name: Feature request
description: Suggest a change to Canopy.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe what gets in your way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Suggest a change and give an example of when you would use it.
    validations:
      required: true

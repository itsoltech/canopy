name: PR title
on:
  pull_request:
    branches: [dev, next, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request is read-only and has no secrets, including for forks.
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Validate squash title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --no-install commitlint

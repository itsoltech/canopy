name: Artifact smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  images:
    env:
      CANOPY_VERSION: 0.0.0-nightly.1
    name: Image (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, push-relay]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64
          load: true
          tags: canopy-${{ matrix.app }}:smoke
          provenance: false
          sbom: false
          build-args: |
            CANOPY_VERSION=${{ env.CANOPY_VERSION }}
            CANOPY_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Gateway image serves its web
        if: matrix.app == 'gateway'
        run: |
          docker network create canopy-smoke
          docker run -d --name canopy-smoke-pg --network canopy-smoke \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=canopy postgres:17
          until docker exec canopy-smoke-pg pg_isready -h 127.0.0.1 -U postgres -d canopy; do sleep 1; done
          docker run -d --name canopy-smoke-gateway --network canopy-smoke -p 127.0.0.1:3000:3000 \
            -e CANOPY_DATABASE_URL=postgres://postgres:smoke@canopy-smoke-pg:5432/canopy \
            -e CANOPY_UI_SERVICE_TOKEN="$(openssl rand -hex 32)" -e CANOPY_SECRETS_KEY="$(openssl rand -base64 32)" \
            canopy-gateway:smoke
          health=""
          for _ in $(seq 1 120); do
            health="$(curl -fsS http://127.0.0.1:3000/api/health || true)"
            [ -n "$health" ] && break
            sleep 1
          done
          echo "$health"
          ok=true
          grep -Fq "\"version\":\"$CANOPY_VERSION\"" <<<"$health" || ok=false
          docker exec canopy-smoke-gateway canopy-gateway healthcheck || ok=false
          docker exec canopy-smoke-gateway printenv CANOPY_INSTALL_KIND | grep -qx docker || ok=false
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200 || ok=false
          # DNS rebinding guard: an unknown Host name is refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:3000/api/health)" = 421 || ok=false
          docker logs canopy-smoke-gateway 2>&1 | grep -v '^\s' | tail -n 20
          docker rm -f canopy-smoke-gateway canopy-smoke-pg >/dev/null
          "$ok"

      - name: Push relay image accepts HTTPS and requires a bearer
        if: matrix.app == 'push-relay'
        run: |
          scratch="$(mktemp -d)"
          container=
          trap '
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null; fi
            rm -rf "$scratch"
          ' EXIT
          mkdir -m 0755 "$scratch/tls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost' -keyout "$scratch/tls/key.pem" -out "$scratch/tls/cert.pem"
          chmod 0644 "$scratch/tls/key.pem" "$scratch/tls/cert.pem"
          container="$(docker run -d -p 127.0.0.1::24444 \
            --mount "type=bind,source=$scratch/tls,target=/tls,readonly" \
            -e CANOPY_PUSH_RELAY_TLS_CERT_FILE=/tls/cert.pem -e CANOPY_PUSH_RELAY_TLS_KEY_FILE=/tls/key.pem \
            -e CANOPY_PUSH_RELAY_BEARER_SHA256="$(openssl rand -hex 32)" -e EXPO_ACCESS_TOKEN=smoke \
            canopy-push-relay:smoke)"
          address="$(docker port "$container" 24444/tcp)"
          for _ in $(seq 1 20); do
            status="$(curl -s --max-time 2 --cacert "$scratch/tls/cert.pem" -X POST \
              -o /dev/null -w '%{http_code}' "https://localhost:${address##*:}/v1/push" || true)"
            if [ "$status" = 401 ]; then
              test "$(docker exec "$container" id -u)" = 65532
              docker exec "$container" test -s /usr/share/doc/canopy/THIRD_PARTY_NOTICES.txt
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

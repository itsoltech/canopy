name: Automatic promotion
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print both promotion plans without mutations
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: release-branch-mutations
  cancel-in-progress: false
env:
  BUN_VERSION: 1.4.4
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require release deploy key
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::RELEASE_DEPLOY_KEY is required to push release branches through repository rulesets."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && secrets.RELEASE_DEPLOY_KEY || '' }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
      - name: Promote stable, then beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BURN_IN_DAYS: ${{ vars.BETA_BURN_IN_DAYS || '3' }}
          AUTO_PROMOTION: ${{ vars.AUTO_PROMOTION }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bun scripts/promote.ts --automatic

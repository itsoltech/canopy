name: Automatic promotion
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print both promotion plans without mutations
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: release-branch-mutations
  cancel-in-progress: false
env:
  BUN_VERSION: 1.4.4
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
      - name: Promote stable, then beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BURN_IN_DAYS: ${{ vars.BETA_BURN_IN_DAYS || '3' }}
          AUTO_PROMOTION: ${{ vars.AUTO_PROMOTION }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bun scripts/promote.ts --automatic

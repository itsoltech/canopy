# Reused by Release. The aggregate name is the public check contract; live tests stay opt-in.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      revision:
        description: Exact Release commit to check
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Cancel obsolete PR work, including all shards. Release callers each have an independent group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.5

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ github.event_name != 'pull_request' && 'full' || steps.changes.outputs.scope }}
      web: ${{ steps.changes.outputs.web }}
      desktop: ${{ steps.changes.outputs.desktop }}
      extra_tests: ${{ steps.changes.outputs.extra_tests }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: bash .github/scripts/select-checks.sh

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/setup-bun
      - name: Every test file belongs to exactly one shard
        run: bun scripts/test-shards.ts --check
      - name: Generated code is up to date
        run: bun run gen:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Formatting
        run: bun run format:check

  clients:
    name: Affected client checks
    needs: changes
    if: needs.changes.outputs.scope == 'clients'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
      - run: docker pull --quiet postgres:17
      - name: Tests affected by the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EXTRA_TESTS: ${{ needs.changes.outputs.extra_tests }}
        run: bun scripts/test-affected.ts "$BASE"
      - name: Build the web UI used by browsers and desktop
        if: needs.changes.outputs.web == 'true'
        run: bun scripts/build-web.ts
      - name: Build the Electron shell
        if: needs.changes.outputs.desktop == 'true'
        run: bun run --filter @canopy/desktop build:shell

  tests:
    name: Tests (${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          # Local-git release fixtures and scripts/version.ts read release tags.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
      # One server per shard, separate databases cloned from a migrated template. A pull takes ~7s;
      # keep registry layer caching instead of maintaining Docker archives in the Actions cache.
      - name: Pull the test database image
        run: docker pull --quiet postgres:17
      - name: Unit and integration tests, with temp-directory check
        run: >-
          bun scripts/test-shards.ts ${{ matrix.shard }}
          --reporter=junit --reporter-outfile=${{ runner.temp }}/tests-${{ matrix.shard }}.xml
          --timings=${{ runner.temp }}/timings-${{ matrix.shard }}.json --update-timings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-profile-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/tests-${{ matrix.shard }}.xml
            ${{ runner.temp }}/timings-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  builds:
    name: Web and Linux binaries
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Version
        id: version
        env:
          RELEASE_REVISION: ${{ inputs.revision || github.sha }}
        run: GITHUB_SHA="$RELEASE_REVISION" bun scripts/version.ts --github-output
      - name: Web build
        env:
          CANOPY_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/build-web.ts
      - name: Gateway and worker binaries (linux-x64)
        env:
          CANOPY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/build-binaries.ts --target linux-x64 --web dist/web
          test "$(dist/release/canopy-gateway-linux-x64 --version)" = "$CANOPY_VERSION"
          test "$(dist/release/canopy-worker-linux-x64 --version)" = "$CANOPY_VERSION"
          dist/release/canopy-worker-linux-x64 self-check
      - name: Embedded web answers with the build version
        env:
          CANOPY_VERSION: ${{ steps.version.outputs.version }}
          CANOPY_WEB_DIR: ${{ runner.temp }}/canopy-web
          CANOPY_WEB_PORT: "39231"
        run: |
          CANOPY_UI_SERVICE_TOKEN="ci-$RANDOM-$RANDOM-0123456789abcdef0123456789" dist/release/canopy-gateway-linux-x64 web &
          web=$!
          health=""
          for _ in $(seq 1 60); do
            health="$(curl -fsS "http://127.0.0.1:$CANOPY_WEB_PORT/api/health" || true)"
            [ -n "$health" ] && break
            sleep 0.5
          done
          echo "$health"
          kill "$web"
          grep -q "\"version\":\"$CANOPY_VERSION\"" <<<"$health"
      # Image export calls native APIs per OS (bun:ffi), and the embedded web listens through the OS's sockets;
      # only a binary on that OS proves them.
      - name: Native binaries (darwin-arm64, windows-x64)
        env:
          CANOPY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/build-binaries.ts --app worker --target darwin-arm64,windows-x64
          bun scripts/build-binaries.ts --app gateway --target windows-x64 --web dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            dist/release/canopy-worker-darwin-arm64
            dist/release/canopy-worker-windows-x64.exe
            dist/release/canopy-gateway-windows-x64.exe
          if-no-files-found: error
          retention-days: 1

  native:
    name: Native checks (${{ matrix.target }})
    needs: builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025, suffix: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Decode the small Canopy app icon representations with macOS
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          for channel in stable beta nightly development; do
            iconset="$RUNNER_TEMP/canopy-$channel.iconset"
            iconutil -c iconset -o "$iconset" "apps/web/static/channels/$channel/icon.icns"
            for size in 16 32; do
              test -s "$iconset/icon_${size}x${size}.png"
              test -s "$iconset/icon_${size}x${size}@2x.png"
            done
          done
      - uses: ./.github/actions/setup-bun
      - name: Resolve the installed Canopy bundle name and artwork with macOS
        if: matrix.target == 'darwin-arm64'
        run: bun test ./apps/desktop/test/packaging.test.ts -t 'macOS packaging'
      - name: OAuth address fallback on macOS
        if: matrix.target == 'darwin-arm64'
        run: bun test ./tests/integration/connector-oauth-egress.test.ts
      - name: Windows CLI launcher argument round-trip
        if: matrix.target == 'windows-x64'
        run: bun test ./packages/process-governor/src/windows-command.test.ts
      - name: Windows Codex login migration
        if: matrix.target == 'windows-x64'
        run: bun test ./apps/worker/src/providers/codex/home.test.ts ./apps/worker/src/bots/codex-login.test.ts
      - name: Windows worktree checkout and cleanup
        if: matrix.target == 'windows-x64'
        run: bun test ./apps/worker/src/git/failed-worktree-cleanup.test.ts ./tests/integration/worktree-creation-failure.test.ts
      - uses: actions/download-artifact@v5
        with:
          name: native-binaries
      - name: Open, stat, read and export an image through the pinned native calls
        shell: bash
        env:
          CANOPY_NATIVE_DIR: ${{ runner.temp }}/canopy-native
        run: |
          binary="./canopy-worker-${{ matrix.target }}${{ matrix.suffix }}"
          chmod +x "$binary"
          "$binary" --version
          "$binary" self-check
      # The release smoke's check, on a PR: Windows sockets differ (a reduced environment broke every listen).
      - name: Embedded web answers with the build version
        if: matrix.target == 'windows-x64'
        shell: bash
        env:
          CANOPY_WEB_DIR: ${{ runner.temp }}/canopy-web
          CANOPY_WEB_PORT: "39231"
        run: |
          binary="./canopy-gateway-${{ matrix.target }}${{ matrix.suffix }}"
          chmod +x "$binary"
          expected="$("$binary" --version | tr -d '\r')"
          CANOPY_UI_SERVICE_TOKEN="ci-$RANDOM-$RANDOM-0123456789abcdef0123456789" "$binary" web &
          web=$!
          health=""
          for _ in $(seq 1 120); do
            health="$(curl -fsS "http://127.0.0.1:$CANOPY_WEB_PORT/api/health" || true)"
            [ -n "$health" ] && break
            sleep 0.5
          done
          echo "$health"
          kill "$web" || true
          grep -q "\"version\":\"$expected\"" <<<"$health"

  check:
    name: Typecheck, tests, builds
    needs: [changes, static, clients, tests, builds, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          BUILDS: ${{ needs.builds.result }}
          NATIVE: ${{ needs.native.result }}
          CLIENTS: ${{ needs.clients.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          test "$CHANGES" = success
          test "$STATIC" = success
          case "$SCOPE" in
            full) expected_full=success; expected_clients=skipped ;;
            clients) expected_full=skipped; expected_clients=success ;;
            docs) expected_full=skipped; expected_clients=skipped ;;
            *) exit 1 ;;
          esac
          test "$CLIENTS" = "$expected_clients"
          test "$TESTS" = "$expected_full"
          test "$BUILDS" = "$expected_full"
          test "$NATIVE" = "$expected_full"
      - uses: actions/checkout@v5
        if: needs.changes.outputs.scope == 'full'
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/setup-bun
        if: needs.changes.outputs.scope == 'full'
        with:
          install: "false"
      - uses: actions/download-artifact@v5
        if: needs.changes.outputs.scope == 'full'
        with:
          pattern: test-profile-*
          merge-multiple: true
          path: ${{ runner.temp }}/test-profiles
      - name: Every test file actually ran exactly once
        if: needs.changes.outputs.scope == 'full'
        run: bun scripts/test-shards.ts --verify-reports "${{ runner.temp }}/test-profiles"

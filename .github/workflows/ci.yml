# Checks of every change (docs/release.md). Pull requests run it directly; pushes to main/next/dev and stable tags run it
# as the `checks` job of release.yml, which builds next to it and publishes only after it passes. Live tests stay opt-in: they need
# private provider credentials and are skipped without CANOPY_LIVE.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.4

jobs:
  check:
    name: Typecheck, tests, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A newer push to a pull request replaces its running check. Release runs (workflow_call) get a group of
    # their own: they are never cancelled and never wait for the previous release run's checks.
    concurrency:
      group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # scripts/version.ts reads the last vX.Y.Z tag.
          fetch-depth: 0

      # semantic-release CLI is exercised by the local-git unit fixtures; Node >=24.10 is required.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bun and dependencies
        uses: ./.github/actions/setup-bun

      - name: Generated code is up to date
        run: bun run gen:check

      - name: Typecheck
        run: bun run typecheck

      # Integration tests start throwaway PostgreSQL containers (packages/db/src/testing.ts); the runner has Docker.
      - name: Pull the test database image
        run: docker pull --quiet postgres:17

      - name: Unit and integration tests
        run: bun run check:tmp

      - name: Version
        id: version
        run: bun scripts/version.ts --github-output

      - name: Web build
        env:
          CANOPY_VERSION: ${{ steps.version.outputs.version }}
        run: bun scripts/build-web.ts

      - name: Gateway and worker binaries (linux-x64)
        env:
          CANOPY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/build-binaries.ts --target linux-x64
          test "$(dist/release/canopy-gateway-linux-x64 --version)" = "$CANOPY_VERSION"
          test "$(dist/release/canopy-worker-linux-x64 --version)" = "$CANOPY_VERSION"

# Releases main/next pushes, hourly dev snapshots, manual stable tags and dispatches (docs/release.md).
# A planned release requires successful Push CI for its exact source SHA before any builds or writes.
# Server artifacts are staged on a draft; publication waits for desktop builds, feeds and verification.
# Each branch has one active run and only its newest pending run. GITHUB_TOKEN tags do not trigger another workflow.
# Builds use the validated source SHA. Planning, tagging and publishing use the workflow revision.
name: Release

on:
  push:
    branches: [main, next]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    # Every hour around the clock, at :40, away from the busy :00 and :30 marks. Most changes reach phones
    # as OTA updates, so they ship soon after merging. Runs on the default branch (dev); `plan` skips hours
    # without releasable commits.
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit to release (must remain in the selected branch history)
        required: true
        type: string
      release_branch:
        description: Release channel branch (current uses the workflow ref; recovery can run updated tooling from dev)
        required: false
        default: current
        type: choice
        options: [current, dev, next, main]
      desktop_all_targets:
        description: Nightly also builds the experimental linux-arm64 desktop target
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# GitHub replaces an older pending run in this group, but never cancels its active run (which may be
# publishing). Push, schedule and dispatch share the branch lock; tags have their own locks.
concurrency:
  group: release-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.5
  IMAGE_NAMESPACE: ghcr.io/itsoltech
  EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
  RELEASE_BRANCH: ${{ github.ref_type == 'tag' && 'main' || inputs.release_branch && inputs.release_branch != 'current' && inputs.release_branch || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Inspect Git objects only. Never check out or execute the requested revision here.
      - name: Validate release revision against the protected branch
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF_PROTECTED" != true ]; then
            echo "::error::Release requires a protected workflow ref."
            exit 1
          fi
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            workflow_dispatch:refs/heads/dev|workflow_dispatch:refs/heads/next|workflow_dispatch:refs/heads/main) ;;
            schedule:refs/heads/dev|push:refs/heads/next|push:refs/heads/main) ;;
            push:refs/tags/v*)
              if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "::error::Manual tags must be stable vX.Y.Z."
                exit 1
              fi ;;
            *) echo "::error::Release requires an approved event on a protected ref."; exit 1 ;;
          esac
          case "$RELEASE_BRANCH" in
            dev|next|main) ;;
            *) echo "::error::Invalid release branch."; exit 1 ;;
          esac
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/branches/$RELEASE_BRANCH" --jq .protected)" != true ]; then
            echo "::error::The selected release branch must be protected."
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release requires a full commit SHA."
            exit 1
          fi

          history="$RUNNER_TEMP/canopy-release-history.git"
          git init --bare "$history"
          git -C "$history" fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$RELEASE_BRANCH"
          if [[ "$(git -C "$history" cat-file -t "$EXPECTED_SHA")" != commit ]] ||
             ! git -C "$history" merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD; then
            echo "::error::The requested commit is outside the selected release branch history."
            exit 1
          fi

  checks:
    name: Verified CI
    needs: plan
    if: needs.plan.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require successful Push CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-push-ci.sh

  # Dry run: the version this run will release. Shares the per-branch group with `release`, so it never plans
  # while another run of the branch is tagging.
  plan:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-version-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
      cancel-in-progress: false
    permissions:
      # Planning probes push access only to its disposable local mirror.
      contents: read
    outputs:
      published: ${{ steps.plan.outputs.published }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      desktop_matrix: ${{ steps.matrix.outputs.value }}
      bun_version: ${{ steps.matrix.outputs.bun_version }}
      mac_intel: ${{ steps.matrix.outputs.mac_intel }}
      image_apps: ${{ steps.image-apps.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Move the detached HEAD for semantic-release's history queries without replacing any tooling files.
      - run: git reset --soft "$EXPECTED_SHA"
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: node scripts/semantic-release.mjs --dry-run
      - name: Check the stable commit against the public beta of its series
        if: steps.plan.outputs.published == 'true' && steps.plan.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_TAG: ${{ steps.plan.outputs.tag }}
        run: bun scripts/release-publication.ts "$EXPECTED_SHA" "$PLANNED_TAG"
      # Nightly skips the experimental targets unless the dispatch asks for them; beta and stable build all.
      - id: matrix
        shell: bash
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
          ALL_TARGETS: ${{ inputs.desktop_all_targets }}
        run: |
          targets='{"target":"linux-x64","runner":"ubuntu-24.04"},{"target":"darwin-arm64","runner":"macos-15","packaging_runner":"macos-26"},{"target":"windows-x64","runner":"windows-2025"}'
          # Recovery can package a source revision from before Canopy shipped for Intel.
          mac_intel="$(git show "$EXPECTED_SHA:apps/desktop/package.json" | jq 'any(.build.mac.target[]; .target == "zip" and (.arch | index("x64") != null))')"
          if [ "$mac_intel" = true ]; then
            targets="$targets"',{"target":"darwin-x64","runner":"macos-15-intel","packaging_runner":"macos-26-intel"}'
          fi
          if [ "$CHANNEL" != nightly ] || [ "$ALL_TARGETS" = true ]; then
            targets="$targets"',{"target":"linux-arm64","runner":"ubuntu-24.04-arm"}'
          fi
          echo "mac_intel=$mac_intel" >> "$GITHUB_OUTPUT"
          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"
          echo "value={\"include\":[$targets]}" >> "$GITHUB_OUTPUT"
      - name: Select image targets in the release revision
        id: image-apps
        run: |
          apps='"gateway","worker"'
          dockerfile="$(git show "$EXPECTED_SHA:Dockerfile")"
          if grep -qE '^FROM .+ AS push-relay$' <<<"$dockerfile"; then
            apps="$apps"',"push-relay"'
          fi
          echo "value=[$apps]" >> "$GITHUB_OUTPUT"

  # Reserve the version: tag and draft GitHub Release after checks, only with the planned version
  # (EXPECTED_VERSION, scripts/release-expected-version.mjs). Refuse rewritten history, allow newer commits.
  release:
    needs: [plan, checks]
    if: needs.plan.outputs.published == 'true'
    runs-on: ubuntu-24.04
    environment: release-publication
    timeout-minutes: 10
    concurrency:
      group: release-version-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Move the detached HEAD for semantic-release's history queries without replacing any tooling files.
      - run: git reset --soft "$EXPECTED_SHA"
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/semantic-release.mjs
      - name: Same version as planned
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          RELEASED: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          if [ "$PUBLISHED" = true ] && [ "$RELEASED" != "$PLANNED" ]; then
            echo "::error::Planned $PLANNED, released $RELEASED"
            exit 1
          fi
      # workflow_run.head_sha is the dispatch ref. Promotion and Mobile release read the pinned revision.
      - name: Record released revision for promotion and Mobile release
        if: steps.release.outputs.published == 'true'
        run: |
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/release-sha"
          printf '%s\n' "$RELEASE_BRANCH" > "$RUNNER_TEMP/release-branch"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.published == 'true'
        with:
          name: release-revision
          path: |
            ${{ runner.temp }}/release-sha
            ${{ runner.temp }}/release-branch
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # Stop parallel builds if the release could not reserve its version.
  # A later scheduled/dispatched dev run picks up the commits. Stop builds, including macOS notarization.
  stop-builds:
    needs: [plan, release]
    if: always() && needs.plan.outputs.published == 'true' && (needs.release.result == 'failure' || needs.release.result == 'cancelled' || (needs.release.result == 'success' && needs.release.outputs.published != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::notice::Release did not reserve its version; stopping the builds."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  binaries:
    needs: [plan, checks]
    if: needs.plan.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      # The web is target-independent JavaScript: built once, embedded into every gateway binary (docs/deploy.md).
      - name: Web build
        env:
          CANOPY_VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/build-web.ts --outdir dist/web
      # Cross-compiled for every target; sharp's native build per target comes from the npm registry.
      - name: Build
        env:
          CANOPY_VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/build-binaries.ts --target all --outdir dist/release --web dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/release/canopy-*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Build OCI archives without registry write access.
  images-build:
    needs: [plan, checks]
    if: needs.plan.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.image_apps) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.plan.outputs.tag }}
          labels: |
            org.opencontainers.image.title=canopy-${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ env.EXPECTED_SHA }}
          annotations: |
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ env.EXPECTED_SHA }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image.oci.tar
          tags: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}:${{ needs.plan.outputs.tag }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=min
          sbom: true
          build-args: |
            CANOPY_VERSION=${{ needs.plan.outputs.version }}
            CANOPY_REVISION=${{ env.EXPECTED_SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/image.oci.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Publication copies the already-built OCI image, including its index and attestations.
  images:
    needs: [plan, release, images-build]
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.image_apps) }}
    runs-on: ubuntu-24.04
    environment: release-publication
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the immutable image tag
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}:${{ needs.release.outputs.tag }}
        run: |
          skopeo copy --all --preserve-digests --dest-authfile "$HOME/.docker/config.json" \
            "oci-archive:$RUNNER_TEMP/image.oci.tar" "docker://$IMAGE"
  # A target packages as soon as its own runtime is available.
  desktop:
    name: desktop (${{ matrix.target }})
    needs: [plan, checks]
    if: needs.plan.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop_matrix) }}
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      build_runner: ${{ matrix.runner }}
      packaging_runner: ${{ matrix.packaging_runner || matrix.runner }}
      expected_sha: ${{ inputs.expected_sha || github.sha }}
      version: ${{ needs.plan.outputs.version }}
      channel: ${{ needs.plan.outputs.channel }}
      bun_version: ${{ needs.plan.outputs.bun_version }}

  # Stage 1: stage binaries and server metadata on the hidden draft. No updater sees this stage.
  publish-server:
    needs: [release, binaries, images]
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' && needs.binaries.result == 'success' && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release-publication
    timeout-minutes: 30
    concurrency:
      group: release-branch-mutations
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANOPY_VERSION: ${{ needs.release.outputs.version }}
      CANOPY_CHANNEL: ${{ needs.release.outputs.channel }}
      CANOPY_RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: release-assets
      - name: checksums.txt and manifest.json
        run: |
          GITHUB_SHA="$EXPECTED_SHA" CANOPY_PROTOCOL_REVISION="$EXPECTED_SHA" bun scripts/release-manifest.ts release-assets
          ls -l release-assets
          echo "### Canopy $CANOPY_VERSION ($CANOPY_RELEASE_TAG): server" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Stage server assets on draft (manifest last)
        run: GITHUB_SHA="$EXPECTED_SHA" bun scripts/release-upload.ts release-assets

  # Stage 2: required desktop targets must succeed. Upload and verify the complete set before publishing
  # the draft or moving image aliases. Failed jobs can resume the same draft without exposing partial feeds.
  publish-desktop:
    needs: [plan, release, publish-server, desktop]
    if: ${{ !cancelled() && needs.publish-server.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: release-publication
    timeout-minutes: 30
    # Publication gates see a consistent snapshot of previous publications and promotion pushes.
    concurrency:
      group: release-branch-mutations
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANOPY_VERSION: ${{ needs.release.outputs.version }}
      CANOPY_CHANNEL: ${{ needs.release.outputs.channel }}
      CANOPY_RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: desktop-artifacts
      # Only nightly releases emit nightly feeds. Stable also emits a beta feed for the same assets.
      - name: Merge desktop update feeds
        run: bun apps/desktop/scripts/merge-update-metadata.ts desktop-artifacts release-assets
      # Keep binaries locally for complete verification; matching draft assets are not uploaded again.
      - name: checksums.txt and manifest.json
        run: |
          GITHUB_SHA="$EXPECTED_SHA" CANOPY_PROTOCOL_REVISION="$EXPECTED_SHA" bun scripts/release-manifest.ts release-assets
          ls -l release-assets
          echo "### Canopy $CANOPY_VERSION ($CANOPY_RELEASE_TAG): server and desktop" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload and verify all assets, then publish release
        env:
          CANOPY_RELEASE_MAC_INTEL: ${{ needs.plan.outputs.mac_intel }}
        run: GITHUB_SHA="$EXPECTED_SHA" bun scripts/release-upload.ts release-assets --publish
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image channel aliases (forward only)
        env:
          CANOPY_IMAGE_APPS: ${{ join(fromJSON(needs.plan.outputs.image_apps), ' ') }}
        run: GITHUB_SHA="$EXPECTED_SHA" bun scripts/image-aliases.ts

  release-index:
    needs: [release, publish-desktop]
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  backmerge:
    needs: [release, publish-desktop]
    if: needs.release.outputs.channel == 'stable' || needs.release.outputs.channel == 'beta'
    uses: ./.github/workflows/backmerge.yml
    secrets:
      repository_deploy_key: ${{ secrets.RELEASE_DEPLOY_KEY }}
    with:
      stable_sha: ${{ needs.release.outputs.channel == 'stable' && (inputs.expected_sha || github.sha) || '' }}
      beta_sha: ${{ needs.release.outputs.channel == 'beta' && (inputs.expected_sha || github.sha) || '' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write

  nightly-hygiene:
    needs: [release, publish-desktop]
    if: needs.release.outputs.channel == 'nightly'
    uses: ./.github/workflows/nightly-hygiene.yml
    permissions:
      contents: write
      packages: write

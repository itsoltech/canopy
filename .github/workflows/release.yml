# Releases main/next pushes, hourly dev snapshots, manual stable tags and dispatches (docs/release.md).
# `plan` decides whether to release before dev checks/builds; nothing is
# tagged, pushed to GHCR or uploaded before `checks` pass. Server artifacts are staged on a draft;
# publication waits for desktop builds, feeds and verification. All dev events share one active run and only the newest pending run;
# each branch has its own queue. GITHUB_TOKEN tags do not trigger another workflow.
# Every checkout/build uses EXPECTED_SHA; later branch commits belong to the next run.
name: Release

on:
  push:
    branches: [main, next]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  schedule:
    # Every hour around the clock, at :40, away from the busy :00 and :30 marks. Most changes reach phones
    # as OTA updates, so they ship soon after merging. Runs on the default branch (dev); `plan` skips hours
    # without releasable commits.
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit to release (must remain in the selected branch history)
        required: true
        type: string
      release_branch:
        description: Release channel branch (current uses the workflow ref; recovery can run updated tooling from dev)
        required: false
        default: current
        type: choice
        options: [current, dev, next, main]
      desktop_all_targets:
        description: Nightly also builds the experimental linux-arm64 desktop target
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# GitHub replaces an older pending run in this group, but never cancels its active run (which may be
# publishing). Push, schedule and dispatch share the branch lock; tags have their own locks.
concurrency:
  group: release-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.4
  IMAGE_NAMESPACE: ghcr.io/itsoltech
  EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
  RELEASE_BRANCH: ${{ inputs.release_branch && inputs.release_branch != 'current' && inputs.release_branch || github.ref_name }}

jobs:
  checks:
    needs: plan
    # Keep main/next/tag checks even for no-release runs; dev pays for CI only for a planned nightly.
    if: needs.plan.outputs.published == 'true' || (inputs.release_branch && inputs.release_branch != 'current' && inputs.release_branch || github.ref_name) != 'dev'
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ inputs.expected_sha || github.sha }}

  # Dry run: the version this run will release. Shares the per-branch group with `release`, so it never plans
  # while another run of the branch is tagging.
  plan:
    if: >-
      (github.event_name != 'schedule' || github.ref == 'refs/heads/dev') &&
      (github.event_name != 'workflow_dispatch' || contains(fromJSON('["main", "next", "dev"]'), github.ref_name))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-version-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
      cancel-in-progress: false
    permissions:
      # Planning probes push access only to its disposable local mirror.
      contents: read
    outputs:
      published: ${{ steps.plan.outputs.published }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      tag: ${{ steps.plan.outputs.tag }}
      desktop_matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Release tooling from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts
            release.config.mjs
            patches/semantic-release@25.0.9.patch
          sparse-checkout-cone-mode: false
      - name: Use current release tooling with the pinned source
        run: |
          cp .release-tooling/scripts/{semantic-release,release-analyzer,release-expected-version,release-body,release-draft,release-recovery,generate-release-notes}.mjs scripts/
          cp .release-tooling/release.config.mjs .
      - uses: ./.github/actions/setup-bun
      - name: Apply release dependency patch from the workflow revision
        run: |
          patch=.release-tooling/patches/semantic-release@25.0.9.patch
          if ! git apply --directory=node_modules/semantic-release --reverse --check "$patch" 2>/dev/null; then
            git apply --directory=node_modules/semantic-release "$patch"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: node scripts/semantic-release.mjs --dry-run
      # Nightly skips the experimental targets unless the dispatch asks for them; beta and stable build all.
      - id: matrix
        env:
          CHANNEL: ${{ steps.plan.outputs.channel }}
          ALL_TARGETS: ${{ inputs.desktop_all_targets }}
        run: |
          targets='{"target":"linux-x64","runner":"ubuntu-24.04","package":"package:linux","experimental":false},{"target":"darwin-arm64","runner":"macos-15","package":"package:mac","experimental":false},{"target":"windows-x64","runner":"windows-2025","package":"package:windows","experimental":false}'
          if [ "$CHANNEL" != nightly ] || [ "$ALL_TARGETS" = true ]; then
            targets="$targets"',{"target":"linux-arm64","runner":"ubuntu-24.04-arm","package":"package:linux","experimental":true}'
          fi
          echo "value={\"include\":[$targets]}" >> "$GITHUB_OUTPUT"

  # Reserve the version: tag and draft GitHub Release after checks, only with the planned version
  # (EXPECTED_VERSION, scripts/release-expected-version.mjs). Refuse rewritten history, allow newer commits.
  release:
    needs: [plan, checks]
    if: needs.plan.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-version-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Release tooling from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts
            release.config.mjs
            patches/semantic-release@25.0.9.patch
          sparse-checkout-cone-mode: false
      - name: Use current release tooling with the pinned source
        run: |
          cp .release-tooling/scripts/{semantic-release,release-analyzer,release-expected-version,release-body,release-draft,release-recovery,generate-release-notes}.mjs scripts/
          cp .release-tooling/release.config.mjs .
      - uses: ./.github/actions/setup-bun
      - name: Apply release dependency patch from the workflow revision
        run: |
          patch=.release-tooling/patches/semantic-release@25.0.9.patch
          if ! git apply --directory=node_modules/semantic-release --reverse --check "$patch" 2>/dev/null; then
            git apply --directory=node_modules/semantic-release "$patch"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/semantic-release.mjs
      - name: Same version as planned
        env:
          PLANNED: ${{ needs.plan.outputs.version }}
          RELEASED: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          if [ "$PUBLISHED" = true ] && [ "$RELEASED" != "$PLANNED" ]; then
            echo "::error::Planned $PLANNED, released $RELEASED"
            exit 1
          fi
      # workflow_run.head_sha is the dispatch ref. Promotion and Mobile release read the pinned revision.
      - name: Record released revision for promotion and Mobile release
        if: steps.release.outputs.published == 'true'
        run: |
          printf '%s\n' "$EXPECTED_SHA" > "$RUNNER_TEMP/release-sha"
          printf '%s\n' "$RELEASE_BRANCH" > "$RUNNER_TEMP/release-branch"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.published == 'true'
        with:
          name: release-revision
          path: |
            ${{ runner.temp }}/release-sha
            ${{ runner.temp }}/release-branch
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # Nothing of this run will be published: checks failed or the release could not reserve its version.
  # A later scheduled/dispatched dev run picks up the commits. Stop builds, including macOS notarization.
  stop-builds:
    needs: [plan, checks, release]
    if: always() && needs.plan.outputs.published == 'true' && (needs.checks.result == 'failure' || needs.release.result == 'failure' || needs.release.result == 'cancelled' || (needs.release.result == 'success' && needs.release.outputs.published != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          if [ "$CHECKS" = failure ]; then
            echo "::error::Checks failed; nothing is published and the builds are stopped."
          else
            echo "::notice::Release did not publish; inspect its result before retrying."
          fi
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  binaries:
    needs: plan
    if: needs.plan.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: ./.github/actions/setup-bun
      # The web is target-independent JavaScript: built once, embedded into every gateway binary (docs/deploy.md).
      - name: Web build
        env:
          CANOPY_VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/build-web.ts --outdir dist/web
      # Cross-compiled for every target; sharp's native build per target comes from the npm registry.
      - name: Build
        env:
          CANOPY_VERSION: ${{ needs.plan.outputs.version }}
        run: bun scripts/build-binaries.ts --target all --outdir dist/release --web dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/release/canopy-*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Each binary starts on its own OS/arch (`--version` already loads the embedded sharp/libvips; `self-check` runs the image-export FFI;
  # `canopy-gateway web` serves the embedded web).
  smoke:
    needs: [plan, binaries]
    if: needs.plan.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025, suffix: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: binaries
      - name: Start each binary
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
          CANOPY_NATIVE_DIR: ${{ runner.temp }}/canopy-native
        run: |
          for app in gateway worker; do
            binary="./canopy-$app-${{ matrix.target }}${{ matrix.suffix }}"
            chmod +x "$binary"
            actual="$("$binary" --version | tr -d '\r')"
            echo "$binary: $actual"
            test "$actual" = "$EXPECTED"
          done
          # Native image-export calls (bun:ffi) on this OS/arch: show_images depends on them.
          "./canopy-worker-${{ matrix.target }}${{ matrix.suffix }}" self-check
      - name: Embedded web answers with the release version
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
          CANOPY_NATIVE_DIR: ${{ runner.temp }}/canopy-native
          CANOPY_WEB_DIR: ${{ runner.temp }}/canopy-web
          CANOPY_WEB_PORT: "39231"
        run: |
          # A throwaway service token: `web` only refuses to start without one; no gateway is called.
          CANOPY_UI_SERVICE_TOKEN="smoke-$RANDOM-$RANDOM-0123456789abcdef0123456789" \
            "./canopy-gateway-${{ matrix.target }}${{ matrix.suffix }}" web &
          web=$!
          health=""
          for _ in $(seq 1 120); do
            health="$(curl -fsS "http://127.0.0.1:$CANOPY_WEB_PORT/api/health" || true)"
            [ -n "$health" ] && break
            sleep 0.5
          done
          echo "$health"
          kill "$web" || true
          grep -q "\"version\":\"$EXPECTED\"" <<<"$health"
      # The installed shape on a Linux server: supervisor, gateway and web from one binary, PostgreSQL alongside.
      - name: Binary gateway serves its web
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
          CANOPY_NATIVE_DIR: ${{ runner.temp }}/canopy-native
          CANOPY_WEB_DIR: ${{ runner.temp }}/canopy-web
          CANOPY_UPDATE_CACHE_DIR: ${{ runner.temp }}/canopy-releases
          CANOPY_LOG_DIR: ${{ runner.temp }}/canopy-logs
          CANOPY_HOST: 127.0.0.1
          CANOPY_PORT: "7443"
        run: |
          docker run -d --name canopy-smoke-pg -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=canopy \
            -p 127.0.0.1:5432:5432 postgres:17
          until docker exec canopy-smoke-pg pg_isready -h 127.0.0.1 -U postgres -d canopy; do sleep 1; done
          install -m 0755 canopy-gateway-linux-x64 "$RUNNER_TEMP/canopy-gateway"
          export CANOPY_DATABASE_URL=postgres://postgres:smoke@127.0.0.1:5432/canopy
          CANOPY_UI_SERVICE_TOKEN="$(openssl rand -hex 32)"
          CANOPY_SECRETS_KEY="$(openssl rand -base64 32)"
          export CANOPY_UI_SERVICE_TOKEN CANOPY_SECRETS_KEY
          "$RUNNER_TEMP/canopy-gateway" >gateway.log 2>&1 &
          gateway=$!
          health=""
          for _ in $(seq 1 120); do
            health="$(curl -fsS http://127.0.0.1:3000/api/health || true)"
            [ -n "$health" ] && break
            sleep 1
          done
          echo "$health"
          ok=true
          grep -q "\"version\":\"$EXPECTED\"" <<<"$health" || ok=false
          "$RUNNER_TEMP/canopy-gateway" healthcheck || ok=false
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200 || ok=false
          kill -TERM "$gateway" || ok=false
          wait "$gateway" || ok=false
          grep -v '^\s' gateway.log | tail -n 20
          docker rm -f canopy-smoke-pg >/dev/null
          "$ok"

  # Builds every image layer into the GHA cache next to the checks; nothing is pushed here.
  images-build:
    needs: plan
    if: needs.plan.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            CANOPY_VERSION=${{ needs.plan.outputs.version }}
            CANOPY_REVISION=${{ env.EXPECTED_SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # The gateway image serves the web too: the amd64 image from the cache, started next to PostgreSQL.
      - if: matrix.app == 'gateway'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          target: gateway
          platforms: linux/amd64
          load: true
          tags: canopy-gateway:smoke
          provenance: false
          sbom: false
          build-args: |
            CANOPY_VERSION=${{ needs.plan.outputs.version }}
            CANOPY_REVISION=${{ env.EXPECTED_SHA }}
          cache-from: type=gha,scope=gateway
      - name: Gateway image serves its web
        if: matrix.app == 'gateway'
        env:
          EXPECTED: ${{ needs.plan.outputs.version }}
        run: |
          docker network create canopy-smoke
          docker run -d --name canopy-smoke-pg --network canopy-smoke \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=canopy postgres:17
          until docker exec canopy-smoke-pg pg_isready -h 127.0.0.1 -U postgres -d canopy; do sleep 1; done
          docker run -d --name canopy-smoke-gateway --network canopy-smoke -p 127.0.0.1:3000:3000 \
            -e CANOPY_DATABASE_URL=postgres://postgres:smoke@canopy-smoke-pg:5432/canopy \
            -e CANOPY_UI_SERVICE_TOKEN="$(openssl rand -hex 32)" -e CANOPY_SECRETS_KEY="$(openssl rand -base64 32)" \
            canopy-gateway:smoke
          health=""
          for _ in $(seq 1 120); do
            health="$(curl -fsS http://127.0.0.1:3000/api/health || true)"
            [ -n "$health" ] && break
            sleep 1
          done
          echo "$health"
          ok=true
          grep -q "\"version\":\"$EXPECTED\"" <<<"$health" || ok=false
          docker exec canopy-smoke-gateway canopy-gateway healthcheck || ok=false
          docker exec canopy-smoke-gateway printenv CANOPY_INSTALL_KIND | grep -qx docker || ok=false
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200 || ok=false
          # DNS rebinding guard: an unknown Host name is refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:3000/api/health)" = 421 || ok=false
          docker logs canopy-smoke-gateway 2>&1 | grep -v '^\s' | tail -n 20
          docker rm -f canopy-smoke-gateway canopy-smoke-pg >/dev/null
          "$ok"

  # After the release tag exists: the same build from the cache, pushed only as the immutable vX.Y.Z.
  # Channel aliases move after publish-desktop, forward only.
  images:
    needs: [release, images-build]
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.release.outputs.tag }}
          labels: |
            org.opencontainers.image.title=canopy-${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ env.EXPECTED_SHA }}
          annotations: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}:${{ needs.release.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            CANOPY_VERSION=${{ needs.release.outputs.version }}
            CANOPY_REVISION=${{ env.EXPECTED_SHA }}
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}

  desktop:
    needs: plan
    if: needs.plan.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
      # Restore downloads before dependency installation, so Electron install hooks can reuse them too.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-bun
      # electron-builder runs on Node (docs/desktop.md: Node 24 or newer).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # electron-builder's bundled fpm (deb) is x86-64 only.
      - name: fpm for arm64 deb
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # No Apple secrets: explicit ad-hoc identity. Never silently skip configured signing.
      - name: Signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          case "${{ matrix.target }}" in
            darwin-*)
              if [ -n "$MAC_CSC_LINK" ]; then
                {
                  echo "CSC_LINK=$MAC_CSC_LINK"
                  echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
                  echo "CANOPY_MAC_SIGNED=true"
                  echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
                } >> "$GITHUB_ENV"
                if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
                  key_file="$RUNNER_TEMP/canopy-notarization-key.p8"
                  umask 077
                  printf '%s' "$APPLE_API_KEY" | base64 -D > "$key_file"
                  { echo "APPLE_API_KEY=$key_file"; echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; echo "CANOPY_MAC_NOTARIZED=true"; } >> "$GITHUB_ENV"
                elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                  { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
                  echo "CANOPY_MAC_NOTARIZED=true" >> "$GITHUB_ENV"
                else
                  echo "macOS: no complete notarization credentials; Gatekeeper will require an override"
                fi
                echo "macOS: signed with the configured Developer ID"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "macOS: ad-hoc signed; Gatekeeper override required; automatic updates disabled"
              fi ;;
          esac
      - name: Windows signing credentials
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          CANOPY_CHANNEL: ${{ needs.plan.outputs.channel }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') | Where-Object {
            -not [Environment]::GetEnvironmentVariable($_)
          }
          if ($missing.Count -eq 0) {
            'CANOPY_WINDOWS_SIGNED=true' >> $env:GITHUB_ENV
            Write-Output 'Windows: Azure Trusted Signing required; signature verification will gate upload.'
          } elseif ($env:CANOPY_CHANNEL -ne 'nightly') {
            throw "Windows $env:CANOPY_CHANNEL requires Azure Trusted Signing. Missing repository secrets: $($missing -join ', ')"
          } else {
            'CANOPY_WINDOWS_SIGNED=false' >> $env:GITHUB_ENV
            Write-Output "::notice::Windows nightly will be unsigned. Missing repository secrets: $($missing -join ', ')"
          }
      - name: Package
        env:
          CANOPY_VERSION: ${{ needs.plan.outputs.version }}
          CANOPY_CHANNEL: ${{ needs.plan.outputs.channel }}
          AZURE_TENANT_ID: ${{ matrix.target == 'windows-x64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.target == 'windows-x64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.target == 'windows-x64' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: bun run --cwd apps/desktop ${{ matrix.package }}
      - name: Verify Windows signatures
        if: matrix.target == 'windows-x64' && env.CANOPY_WINDOWS_SIGNED == 'true'
        shell: pwsh
        run: ./apps/desktop/scripts/verify-windows.ps1 -ReleaseDirectory apps/desktop/release/${{ needs.plan.outputs.channel }}
      - name: Install Windows package and smoke sidecars
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          CANOPY_VERSION: ${{ needs.plan.outputs.version }}
        run: ./apps/desktop/scripts/smoke-windows.ps1 -ReleaseDirectory apps/desktop/release/${{ needs.plan.outputs.channel }}
      - name: Verify macOS signatures and notarization
        if: startsWith(matrix.target, 'darwin-')
        env:
          CANOPY_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: node apps/desktop/scripts/verify-macos.cjs "apps/desktop/release/$CANOPY_CHANNEL"
      - name: Verify packaged runtime and downloaded PostgreSQL
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        shell: bash
        env:
          CANOPY_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CANOPY_DESKTOP_RUNTIME="$PWD/apps/desktop/release/$CANOPY_CHANNEL/mac-arm64/Canopy.app/Contents/Resources/runtime"
          else
            export CANOPY_DESKTOP_RUNTIME="$PWD/apps/desktop/release/$CANOPY_CHANNEL/linux-unpacked/resources/runtime"
          fi
          bun test apps/desktop/test/*.integration.test.ts
      - name: Remove notarization API key
        if: always() && startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/canopy-notarization-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/${{ needs.plan.outputs.channel }}/Canopy-*.AppImage
            apps/desktop/release/${{ needs.plan.outputs.channel }}/Canopy-*.deb
            apps/desktop/release/${{ needs.plan.outputs.channel }}/Canopy-*.dmg
            apps/desktop/release/${{ needs.plan.outputs.channel }}/Canopy-*.zip
            apps/desktop/release/${{ needs.plan.outputs.channel }}/Canopy-*.exe
            apps/desktop/release/${{ needs.plan.outputs.channel }}/latest*.yml
            apps/desktop/release/${{ needs.plan.outputs.channel }}/beta*.yml
            apps/desktop/release/${{ needs.plan.outputs.channel }}/nightly*.yml
            apps/desktop/release/${{ needs.plan.outputs.channel }}/*.blockmap
            apps/desktop/release/${{ needs.plan.outputs.channel }}/package-sizes-*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Stage 1: stage binaries and server metadata on the hidden draft. No updater sees this stage.
  publish-server:
    needs: [checks, release, binaries, smoke, images]
    if: ${{ !cancelled() && needs.release.outputs.published == 'true' && needs.checks.result == 'success' && needs.binaries.result == 'success' && needs.smoke.result == 'success' && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-publish-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANOPY_VERSION: ${{ needs.release.outputs.version }}
      CANOPY_CHANNEL: ${{ needs.release.outputs.channel }}
      CANOPY_RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Release tooling from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - name: Use current publication tooling with the pinned source
        run: |
          cp .release-tooling/scripts/{release-body,release-draft}.mjs scripts/
          cp .release-tooling/scripts/release-upload.ts scripts/
      # The staging scripts have no runtime package dependencies.
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: release-assets
      - name: checksums.txt and manifest.json
        run: |
          GITHUB_SHA="$EXPECTED_SHA" bun scripts/release-manifest.ts release-assets
          ls -l release-assets
          echo "### Canopy $CANOPY_VERSION ($CANOPY_RELEASE_TAG): server" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Stage server assets on draft (manifest last)
        run: GITHUB_SHA="$EXPECTED_SHA" bun scripts/release-upload.ts release-assets

  # Stage 2: required desktop targets must succeed. Upload and verify the complete set before publishing
  # the draft or moving image aliases. Failed jobs can resume the same draft without exposing partial feeds.
  publish-desktop:
    needs: [release, publish-server, desktop]
    if: ${{ !cancelled() && needs.publish-server.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-publish-${{ inputs.release_branch && inputs.release_branch != 'current' && format('refs/heads/{0}', inputs.release_branch) || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANOPY_VERSION: ${{ needs.release.outputs.version }}
      CANOPY_CHANNEL: ${{ needs.release.outputs.channel }}
      CANOPY_RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Release tooling from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts
      - name: Use current publication tooling with the pinned source
        run: |
          cp .release-tooling/scripts/{release-body,release-draft}.mjs scripts/
          cp .release-tooling/scripts/release-upload.ts scripts/
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: desktop-artifacts
      # Stable emits latest/beta/nightly feeds; beta emits beta/nightly; nightly emits nightly.
      # Aliases refer to this release's single Canopy artifact set (including mac ZIP/blockmaps).
      - name: Merge desktop update feeds and cumulative channel aliases
        run: bun apps/desktop/scripts/merge-update-metadata.ts desktop-artifacts release-assets
      # Keep binaries locally for complete verification; matching draft assets are not uploaded again.
      - name: checksums.txt and manifest.json
        run: |
          GITHUB_SHA="$EXPECTED_SHA" bun scripts/release-manifest.ts release-assets
          ls -l release-assets
          echo "### Canopy $CANOPY_VERSION ($CANOPY_RELEASE_TAG): server and desktop" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload and verify all assets, then publish release
        run: GITHUB_SHA="$EXPECTED_SHA" bun scripts/release-upload.ts release-assets --publish
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image channel aliases (forward only)
        run: GITHUB_SHA="$EXPECTED_SHA" bun scripts/image-aliases.ts

  release-index:
    needs: [release, publish-desktop]
    uses: ./.github/workflows/pages.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  backmerge:
    needs: [release, publish-desktop]
    if: needs.release.outputs.channel == 'stable'
    uses: ./.github/workflows/backmerge.yml
    with:
      stable_sha: ${{ inputs.expected_sha || github.sha }}
    secrets:
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: write

  nightly-hygiene:
    needs: [release, publish-desktop]
    if: needs.release.outputs.channel == 'nightly'
    uses: ./.github/workflows/nightly-hygiene.yml
    permissions:
      contents: write
      packages: write

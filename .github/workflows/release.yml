# One run checks, versions, builds and publishes. GITHUB_TOKEN tags do not trigger another workflow.
name: Release

on:
  push:
    branches: [main, next, dev]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit pushed by Promote/back-merge (reject a moved branch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.4
  IMAGE_NAMESPACE: ghcr.io/itsoltech

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  semantic-release:
    needs: checks
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["main", "next", "dev"]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
      desktop_matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/semantic-release.mjs
      - id: matrix
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          echo 'value={"include":[{"target":"linux-x64","runner":"ubuntu-24.04","package":"package:linux","experimental":false},{"target":"linux-arm64","runner":"ubuntu-24.04-arm","package":"package:linux","experimental":true},{"target":"darwin-x64","runner":"macos-15-intel","package":"package:mac","experimental":false},{"target":"darwin-arm64","runner":"macos-15","package":"package:mac","experimental":false},{"target":"windows-x64","runner":"windows-2025","package":"package:windows","experimental":true}]}' >> "$GITHUB_OUTPUT"

  binaries:
    needs: semantic-release
    if: needs.semantic-release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      # Cross-compiled for every target; sharp's native build per target comes from the npm registry.
      - name: Build
        env:
          CANOPY_VERSION: ${{ needs.semantic-release.outputs.version }}
        run: bun scripts/build-binaries.ts --target all --outdir dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/release/canopy-*
          if-no-files-found: error
          retention-days: 7

  # Each binary starts on its own OS/arch (`--version` already loads the embedded sharp/libvips).
  smoke:
    needs: [semantic-release, binaries]
    if: needs.semantic-release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: windows-x64, runner: windows-2025, suffix: .exe }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: binaries
      - name: Start each binary
        shell: bash
        env:
          EXPECTED: ${{ needs.semantic-release.outputs.version }}
          CANOPY_NATIVE_DIR: ${{ runner.temp }}/canopy-native
        run: |
          for app in gateway worker; do
            binary="./canopy-$app-${{ matrix.target }}${{ matrix.suffix }}"
            chmod +x "$binary"
            actual="$("$binary" --version | tr -d '\r')"
            echo "$binary: $actual"
            test "$actual" = "$EXPECTED"
          done

  desktop:
    needs: semantic-release
    if: needs.semantic-release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.semantic-release.outputs.desktop_matrix) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # electron-builder runs on Node (docs/desktop.md: Node 24 or newer).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      # electron-builder's bundled fpm (deb) is x86-64 only.
      - name: fpm for arm64 deb
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # No Apple secrets: explicit ad-hoc identity. Never silently skip configured signing.
      - name: Signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          case "${{ matrix.target }}" in
            darwin-*)
              if [ -n "$MAC_CSC_LINK" ]; then
                { echo "CSC_LINK=$MAC_CSC_LINK"; echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"; } >> "$GITHUB_ENV"
                echo "CANOPY_MAC_SIGNED=true" >> "$GITHUB_ENV"
                echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
                if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
                  key_file="$RUNNER_TEMP/canopy-notarization-key.p8"
                  umask 077
                  printf '%s' "$APPLE_API_KEY" | base64 -D > "$key_file"
                  { echo "APPLE_API_KEY=$key_file"; echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; echo "CANOPY_MAC_NOTARIZED=true"; } >> "$GITHUB_ENV"
                elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                  { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
                  echo "CANOPY_MAC_NOTARIZED=true" >> "$GITHUB_ENV"
                else
                  echo "macOS: no complete notarization credentials; Gatekeeper will require an override"
                fi
                echo "macOS: signed with the configured Developer ID"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
                echo "macOS: ad-hoc signed; Gatekeeper override required; automatic updates disabled"
              fi ;;
            windows-*)
              if [ -n "$WIN_CSC_LINK" ]; then
                { echo "WIN_CSC_LINK=$WIN_CSC_LINK"; echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD"; } >> "$GITHUB_ENV"
                echo "Windows: signed"
              else
                echo "Windows: unsigned (no WIN_CSC_LINK secret)"
              fi ;;
          esac
      - name: Package
        env:
          CANOPY_VERSION: ${{ needs.semantic-release.outputs.version }}
          CANOPY_CHANNEL: ${{ needs.semantic-release.outputs.channel }}
        run: bun run --cwd apps/desktop ${{ matrix.package }}
      - name: Verify macOS signatures and notarization
        if: startsWith(matrix.target, 'darwin-')
        env:
          CANOPY_CHANNEL: ${{ needs.semantic-release.outputs.channel }}
        run: node apps/desktop/scripts/verify-macos.cjs "apps/desktop/release/$CANOPY_CHANNEL"
      - name: Remove notarization API key
        if: always() && startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/canopy-notarization-key.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/Canopy-*.AppImage
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/Canopy-*.deb
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/Canopy-*.dmg
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/Canopy-*.zip
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/Canopy-*.exe
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/latest*.yml
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/beta*.yml
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/nightly*.yml
            apps/desktop/release/${{ needs.semantic-release.outputs.channel }}/*.blockmap
          if-no-files-found: error
          retention-days: 7

  images:
    needs: semantic-release
    if: needs.semantic-release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, web, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
          CHANNEL: ${{ needs.semantic-release.outputs.channel }}
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}
        run: |
          {
            echo 'value<<TAGS'
            echo "$IMAGE:v$VERSION"
            echo "$IMAGE:$CHANNEL"
            if [ "$CHANNEL" = stable ]; then
              echo "$IMAGE:v${VERSION%.*}"
              echo "$IMAGE:v${VERSION%%.*}"
              echo "$IMAGE:latest"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/canopy-${{ matrix.app }}
          flavor: latest=false
          tags: type=raw,value=v${{ needs.semantic-release.outputs.version }}
          labels: |
            org.opencontainers.image.title=canopy-${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
          annotations: |
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            CANOPY_VERSION=${{ needs.semantic-release.outputs.version }}
            CANOPY_REVISION=${{ github.sha }}
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  publish:
    needs: [semantic-release, binaries, smoke, desktop, images]
    if: ${{ !cancelled() && needs.semantic-release.outputs.published == 'true' && needs.binaries.result == 'success' && needs.smoke.result == 'success' && needs.desktop.result == 'success' && needs.images.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.semantic-release.outputs.version }}
      TAG: ${{ needs.semantic-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Only the release assets: build-push-action also uploads *.dockerbuild records, which are not ours to publish.
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: binaries
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: desktop-artifacts
      - name: Merge desktop update feeds across architectures
        env:
          CANOPY_VERSION: ${{ needs.semantic-release.outputs.version }}
          CANOPY_CHANNEL: ${{ needs.semantic-release.outputs.channel }}
        run: bun apps/desktop/scripts/merge-update-metadata.ts desktop-artifacts release-assets
      - name: checksums.txt and manifest.json
        env:
          CANOPY_VERSION: ${{ needs.semantic-release.outputs.version }}
          CANOPY_CHANNEL: ${{ needs.semantic-release.outputs.channel }}
          CANOPY_RELEASE_TAG: ${{ needs.semantic-release.outputs.tag }}
        run: |
          bun scripts/release-manifest.ts release-assets
          ls -l release-assets
          echo "### Canopy $VERSION ($TAG)" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets (manifest last)
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Canopy $VERSION" --generate-notes
          fi
          find release-assets -type f ! -name manifest.json -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release upload "$TAG" release-assets/manifest.json --clobber

  backmerge:
    needs: [semantic-release, publish]
    if: needs.semantic-release.outputs.channel == 'stable'
    uses: ./.github/workflows/backmerge.yml
    with:
      stable_sha: ${{ github.sha }}
    permissions:
      contents: write
      pull-requests: write
      actions: write

  nightly-hygiene:
    needs: [semantic-release, publish]
    if: needs.semantic-release.outputs.channel == 'nightly'
    uses: ./.github/workflows/nightly-hygiene.yml
    permissions:
      contents: write

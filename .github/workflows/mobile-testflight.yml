# Native changes build iOS/TestFlight; compatible JS changes publish signed updates for both platforms.
# Android binaries are always built manually. See docs/mobile.md.
name: Mobile release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing the mobile app uses changed
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.4
  EAS_CLI: eas-cli@27.4.1

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            released=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "release" and .conclusion == "success") | .id')
            if [ -z "$released" ]; then echo "Release skipped publication; nothing to ship."; exit 0; fi
          fi
          case "$RELEASE_BRANCH" in
            dev) channel=nightly; profile=production; pattern='v*-nightly.*' ;;
            next) channel=beta; profile=production-beta; pattern='v*-beta.*' ;;
            main|v[0-9]*.[0-9]*.[0-9]*) channel=stable; profile=production-stable; pattern='v*' ;;
            *) echo "Not a Canopy release branch; skipping."; exit 0 ;;
          esac
          tag=$(git tag --points-at HEAD --list "$pattern" --sort=-v:refname \
            | { if [ "$channel" = stable ]; then sed -n '/^v[0-9]\+\.[0-9]\+\.[0-9]\+$/p'; else cat; fi; } | head -n1)
          if [ -z "$tag" ]; then echo "No $channel release on $HEAD_SHA; nothing to ship."; exit 0; fi
          {
            echo "tag=$tag"
            echo "marketing=$(echo "${tag#v}" | cut -d- -f1)"
            echo "channel=$channel"
            echo "profile=$profile"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.version.outputs.tag
      - uses: actions/setup-node@v5
        if: steps.version.outputs.tag
        with:
          node-version: 24

      - id: plan
        if: steps.version.outputs.tag
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          PROFILE: ${{ steps.version.outputs.profile }}
          TAG: ${{ steps.version.outputs.tag }}
          MARKETING: ${{ steps.version.outputs.marketing }}
          FORCE: ${{ inputs.force }}
        run: bash ../../scripts/mobile-release.sh

      # EAS copies the modified app.json; remote autoIncrement owns the iOS build number.
      - name: Build iOS and submit to TestFlight
        if: steps.plan.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          PROFILE: ${{ steps.version.outputs.profile }}
          MESSAGE: ${{ steps.plan.outputs.message }}
        run: |
          bunx "$EAS_CLI" build --platform ios --profile "$PROFILE" --non-interactive --no-wait \
            --auto-submit-with-profile production --message "$MESSAGE"

      # Replace this publisher (and updates.url in app.json) to use an Expo Updates protocol server.
      - name: Publish signed update
        if: steps.plan.outputs.ota == 'true'
        working-directory: apps/mobile
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          MESSAGE: ${{ steps.plan.outputs.message }}
          EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
        run: bash ../../scripts/mobile-publish-update.sh

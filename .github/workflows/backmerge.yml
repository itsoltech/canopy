name: Back-merge
on:
  workflow_call:
    inputs:
      stable_sha:
        description: Commit of the completed stable release
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release-branch-mutations
  cancel-in-progress: false
jobs:
  backmerge:
    if: >-
      github.ref_protected &&
      (github.ref == 'refs/heads/dev' ||
       (inputs.stable_sha != '' &&
        (github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    environment: release-automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::RELEASE_DEPLOY_KEY is required to push release branches through repository rulesets."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Propagate stable hotfixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_SHA: ${{ inputs.stable_sha }}
        run: bun scripts/backmerge.ts

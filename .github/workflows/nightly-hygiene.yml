name: Nightly hygiene
on:
  workflow_call:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-hygiene
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Keep ten completed nightly GitHub prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/prune-nightly.ts

name: Nightly hygiene
on:
  workflow_call:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be deleted
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
concurrency:
  group: nightly-hygiene
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Releases first, then GHCR; missing package access fails this job only after the releases are pruned.
      - name: Prune nightly GitHub prereleases and GHCR image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$DRY_RUN" = true ]; then bun scripts/prune-nightly.ts --dry-run; else bun scripts/prune-nightly.ts; fi

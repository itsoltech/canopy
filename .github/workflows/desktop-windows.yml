# Builds and installs the Windows package without signing, tags, releases or publication.
name: Windows desktop package

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows.yml"
      - ".github/workflows/release.yml"
      - ".github/actions/setup-bun/**"
      - "apps/desktop/**"
      - "apps/gateway/**"
      - "apps/worker/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CANOPY_VERSION: 0.0.0-nightly.${{ github.run_number }}
      CANOPY_CHANNEL: nightly
      CANOPY_RELEASE_TAG: v0.0.0-nightly.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Package unsigned Windows desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run --cwd apps/desktop package:windows
      - name: Unsigned installer must fail the signature gate
        run: |
          try {
            ./apps/desktop/scripts/verify-windows.ps1 -ReleaseDirectory apps/desktop/release/nightly
            throw 'Unsigned installer passed the signature gate'
          } catch {
            if (-not $_.Exception.Message.StartsWith('Invalid Authenticode signature')) { throw }
            Write-Output 'Unsigned installer rejected by the release signature gate.'
          }
      - name: Install package and smoke sidecars
        run: ./apps/desktop/scripts/smoke-windows.ps1 -ReleaseDirectory apps/desktop/release/nightly
      - name: Validate release metadata without publishing
        run: |
          $release = 'apps/desktop/release/nightly'
          $artifact = '.tmp/windows-desktop/artifacts/desktop-windows-x64'
          New-Item $artifact -ItemType Directory -Force | Out-Null
          foreach ($pattern in @('Canopy-*.exe', 'Canopy-*.exe.blockmap', 'nightly.yml')) {
            $files = @(Get-ChildItem "$release/$pattern" -File)
            if ($files.Count -ne 1) { throw "Expected exactly one $pattern" }
            $files | Copy-Item -Destination $artifact
          }
          bun apps/desktop/scripts/merge-update-metadata.ts .tmp/windows-desktop/artifacts .tmp/windows-desktop/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/release-manifest.ts .tmp/windows-desktop/assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content .tmp/windows-desktop/assets/manifest.json -Raw | ConvertFrom-Json
          if (@($manifest.assets).Count -ne 1 -or $manifest.assets[0].app -ne 'desktop' -or $manifest.assets[0].os -ne 'windows' -or $manifest.assets[0].arch -ne 'x64') {
            throw 'Missing desktop/windows/x64 manifest entry'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            .tmp/windows-desktop/assets/*
            apps/desktop/release/nightly/package-sizes-*.json
          if-no-files-found: error
          retention-days: 3

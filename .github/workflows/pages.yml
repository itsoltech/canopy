# Publishes the OAuth redirect page and the complete public release index.
name: Pages

on:
  push:
    branches: [dev]
    paths:
      - site/**
      - scripts/build-site.ts
      - scripts/release-index.ts
      - packages/domain/src/release/catalog.ts
      - packages/domain/src/oauth-return.ts
      - .github/workflows/pages.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in sync with mise.toml.
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # All channels publish the current site, so a stable release cannot restore older OAuth pages.
          ref: dev
      - uses: ./.github/actions/setup-bun
      - run: bun scripts/build-site.ts
      # Regenerate on ordinary site changes too, so a site deployment cannot remove the index.
      # Only public releases are read; Release calls this workflow after all verification/publication.
      - run: bun scripts/release-index.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANOPY_RELEASE_TAG: ${{ inputs.release_tag || '' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

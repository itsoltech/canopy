name: Nightly release recovery

on:
  workflow_run:
    workflows: [Release]
    branches: [dev]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Retry failed jobs after a runner disconnect or artifact service timeout
        shell: bash
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          run="$repo/actions/runs/$RUN_ID"
          failed=$(gh api --paginate "$run/attempts/1/jobs?per_page=100" --jq '
            .jobs[] | select(.conclusion | IN("failure", "cancelled", "timed_out", "action_required", "startup_failure"))
            | [.id, .conclusion] | @tsv')
          if [[ -z "$failed" ]]; then exit 0; fi

          while IFS=$'\t' read -r job conclusion; do
            if [[ "$conclusion" != failure ]]; then
              echo "Job $job concluded with $conclusion. Use the Release logs to recover it."
              exit 0
            fi
            transient=$(gh api --paginate "$repo/check-runs/$job/annotations?per_page=100" --jq '
              .[] | select(.annotation_level == "failure") | .message | select(
                startswith("The hosted runner lost communication with the server.") or
                (startswith("Failed to CreateArtifact: Failed to make request after ") and
                 endswith(" attempts: Request timeout: /twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact")))')
            if [[ -z "$transient" ]]; then
              echo "Job $job failed without a recognized GitHub infrastructure error. Use the Release logs to recover it."
              exit 0
            fi
          done <<< "$failed"

          # A manual rerun may have started while we read the job annotations.
          current=$(gh api "$run" --jq '
            select(.path == ".github/workflows/release.yml" and .event == "schedule" and
              .head_branch == "dev" and .run_attempt == 1 and .status == "completed" and
              .conclusion == "failure") | .id')
          if [[ "$current" != "$RUN_ID" ]]; then exit 0; fi

          gh api --method POST "$run/rerun-failed-jobs"
          echo "Queued a single retry of failed jobs in Release run $RUN_ID after a GitHub infrastructure error."

name: Release desktop target

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      build_runner:
        required: true
        type: string
      packaging_runner:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      bun_version:
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  BUN_VERSION: ${{ inputs.bun_version }}

jobs:
  build:
    runs-on: ${{ inputs.build_runner }}
    continue-on-error: ${{ inputs.target == 'linux-arm64' }}
    timeout-minutes: 45
    outputs:
      runtime_artifact: ${{ steps.runtime.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Build the desktop runtime
        env:
          CANOPY_VERSION: ${{ inputs.version }}
          CANOPY_CHANNEL: ${{ inputs.channel }}
          CANOPY_REVISION: ${{ env.EXPECTED_SHA }}
        run: bun run --cwd apps/desktop build
      - name: Archive the build output with file modes
        shell: bash
        working-directory: apps/desktop
        run: |
          entries=(dist build/runtime)
          if [ "$RUNNER_OS" = macOS ]; then entries+=(build/native); fi
          tar -czf desktop-runtime.tar.gz "${entries[@]}"
      - id: runtime
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ inputs.target }}
          path: apps/desktop/desktop-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  package:
    needs: build
    if: needs.build.outputs.runtime_artifact != ''
    runs-on: ${{ inputs.packaging_runner }}
    environment: release-signing
    continue-on-error: ${{ inputs.target == 'linux-arm64' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      # Restore downloads before dependency installation, so Electron install hooks can reuse them too.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-bun
        with:
          workspace: ${{ startsWith(inputs.target, 'darwin-') && '@canopy/desktop' || '' }}
      # electron-builder runs on Node (docs/desktop.md: Node 24 or newer).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.runtime_artifact }}
          path: apps/desktop/.release-artifact
      - name: Restore the runtime into its packaging directories
        shell: bash
        working-directory: apps/desktop
        run: |
          staging="$(mktemp -d)"
          tar -xf .release-artifact/desktop-runtime.tar.gz -C "$staging"
          test -d "$staging/dist" && test ! -L "$staging/dist"
          test -d "$staging/build/runtime" && test ! -L "$staging/build/runtime"
          mkdir -p build
          mv "$staging/dist" ./dist
          mv "$staging/build/runtime" ./build/runtime
          if [ "$RUNNER_OS" = macOS ]; then mv "$staging/build/native" ./build/native; fi
      # electron-builder's bundled fpm (deb) is x86-64 only.
      - name: fpm for arm64 deb
        if: inputs.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      # No Apple secrets: explicit ad-hoc identity. Never silently skip configured signing.
      - name: Signing
        if: startsWith(inputs.target, 'darwin-')
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$MAC_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
              echo "CANOPY_MAC_SIGNED=true"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
              key_file="$RUNNER_TEMP/canopy-notarization-key.p8"
              umask 077
              printf '%s' "$APPLE_API_KEY" | base64 -D > "$key_file"
              { echo "APPLE_API_KEY=$key_file"; echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; echo "CANOPY_MAC_NOTARIZED=true"; } >> "$GITHUB_ENV"
            elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
              echo "CANOPY_MAC_NOTARIZED=true" >> "$GITHUB_ENV"
            else
              echo "macOS: no complete notarization credentials; Gatekeeper will require an override"
            fi
            echo "macOS: signed with the configured Developer ID"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "macOS: ad-hoc signed; Gatekeeper override required; automatic updates disabled"
          fi
      - name: Windows signing credentials
        if: inputs.target == 'windows-x64'
        shell: pwsh
        env:
          CANOPY_CHANNEL: ${{ inputs.channel }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') | Where-Object {
            -not [Environment]::GetEnvironmentVariable($_)
          }
          if ($missing.Count -eq 0) {
            'CANOPY_WINDOWS_SIGNED=true' >> $env:GITHUB_ENV
            Write-Output 'Windows: Azure Trusted Signing required; signature verification will gate upload.'
          } elseif ($env:CANOPY_CHANNEL -ne 'nightly') {
            throw "Windows $env:CANOPY_CHANNEL requires Azure Trusted Signing. Missing release-signing secrets: $($missing -join ', ')"
          } else {
            'CANOPY_WINDOWS_SIGNED=false' >> $env:GITHUB_ENV
            Write-Output "::notice::Windows nightly will be unsigned. Missing release-signing secrets: $($missing -join ', ')"
          }
      - name: Package
        uses: ./.github/actions/package-desktop
        with:
          build-runtime: "false"
        env:
          CANOPY_VERSION: ${{ inputs.version }}
          CANOPY_CHANNEL: ${{ inputs.channel }}
          AZURE_TENANT_ID: ${{ inputs.target == 'windows-x64' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.target == 'windows-x64' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.target == 'windows-x64' && secrets.AZURE_CLIENT_SECRET || '' }}
      - name: Clear signing credentials before package checks
        if: always() && startsWith(inputs.target, 'darwin-')
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/canopy-notarization-key.p8"
          printf '%s\n' CSC_LINK= CSC_KEY_PASSWORD= APPLE_API_KEY= APPLE_API_KEY_ID= APPLE_API_ISSUER= \
            APPLE_ID= APPLE_APP_SPECIFIC_PASSWORD= APPLE_TEAM_ID= >> "$GITHUB_ENV"
      - name: Verify Windows signatures
        if: inputs.target == 'windows-x64' && env.CANOPY_WINDOWS_SIGNED == 'true'
        shell: pwsh
        env:
          CANOPY_CHANNEL: ${{ inputs.channel }}
        run: ./apps/desktop/scripts/verify-windows.ps1 -ReleaseDirectory "apps/desktop/release/$env:CANOPY_CHANNEL"
      - name: Install and test the Windows release package
        if: inputs.target == 'windows-x64'
        shell: pwsh
        env:
          CANOPY_VERSION: ${{ inputs.version }}
          CANOPY_CHANNEL: ${{ inputs.channel }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          # During recovery the packaging checkout can differ from the packaged source.
          ./apps/desktop/scripts/smoke-windows.ps1 -ReleaseDirectory "apps/desktop/release/$env:CANOPY_CHANNEL" `
            -SkipSourceTests:($env:EXPECTED_SHA -ne $env:WORKFLOW_SHA)
      - name: Verify macOS signatures and notarization
        if: startsWith(inputs.target, 'darwin-')
        env:
          CANOPY_CHANNEL: ${{ inputs.channel }}
        run: node apps/desktop/scripts/verify-macos.cjs "apps/desktop/release/$CANOPY_CHANNEL"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.target }}
          path: |
            apps/desktop/release/${{ inputs.channel }}/Canopy-*.AppImage
            apps/desktop/release/${{ inputs.channel }}/Canopy-*.deb
            apps/desktop/release/${{ inputs.channel }}/Canopy-*.dmg
            apps/desktop/release/${{ inputs.channel }}/Canopy-*.zip
            apps/desktop/release/${{ inputs.channel }}/Canopy-*.exe
            apps/desktop/release/${{ inputs.channel }}/latest*.yml
            apps/desktop/release/${{ inputs.channel }}/beta*.yml
            apps/desktop/release/${{ inputs.channel }}/nightly*.yml
            apps/desktop/release/${{ inputs.channel }}/*.blockmap
            apps/desktop/release/${{ inputs.channel }}/package-sizes-*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

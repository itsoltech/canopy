name: Promote
on:
  workflow_dispatch:
    inputs:
      promotion:
        description: Fast-forward promotion
        type: choice
        options: [dev-next, next-main]
        required: true
      burn_in_days:
        description: Minimum beta age in days
        type: number
        default: 3
      live_smoke:
        description: Legacy confirmation (automated Release smoke now gates promotion)
        type: boolean
        default: false
      update_smoke:
        description: Legacy confirmation (not required by automatic promotion)
        type: boolean
        default: false
      dry_run:
        description: Print the plan without pushing, dispatching or writing issues
        type: boolean
        default: true
      override:
        description: Bypass soak, pause and promotion-hold (CI, blockers and FF still enforced)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: release-branch-mutations
  cancel-in-progress: false
env:
  BUN_VERSION: 1.4.4
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: ./.github/actions/setup-bun
      - name: Verify and fast-forward
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_PATH: ${{ inputs.promotion }}
          BURN_IN_DAYS: ${{ inputs.burn_in_days }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMOTION_OVERRIDE: ${{ inputs.override }}
          AUTO_PROMOTION: ${{ vars.AUTO_PROMOTION }}
        run: bun scripts/promote.ts

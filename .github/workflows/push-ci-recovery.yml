# Retries the failed test jobs of a protected push once and reports tests that pass on the retry (docs/release.md).
# A retry that fails again keeps the run red, so Release still needs a passing Push CI for its exact commit.
name: Push CI recovery

on:
  workflow_run:
    workflows: [Push CI]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["dev", "next", "main"]'), github.event.workflow_run.head_branch) &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Retry failed test jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/scripts/push-ci-recovery.sh rerun

  report:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["dev", "next", "main"]'), github.event.workflow_run.head_branch) &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Report tests that passed on the retry
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash .github/scripts/push-ci-recovery.sh report

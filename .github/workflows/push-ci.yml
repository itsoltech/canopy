# Validate the squash or back-merge commit. Fast-forward promotions can use its existing run.
name: Push CI

on:
  push:
    branches: [dev, next, main]

permissions:
  contents: read

jobs:
  select:
    if: github.ref_protected && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      upstream: ${{ steps.lookup.outputs.upstream }}
    steps:
      - uses: actions/checkout@v5
        if: github.ref_name != 'dev'
        with:
          persist-credentials: false
      - id: lookup
        if: github.ref_name != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/verify-push-ci.sh --find-upstream

  checks:
    needs: select
    if: needs.select.outputs.upstream == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

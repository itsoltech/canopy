name: Bun and dependencies
description: Bun (BUN_VERSION of the calling workflow), a cached package store and a frozen install.
inputs:
  install:
    description: Run bun install --frozen-lockfile
    default: "true"
  workspace:
    description: Install only this workspace and use a separate package cache.
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ env.BUN_VERSION }}
    - if: inputs.install == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ inputs.workspace && format('bun-workspace-{0}', inputs.workspace) || 'bun' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ inputs.workspace && format('bun-workspace-{0}', inputs.workspace) || 'bun' }}-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.install == 'true'
      env:
        BUN_WORKSPACE: ${{ inputs.workspace }}
      shell: bash
      run: |
        filters=()
        if [[ -n "$BUN_WORKSPACE" ]]; then filters+=(--filter "$BUN_WORKSPACE"); fi
        bun install --frozen-lockfile "${filters[@]}"

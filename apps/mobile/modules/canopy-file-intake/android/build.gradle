plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.canopy'
version = '1.0.0'

android {
  namespace "app.canopy.fileintake"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // ViewCompat.setOnReceiveContentListener; the AndroidX core React Native already ships.
  implementation 'androidx.core:core-ktx:1.13.1'
}

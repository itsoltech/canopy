<!doctype html>
<html lang="en" class="bg-white antialiased dark:bg-black%canopy.dark%" data-color-scheme="%canopy.scheme%" data-accent="%canopy.accent%" data-chat-width="%canopy.chatWidth%" data-sidebar-width="%canopy.sidebarWidth%" data-sidebar-collapsed="%canopy.sidebarCollapsed%" data-thread-panel-collapsed="%canopy.threadPanelCollapsed%" style="--canopy-sidebar-width: min(45vw, %canopy.sidebarWidth%px)">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="%canopy.colorSchemeMeta%" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Canopy" />
		<meta name="application-name" content="Canopy" />
		<style>
			html { background: white; color-scheme: light; }
			html.dark { background: black; color-scheme: dark; }
			#canopy-boot { position: fixed; inset: 0; display: flex; background: white; z-index: 100; }
			.dark #canopy-boot { background: black; }
			#canopy-boot aside { display: none; }
			#canopy-boot main { flex: 1; min-width: 0; padding: 24px; }
			#canopy-boot i { display: block; width: 176px; height: 24px; border-radius: 6px; background: #f4f4f5; }
			.dark #canopy-boot i { background: #18181b; }
			#canopy-boot section { max-width: 720px; margin: 30vh auto 0; }
			#canopy-boot section i { width: 100%; height: 128px; }
			@media (min-width: 1024px) {
				#canopy-boot aside { display: block; width: var(--canopy-sidebar-width); flex-shrink: 0; background: #fafafa; }
				.dark #canopy-boot aside { background: #09090b; }
				html[data-sidebar-collapsed="true"] #canopy-boot aside { width: 0; }
			}
		</style>
		<script>
			// The server renders the saved appearance (hooks.server.ts); only "system" needs the browser's preference.
			if (document.documentElement.dataset.colorScheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
		</script>
		<link rel="preconnect" href="https://rsms.me/" />
		<!-- The font file starts loading with the page, not after the stylesheet: fewer frames in the fallback. -->
		<link rel="preload" href="https://rsms.me/inter/font-files/InterVariable.woff2?v=4.1" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="canopy-boot" role="status" aria-label="Loading application"><aside></aside><main><i></i><section><i></i></section></main></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

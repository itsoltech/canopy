<!doctype html>
<html lang="en" class="bg-white antialiased dark:bg-black%oa.dark%" data-color-scheme="%oa.scheme%" data-accent="%oa.accent%" data-chat-width="%oa.chatWidth%" data-sidebar-width="%oa.sidebarWidth%" data-sidebar-collapsed="%oa.sidebarCollapsed%" data-thread-panel-collapsed="%oa.threadPanelCollapsed%" style="--oa-sidebar-width: min(45vw, %oa.sidebarWidth%px)">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="%oa.colorSchemeMeta%" />
		<style>
			html { background: white; color-scheme: light; }
			html.dark { background: black; color-scheme: dark; }
			#oa-boot { position: fixed; inset: 0; display: flex; background: white; z-index: 100; }
			.dark #oa-boot { background: black; }
			#oa-boot aside { display: none; }
			#oa-boot main { flex: 1; min-width: 0; padding: 24px; }
			#oa-boot i { display: block; width: 176px; height: 24px; border-radius: 6px; background: #f4f4f5; }
			.dark #oa-boot i { background: #18181b; }
			#oa-boot section { max-width: 720px; margin: 30vh auto 0; }
			#oa-boot section i { width: 100%; height: 128px; }
			@media (min-width: 1024px) {
				#oa-boot aside { display: block; width: var(--oa-sidebar-width); flex-shrink: 0; background: #fafafa; }
				.dark #oa-boot aside { background: #09090b; }
				html[data-sidebar-collapsed="true"] #oa-boot aside { width: 0; }
			}
		</style>
		<script>
			// The server renders the saved appearance (hooks.server.ts); only "system" needs the browser's preference.
			if (document.documentElement.dataset.colorScheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
		</script>
		<link rel="preconnect" href="https://rsms.me/" />
		<!-- The font file starts loading with the page, not after the stylesheet: fewer frames in the fallback. -->
		<link rel="preload" href="https://rsms.me/inter/font-files/InterVariable.woff2?v=4.1" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="oa-boot" role="status" aria-label="Loading application"><aside></aside><main><i></i><section><i></i></section></main></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

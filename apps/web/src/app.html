<!doctype html>
<html lang="en" class="bg-white antialiased dark:bg-black%oa.dark%" data-color-scheme="%oa.scheme%" data-accent="%oa.accent%" data-chat-width="%oa.chatWidth%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="%oa.colorSchemeMeta%" />
		<script>
			// The server renders the saved appearance (hooks.server.ts); only "system" needs the browser's preference.
			if (document.documentElement.dataset.colorScheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
		</script>
		<link rel="preconnect" href="https://rsms.me/" />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

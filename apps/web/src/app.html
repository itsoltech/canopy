<!doctype html>
<html
  lang="en"
  data-application-name="%canopy.applicationName%"
  class="%canopy.dark% bg-canvas antialiased"
  data-color-scheme="%canopy.scheme%"
  data-accent="%canopy.accent%"
  data-light-theme="%canopy.lightTheme%"
  data-dark-theme="%canopy.darkTheme%"
  data-chat-width="%canopy.chatWidth%"
  data-sidebar-width="%canopy.sidebarWidth%"
  data-sidebar-collapsed="%canopy.sidebarCollapsed%"
  data-thread-panel-collapsed="%canopy.threadPanelCollapsed%"
  style="%canopy.paletteStyle%;--canopy-sidebar-width: min(45vw, %canopy.sidebarWidth%px)"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="%canopy.colorSchemeMeta%" />
    <link rel="icon" href="%canopy.channelAssets%/icon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%canopy.channelAssets%/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%canopy.channelAssets%/icon-16.png" />
    <link rel="apple-touch-icon" href="%canopy.channelAssets%/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="%canopy.applicationName%" />
    <meta name="application-name" content="%canopy.applicationName%" />
    <style>
      html {
        background: var(--theme-canvas);
        color: var(--theme-ink);
        color-scheme: light;
      }
      html.dark {
        color-scheme: dark;
      }
      #canopy-boot {
        position: fixed;
        inset: 0;
        display: flex;
        background: var(--theme-canvas);
        z-index: 100;
      }
      #canopy-boot aside {
        display: none;
      }
      #canopy-boot main {
        flex: 1;
        min-width: 0;
        padding: 24px;
      }
      #canopy-boot i {
        display: block;
        width: 176px;
        height: 24px;
        border-radius: 6px;
        background: var(--theme-hover);
      }
      #canopy-boot section {
        max-width: 720px;
        margin: 30vh auto 0;
      }
      #canopy-boot section i {
        width: 100%;
        height: 128px;
      }
      @media (min-width: 1024px) {
        #canopy-boot aside {
          display: block;
          width: var(--canopy-sidebar-width);
          flex-shrink: 0;
          background: var(--theme-panel);
        }
        html[data-sidebar-collapsed="true"] #canopy-boot aside {
          width: 0;
        }
      }
      #canopy-boot [role="alert"],
      #canopy-boot[data-failed] main > i,
      #canopy-boot[data-failed] section {
        display: none;
      }
      #canopy-boot[data-failed] [role="alert"] {
        display: block;
        max-width: 28rem;
        margin: 30vh auto 0;
        text-align: center;
        font:
          14px/1.5 InterVariable,
          system-ui,
          sans-serif;
      }
      #canopy-boot h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
      }
      #canopy-boot p {
        margin: 8px 0 24px;
        opacity: 0.7;
      }
      #canopy-boot button {
        padding: 6px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--theme-ink);
        color: var(--theme-canvas);
        font: inherit;
        font-weight: 600;
      }
    </style>
    <script>
      // Gateway palettes are already inline. Only the bundled desktop startup uses its chrome cache.
      const root = document.documentElement;
      try {
        const view = JSON.parse(localStorage.getItem("canopy:preferences:view") || "{}");
        if (view && typeof view === "object") {
          if (typeof view.sidebarWidth === "number" && Number.isFinite(view.sidebarWidth)) {
            const width = view.sidebarWidth > 0 ? Math.round(Math.min(560, Math.max(220, view.sidebarWidth))) : 288;
            root.dataset.sidebarWidth = String(width);
            root.style.setProperty("--canopy-sidebar-width", `min(45vw, ${width}px)`);
          }
          for (const key of ["sidebarCollapsed", "threadPanelCollapsed"]) {
            if (typeof view[key] === "boolean") root.dataset[key] = String(view[key]);
          }
        }
      } catch {
        // The shell remains usable when device storage is unavailable.
      }
      const startup = location.pathname === "/desktop" && window.canopyDesktop?.startupAppearance;
      if (startup) {
        root.style.cssText += ";" + startup.style;
        root.dataset.colorScheme = startup.scheme;
        root.dataset.lightTheme = startup.light;
        root.dataset.darkTheme = startup.dark;
      }
      const scheme = root.dataset.colorScheme;
      root.classList.toggle(
        "dark",
        scheme === "dark" || (scheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches),
      );
      document.querySelector('meta[name="color-scheme"]').content = scheme === "system" ? "light dark" : scheme;
    </script>
    <link rel="preconnect" href="https://rsms.me/" />
    <!-- The font file starts loading with the page, not after the stylesheet: fewer frames in the fallback. -->
    <link
      rel="preload"
      href="https://rsms.me/inter/font-files/InterVariable.woff2?v=4.1"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="canopy-boot" role="status" aria-label="Loading application">
      <aside></aside>
      <main>
        <i></i>
        <section><i></i></section>
        <div role="alert">
          <h1>Could not start %canopy.applicationName%</h1>
          <p>Part of the app did not download. Check the connection, then reload.</p>
          <button type="button" onclick="location.reload()">Reload</button>
        </div>
      </main>
    </div>
    <script>
      // Startup failed (a script did not download): offer a reload, not a skeleton that never ends.
      // The root layout removes #canopy-boot once it mounts, so later rejections never reach here.
      addEventListener("unhandledrejection", () => {
        const boot = document.getElementById("canopy-boot");
        if (!boot) return;
        boot.dataset.failed = "";
        boot.setAttribute("aria-label", "Could not start the application");
      });
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

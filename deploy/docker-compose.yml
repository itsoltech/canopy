# Canopy on one host (docs/deploy.md): PostgreSQL + gateway + web, optionally a worker (profile "worker").
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d
# Put the web port behind a TLS reverse proxy; keep the existing gateway port for workers and self-update.
# Network access is optional: workers migrate after verifying it, or keep their original server endpoint.
name: canopy

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: canopy
      POSTGRES_DB: canopy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy -d canopy"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    image: ghcr.io/itsoltech/canopy-gateway:${CANOPY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CANOPY_DATABASE_URL: postgres://canopy:${POSTGRES_PASSWORD}@postgres:5432/canopy
      CANOPY_UI_SERVICE_TOKEN: ${CANOPY_UI_SERVICE_TOKEN:?set CANOPY_UI_SERVICE_TOKEN in .env}
      CANOPY_SECRETS_KEY: ${CANOPY_SECRETS_KEY:?set CANOPY_SECRETS_KEY in .env}
      CANOPY_DEV_USER_EMAIL: ${CANOPY_DEV_USER_EMAIL:-dev@localhost}
      CANOPY_NETWORK_PORT: ${CANOPY_NETWORK_PORT:-24443}
      CANOPY_OAUTH_REDIRECT_URL: ${CANOPY_OAUTH_REDIRECT_URL:-}
    ports:
      # Bootstrap/compatibility: WorkerLink + Enrollment + frozen UpdateService remain here.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-7443}:7443"
      # Optional pinned route: enable Network access in Settings and add the host's reachable address.
      - "${NETWORK_BIND:-0.0.0.0}:${CANOPY_NETWORK_PORT:-24443}:${CANOPY_NETWORK_PORT:-24443}"

  web:
    image: ghcr.io/itsoltech/canopy-web:${CANOPY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: http://gateway:7443
      GATEWAY_SERVICE_TOKEN: ${CANOPY_UI_SERVICE_TOKEN}
      # The reverse proxy tells the BFF the public scheme and host (form submissions check the origin).
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-50M}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

  # Optional: `docker compose --profile worker run --rm worker enroll --gateway http://gateway:7443 --token TOKEN`,
  # then `docker compose --profile worker up -d`. The image has no agent CLIs (docs/deploy.md).
  worker:
    image: ghcr.io/itsoltech/canopy-worker:${CANOPY_TAG:-latest}
    profiles: [worker]
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - worker-home:/home/canopy

volumes:
  postgres:
  worker-home:

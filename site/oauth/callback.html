<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <title>Canopy</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: InterVariable, Inter, ui-sans-serif, system-ui, sans-serif;
        color: #18181b;
        background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: 100%;
        max-width: 26rem;
        display: grid;
        gap: 1rem;
      }
      p {
        margin: 0;
        color: #52525b;
        font-size: 1rem;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .brand {
        color: inherit;
        font-size: 0.875rem;
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
      .code {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        border-radius: 0.5rem;
        padding: 0.375rem 0.375rem 0.375rem 0.75rem;
        box-shadow: inset 0 0 0 1px rgb(9 9 11 / 0.1);
      }
      code {
        min-width: 0;
        flex: 1;
        padding-block: 0.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
        color: #3f3f46;
        user-select: all;
      }
      button {
        flex: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.375rem 0.75rem;
        background: #18181b;
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #3f3f46;
      }
      button:focus-visible {
        outline: 2px solid #0d9488;
        outline-offset: 3px;
      }
      @media (min-width: 40rem) {
        p {
          font-size: 0.875rem;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #18181b;
          color: #fafafa;
        }
        p {
          color: #a1a1aa;
        }
        .code {
          box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1);
        }
        code {
          color: #d4d4d8;
        }
        button {
          background: #fafafa;
          color: #18181b;
        }
        button:hover {
          background: #d4d4d8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Canopy</p>
      <p id="status" role="status">Returning to Canopy…</p>
      <div id="manual" hidden>
        <div class="code"><code id="code"></code><button id="copy" type="button">Copy code</button></div>
      </div>
    </main>
    <script>
      __SCRIPT__;
    </script>
  </body>
</html>

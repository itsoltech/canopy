syntax = "proto3";
package canopy.ui.v1;

// Network access (docs/network-access.md): one switch per computer lets phones and linked computers
// connect to a pinned TLS listener on every interface. Settings live in the database.
message NetworkAddress {
  // https://host:port, as phones and linked computers use it.
  string origin = 1;
  string host = 2;
  // lan, tailscale, vpn, public, hostname
  string kind = 3;
  // The network interface; empty for an added hostname.
  string interface_name = 4;
}
message NetworkAccess {
  bool enabled = 1;
  // off, on, error
  string state = 2;
  // Why the listener isn't running, in the words the UI shows (port in use, not allowed).
  string error = 3;
  // The listening port, or the one kept for the next start; 0 while none is chosen yet.
  uint32 port = 4;
  // The server's environment fixes the port (a published container port); the UI shows it read-only.
  bool port_fixed = 5;
  // Where this computer can be reached now: detected addresses, then added hostnames.
  repeated NetworkAddress addresses = 6;
  repeated string hostnames = 7;
  // SHA-256 of this computer's certificate; phones and linked computers pin it.
  string fingerprint = 8;
  // A help line only when needed (container networking, the macOS local network permission).
  string note = 9;
  // This host's Tailscale, read-only (docs/tailscale.md).
  Tailscale tailscale = 10;
}
message Tailscale {
  // not_installed, not_running, stopped, logged_out, starting, connected
  string state = 1;
  // This computer's MagicDNS name without the trailing dot; empty without MagicDNS or while not connected.
  string dns_name = 2;
  repeated string ipv4 = 3;
  repeated string ipv6 = 4;
  string tailnet = 5;
  bool magic_dns = 6;
  // The tailnet issues HTTPS certificates for this computer's name.
  bool https_certificates = 7;
  int64 checked_at_ms = 8;
  // HTTPS over Tailscale: the web app at https://<dns_name>[:port] through Tailscale Serve.
  TailscaleHttps https = 9;
}
message TailscaleHttps {
  // The switch in Settings.
  bool enabled = 1;
  // off, on, error, unavailable
  string state = 2;
  // The HTTPS port in use, or the one chosen for next time; 0 while automatic and off.
  uint32 port = 3;
  // No port was chosen: 443 when it is free in Serve, otherwise 8447.
  bool port_automatic = 4;
  // https://name[:port] while on.
  string url = 5;
  // Why it isn't working, in the words the UI shows (a used port, missing operator rights).
  string error = 6;
  // Why it can't be turned on now, in the words the UI shows; empty when it can.
  string unavailable = 7;
  // The Tailscale admin console page with the one action needed (HTTPS certificates); empty otherwise.
  string admin_url = 8;
  // The Tailscale login that may open it; empty when every device in the tailnet may (a tagged server).
  string allowed_login = 9;
}
message GetNetworkAccessRequest {}
message UpdateNetworkAccessRequest {
  // set_enabled, set_port, choose_port (a new free port), set_hostnames, refresh_tailscale,
  // set_tailscale_https (enabled), set_tailscale_https_port (port; 0 = automatic)
  string action = 1;
  bool enabled = 2;
  uint32 port = 3;
  repeated string hostnames = 4;
}

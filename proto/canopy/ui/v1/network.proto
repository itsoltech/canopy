syntax = "proto3";
package canopy.ui.v1;

// Network access (docs/network-access.md): one switch per computer lets phones and linked computers
// connect to a pinned TLS listener on every interface. Settings live in the database.
message NetworkAddress {
  // https://host:port, as phones and linked computers use it.
  string origin = 1;
  string host = 2;
  // lan, tailscale, vpn, public, hostname
  string kind = 3;
  // The network interface; empty for an added hostname.
  string interface_name = 4;
}
message NetworkAccess {
  bool enabled = 1;
  // off, on, error
  string state = 2;
  // Why the listener isn't running, in the words the UI shows (port in use, not allowed).
  string error = 3;
  // The listening port, or the one kept for the next start; 0 while none is chosen yet.
  uint32 port = 4;
  // The server's environment fixes the port (a published container port); the UI shows it read-only.
  bool port_fixed = 5;
  // Where this computer can be reached now: detected addresses, then added hostnames.
  repeated NetworkAddress addresses = 6;
  repeated string hostnames = 7;
  // SHA-256 of this computer's certificate; phones and linked computers pin it.
  string fingerprint = 8;
  // A help line only when needed (container networking, the macOS local network permission).
  string note = 9;
}
message GetNetworkAccessRequest {}
message UpdateNetworkAccessRequest {
  // set_enabled, set_port, choose_port (a new free port), set_hostnames
  string action = 1;
  bool enabled = 2;
  uint32 port = 3;
  repeated string hostnames = 4;
}

syntax = "proto3";
package canopy.ui.v1;

import "canopy/worker/v1/cli_import.proto";
import "canopy/ui/v1/agent_environment.proto";
import "google/protobuf/timestamp.proto";

// Settings → Import (docs/import.md): wątki z Claude Code, Codexa i Groka na workerze właściciela.

message ScanImportRequest {
  string worker_id = 1;
}

// Podsumowanie jednego CLI na workerze.
message ImportOverview {
  string agent_cli = 1;
  uint32 threads = 2;
  uint64 bytes = 3;
  google.protobuf.Timestamp oldest = 4;
  google.protobuf.Timestamp newest = 5;
  uint32 directories = 6;
  string root_path = 7;
  string cli_version = 8;
  string problem = 9;
  // Pozycje ustawień i biblioteki znalezione w tym CLI (także te, których nie da się zaimportować).
  uint32 library = 10;
}

message ScanImportResponse {
  // Wynik skanu żyje w pamięci gatewaya przez 30 minut; potem trzeba skanować ponownie.
  string scan_id = 1;
  string worker_id = 2;
  repeated ImportOverview overview = 3;
  bool truncated = 4;
  google.protobuf.Timestamp scanned_at = 5;
  uint32 skipped = 6;
}

message ImportCandidateFilter {
  // claude | codex | grok; puste = wszystkie.
  repeated string agent_clis = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  // Katalog źródłowy: dokładnie ten albo jego podkatalogi.
  string directory = 4;
  // Tytuł i podgląd, bez rozróżniania wielkości liter.
  string search = 5;
  // cli | sdk | ide | exec | app | unknown; puste = wszystkie.
  repeated string origins = 6;
  bool include_subagents = 7;
}

message ListImportCandidatesRequest {
  string scan_id = 1;
  ImportCandidateFilter filter = 2;
  uint32 offset = 3;
  // Domyślnie 200, najwyżej 1000.
  uint32 limit = 4;
}

// Dokąd trafi katalog źródłowy.
message ImportTarget {
  // workspace | create_project | no_project | missing
  string kind = 1;
  string project_id = 2;
  string workspace_id = 3;
  string project_name = 4;
  // Katalog wątku w workspace (cwd źródła albo korzeń workspace'u).
  string cwd = 5;
}

message ImportCandidate {
  string source_key = 1;
  string agent_cli = 2;
  string native_id = 3;
  string title = 4;
  string preview = 5;
  string cwd = 6;
  bool cwd_exists = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  uint64 bytes = 10;
  uint32 turns = 11;
  string origin = 12;
  string cli_version = 13;
  // new | imported | has_new_turns | in_canopy
  string status = 14;
  // native | history: co będzie możliwe po imporcie.
  string continue_mode = 15;
  // Dlaczego tylko historia (pusty przy native).
  string reason = 16;
  bool subagent = 17;
  uint32 flagged_secrets = 18;
  // Wątek Canopy dla imported / has_new_turns / in_canopy.
  string thread_id = 19;
  string git_branch = 20;
  bool archived = 21;
}

message ImportDirectoryGroup {
  string directory = 1;
  uint32 threads = 2;
  uint64 bytes = 3;
  bool exists = 4;
  ImportTarget suggestion = 5;
}

message ListImportCandidatesResponse {
  repeated ImportCandidate candidates = 1;
  uint32 total = 2;
  uint64 total_bytes = 3;
  // Wszystkie katalogi pasujące do filtra (bez stronicowania).
  repeated ImportDirectoryGroup groups = 4;
  // Szacowany rozmiar w bazie Canopy dla pasujących wątków.
  uint64 estimated_bytes = 5;
  // Pasujące wątki, które można zaimportować teraz (status new); tylko one są zaznaczane.
  uint32 importable = 6;
  uint64 importable_estimated_bytes = 7;
}

// ---------- Import (etap 2) ----------

// Co importować: wszystko, co pasuje do filtra, poza `excluded`, albo dokładnie `included`.
message ImportSelection {
  bool all_matching = 1;
  ImportCandidateFilter filter = 2;
  repeated string included = 3;
  repeated string excluded = 4;
}

// Cel katalogu źródłowego; kind: workspace | create_project | no_project | skip.
message ImportMapping {
  string directory = 1;
  ImportTarget target = 2;
}

message StartImportRequest {
  string scan_id = 1;
  ImportSelection selection = 2;
  // Katalogi bez wpisu dostają propozycję z listy.
  repeated ImportMapping mappings = 3;
  // continue (domyślnie: kontynuacja tam, gdzie się da) | history
  string mode = 4;
  // Wybrane ustawienia i pozycje biblioteki; wątki mogą być wtedy puste.
  repeated ImportLibraryChoice library = 5;
}

message ImportItem {
  string id = 1;
  string agent_cli = 2;
  string title = 3;
  // pending | importing | done | failed | cancelled | undone
  string status = 4;
  string thread_id = 5;
  string error = 6;
  uint32 turns = 7;
  uint64 bytes_total = 8;
  uint64 bytes_done = 9;
  repeated string warnings = 10;
  string cwd = 11;
  // native | history
  string continue_mode = 12;
}

message ImportRun {
  string id = 1;
  string worker_id = 2;
  string worker_name = 3;
  // running | paused | completed | failed | cancelled | undone
  string status = 4;
  string mode = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp finished_at = 7;
  uint32 total = 8;
  uint32 done = 9;
  uint32 failed = 10;
  uint32 cancelled = 11;
  // Wybrane, ale już zaimportowane wcześniej.
  uint32 already_imported = 12;
  uint64 bytes_total = 13;
  uint64 bytes_done = 14;
  string error = 15;
  // Tytuł wątku importowanego teraz.
  string current = 16;
  // Tylko w GetImportRun z items = true.
  repeated ImportItem items = 17;
  // Ustawienia i biblioteka tego importu (zawsze, jest ich mało).
  repeated ImportLibraryResult library = 18;
}

message ListImportRunsRequest {}

message ListImportRunsResponse {
  repeated ImportRun runs = 1;
}

message GetImportRunRequest {
  string run_id = 1;
  bool items = 2;
}

message ImportRunRequest {
  string run_id = 1;
}

// Nowy wątek w miejscu zaimportowanego: pierwsza wiadomość dostaje notatkę z jego historią (bez modelu).
message ContinueImportedThreadRequest {
  string thread_id = 1;
}

// ---------- Ustawienia i biblioteka (stos B) ----------

message ListImportLibraryRequest {
  string scan_id = 1;
}

// Pozycja z CLI porównana ze stanem Canopy.
message ImportLibraryCandidate {
  // source_key workera.
  string key = 1;
  string agent_cli = 2;
  // setting | instruction
  string kind = 3;
  // Nazwa do wyświetlenia (Default model, CLAUDE.md).
  string name = 4;
  // Wartość w Canopy teraz i po imporcie (Default → claude-opus-5-5); puste, gdy nie dotyczy.
  string current = 5;
  string proposed = 6;
  // new | same | conflict | imported | unavailable
  string status = 7;
  // Dlaczego unavailable (albo uwaga do conflict).
  string reason = 8;
  repeated string warnings = 9;
  // Zaznaczone na start.
  bool suggested = 10;
  // Wybory przy conflict: replace | keep_both; pusta lista = tylko import albo pominięcie.
  repeated string actions = 11;
  string detail = 12;
  uint64 bytes = 13;
  // Skill znaleziony w kilku CLI z tą samą treścią: jedna pozycja dla wszystkich.
  repeated string agent_clis = 14;
  uint32 files = 15;
  // connector: transport i nagłówki z sekretami (nazwy i rodzaj, nigdy wartości).
  string transport = 16;
  repeated canopy.worker.v1.ImportSecretSlot slots = 17;
}

message ListImportLibraryResponse {
  repeated ImportLibraryCandidate items = 1;
}

// action: import (nowa pozycja) | replace | keep_both
message ImportLibraryChoice {
  string key = 1;
  string action = 2;
  // connector: nagłówki z wartością w pliku CLI, które właściciel zgadza się przenieść (domyślnie żadne).
  repeated string secrets = 3;
  // Nowe skille/komendy: brak = worker źródłowy. Replace zachowuje istniejące przypisanie.
  EnvironmentSelector skill_selector = 4;
}

message ImportLibraryResult {
  string id = 1;
  string agent_cli = 2;
  string kind = 3;
  string name = 4;
  // pending | done | failed | cancelled | undone | kept (cofnięcie pominięte: zmienione po imporcie)
  string status = 5;
  string error = 6;
  // Co powstało albo się zmieniło (Default model for Claude: claude-opus-5-5).
  string detail = 7;
}

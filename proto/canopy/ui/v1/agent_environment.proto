syntax = "proto3";
package canopy.ui.v1;
import "canopy/worker/v1/agent_environment.proto";

message EnvironmentSelector {
  bool everyone = 1;
  repeated string worker_ids = 2;
  repeated string tags = 3;
  bool match_all_tags = 4;
  repeated string exclude_tags = 5;
}

message InstructionFragment {
  string id = 1;
  string name = 2;
  string content = 3;
  EnvironmentSelector selector = 4; // absent = all workers selected by the document
}

message InstructionMachineOverride {
  string worker_id = 1;
  bool disabled = 2;
  string content = 3;
}

message InstructionDocument {
  string id = 1;
  string name = 2;
  string harness = 3;
  uint64 revision = 4;
  EnvironmentSelector selector = 5;
  repeated InstructionFragment fragments = 6;
  repeated InstructionMachineOverride overrides = 7;
  bool device_home = 8;
  bool platform_home = 9;
}

message EnvironmentWorker {
  string worker_id = 1;
  string name = 2;
  repeated string automatic_tags = 3;
  repeated string manual_tags = 4;
  bool supported = 5;
  bool online = 6;
  canopy.worker.v1.AgentEnvironmentReport report = 7;
  repeated canopy.worker.v1.EnvironmentInstruction preview = 8;
  uint64 desired_revision = 9;
  string composition_error = 10;
  bool skills_supported = 11;
  repeated string skill_ids = 12;
  bool plugins_supported = 13;
  repeated string plugin_ids = 14;
}

message AgentEnvironmentRequest {
  // Read an immutable local library version without changing its assignment.
  string preview_skill_id = 1;
  uint64 preview_skill_version = 2;
}
message GetWorkerEnvironmentRequest { string worker_id = 1; }
// item to globalny klucz biblioteki, a version_hash wskazuje treść, nie lokalny numer wersji.
message WorkerEnvironmentOverride {
  string kind = 1;
  string item = 2;
  bool disabled = 3;
  string content = 4;
  string version_hash = 5;
}
message SetWorkerEnvironmentOverrideRequest {
  string worker_id = 1;
  WorkerEnvironmentOverride override = 2;
  bool remove = 3;
  uint64 expected_revision = 4;
}
message WorkerEnvironmentResponse {
  EnvironmentWorker worker = 1;
  repeated WorkerEnvironmentOverride overrides = 2;
  uint64 revision = 3;
  repeated WorkerEnvironmentItem items = 4;
}
message WorkerEnvironmentItem {
  string kind = 1;
  string item = 2;
  string name = 3;
  repeated WorkerEnvironmentVersion versions = 4;
}
message WorkerEnvironmentVersion {
  uint64 version = 1;
  string hash = 2;
}
message AgentEnvironmentSnapshot {
  uint64 revision = 1;
  repeated InstructionDocument documents = 2;
  repeated EnvironmentWorker workers = 3;
  repeated LibrarySkill skills = 4;
  repeated EnvironmentMarketplace marketplaces = 5;
  repeated LibraryPlugin plugins = 6;
  canopy.worker.v1.SkillArtifact preview_skill_artifact = 7;
}

message MarketplacePlugin {
  canopy.worker.v1.SkillArtifact artifact = 1;
  repeated string harnesses = 2;
  string unavailable_reason = 3;
}
message EnvironmentMarketplace {
  string id = 1;
  string name = 2;
  SkillSource source = 3;
  repeated MarketplacePlugin plugins = 4;
}
message MarketplacePreview {
  string id = 1;
  EnvironmentMarketplace marketplace = 2;
  string expires_at = 3;
  string base_commit = 4;
}
message LibraryPlugin {
  LibrarySkill assignment = 1;
  string marketplace_id = 2;
  string marketplace_name = 3;
  string commit = 4;
}
message PreviewMarketplaceRequest {
  string command = 1; // repo reference or fixed /plugin marketplace add recipe
  string id = 2; // check an existing marketplace's tracked ref
  string credential_account_id = 3;
}
message SaveMarketplaceRequest {
  string preview_id = 1;
  uint64 expected_revision = 2;
}
message DeleteMarketplaceRequest {
  string id = 1;
  uint64 expected_revision = 2;
}
message SaveLibraryPluginRequest {
  string marketplace_id = 1;
  string plugin_name = 2; // accepts /plugin install name@marketplace
  LibrarySkill assignment = 3;
  string confirmed_checksum = 4; // explicit consent to exactly these reviewed bytes
  uint64 expected_revision = 5;
  bool use_latest = 6; // otherwise retain the selected immutable version
}
message DeleteLibraryPluginRequest {
  string id = 1;
  uint64 expected_revision = 2;
}

message SkillMachineOverride {
  string worker_id = 1;
  bool disabled = 2;
  uint64 version = 3; // 0 = library's selected version
}
message LibrarySkill {
  string id = 1;
  string name = 2;
  uint64 version = 3;
  repeated string harnesses = 4;
  EnvironmentSelector selector = 5;
  repeated SkillMachineOverride overrides = 6;
  bool device_home = 7;
  bool platform_home = 8;
  canopy.worker.v1.SkillArtifact artifact = 9;
  repeated uint64 versions = 10;
  SkillSource source = 11;
}
message SkillSource {
  string url = 1;
  string ref = 2;
  string path = 3;
  string commit = 4;
  string credential_account_id = 5;
  bool auto_update = 6;
  bool pinned = 7;
  string checked_at = 8;
  string available_commit = 9;
  string update_preview_id = 10;
  string error = 11;
}
message ResolvedSourceSkill {
  string path = 1;
  canopy.worker.v1.SkillArtifact artifact = 2;
}
message SkillSourcePreview {
  string id = 1;
  SkillSource source = 2;
  repeated ResolvedSourceSkill skills = 3;
  repeated string notices = 4;
  repeated string harnesses = 5;
  bool device_home = 6;
  string skill_id = 7; // set only for an update of an existing item
  string expires_at = 8;
  string base_checksum = 9;
  string license = 10;
}
message PreviewSkillSourceRequest {
  string command = 1;
  string credential_account_id = 2;
}
message AddSkillSourceRequest {
  string preview_id = 1;
  repeated string paths = 2;
  LibrarySkill assignment = 3;
  uint64 expected_revision = 4;
}
message CheckSkillSourceRequest { string id = 1; }
message ApplySkillSourceRequest {
  string id = 1;
  string preview_id = 2;
  uint64 expected_revision = 3;
}
message SaveLibrarySkillRequest {
  LibrarySkill skill = 1;
  uint64 expected_revision = 2;
  repeated canopy.worker.v1.SkillFile files = 3; // folder upload; paths relative to skill root
  bytes zip = 4; // alternative to files, one skill root
}
message DeleteLibrarySkillRequest {
  string id = 1;
  uint64 expected_revision = 2;
}
message ResolveSkillDriftRequest {
  string worker_id = 1;
  string target_id = 2;
  string action = 3; // keep | overwrite | import
  string observed_checksum = 4;
  uint64 expected_revision = 5;
}
message SaveInstructionDocumentRequest {
  InstructionDocument document = 1;
  uint64 expected_revision = 2;
}
message DeleteInstructionDocumentRequest {
  string id = 1;
  uint64 expected_revision = 2;
}
message SetEnvironmentTagsRequest {
  string worker_id = 1;
  repeated string tags = 2;
  uint64 expected_revision = 3;
}
message PreviewAgentEnvironmentRequest {
  string worker_id = 1;
  InstructionDocument draft = 2; // optional replacement of one document, never persisted
}
message PreviewAgentEnvironmentResponse {
  repeated canopy.worker.v1.EnvironmentInstruction instructions = 1;
}
message ResolveEnvironmentDriftRequest {
  string worker_id = 1;
  string target_id = 2;
  string action = 3; // keep | overwrite | import
  string observed_checksum = 4;
  uint64 expected_revision = 5;
}

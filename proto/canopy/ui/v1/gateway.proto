// ---------- Modele, effort i steer ----------

// Jak dostarczyć wiadomość, gdy w wątku trwa tura.
enum MessageDelivery {
  MESSAGE_DELIVERY_UNSPECIFIED = 0; // = QUEUE
  // Następna tura (po bieżącej).
  MESSAGE_DELIVERY_QUEUE = 1;
  // Do tury w toku (Codex turn/steer, Claude strumień wejścia). Bez tury w toku działa jak QUEUE;
  // gdy tura skończy się wcześniej albo dostawca odmówi, wiadomość trafia do kolejki z powodem (Steer.reason).
  MESSAGE_DELIVERY_STEER = 2;
}

// Wiadomość dołączona do tury w toku. W transkrypcie to item user_message z client_id = id w tej turze,
// w miejscu, w którym weszła.
message Steer {
  string id = 1;
  // Pliki tej wiadomości, także gdy jest dopiero dostarczana do trwającej tury.
  repeated Attachment attachments = 243;
  optional string shell_command = 240;
  canopy.worker.v1.ShellResult shell_result = 241;
  string input_text = 242;
  string thread_id = 2;
  // Tura, do której ma trafić.
  string turn_id = 3;
  string text = 4;
  // pending (czeka na workera) | accepted (dostawca przyjął) | delivered (weszła do tury: item user_message)
  // | queued (nie weszła; jest następną turą queued_turn_id, powód w reason) | failed
  string status = 5;
  string reason = 6;
  string queued_turn_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // Autor: użytkownik albo wątek agenta (send_message z delivery = steer).
  string source_thread_id = 9;
  // Numery od 160: steer zrobiony z tury w kolejce (SteerQueuedTurn). Gdy nie wejdzie, ta tura wraca do kolejki
  // na swoje miejsce (queued_turn_id = from_turn_id) zamiast nowej tury na końcu.
  string from_turn_id = 160;
  // Wzmianki w text.
  repeated canopy.worker.v1.Mention mentions = 140;
  // Numery od 150: cytaty wiadomości (SendMessage.quotes); text to sama treść użytkownika.
  repeated Quote quotes = 150;
  // Numery od 210: steer agenta (send_message): wątek nadawcy, jego dostawca i model.
  AgentSender sender = 210;

  // Numery od 230: notatka platformy o zakończonych zadaniach w tle wstrzyknięta do tury w toku (bez autora):
  // item_id tych itemów background_task.
  repeated string background_item_ids = 230;
}

// Katalog modeli jednego workera (z ostatniego raportu workera).
message WorkerModels {
  string worker_id = 1;
  repeated canopy.worker.v1.ProfileModels profiles = 2;
  // Wersja konfiguracji workera, dla której powstał.
  uint64 config_version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ListModelsRequest {
  // Pusty = wszystkie workery użytkownika.
  string worker_id = 1;
  // Lista od nowa z workera (musi być online); bez tego ostatni zapisany raport.
  bool refresh = 2;
  // Pełny katalog bez wyborów modeli instancji (ekran ustawień). Domyślnie modele ukryte w instancji mają hidden, własne dochodzą, ulubione są pierwsze.
  bool unfiltered = 100;
}

message ListModelsResponse {
  repeated WorkerModels workers = 1;
}

message UpdateThreadRequest {
  string thread_id = 1;
  // Nieustawione = bez zmian; pusty = domyślny profilu / modelu.
  optional string model = 2;
  optional string effort = 3;
  // Domyślny tryb uprawnień wątku (tury bez nadpisania). Nieustawione albo UNSPECIFIED = bez zmian.
  optional canopy.worker.v1.PermissionMode permission_mode = 90;
  optional string title = 200;
}

message RegenerateTitleRequest {
  string thread_id = 1;
}
// Zlecenie przyjęte; nowy tytuł przychodzi przez WatchThread / WatchOverview.
message RegenerateTitleResponse {}

message UpdateThreadResponse {
  Thread thread = 1;
}

// Ulubione modele w wyborze modelu (sekcja ustawień użytkownika, zastępowana w całości).
message ModelFavorites {
  repeated FavoriteModel models = 1;
}

message FavoriteModel {
  canopy.worker.v1.Provider provider = 1;
  // Pusty = dowolny profil z tym modelem.
  string profile_id = 2;
  string model = 3;
}
// ---------- Cele i praca w tle ----------

// Cel harnessu (docs/goals.md): silnikiem jest harness (Codex thread/goal, Claude /goal), platforma śledzi
// stan, zużycie i tury celu. Najwyżej jeden otwarty cel na wątek.
message Goal {
  string id = 1;
  string thread_id = 2;
  // Co ma być osiągnięte (Claude: warunek /goal).
  string objective = 3;
  // active | paused | blocked | budget_limited | usage_limited | achieved | cancelled
  string status = 4;
  // user (z UI) | provider (model albo harness sam ustawił cel)
  string created_by = 5;
  uint64 token_budget = 6;        // 0 = bez limitu (Codex tokenBudget)
  uint64 tokens_used = 7;         // według harnessu (Codex tokensUsed)
  uint64 time_used_seconds = 8;
  // Codex: tury kontynuacji celu; Claude: oceny ewaluatora.
  uint32 iterations = 9;
  // Werdykt ewaluatora (Claude), powód blokady albo zatrzymania.
  string last_reason = 10;
  // Ostatni status zgłoszony przez harness (Codex: active, paused, complete, ...; Claude: active, met, failed, cleared).
  string native_status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  // Ostatnia komenda celu nie powiodła się na workerze (np. SetGoal: wątek nie dał się wznowić).
  // Status wraca wtedy do ostatniego stanu harnessu (cel, którego harness nigdy nie potwierdził: blocked).
  // Czyszczone przy następnej udanej komendzie celu.
  string error = 70;
  google.protobuf.Timestamp error_at = 71;
}

message SetGoalRequest {
  string thread_id = 1;
  // set (nowy cel; zastępuje otwarty) | pause | resume | clear
  string action = 2;
  // set: wymagany.
  string objective = 3;
  // set: budżet tokenów harnessu (Codex); 0 = bez limitu. Claude go nie obsługuje.
  uint64 token_budget = 4;
}

message SetGoalResponse {
  Goal goal = 1;
}

message StopBackgroundTaskRequest {
  string thread_id = 1;
  // item_id itemu background_task z osi czasu.
  string item_id = 2;
}

message StopBackgroundTaskResponse {}

// ---------- Projekt na workerach ----------
// Projekt żyje na workerach, na których ma workspace (katalog). Nowy wątek wybiera projekt, potem worker
// spośród jego workspace'ów (docs/ui-api.md).

// Nieustawione pole = bez zmian. Istniejące wątki zostają w swoim katalogu (cwd wątku jest jego własny).
message UpdateWorkspaceRequest {
  string workspace_id = 1;
  // Nowy katalog na tym samym workerze (te same reguły co przy CreateWorkspace).
  optional string root_path = 2;
  optional string label = 3;
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

// Usunięcie projektu z workera (archiwizacja workspace'u): nowe wątki nie mogą go już wybrać, istniejące
// działają dalej (wiadomości, wątki boczne i forki w tym samym katalogu).
message RemoveWorkspaceRequest {
  string workspace_id = 1;
}

message RemoveWorkspaceResponse {}

// ---------- Globalne instancje dostawców ----------
// Instancja = dostawca (harness: Claude Code, Codex) + id, zdefiniowana raz w gateway i włączana na wybranych
// workerach (docs/worker-config.md, sekcja 9). Wbudowane instancje "native" (logowanie CLI na urządzeniu) istnieją
// zawsze dla obu dostawców: nie da się ich usunąć ani zmienić ich połączenia. Sekrety (klucz API, zmienne oznaczone
// jako sekret) nigdy nie wracają do UI: jest tylko informacja, że są ustawione.

message ProfileEnvVarSettings {
  string name = 1;
  bool secret = 2;
  // Tylko dla zmiennych jawnych; sekret ma zawsze pustą wartość.
  string value = 3;
}

message ProfileEnvVarInput {
  string name = 1;
  bool secret = 2;
  // Jawna: wartość (nieustawiona = pusta). Sekret: nieustawiona = bez zmian (zmienna o tej nazwie musi już być sekretem).
  optional string value = 3;
}

// Jak worker uruchamia harness instancji. Puste = ustawienia workera (izolowany katalog w data_dir, logowanie
// urządzenia dowiązane z domyślnego katalogu domowego CLI).
message InstanceRuntime {
  string binary_path = 1;
  // Katalog CLI właściciela urządzenia (CODEX_HOME / CLAUDE_CONFIG_DIR), z którego dowiązywane jest logowanie.
  string home_path = 2;
  // Izolowany katalog harnessu instancji (stan i sesje; z own_login także logowanie).
  string shadow_home_path = 3;
  repeated string launch_args = 4;
  // Własne logowanie instancji (np. ChatGPT przez StartProviderLogin) zamiast logowania urządzenia.
  bool own_login = 5;
}

// Modele instancji w pickerach. Model widoczny = jest w shown albo (dostawca go nie ukrywa i nie ma go w hidden).
message InstanceModels {
  // Ulubione w kolejności użytkownika: w pickerze pierwsze, z ⌘1…⌘9.
  repeated string favorites = 1;
  repeated string hidden = 2;
  // Modele ukryte przez dostawcę (np. Codex hidden), które użytkownik pokazał.
  repeated string shown = 3;
  // Własne id modeli spoza katalogu (bez danych o wysiłku).
  repeated string custom = 4;
}

// Nadpisania na jednym workerze (np. ścieżki zależne od systemu). Nieustawione = definicja globalna.
message InstanceOverrides {
  optional string binary_path = 1;
  optional string home_path = 2;
  optional string shadow_home_path = 3;
  // launch_args_set = argumenty tego workera zastępują globalne (także pustą listą).
  bool launch_args_set = 4;
  repeated string launch_args = 5;
  // Zmienne dodane albo zastąpione (po nazwie) na tym workerze.
  repeated ProfileEnvVarSettings env = 6;
  // Endpoint: inny adres albo klucz na tym workerze (np. inna sieć).
  optional string base_url = 7;
  bool api_key_set = 8;
  string proxy_id = 9;
}

message InstanceOverridesInput {
  optional string binary_path = 1;
  optional string home_path = 2;
  optional string shadow_home_path = 3;
  bool launch_args_set = 4;
  repeated string launch_args = 5;
  // Pełna lista zmiennych tego workera (sekret bez wartości = bez zmian).
  repeated ProfileEnvVarInput env = 6;
  optional string base_url = 7;
  // Nieustawiony = bez zmian, pusty = bez własnego klucza (globalny), inaczej nowy klucz.
  optional string api_key = 8;
  optional string proxy_id = 9;
}

// Instancja na jednym workerze: włączenie, nadpisania i ostatni raport workera.
message InstanceOnWorker {
  string worker_id = 1;
  bool enabled = 2;
  // Wybór zapisany dla tego workera; false = wynika z all_workers.
  bool explicit = 3;
  InstanceOverrides overrides = 4;
  // Worker zgłosił instancję w ostatnim raporcie (ConfigApplied).
  bool reported = 5;
  bool available = 6;
  string detail = 7;
  string version = 8;
  string auth = 9;
  bool authenticated = 10;
  // Wątki (niezarchiwizowane) instancji na tym workerze.
  uint32 thread_count = 11;
  google.protobuf.Timestamp checked_at = 12;
  // Worker ma już wersję konfiguracji z bieżącą definicją instancji.
  bool synced = 13;
  canopy.worker.v1.ProviderAccountStatus account = 14;
  // Connection in the worker's actual ConfigApplied report; absent when not reported.
  optional canopy.worker.v1.ProviderProfileKind kind = 15;
}

message ProviderInstance {
  canopy.worker.v1.Provider harness = 1;
  // Litery, cyfry, "-" i "_" (małe litery); stałe (wątki je zapisują). Unikalne w obrębie dostawcy.
  string id = 2;
  string label = 3;
  canopy.worker.v1.ProviderProfileKind kind = 4;
  // CLIPROXYAPI: adres endpointu.
  string base_url = 5;
  bool api_key_set = 6;
  repeated ProfileEnvVarSettings env = 7;
  InstanceRuntime runtime = 8;
  // Kolor akcentu w pickerze (#rrggbb); pusty = bez.
  string accent_color = 9;
  InstanceModels models = 10;
  // Działa na wszystkich workerach (także przyszłych), poza wyłączonymi wprost.
  bool all_workers = 11;
  bool built_in = 12;
  // Rośnie przy każdej zmianie definicji (expected_revision).
  uint64 revision = 13;
  uint32 thread_count = 14;
  // Każdy worker (niezarchiwizowany), także te, na których instancja jest wyłączona.
  repeated InstanceOnWorker workers = 15;
  google.protobuf.Timestamp updated_at = 16;
  string proxy_id = 17;
}

// Instancja w Worker.provider_instances: to, czego potrzebują pickery.
message WorkerInstance {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  string label = 3;
  string accent_color = 4;
  bool enabled = 5;
  bool available = 6;
  string detail = 7;
  repeated string favorites = 8;
  canopy.worker.v1.ProviderProfileKind kind = 9;
  canopy.worker.v1.ProviderAccountStatus account = 10;
  // Full status from this worker's home, also carried over linked overview streams.
  InstanceOnWorker status = 11;
}

message ListProviderInstancesRequest {}

message ListProviderInstancesResponse {
  repeated ProviderInstance instances = 1;
}

message SaveProviderInstanceRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  // true = nowa instancja (id nie może być zajęte), false = zmiana istniejącej.
  bool create = 3;
  string label = 4;
  canopy.worker.v1.ProviderProfileKind kind = 5;
  string base_url = 6;
  // Nieustawiony = bez zmian, pusty = usunięcie, inaczej nowy klucz.
  optional string api_key = 7;
  // Pełna lista: zastępuje dotychczasową.
  repeated ProfileEnvVarInput env = 8;
  InstanceRuntime runtime = 9;
  string accent_color = 10;
  // Wersja definicji, którą widział klient; inna = FailedPrecondition (BFF: 409). 0 = bez sprawdzania.
  uint64 expected_revision = 11;
  // Tylko przy tworzeniu: gdzie instancja działa (jak SetInstanceWorkers).
  bool all_workers = 12;
  repeated string worker_ids = 13;
  string proxy_id = 14;
}

message Proxy {
  string id = 1;
  string name = 2;
  // cliproxyapi (including forks), anthropic, openai.
  string kind = 3;
  // Normalized root, without a trailing /v1.
  string base_url = 4;
  bool secret_set = 5;
  canopy.worker.v1.ProxyCodexOptions codex = 6;
  uint64 revision = 7;
  // Human-readable profile references, including worker-specific choices.
  repeated string used_by = 8;
}
message ListProxiesRequest {}
message ListProxiesResponse { repeated Proxy proxies = 1; }
message SaveProxyRequest {
  // Empty creates a new proxy.
  string id = 1;
  string name = 2;
  string kind = 3;
  string base_url = 4;
  // Omitted keeps the stored secret; a supplied value replaces it. Never returned.
  optional string secret = 5;
  canopy.worker.v1.ProxyCodexOptions codex = 6;
  uint64 expected_revision = 7;
}
message ProxyIdRequest {
  string id = 1;
  uint64 expected_revision = 2;
}
message ProxyResponse { Proxy proxy = 1; }
message DeleteProxyResponse {}
message TestProxyResponse {
  bool ok = 1;
  uint32 model_count = 2;
  bool cliproxyapi_detected = 3;
  // Sanitized diagnostic, never an upstream response body or secret.
  string detail = 4;
}
message MoveInstanceToProxyRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  uint64 expected_revision = 3;
  // Built-in login stays native; a separate instance receives the proxy.
  string new_instance_id = 4;
  string name = 5;
}

message SaveProviderInstanceResponse {
  ProviderInstance instance = 1;
}

message DeleteProviderInstanceRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  uint64 expected_revision = 3;
}

message DeleteProviderInstanceResponse {}

message SetInstanceWorkersRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  bool all_workers = 3;
  // Bez all_workers: workery, na których instancja działa (pozostałe: wyłączona).
  repeated string worker_ids = 4;
}

message SetInstanceWorkersResponse {
  ProviderInstance instance = 1;
}

message SetInstanceWorkerRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  string worker_id = 3;
  // Nieustawione = bez zmian.
  optional bool enabled = 4;
  // Nieustawione = bez zmian; ustawione = zastępuje nadpisania tego workera.
  InstanceOverridesInput overrides = 5;
}

message SetInstanceWorkerResponse {
  ProviderInstance instance = 1;
}

message SetInstanceModelsRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  InstanceModels models = 3;
  // true = tylko ulubione (gwiazdka w pickerze); pozostałe listy bez zmian.
  bool favorites_only = 4;
}

message SetInstanceModelsResponse {
  ProviderInstance instance = 1;
}

message RefreshProvidersRequest {
  // Pusty = wszystkie workery online.
  string worker_id = 1;
  bool account_only = 2;
  canopy.worker.v1.Provider harness = 3;
  string id = 4;
}

message RefreshProvidersResponse {
  repeated ProviderInstance instances = 1;
  // Workery, które nie odpowiedziały (offline, starsza wersja, błąd), z powodem.
  repeated string skipped = 2;
}

message StartProviderLoginRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  string worker_id = 3;
}

message StartProviderLoginResponse {
  string verification_url = 1;
  string user_code = 2;
}

// ---------- CLI dostawców (docs/provider-cli.md) ----------

// Najnowsza wersja CLI z oficjalnego źródła (cache gatewaya).
message CliLatest {
  canopy.worker.v1.Provider provider = 1;
  string version = 2;
  // Nie udało się sprawdzić (UI: "Couldn't check for updates"); version może być z poprzedniego sprawdzenia.
  string error = 3;
  google.protobuf.Timestamp checked_at = 4;
}

// CLI na workerze z tym, co UI może z nim zrobić. Decyzje egzekwuje gateway (InstallCli), nie UI.
message WorkerCliTool {
  // Ostatni raport workera.
  canopy.worker.v1.CliTool tool = 1;
  CliLatest latest = 2;
  bool update_available = 3;
  // install | update | "" (brak akcji: zarządzane zewnętrznie, aktualne, brak przepisu).
  string action = 4;
  // Dlaczego akcja jest teraz zablokowana (offline, trwające tury, starszy worker); pusty = można.
  string blocked_reason = 5;
  // Np. "Managed by Homebrew", "Managed by the image".
  string managed_by = 6;
  // Trwające tury tego dostawcy na workerze.
  uint32 running_turns = 7;
  // Ostatnie zredagowane linie trwającej albo ostatniej instalacji (od startu gatewaya).
  repeated string log = 8;
}

message InstallCliRequest {
  // Pusty z all_workers = wszystkie workery właściciela, na których dostawca ma dostępną aktualizację.
  string worker_id = 1;
  canopy.worker.v1.Provider provider = 2;
  // X.Y.Z[-pre] albo "latest"; pusty = najnowsza znana (albo "latest").
  string version = 3;
  bool all_workers = 4;
}

message InstallCliResponse {
  // Workery, na których instalacja wystartowała.
  repeated string started = 1;
  // Pominięte z powodem ("<nazwa>: <powód>").
  repeated string skipped = 2;
}

message CheckCliUpdatesRequest {
  // Pusty = wszystkie workery online właściciela.
  string worker_id = 1;
}

message SetWorkerCliUpdateSettingsRequest {
  string worker_id = 1;
  optional uint32 interval_minutes = 2; // brak = dziedzicz z konta
  uint64 expected_config_version = 3;
}

message CheckCliUpdatesResponse {
  repeated CliLatest latest = 1;
  repeated string skipped = 2;
}

// ---------- Załączniki (docs/ui-api.md) ----------

// Plik dołączony do wiadomości. Gateway sam rozpoznaje typ po treści (nie po nazwie ani typie z przeglądarki).
message Attachment {
  string id = 1;
  // Nazwa bez katalogów i znaków sterujących (taka trafia na workera).
  string name = 2;
  string mime_type = 3;
  // image (png, jpeg, gif, webp: podgląd w UI) | file (reszta, także SVG i HEIC)
  string kind = 4;
  uint64 size_bytes = 5;
  uint32 width = 6;
  uint32 height = 7;
  string sha256 = 8;
  // Obraz ma miniaturę (GetAttachment.thumbnail).
  bool has_thumbnail = 9;
}

message AttachmentLimits {
  uint64 max_file_bytes = 1;
  uint64 max_message_bytes = 2;
  uint32 max_files = 3;
}

message UploadAttachmentRequest {
  string name = 1;
  bytes data = 2;
}

message UploadAttachmentResponse {
  Attachment attachment = 1;
}

message GetAttachmentRequest {
  string attachment_id = 1;
  // Miniatura obrazu (WebP, do 512 px) zamiast pliku.
  bool thumbnail = 2;
}

message GetAttachmentResponse {
  Attachment attachment = 1;
  bytes data = 2;
  string mime_type = 3;
}

// Podgląd obrazu z transkryptu wątku (Image.blob, ToolCall.images), tylko dla właściciela wątku.
message GetThreadBlobRequest {
  string thread_id = 1;
  string sha256 = 2;
}

message GetThreadBlobResponse {
  bytes data = 1;
  string mime_type = 2;
}

// ---------- Kolejka ----------
// Błędy: tura, która już ruszyła (gateway wysłał jej StartTurn) albo nie jest już w kolejce = FailedPrecondition
// z powodem; klient ma stan z ThreadUpdate.turn. Każda zmiana idzie do wszystkich klientów jako ThreadUpdate.turn
// (kolejność = Turn.ordinal; tura z withdrawn znika z kolejki).

// Nowa kolejność: podane tury dostają, w tej kolejności, miejsca (ordinal), które zajmują razem; tury kolejki,
// których klient nie zna (przyszły w międzyczasie), zostają na swoich miejscach.
message ReorderQueuedTurnsRequest {
  string thread_id = 1;
  repeated string turn_ids = 2;
}

message ReorderQueuedTurnsResponse {
  // Podane tury po zmianie, w nowej kolejności.
  repeated Turn turns = 1;
}

// Nowy tekst wiadomości w kolejce (tylko tury użytkownika). Nadpisania (model, wysiłek, tryb) i załączniki zostają;
// wejście składa się jak w SendMessage (notatka załączników, wzmianki). „/goal” nie czeka w kolejce (InvalidArgument).
message EditQueuedTurnRequest {
  string turn_id = 1;
  string text = 2;
  // Turn.revision, od której klient zaczął (inna = FailedPrecondition: ktoś zmienił ją wcześniej).
  uint32 expected_revision = 3;
  // Wzmianki w nowym tekście (jak SendMessage.mentions); puste = bez wzmianek.
  repeated canopy.worker.v1.Mention mentions = 4;
  // Klient wysyła pełną listę pozycji z edytora (plakietki plików, wzmianki). Bez tej flagi i bez wzmianek
  // (starszy klient z edycją jako tekstem) gateway odnajduje dotychczasowe wzmianki w nowym tekście po ich znacznikach.
  bool mentions_complete = 5;
}

message EditQueuedTurnResponse {
  Turn turn = 1;
}

// Usuwa wiadomość użytkownika z kolejki (status cancelled, withdrawn = deleted).
message DeleteQueuedTurnRequest {
  string turn_id = 1;
}

message DeleteQueuedTurnResponse {
  Turn turn = 1;
}

// Cofnięcie DeleteQueuedTurn: tura wraca do kolejki na swoje miejsce.
message RestoreQueuedTurnRequest {
  string turn_id = 1;
}

message RestoreQueuedTurnResponse {
  Turn turn = 1;
}

// Wiadomość z kolejki idzie teraz do tury w toku (jak SendMessage z delivery = STEER): tura wychodzi z kolejki
// (withdrawn = steered) w tej samej transakcji, w której powstaje steer. Bez tury w toku = FailedPrecondition i
// wiadomość zostaje w kolejce. Tylko wiadomości użytkownika bez załączników.
message SteerQueuedTurnRequest {
  string turn_id = 1;
}

message SteerQueuedTurnResponse {
  Steer steer = 1;
  Turn turn = 2;
}

// ---------- Wzmianki w kompozytorze (docs/ui-api.md, "Wzmianki") ----------
// Wyzwalacze w kompozytorze: "/" komendy, "$" skille i pluginy (jak w Codexie), "@" pliki, "#" wątki.

// Gdzie: istniejący wątek (thread_id) albo nowy (workspace, dostawca, profil, opcjonalnie katalog).
message MentionScope {
  string thread_id = 1;
  string workspace_id = 2;
  canopy.worker.v1.Provider provider = 3;
  string provider_profile_id = 4;
  // Pusty = katalog wątku albo główny workspace'u.
  string cwd = 5;
}

message ListMentionCatalogRequest {
  MentionScope scope = 1;
  // Od nowa z workera (bez pamięci podręcznej gateway i workera).
  bool refresh = 2;
}

message ListMentionCatalogResponse {
  // Komendy, skille i pluginy harnessu oraz komendy platformy (source = platform).
  canopy.worker.v1.MentionCatalog catalog = 1;
}

message SearchFilesRequest {
  MentionScope scope = 1;
  string query = 2;
  uint32 limit = 3;
}

message SearchFilesResponse {
  canopy.worker.v1.FileSearchResult result = 1;
}

message SearchThreadsRequest {
  // Pusty = najnowsze wątki.
  string query = 1;
  // Bez tego wątku (zwykle bieżący).
  string exclude_thread_id = 2;
  // 0 = 20; najwyżej 50.
  uint32 limit = 3;
}

message SearchThreadsResponse {
  // Najpierw najlepiej pasujące, przy równym dopasowaniu najnowsza aktywność.
  repeated Thread threads = 1;
}

// ---------- Stan przeczytania ----------

message MarkThreadSeenRequest {
  string thread_id = 1;
  // Ostatnie zdarzenie wątku na ekranie użytkownika (ThreadEvent.seq); znacznik tylko rośnie, najwyżej do Thread.last_seq.
  uint64 up_to_seq = 2;
}

message MarkThreadSeenResponse {
  Thread thread = 1;
}

message SetThreadReadRequest {
  string thread_id = 1;
  bool unread = 2;
}

message SetThreadArchivedRequest {
  string thread_id = 1;
  bool archived = 2;
}

message DeleteThreadRequest { string thread_id = 1; }
message DeleteThreadResponse {
  // Wątek i nieusunięte wcześniej wątki boczne, usunięte razem z nim.
  repeated string thread_ids = 1;
}
message RestoreThreadRequest { string thread_id = 1; }

// ---------- Git worktrees (docs/worktrees.md) ----------

enum WorkspaceMode {
  WORKSPACE_MODE_UNSPECIFIED = 0;
  // Katalog workspace'u (bieżący checkout).
  WORKSPACE_MODE_CHECKOUT = 1;
  WORKSPACE_MODE_NEW_WORKTREE = 2;
  WORKSPACE_MODE_EXISTING_WORKTREE = 3;
  WORKSPACE_MODE_INHERIT_PARENT = 4;
}

enum BranchNaming {
  BRANCH_NAMING_UNSPECIFIED = 0;
  // Tymczasowa nazwa, potem model wybiera feat/..., fix/..., refactor/..., gdy zadanie jest jasne.
  BRANCH_NAMING_SEMANTIC = 1;
  // <prefix>/<slug pierwszej wiadomości>.
  BRANCH_NAMING_PREFIX = 2;
  // Slug tytułu wątku.
  BRANCH_NAMING_TITLE = 3;
}

message ThreadWorktree {
  string id = 1;
  string branch = 2;
  string path = 3;
  string base_ref = 4;
  string repo_root = 5;
  google.protobuf.Timestamp created_at = 6;
  string worker_id = 7;
  google.protobuf.Timestamp removed_at = 8;
  // Odłączony HEAD: skrócony commit (branch zostaje ostatnią gałęzią). Gałąź i HEAD pochodzą z workera na żywo.
  string detached_commit = 9;
  // Tymczasowa nazwa gałęzi: Canopy może ją zmienić na wygenerowaną, gdy zadanie stanie się jasne.
  bool provisional_branch = 10;
  // External worktrees are never removed, moved or renamed by Canopy.
  bool external = 11;
  bool locked = 12;
  bool prunable = 13;
  bool missing = 14;
  string unavailable_reason = 15;
}

// Bieżący HEAD checkoutu zgłoszony przez worker; detached_commit niepusty = odłączony HEAD.
message GitHead {
  string branch = 1;
  string detached_commit = 2;
}

// Nieustawione pole (UNSPECIFIED / brak optional) = dziedziczone z szerszego zakresu.
message WorktreeSettings {
  optional string location = 1;
  optional bool start_from_remote = 2;
  optional string remote = 3;
  BranchNaming branch_naming = 4;
  optional string branch_prefix = 5;
  WorkspaceMode default_mode = 6;
  optional bool cleanup_deleted_threads = 7;
  optional bool cleanup_merged = 8;
  // 0 = wyłączone.
  optional uint32 cleanup_inactive_days = 9;
  optional bool cleanup_settled = 10;
  optional bool cleanup_unchanged = 11;
  optional bool keep_local_changes = 12;
  optional bool delete_local_branch = 13;
}

message ListWorktreesRequest {
  string project_id = 1;
  string worker_id = 2;
  string worktree_id = 3;
}

message CleanupWorktreesRequest {
  string project_id = 1;
  string worker_id = 2;
  bool dry_run = 3;
}

message WorktreeEntry {
  ThreadWorktree worktree = 1;
  string project_id = 2;
  canopy.worker.v1.WorktreeStatus status = 3;
  google.protobuf.Timestamp last_activity_at = 4;
  bool online = 5;
  bool busy = 6;
  string detail = 7;
  bool would_remove = 8;
  bool removed = 9;
  bool confirmation_required = 10;
  bool branch_deleted = 11;
}

message ListWorktreesResponse {
  repeated WorktreeEntry entries = 1;
}

message RemoveWorktreeRequest {
  string worktree_id = 1;
  bool confirm_local_changes = 2;
  string expected_head_commit = 3;
}

// Zakres: puste project_id = All projects, puste worker_id = All computers.
message GetWorktreeSettingsRequest {
  string project_id = 1;
  string worker_id = 2;
}

message UpdateWorktreeSettingsRequest {
  string project_id = 1;
  string worker_id = 2;
  // Nadpisania zakresu (zastępują zapisane w całości).
  WorktreeSettings settings = 3;
  // Wersja zakresu, od której klient zaczął (0 = zakres jeszcze nie istnieje); konflikt = FailedPrecondition.
  uint64 expected_version = 4;
}

message WorktreeSettingsResponse {
  string project_id = 1;
  string worker_id = 2;
  // Nadpisania tego zakresu.
  WorktreeSettings settings = 3;
  // Wartości z szerszych zakresów i domyślne (wszystkie pola ustawione).
  WorktreeSettings inherited = 4;
  // Wynik: inherited z nadpisaniami tego zakresu.
  WorktreeSettings effective = 5;
  uint64 version = 6;
  // Źródło dziedziczonej wartości każdego pola; brak źródła = wbudowane domyślne.
  repeated WorktreeSettingSource inherited_sources = 7;
}

message WorktreeSettingSource {
  // Nazwa pola JSON WorktreeSettings, np. startFromRemote.
  string field = 1;
  string project_id = 2;
  string worker_id = 3;
}

message ListGitRefsRequest {
  string workspace_id = 1;
}

message ListGitRefsResponse {
  // Fałsz: worker bez capability "worktrees" (powód w detail); reszta pusta.
  bool supported = 1;
  string detail = 2;
  canopy.worker.v1.GitRefs refs = 3;
  // Wcześniejsze worktree tego projektu na tym workerze, od ostatnio używanego.
  repeated ThreadWorktree worktrees = 4;
  // Efektywne ustawienia projektu × workera (m.in. domyślny tryb).
  WorktreeSettings settings = 5;
}

// ---------------------------------------------------------------- rekordy workerów (wspólna konfiguracja, etap 6)

// Kopia tylko do odczytu rekordu workera innego komputera grupy konfiguracji. Zapisuje go wyłącznie dom
// workera; edycja to wywołanie do domu (id kwalifikowane). Bez wartości sekretów.
message ListWorkerRecordsRequest {}
message ListWorkerRecordsResponse { repeated WorkerRecord records = 1; }

// Odczyt nadpisań bez sekretów, zawsze u domu workera.
message GetInstanceWorkerRequest {
  canopy.worker.v1.Provider harness = 1;
  string id = 2;
  string worker_id = 3;
}
message GetInstanceWorkerResponse {
  InstanceOnWorker worker = 1;
  InstanceRuntime inherited_runtime = 2;
}
message WorkerRecord {
  // Id kwalifikowane domem (`<uuid>~<node16>`), jak w overview.
  string worker_id = 1;
  string node_id = 2;
  string computer_name = 3;
  string name = 4;
  string os = 5;
  string arch = 6;
  string hostname = 7;
  bool revoked = 8;
  repeated string manual_tags = 9;
  repeated string automatic_tags = 10;
  // Nadpisanie częstotliwości sprawdzania CLI; brak = konto.
  optional uint32 cli_update_check_minutes = 11;
  repeated WorkerRecordInstance instances = 12;
  // Lokalne id kont connectorów z dostępem dla tego workera.
  repeated string connector_account_ids = 13;
  repeated WorkerRecordWorkspace workspaces = 14;
  repeated WorkerRecordWorktreeSettings worktree_settings = 15;
  // Ostatnia zmiana rekordu w domu.
  google.protobuf.Timestamp updated_at = 16;
  // Pusty = dom osiągalny, edycja działa; inaczej powód (np. „Laptop B is unreachable since 19:42”).
  string read_only_reason = 17;
}
message WorkerRecordInstance {
  canopy.worker.v1.Provider harness = 1;
  // Lokalne id instancji na tym komputerze.
  string id = 2;
  // Brak = dziedziczy z instancji (all_workers).
  optional bool enabled = 3;
  // Worker ma własny klucz; wartość nie opuszcza domu.
  bool key_set = 4;
}
message WorkerRecordWorkspace {
  string id = 1;
  string project_id = 2;
  string root_path = 3;
  uint32 worktrees = 4;
}
message WorkerRecordWorktreeSettings {
  // Pusty = zakres workera bez projektu.
  string project_id = 1;
  WorktreeSettings settings = 2;
}

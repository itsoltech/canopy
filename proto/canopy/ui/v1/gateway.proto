// API gateway dla UI (Svelte). Gateway jest jedynym stanem globalnym; UI tylko czyta i wysyła akcje.
// Transkrypt (Item, ThreadEvent) to te same typy co w kanale gateway <-> worker.
// Opis: docs/ui-api.md
syntax = "proto3";
import "google/protobuf/empty.proto";

package canopy.ui.v1;

import "google/protobuf/timestamp.proto";
import "canopy/worker/v1/worker_link.proto";
import "canopy/ui/v1/bots.proto";
import "canopy/ui/v1/quotes.proto";
import "canopy/ui/v1/connectors.proto";
import "canopy/ui/v1/mobile.proto";
import "canopy/ui/v1/computers.proto";
import "canopy/ui/v1/network.proto";
import "canopy/ui/v1/agent_environment.proto";
import "canopy/ui/v1/desktop.proto";
import "canopy/ui/v1/cli_import.proto";

service GatewayService {
  rpc GetAgentEnvironment(AgentEnvironmentRequest) returns (AgentEnvironmentSnapshot);
  rpc SaveInstructionDocument(SaveInstructionDocumentRequest) returns (AgentEnvironmentSnapshot);
  rpc DeleteInstructionDocument(DeleteInstructionDocumentRequest) returns (AgentEnvironmentSnapshot);
  rpc SetEnvironmentTags(SetEnvironmentTagsRequest) returns (AgentEnvironmentSnapshot);
  rpc PreviewAgentEnvironment(PreviewAgentEnvironmentRequest) returns (PreviewAgentEnvironmentResponse);
  rpc ResolveEnvironmentDrift(ResolveEnvironmentDriftRequest) returns (AgentEnvironmentSnapshot);
  rpc SaveLibrarySkill(SaveLibrarySkillRequest) returns (AgentEnvironmentSnapshot);
  rpc DeleteLibrarySkill(DeleteLibrarySkillRequest) returns (AgentEnvironmentSnapshot);
  rpc ResolveSkillDrift(ResolveSkillDriftRequest) returns (AgentEnvironmentSnapshot);
  rpc PreviewSkillSource(PreviewSkillSourceRequest) returns (SkillSourcePreview);
  rpc AddSkillSource(AddSkillSourceRequest) returns (AgentEnvironmentSnapshot);
  rpc CheckSkillSource(CheckSkillSourceRequest) returns (SkillSourcePreview);
  rpc ApplySkillSource(ApplySkillSourceRequest) returns (AgentEnvironmentSnapshot);
  rpc PreviewMarketplace(PreviewMarketplaceRequest) returns (MarketplacePreview);
  rpc SaveMarketplace(SaveMarketplaceRequest) returns (AgentEnvironmentSnapshot);
  rpc DeleteMarketplace(DeleteMarketplaceRequest) returns (AgentEnvironmentSnapshot);
  rpc SaveLibraryPlugin(SaveLibraryPluginRequest) returns (AgentEnvironmentSnapshot);
  rpc DeleteLibraryPlugin(DeleteLibraryPluginRequest) returns (AgentEnvironmentSnapshot);
  rpc ResolvePluginDrift(ResolveSkillDriftRequest) returns (AgentEnvironmentSnapshot);
  rpc ListProxies(ListProxiesRequest) returns (ListProxiesResponse);
  rpc SaveProxy(SaveProxyRequest) returns (ProxyResponse);
  rpc DeleteProxy(ProxyIdRequest) returns (DeleteProxyResponse);
  rpc TestProxy(ProxyIdRequest) returns (TestProxyResponse);
  // Move stored endpoint variables without returning their values to the client.
  rpc MoveInstanceToProxy(MoveInstanceToProxyRequest) returns (SaveProviderInstanceResponse);
  rpc GetClientCapabilities(ClientCapabilitiesRequest) returns (ClientCapabilities);
  rpc CreateDesktopPairing(CreateMobilePairingRequest) returns (CreateMobilePairingResponse);
  // Safe model picker metadata for a bot, resolved at its home. No credentials or connector grants.
  rpc GetBotProviderInstances(GetBotRequest) returns (ListProviderInstancesResponse);
  rpc GetComputers(ComputersRequest) returns (ComputersSnapshot);
  rpc CreateComputerPairing(CreateComputerPairingRequest) returns (ComputerPairing);
  rpc LinkComputer(LinkComputerRequest) returns (ComputersSnapshot);
  rpc ManageComputer(ComputerOperationRequest) returns (ComputersSnapshot);
  rpc ManageConfigNotice(ConfigNoticeOperation) returns (ComputersSnapshot);
  // Owner-scoped Network access for phones, desktop clients and the web BFF.
  rpc GetNetworkAccess(GetNetworkAccessRequest) returns (NetworkAccess);
  rpc UpdateNetworkAccess(UpdateNetworkAccessRequest) returns (NetworkAccess);
  rpc GetSharedConfig(SharedConfigRequest) returns (SharedConfigSnapshot);
  rpc ManageSharedConfig(SharedConfigOperation) returns (SharedConfigSnapshot);
  // Stage 8: owner-scoped "Move to…" for threads and bots of this computer.
  rpc PreviewMove(MovePreviewRequest) returns (MovePreview);
  rpc StartMove(StartMoveRequest) returns (MovesSnapshot);
  rpc GetMoves(MovesRequest) returns (MovesSnapshot);
  rpc FetchWorkerInstall(FetchWorkerInstallRequest) returns (stream WorkerInstallChunk);
  rpc WorkerSsh(WorkerSshRequest) returns (stream WorkerSshEvent);
  rpc GetUpdates(UpdatesRequest) returns (UpdatesSnapshot);
  rpc ManageUpdates(ManageUpdatesRequest) returns (UpdatesSnapshot);
  // Local mode only, service token only: the desktop app's own control channel to its bundled gateway.
  // Linked computers ask for app updates through it (docs/updates.md, "Połączone komputery").
  rpc WatchAppControl(DesktopHello) returns (stream DesktopControlEvent);
  rpc ReportAppControl(DesktopReport) returns (DesktopAck);
  // Device administration uses the authenticated gateway owner.
  rpc GetMobileDevices(GetMobileDevicesRequest) returns (GetMobileDevicesResponse);
  rpc CreateMobilePairing(CreateMobilePairingRequest) returns (CreateMobilePairingResponse);
  rpc RevokeMobilePairing(MobileIdRequest) returns (MobileOperationResponse);
  rpc RevokeMobileDevice(MobileIdRequest) returns (MobileOperationResponse);
  rpc UnpairMobileDevice(UnpairMobileDeviceRequest) returns (MobileOperationResponse);
  rpc GetWorkerSetup(GetWorkerSetupRequest) returns (GetWorkerSetupResponse);
  rpc CreateWorkerEnrollment(CreateWorkerEnrollmentRequest) returns (CreateWorkerEnrollmentResponse);
  rpc RevokeWorkerEnrollment(RevokeWorkerEnrollmentRequest) returns (WorkerOperationResponse);
  rpc RenameWorker(RenameWorkerRequest) returns (WorkerOperationResponse);
  rpc RotateWorkerCredential(WorkerRequest) returns (RotateWorkerCredentialResponse);
  rpc RevokeWorker(WorkerRequest) returns (WorkerOperationResponse);
  rpc ArchiveWorker(WorkerRequest) returns (WorkerOperationResponse);
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  rpc SaveConnectorAccount(SaveConnectorAccountRequest) returns (ConnectorAccountResponse);
  rpc SetConnectorAccess(SetConnectorAccessRequest) returns (ConnectorAccountResponse);
  rpc DisconnectConnector(ConnectorAccountRequest) returns (ConnectorAccountResponse);
  // Odłącza (jak Disconnect) i usuwa konto z listy; audyt zostaje bez powiązania z kontem.
  rpc DeleteConnectorAccount(ConnectorAccountRequest) returns (DeleteConnectorAccountResponse);
  rpc TestConnector(ConnectorAccountRequest) returns (TestConnectorResponse);
  rpc SaveConnectorOAuthApp(SaveConnectorOAuthAppRequest) returns (SaveConnectorOAuthAppResponse);
  rpc BeginConnectorOAuth(BeginConnectorOAuthRequest) returns (BeginConnectorOAuthResponse);
  rpc CompleteConnectorOAuth(CompleteConnectorOAuthRequest) returns (CompleteConnectorOAuthResponse);
  // Boty działające wyłącznie w gateway (docs/bots.md).
  rpc CreateBot(CreateBotRequest) returns (GetBotResponse);
  rpc UpdateBot(UpdateBotRequest) returns (GetBotResponse);
  rpc DeleteBot(DeleteBotRequest) returns (DeleteBotResponse);
  rpc ArchiveBot(ArchiveBotRequest) returns (GetBotResponse);
  rpc UnarchiveBot(UnarchiveBotRequest) returns (GetBotResponse);
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  rpc GetBot(GetBotRequest) returns (GetBotResponse);
  rpc SendBotMessage(SendBotMessageRequest) returns (SendBotMessageResponse);
  rpc WatchBotConversation(WatchBotConversationRequest) returns (stream BotConversation);
  rpc ReadBotExchange(ReadBotExchangeRequest) returns (ReadBotExchangeResponse);
  rpc AnswerBotApproval(AnswerBotApprovalRequest) returns (AnswerBotApprovalResponse);
  rpc ListBotApprovalRules(ListBotApprovalRulesRequest) returns (ListBotApprovalRulesResponse);
  rpc ListThreadApprovals(ListThreadApprovalsRequest) returns (ListThreadApprovalsResponse);
  rpc DeleteBotApprovalRule(DeleteBotApprovalRuleRequest) returns (DeleteBotApprovalRuleResponse);
  rpc InterruptBot(InterruptBotRequest) returns (InterruptBotResponse);
  rpc RetryBot(RetryBotRequest) returns (RetryBotResponse);
  rpc SetBotRoutineEnabled(SetBotRoutineEnabledRequest) returns (BotRoutineResponse);
  rpc DeleteBotRoutine(DeleteBotRoutineRequest) returns (DeleteBotRoutineResponse);
  rpc CancelBotReminder(CancelBotReminderRequest) returns (CancelBotReminderResponse);
  rpc MarkBotRead(MarkBotReadRequest) returns (GetBotResponse);
  rpc SaveBotMcpServer(SaveBotMcpServerRequest) returns (SaveBotMcpServerResponse);
  rpc ListBotMcpServers(ListBotMcpServersRequest) returns (ListBotMcpServersResponse);
  rpc DeleteBotMcpServer(DeleteBotMcpServerRequest) returns (DeleteBotMcpServerResponse);
  rpc TestBotMcpServer(TestBotMcpServerRequest) returns (TestBotMcpServerResponse);
  // Workery, projekty z workspace'ami i agenci: to, czego UI potrzebuje na start.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // Na żywo: zmiany workerów (online, konfiguracja) i wątków (status, oczekujące interakcje).
  rpc WatchOverview(WatchOverviewRequest) returns (stream OverviewUpdate);

  // Przeglądanie katalogów na workerze (w dozwolonych katalogach) przy wyborze workspace'u.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc RenameProject(RenameProjectRequest) returns (CreateProjectResponse);
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  // Katalog na workerze (istniejący, nowy z git init albo klon) jako workspace: dołącza do projektu
  // o tym samym git origin albo tworzy nowy projekt. Trasowane do domu workera.
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse);

  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc ListArchivedThreads(ListArchivedThreadsRequest) returns (ListArchivedThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc InterruptThread(InterruptThreadRequest) returns (InterruptThreadResponse);
  rpc AnswerInteraction(AnswerInteractionRequest) returns (AnswerInteractionResponse);
  rpc AnswerThreadSecret(AnswerThreadSecretRequest) returns (ThreadSecretResponse);
  rpc RevokeThreadSecret(RevokeThreadSecretRequest) returns (ThreadSecretResponse);

  // Najpierw snapshot (wątek, tury, itemy, interakcje), potem zmiany na żywo od snapshot.last_seq.
  rpc WatchThread(WatchThreadRequest) returns (stream ThreadUpdate);

  // Harmonogram platformy (docs/agent-bus.md#5-harmonogram): tworzony przez użytkownika albo agenta.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  // Podgląd: najbliższe terminy cronu w strefie (albo błąd walidacji), bez tworzenia harmonogramu.
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse);
  // Wstrzymanie, wznowienie albo anulowanie.
  rpc SetScheduleStatus(SetScheduleStatusRequest) returns (SetScheduleStatusResponse);

  // Ustawienia użytkownika i projektów. Przechowuje je gateway; przeglądarka jest tylko klientem.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
  rpc UpdateProjectSettings(UpdateProjectSettingsRequest) returns (UpdateProjectSettingsResponse);

  // Modele, effort i steer (sekcja na końcu pliku).
  // Katalog modeli workerów (dostawca -> profil -> modele z wysiłkami rozumowania); refresh = lista od nowa z workera.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Domyślny model i wysiłek wątku (kolejne tury bez nadpisania w wiadomości).
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse);
  rpc RegenerateTitle(RegenerateTitleRequest) returns (RegenerateTitleResponse);
  // Cel harnessu w wątku (docs/goals.md): ustawienie, pauza, wznowienie, usunięcie.
  rpc SetGoal(SetGoalRequest) returns (SetGoalResponse);
  // Zatrzymanie zadania w tle (proces Codexa, background Bash Claude; docs/execution.md).
  rpc StopBackgroundTask(StopBackgroundTaskRequest) returns (StopBackgroundTaskResponse);

  // Projekt na workerach (sekcja na końcu pliku): zmiana katalogu workspace'u i usunięcie projektu z workera.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  rpc RemoveWorkspace(RemoveWorkspaceRequest) returns (RemoveWorkspaceResponse);

  // Globalne instancje dostawców (sekcja na końcu pliku, docs/worker-config.md, sekcja 9): definicja raz w gateway,
  // włączenie i nadpisania per worker, synchronizacja do workerów przez ich wersjonowaną konfigurację.
  rpc ListProviderInstances(ListProviderInstancesRequest) returns (ListProviderInstancesResponse);
  // Nowa albo zmieniona instancja: nowe wersje konfiguracji workerów, na których działa.
  rpc SaveProviderInstance(SaveProviderInstanceRequest) returns (SaveProviderInstanceResponse);
  // Usunięcie instancji, której nie używa żaden wątek (używana: FailedPrecondition, można ją wyłączyć).
  rpc DeleteProviderInstance(DeleteProviderInstanceRequest) returns (DeleteProviderInstanceResponse);
  // Na których workerach działa instancja: wszystkie (także przyszłe) albo wybrane.
  rpc SetInstanceWorkers(SetInstanceWorkersRequest) returns (SetInstanceWorkersResponse);
  // Włączenie i nadpisania (ścieżki, argumenty, zmienne, endpoint) na jednym workerze.
  rpc SetInstanceWorker(SetInstanceWorkerRequest) returns (SetInstanceWorkerResponse);
  // Ulubione, kolejność, widoczność i własne modele instancji (pickery; bez nowej wersji konfiguracji).
  rpc SetInstanceModels(SetInstanceModelsRequest) returns (SetInstanceModelsResponse);
  // Ponowne sprawdzenie wersji, dostępności i logowania na workerach online (ProbeProviders).
  rpc RefreshProviders(RefreshProvidersRequest) returns (RefreshProvidersResponse);
  // Logowanie instancji przez API harnessu (Codex: ChatGPT kodem urządzenia).
  rpc StartProviderLogin(StartProviderLoginRequest) returns (StartProviderLoginResponse);
  // CLI dostawców na workerach (docs/provider-cli.md): instalacja/aktualizacja na kliknięcie i najnowsze wersje.
  rpc InstallCli(InstallCliRequest) returns (InstallCliResponse);
  rpc CheckCliUpdates(CheckCliUpdatesRequest) returns (CheckCliUpdatesResponse);
  rpc SetWorkerCliUpdateSettings(SetWorkerCliUpdateSettingsRequest) returns (WorkerOperationResponse);

  // Załączniki (sekcja na końcu pliku): plik użytkownika do wiadomości, jego bajty i podglądy obrazów z transkryptu.
  rpc UploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);
  // Git worktrees (docs/worktrees.md): ustawienia w zakresach, refy i worktree workspace'u dla kompozytora.
  rpc GetWorktreeSettings(GetWorktreeSettingsRequest) returns (WorktreeSettingsResponse);
  rpc UpdateWorktreeSettings(UpdateWorktreeSettingsRequest) returns (WorktreeSettingsResponse);
  rpc ListWorktrees(ListWorktreesRequest) returns (ListWorktreesResponse);
  rpc CleanupWorktrees(CleanupWorktreesRequest) returns (ListWorktreesResponse);
  rpc RemoveWorktree(RemoveWorktreeRequest) returns (WorktreeEntry);
  rpc RevealWorktree(RemoveWorktreeRequest) returns (google.protobuf.Empty);
  rpc ListGitRefs(ListGitRefsRequest) returns (ListGitRefsResponse);
  rpc GetThreadBlob(GetThreadBlobRequest) returns (GetThreadBlobResponse);

  // Kolejka (sekcja na końcu pliku): wiadomości czekające za turą w toku — kolejność, edycja, usunięcie
  // (z cofnięciem) i steer do tury w toku. Działa tylko na turach queued, których gateway jeszcze nie wystartował.
  rpc ReorderQueuedTurns(ReorderQueuedTurnsRequest) returns (ReorderQueuedTurnsResponse);
  rpc EditQueuedTurn(EditQueuedTurnRequest) returns (EditQueuedTurnResponse);
  rpc DeleteQueuedTurn(DeleteQueuedTurnRequest) returns (DeleteQueuedTurnResponse);
  rpc RestoreQueuedTurn(RestoreQueuedTurnRequest) returns (RestoreQueuedTurnResponse);
  rpc SteerQueuedTurn(SteerQueuedTurnRequest) returns (SteerQueuedTurnResponse);

  // Wzmianki w kompozytorze (sekcja na końcu pliku): komendy, skille i pluginy dostawcy, pliki workspace'u, wątki.
  rpc ListMentionCatalog(ListMentionCatalogRequest) returns (ListMentionCatalogResponse);
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
  rpc SearchThreads(SearchThreadsRequest) returns (SearchThreadsResponse);
  // Stan przeczytania (sekcja na końcu pliku): użytkownik widział wątek do zdarzenia up_to_seq (ostatnia wiadomość
  // agenta była na ekranie); Thread.unseen_result gaśnie na wszystkich urządzeniach (OverviewUpdate.thread).
  rpc MarkThreadSeen(MarkThreadSeenRequest) returns (MarkThreadSeenResponse);
  rpc SetThreadRead(SetThreadReadRequest) returns (MarkThreadSeenResponse);
  rpc SetThreadArchived(SetThreadArchivedRequest) returns (GetThreadResponse);
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse);
  rpc RestoreThread(RestoreThreadRequest) returns (ListThreadsResponse);
  // Workery innych komputerów grupy konfiguracji z ich rekordów (sekcja na końcu pliku, docs/linked-computers.md).
  rpc ListWorkerRecords(ListWorkerRecordsRequest) returns (ListWorkerRecordsResponse);
  rpc GetInstanceWorker(GetInstanceWorkerRequest) returns (GetInstanceWorkerResponse);
  rpc GetWorkerEnvironment(GetWorkerEnvironmentRequest) returns (WorkerEnvironmentResponse);
  rpc SetWorkerEnvironmentOverride(SetWorkerEnvironmentOverrideRequest) returns (WorkerEnvironmentResponse);
  // Import z CLI agentów (cli_import.proto, docs/import.md): tylko workery tego komputera.
  rpc ScanImport(ScanImportRequest) returns (ScanImportResponse);
  rpc ListImportCandidates(ListImportCandidatesRequest) returns (ListImportCandidatesResponse);
  rpc StartImport(StartImportRequest) returns (ImportRun);
  rpc ListImportRuns(ListImportRunsRequest) returns (ListImportRunsResponse);
  rpc GetImportRun(GetImportRunRequest) returns (ImportRun);
  // Zatrzymuje po bieżącej stronie; czekające wątki dostają cancelled.
  rpc CancelImportRun(ImportRunRequest) returns (ImportRun);
  // Wznawia wstrzymany import i ponawia wątki, które się nie udały.
  rpc ResumeImportRun(ImportRunRequest) returns (ImportRun);
  // Usuwa wątki utworzone przez import i ich kopie na workerze.
  rpc UndoImportRun(ImportRunRequest) returns (ImportRun);
  rpc ContinueImportedThread(ContinueImportedThreadRequest) returns (GetThreadResponse);
  // Ustawienia i biblioteka ze skanu (stos B): lista z porównaniem do Canopy.
  rpc ListImportLibrary(ListImportLibraryRequest) returns (ListImportLibraryResponse);
}

// ---------- Model ----------

// Only metadata is listed/streamed. Plaintext tokens and credentials are returned once.
message WorkerEnrollment {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp used_at = 4;
  google.protobuf.Timestamp revoked_at = 5;
  string worker_id = 6;
}
message GetWorkerSetupRequest {}
message FetchWorkerInstallRequest {
  string os = 1;
  string arch = 2;
  bool metadata_only = 3;
  bool channel_fallback = 4;
}
message WorkerInstallChunk {
  bytes data = 1;
  string sha256 = 2;
  string version = 3;
  string download_url = 4;
}
message WorkerSshRequest {
  string action = 1; // key | rotate | probe | install
  string target = 2; // login@host[:port], IPv6: login@[address]:port
  string fingerprint = 3; // explicit confirmation, required on first install
  string name = 4;
  string web_origin = 5;
  repeated string tags = 6; // Stored with the enrollment, never sent to the SSH host.
}
message WorkerSshEvent {
  string public_key = 1;
  string fingerprint = 2;
  bool trusted = 3;
  string output = 4;
  WorkerEnrollment enrollment = 5;
}
message GetWorkerSetupResponse {
  string gateway_url = 1;
  repeated WorkerEnrollment enrollments = 2;
  string gateway_version = 3;
  string channel = 4;
  string gateway_fingerprint = 5;
}
message CreateWorkerEnrollmentRequest {
  string name = 1;
  repeated string tags = 2; // Manual tags applied atomically when the worker enrolls.
}
message CreateWorkerEnrollmentResponse {
  WorkerEnrollment enrollment = 1;
  string token = 2;
}
message RevokeWorkerEnrollmentRequest { string id = 1; }
message WorkerRequest { string worker_id = 1; }

message UpdatesRequest {}
message ManageUpdatesRequest {
  string action = 1; // check | channel | gateway | worker | all | desktop | update_all | computer | computer_check
  string channel = 2;
  string worker_id = 3;
  bool force = 4;
  bool allow_downgrade = 5; // explicit user choice only
  string desktop_request_id = 6; // required for desktop force, bound to the current request
  string node_id = 7; // computer, computer_check: the directly linked computer whose Canopy app updates or checks
}
message WorkerUpdate {
  string worker_id = 1;
  string name = 2;
  string version = 3;
  string install_kind = 4;
  string compatibility = 5;
  string state = 6;
  string reason = 7;
  bool connected = 8;
  DesktopUpdateState desktop = 9;
  // The desktop app's own local-mode worker: it ships and updates with the app (docs/updates.md).
  bool bundled = 10;
}
message UpdatesSnapshot {
  string gateway_version = 1;
  string channel = 2;
  string available_version = 3;
  string gateway_install_kind = 4;
  string gateway_state = 5;
  string gateway_reason = 6;
  repeated WorkerUpdate workers = 7;
  bool admin = 8;
  bool checking = 9;
  string checked_at = 10;
  UpdateRun run = 11;
  repeated Worker cli_workers = 12;
  bool gateway_update_available = 13;
  string check_error = 14;
  // This gateway is the desktop app's bundled one (local mode): it updates with the app, never by itself.
  bool gateway_bundled = 15;
  // Local mode: this computer's own Canopy app, as its control channel reports it.
  DesktopUpdateState app = 16;
  // Local mode: linked computers, their apps, workers and agent CLIs (docs/updates.md).
  repeated ComputerUpdate computers = 17;
  GatewayDeparture departure = 18;
}
// A linked computer's Canopy app and what runs on it. Its ids are qualified with its node.
message ComputerUpdate {
  string node_id = 1;
  string name = 2;
  // The app version from the link's last handshake.
  string version = 3;
  // The link presence: connected, updating, sleeping, shutting_down, unreachable, needs_update, …
  string presence = 4;
  int64 presence_since_ms = 5;
  // Both computers support remote_app_update and the link is direct.
  bool remote_update = 6;
  // Why this computer's app can't be updated from here, in the words the UI shows; empty when it can.
  string reason = 7;
  // The computer's own snapshot (its app in `app`); retained while it isn't reachable.
  UpdatesSnapshot updates = 8;
  // loading | fresh | stale | unavailable; the snapshot may be last-known while refreshing.
  string read_state = 9;
}
// Owner-scoped durable orchestration. No URLs, credentials, force or downgrade grants.
message UpdateRun {
  string id = 1;
  string state = 2; // running | succeeded | failed | blocked
  string reason = 3;
  repeated UpdateStep steps = 4;
}
message UpdateStep {
  string kind = 1; // gateway | worker | cli | desktop | computer
  string worker_id = 2;
  string label = 3;
  string version = 4;
  canopy.worker.v1.Provider provider = 5;
  string state = 6; // queued | running | succeeded | failed | blocked
  string reason = 7;
  string started_at = 8;
  string from_version = 9;
  string node_id = 10; // computer: the linked computer
  string request_id = 11; // computer: the app update request on that computer
}
message RenameWorkerRequest { string worker_id = 1; string name = 2; }
message RotateWorkerCredentialResponse { string credential = 1; }
message WorkerOperationResponse {}

message Worker {
  google.protobuf.Timestamp revoked_at = 700;
  string id = 1;
  string name = 2;
  bool online = 3;
  string hostname = 4;
  string os = 5;
  string version = 6;
  repeated canopy.worker.v1.ProviderInfo providers = 7;
  repeated canopy.worker.v1.ProviderProfile profiles = 8;
  // Historyczne pole zgodności; gateway zwraca pustą listę.
  repeated string allowed_roots = 9 [deprecated = true];
  uint64 config_version = 10;
  uint64 applied_version = 11;
  repeated canopy.worker.v1.ConfigIssue config_issues = 12;
  google.protobuf.Timestamp last_seen_at = 13;
  string home_directory = 14;
  // Globalne instancje dostawców z ich stanem na tym workerze (pickery: tylko enabled i available).
  repeated WorkerInstance provider_instances = 120;
  // CLI dostawców na tym workerze (docs/provider-cli.md); puste = worker ich nie zgłasza (starsza wersja).
  repeated WorkerCliTool cli_tools = 800;
  string arch = 801;
  // Worker innego komputera (id kwalifikowane), pusty = ten komputer.
  string node_id = 802;
  canopy.worker.v1.NetworkRouteStatus network_route_status = 803;
  // Worker obsługuje git worktrees (capability "worktrees", docs/worktrees.md).
  bool worktrees = 804;
  // Worker tworzy katalogi nowych projektów i klony (capability "project_sources").
  bool project_sources = 805;
  // Domyślny folder nowych worktree zgłoszony przez workera (Hello.worktrees_root); pusty = brak worktrees.
  string worktrees_root = 806;
  // Worker importuje dane CLI (capability "cli_import_v1", docs/import.md).
  bool cli_import = 807;
  optional uint32 cli_update_check_minutes = 900; // nadpisanie; brak = konto
  uint32 effective_cli_update_check_minutes = 901;
  google.protobuf.Timestamp cli_updates_checked_at = 902;
  google.protobuf.Timestamp cli_updates_next_check_at = 903;
}

message Project {
  google.protobuf.Timestamp created_at = 900;
  string id = 1;
  string name = 2;
  string slug = 3;
  // "scratch": systemowe No project; ukryte w zarządzaniu projektami.
  string kind = 410;
  repeated Workspace workspaces = 4;
  google.protobuf.Timestamp archived_at = 480;
  // Numery od 800: projekt innego komputera (id kwalifikowane), pusty = ten komputer.
  string node_id = 800;
  // Canonical shared configuration identity; local domain id stays in id.
  string global_id = 801;
}

message Workspace {
  string id = 1;
  string project_id = 2;
  string worker_id = 3;
  string root_path = 4;
  string label = 5;
  // Normalized git origin identity reported by its worker; empty = unknown/no origin.
  string git_origin = 216;
}

message Agent {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  canopy.worker.v1.Provider provider = 5;
  string model = 6;
  bool global = 7;
}

enum ThreadKind {
  THREAD_KIND_UNSPECIFIED = 0;
  THREAD_KIND_MAIN = 1;
  THREAD_KIND_SIDE = 2;
}

message Thread {
  string id = 1;
  string project_id = 2;
  ThreadKind kind = 3;
  string parent_thread_id = 4;
  string title = 5;
  canopy.worker.v1.Provider provider = 6;
  string provider_profile_id = 7;
  string model = 8;
  canopy.worker.v1.PermissionMode permission_mode = 9;
  string worker_id = 10;
  string workspace_id = 11;
  string cwd = 12;
  // creating | idle | running | waiting_input | interrupted | failed | archived
  string status = 13;
  string agent_id = 14;
  bool spawned_by_agent = 15;
  string status_detail = 16;   // np. błąd utworzenia u dostawcy
  uint64 last_seq = 17;
  google.protobuf.Timestamp created_at = 18;
  uint32 pending_interactions = 19;
  // Fork: wątek, którego historię dziedziczy (pusty, gdy to nie fork).
  string fork_source_thread_id = 20;
  // Wątek główny drzewa (dla wątku głównego: on sam).
  string root_thread_id = 21;
  // human | parent: kto odpowiada na zgody i pytania wątku (wątki agentów: parent).
  string interaction_route = 22;
  // Ostatnia zmiana: utworzenie, kolejkowanie, start albo koniec tury.
  google.protobuf.Timestamp last_activity_at = 23;
  // Domyślny wysiłek rozumowania wątku (pusty = domyślny modelu); model domyślny to pole model.
  string effort = 40;

  // Cele i praca w tle (numery od 60, osobno od innych zmian kontraktu).
  // Status bieżącego celu (Goal.status) albo pusty, gdy wątek nie ma otwartego celu.
  string goal_status = 60;
  // Zadania w tle w toku (itemy background_task ze statusem in_progress).
  uint32 background_tasks = 61;

  // Numery od 70: restart workera i błędy komend celu.
  // gateway (agent czatowy w gateway: bez celów i pracy w tle) | worker (wątek dostawcy na workerze)
  string runtime = 70;

  // Numery od 95: subagenci platformy (docs/agent-bus.md).
  // Wątki boczne: początek ostatniej wiadomości agenta (wynik subagenta) do karty w wątku rodzica. Główne: pusty.
  string last_message = 95;

  // Tura queued ma już komendę w outboxie, ale worker jeszcze nie potwierdził running.
  // Ten sam stan startu co Turn.dispatched, także w overview.
  bool turn_starting = 162;

  // Numery od 180: stan przeczytania. Wynik ostatniej zakończonej tury, której użytkownik jeszcze nie widział
  // (completed | failed | interrupted); pusty, gdy widział wszystko (MarkThreadSeen).
  string unseen_result = 180;

  // Numery od 190: fork od tury. Tura źródła, do której (włącznie) wątek dziedziczy historię, i jej numer
  // w wątku, do którego należy (fork_source_thread_id), taki jak na osi czasu: bez tur wyjętych z kolejki
  // (Turn.withdrawn). Puste / 0, gdy to nie fork.
  string fork_after_turn_id = 190;
  uint32 fork_after_turn_ordinal = 191;
  // provisional | generated | user (jawny tytuł, fork lub ręczna zmiana).
  string title_source = 200;
  // Tytuł jest właśnie generowany (automatycznie albo na żądanie): UI pokazuje, że coś się dzieje.
  bool title_generating = 201;

  // Numery od 210: subagenci dowolnego dostawcy i wiadomości między wątkami (docs/agent-bus.md).
  // Jak skończyła się ostatnia zakończona tura (completed | failed | interrupted); pusty przed pierwszą.
  string last_turn_status = 210;
  google.protobuf.Timestamp archived_at = 270;
  // user | agent | cascade (z głównym wątkiem); pusty dla archiwizacji sprzed migracji 0026.
  string archived_by = 271;
  string archived_by_thread_id = 272;
  string archived_by_thread_title = 273;
  google.protobuf.Timestamp deleted_at = 274;
  bool marked_unread = 275;
  string schedule_id = 290;
  string schedule_name = 291;
  uint32 schedule_run = 292;
  // Numery od 800: dom wątku na innym komputerze (id kwalifikowane, docs/linked-computers.md), pusty = ten komputer.
  string node_id = 800;
  // Numery od 900: git worktree wątku (docs/worktrees.md); nieustawione = bieżący checkout workspace'u.
  ThreadWorktree worktree = 900;
  // Wątek bez worktree: HEAD checkoutu workspace'u (gałąź na żywo).
  GitHead checkout_head = 901;
  // Numery od 1000: powiadomienia (docs/notifications.md). Krótki, oczyszczony tekst bez markdownu i sekretów:
  // pytanie lub zgoda czekająca na użytkownika, inaczej odpowiedź nieobejrzanej tury; pusty, gdy nie ma czego pokazać.
  string notice_preview = 1000;
  // pending_interactions > 0: rodzaj najnowszego żądania do człowieka (permission | question | elicitation).
  string notice_interaction_kind = 1001;
  // unseen_result = interrupted: turę zatrzymał użytkownik (nie system).
  bool interrupted_by_user = 1002;
  // Wątek zaimportowany z CLI agenta (docs/import.md); brak = utworzony w Canopy.
  ThreadImport import = 1010;
}

message ThreadImport {
  // claude | codex | grok
  string agent_cli = 1;
  // native: dalsze tury wznawiają kopię sesji CLI; history: tylko do odczytu.
  string mode = 2;
  google.protobuf.Timestamp imported_at = 3;
}

// Wątek agenta, od którego przyszło wejście tury albo steer (zadanie, wiadomość, raport): do oznaczenia wiadomości
// agenta w UI („from <wątek>”) także wtedy, gdy wątek nadawcy jest w innym drzewie, projekcie albo na innym workerze.
message AgentSender {
  string thread_id = 1;
  string title = 2;
  canopy.worker.v1.Provider provider = 3;
  // Instancja dostawcy (pusty = native).
  string provider_profile_id = 4;
  // Model tury, która wysłała (task, message), albo domyślny wątku; pusty = domyślny dostawcy.
  string model = 5;
  string project_id = 6;
  string worker_id = 7;
  // Linked senders keep their identity even when their home is unavailable.
  string bot_id = 8;
  string bot_shape = 9;
  string bot_color = 10;
  string computer_name = 11;
}

// Dokąd dotarło wywołanie spawn_thread / send_message wątku: karta na osi czasu nadawcy śledzi turę docelową.
message BusDelivery {
  // AgentBusCall.call_id.
  string call_id = 1;
  string target_thread_id = 2;
  // Tura docelowa; pusta, dopóki steer nie wszedł do tury.
  string target_turn_id = 3;
  // queue | steer (tak, jak wiadomość faktycznie poszła: steer bez tury w toku idzie do kolejki).
  string delivery = 4;
  // Status tury docelowej (queued | running | completed | interrupted | failed | cancelled) albo steering (steer w drodze).
  string status = 5;
}

message Turn {
  string id = 1;
  optional string shell_command = 240;
  canopy.worker.v1.ShellResult shell_result = 241;
  uint32 ordinal = 2;
  // queued | running | completed | interrupted | failed | cancelled
  string status = 3;
  // user | agent_bus | schedule | interaction | goal | provider | recovery | background_task
  string trigger = 4;
  string input_text = 5;
  string error = 6;
  google.protobuf.Timestamp queued_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  // Zużycie tokenów i koszt (z turn_finished).
  canopy.worker.v1.Usage usage = 10;
  // Długość łańcucha agent → agent bez udziału człowieka (docs/agent-bus.md).
  uint32 hops = 11;
  // Tura z historii odziedziczonej przez fork (należy do wątku źródłowego).
  bool inherited = 12;
  // Odziedziczona tura: wątek, do którego należy (w łańcuchu forków nie zawsze bezpośrednie źródło).
  string from_thread_id = 13;
  // Skąd przyszło wejście tury (puste dla użytkownika i tur dostawcy):
  // task (spawn_thread) | message (send_message) | report (powiadomienie: wątek docelowy skończył turę)
  // | question (wątek boczny pyta rodzica) | schedule (harmonogram)
  // | background_task (zadania w tle się zakończyły: background_item_ids)
  string source_kind = 14;
  // Wątek, od którego tura pochodzi: zlecający (task, message), raportujący (report), pytający (question),
  // a dla harmonogramu agenta wątek, który go utworzył.
  string source_thread_id = 15;
  string schedule_id = 16;
  string interaction_request_id = 17;
  // Treść wejścia bez notatki platformy: wiadomość użytkownika, zadanie, wiadomość agenta, raport
  // (ostatnia wiadomość wątku docelowego) albo polecenie harmonogramu. input_text = notatka + treść,
  // dokładnie to, co dostał model.
  string message_text = 18;
  // Notatka platformy przed treścią (np. "[canopy] Task from the thread …"); pusta dla użytkownika.
  string platform_note = 19;
  // report: jak skończyła się tura wątku docelowego (completed | interrupted | failed | cancelled).
  string source_status = 20;
  // question: rodzaj pytania (permission | question | elicitation) i narzędzie, którego dotyczy.
  string question_kind = 21;
  string question_tool = 22;
  // Model i wysiłek tury: nadpisanie z wiadomości; od startu tury wartości faktycznie wysłane do workera
  // (z domyślnymi wątku). Puste = domyślne profilu.
  string model = 40;
  string effort = 41;

  // Cel, nad którym pracowała tura (tura celu albo kontynuacja dostawcy w trakcie celu).
  string goal_id = 60;

  // Dlaczego tura została przerwana (status interrupted), np. „worker restarted”: worker już jej nie prowadzi
  // (restart procesu), „superseded: …”, albo powód od dostawcy. Pusty dla innych statusów.
  string interrupt_reason = 70;

  // Status failed: skąd błąd — platform (nasza strona: gateway, worker, adapter, połączenie) albo harness
  // (Codex/Claude zgłosił błąd). Treść w error. Pusty dla innych statusów.
  string error_source = 72;
  // Status interrupted: kto przerwał — user (użytkownik albo agent rodzica) albo system (np. restart workera
  // w trakcie tury). Powód w interrupt_reason. Tura przerwana przez system może być kontynuowana („Continue”).
  string interrupt_source = 73;
  // Krótki kod błędu (np. „http_connection_failed:401”, „error_max_turns”, „process_exit”), jeśli jest.
  string error_code = 74;
  // Stable actionable class; native error_code remains available for diagnostics.
  string error_class = 822;

  // Numery od 90: tryb uprawnień tury. Nadpisanie z wiadomości (UNSPECIFIED = domyślny wątku); od startu tury
  // tryb faktycznie wysłany do workera.
  canopy.worker.v1.PermissionMode permission_mode = 90;
  // Pliki dołączone do wiadomości (numery od 110). Ich ścieżki na workerze są w platform_note.
  repeated Attachment attachments = 110;

  // Numery od 160: zarządzanie kolejką.
  // Tura wyjęta z kolejki przez użytkownika (status cancelled, oś czasu jej nie pokazuje): deleted (usunięta,
  // RestoreQueuedTurn ją przywraca) | steered (wysłana do tury w toku jako steer z Steer.from_turn_id; wraca na
  // swoje miejsce w kolejce, gdy nie mogła wejść). Pusty dla innych tur.
  string withdrawn = 160;
  // Rośnie z każdą edycją wejścia tury w kolejce (EditQueuedTurn.expected_revision).
  uint32 revision = 161;
  // StartTurn jest już w outboxie (pending, delivered lub completed). queued + dispatched = tura startuje,
  // nie czeka w kolejce; running nadal potwierdza dopiero zdarzenie workera. Starszy klient pomija to pole.
  bool dispatched = 162;

  // Wzmianki w message_text (numery od 140): chipy wiadomości użytkownika.
  repeated canopy.worker.v1.Mention mentions = 140;
  // Numery od 150: cytaty z wiadomości (SendMessage.quotes). Ich treść i komentarze są w platform_note.
  repeated Quote quotes = 150;

  // Numery od 210: nadawca-agent (source_kind task | message | report): wątek, jego dostawca i model.
  AgentSender sender = 210;

  // Numery od 230: tura z notatką platformy o zakończonych zadaniach w tle (trigger background_task,
  // source_kind background_task): item_id tych itemów background_task (docs/execution.md, „Pobudka”).
  repeated string background_item_ids = 230;

  // Numery od 470: tura zlecona albo wysłana przez bota (trigger bot): jego id; nazwę, kształt i kolor UI bierze z listy botów.
  string bot_id = 470;
}

// Item na osi czasu z zakresem seq (first_seq..last_seq).
message TimelineItem {
  canopy.worker.v1.Item item = 1;
  string turn_id = 2;
  uint64 first_seq = 3;
  uint64 last_seq = 4;
  // Item z historii odziedziczonej przez fork (first_seq/last_seq liczone w wątku źródłowym).
  bool inherited = 5;
  // Odziedziczony item: wątek, do którego należy.
  string from_thread_id = 6;
  // Zakończona wiadomość agenta: czas jej ostatniego zdarzenia (last_seq). Wyznacza czas segmentów tury
  // po pokazanej odpowiedzi także po ponownym otwarciu wątku (docs/timeline-folding.md); inne itemy bez.
  google.protobuf.Timestamp completed_at = 7;
}

// Komunikat dostawcy albo platformy na osi czasu (np. ponowienie po błędzie API).
message ThreadNotice {
  uint64 seq = 1;
  string turn_id = 2;
  canopy.worker.v1.Notice notice = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message Interaction {
  string request_id = 1;
  string thread_id = 2;
  string turn_id = 3;
  string item_id = 4;
  canopy.worker.v1.InteractionKind kind = 5;
  string tool_name = 6;
  string request_json = 7;
  // pending | allowed | declined | answered | expired | cancelled
  string status = 8;
  string routed_to = 9;
  google.protobuf.Timestamp created_at = 10;
  // Pytanie platformy wait=false: agent pracuje dalej, odpowiedź trafia jako steer lub nowa tura.
  bool asynchronous = 250;
  // Absent when the asking side has no known response timeout.
  google.protobuf.Timestamp expires_at = 251;
}

// ---------- Overview ----------

message GetOverviewRequest {}

message GetOverviewResponse {
  repeated Worker workers = 1;
  repeated Project projects = 2;
  repeated Agent agents = 3;
  // Połączone komputery: nazwy i obecność dla znaczków maszyny i zdalnych wątków.
  repeated LinkedComputer computers = 800;
}

message WatchOverviewRequest {
  // Mobile reconnects need a fresh overview + threads before consuming live changes.
  bool include_snapshot = 762;
}

message MobileOverviewSnapshot {
  GetOverviewResponse overview = 1;
  repeated Thread threads = 2;
}

// Pełna lista widocznych wątków i metadanych jednego partnera po reconnect.
// Odbiorca zastępuje wyłącznie dane o tym origin, usuwając nieobecne wiersze.
message LinkedComputerSnapshot {
  string node_id = 1;
  GetOverviewResponse overview = 2;
  repeated Thread threads = 3;
}

// Planned interruption and its durable outcome. Empty node_id means the connected gateway.
message GatewayDeparture {
  string id = 1;
  string state = 2; // updating | restarting | succeeded | failed | rolled_back
  string target_version = 3;
  int64 started_at_ms = 4;
  uint32 window_ms = 5;
  string version = 6;
  string reason = 7;
  string node_id = 8;
  string name = 9;
}

message OverviewUpdate {
  oneof change {
    MobileDevice mobile_device = 760;
    MobilePairing mobile_pairing = 761;
    MobileOverviewSnapshot mobile_snapshot = 763;
    MobileRoutes mobile_routes = 764;
    DesktopUpdateState desktop_update = 765;
    GatewayDeparture gateway_departure = 766;
    string worker_removed = 700;
    WorkerEnrollment enrollment = 701;
    Worker worker = 1;
    Thread thread = 2;
    Project project = 3;
    Schedule schedule = 4;
    // Zmiana z innego urządzenia albo karty.
    UserSettings user_settings = 5;
    ProjectSettings project_settings = 6;
    // Nowy katalog modeli workera.
    WorkerModels models = 40;
    // Numery od 800: obecność, nazwa albo capabilities połączonego komputera się zmieniły.
    LinkedComputer computer = 800;
    // Komputer rozłączony (Unlink): jego wątki, projekty i workery znikają z widoku.
    string computer_removed = 801;
    LinkedComputerSnapshot computer_snapshot = 802;
    // Etap 4: wspólna konfiguracja (znaczki, konflikty) się zmieniła.
    SharedConfigSnapshot shared_config = 803;
    bool agent_environment_changed = 820;
    // Provider definitions or model choices changed, including instances without workers.
    bool provider_instances_changed = 821;
    // Rekordy workerów innych komputerów się zmieniły (ListWorkerRecords).
    bool worker_records_changed = 822;
    // A background aggregate read settled. Clients may refresh only the named catalog.
    string linked_read_completed = 823;
  }
}

// ---------- Katalogi, projekty, workspace'y ----------

message ListDirectoryRequest {
  string worker_id = 1;
  string path = 2; // pusty = katalog domowy workera
}

message ListDirectoryResponse {
  repeated canopy.worker.v1.DirectoryEntry entries = 1;
  string path = 2;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message RenameProjectRequest {
  string project_id = 1;
  string name = 2;
}

message ArchiveProjectRequest {
  string project_id = 1;
}

message ArchiveProjectResponse {}

message CreateWorkspaceRequest {
  string project_id = 1;
  string worker_id = 2;
  string root_path = 3;
  string label = 4;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message AddProjectRequest {
  string worker_id = 1;
  oneof source {
    // Istniejący katalog (ścieżka bezwzględna).
    string directory_path = 2;
    AddProjectInit init = 3;
    AddProjectClone clone = 4;
  }
}

message AddProjectInit {
  string parent_path = 1;
  string name = 2;
}

message AddProjectClone {
  string parent_path = 1;
  string name = 2;
  string url = 3;
}

message AddProjectResponse {
  Project project = 1;
  Workspace workspace = 2;
  // Dołączony do istniejącego projektu o tym samym git origin.
  bool attached = 3;
}

// ---------- Wątki ----------

message ListThreadsRequest {
  // Pusty = wątki wszystkich projektów użytkownika.
  string project_id = 1;
  // Domyślnie lista aktywnych; zgodność dla klientów pobierających całe archiwum.
  bool include_archived = 270;
  // Indeks sidebara: aktywne i zarchiwizowane boczne pod aktywnym rodzicem. Ma pierwszeństwo nad include_archived.
  bool sidebar_only = 310;
}

// Archiwum sidebara: strony głównych wątków; boczne wracają wyłącznie w side_threads.
message ListArchivedThreadsRequest {
  repeated string project_ids = 1; // puste = wszystkie projekty użytkownika
  string query = 2; // fragment tytułu albo nazwy projektu, bez rozróżniania wielkości liter
  uint32 page_size = 3; // 0 = 20, najwyżej 100
  string page_token = 4; // nieprzezroczysty kursor; obowiązuje tylko dla tych samych filtrów
  bool count_only = 5; // zwinięta sekcja: bez przesyłania wierszy
}

message ListArchivedThreadsResponse {
  repeated Thread threads = 1; // archived_at malejąco, następnie id malejąco
  string next_page_token = 2;
  uint32 total_count = 3; // wszystkie pasujące, także przed kursorem
  repeated Thread side_threads = 4; // nieusunięte boczne wyłącznie głównych wątków z tej strony
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  Thread thread = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message CreateThreadRequest {
  string project_id = 1;
  string workspace_id = 2;
  // Pusty = katalog główny workspace'u.
  string cwd = 3;
  string title = 4;
  canopy.worker.v1.Provider provider = 5;
  string provider_profile_id = 6;
  string model = 7;
  canopy.worker.v1.PermissionMode permission_mode = 8;
  string instructions = 9;
  // Wątek boczny: rodzic (ten sam workspace i katalog), opcjonalnie fork historii rodzica.
  string parent_thread_id = 10;
  bool fork = 11;
  // Pierwsza wiadomość (opcjonalnie).
  string initial_message = 12;
  // Idempotencja ponowień z UI.
  string client_request_id = 13;
  // Domyślny wysiłek rozumowania wątku (pusty = domyślny modelu).
  string effort = 40;
  // Załączniki pierwszej wiadomości (UploadAttachment).
  repeated string initial_attachment_ids = 110;
  // Wzmianki w initial_message (zakresy w nim; docs/ui-api.md, "Wzmianki").
  repeated canopy.worker.v1.Mention initial_mentions = 140;
  // Numery od 190: fork od tury ("Fork from here", docs/threads.md). Zakończona tura (completed, failed albo
  // interrupted) z widocznej historii wątku fork_thread_id (jego własna albo odziedziczona), do której
  // (włącznie) nowy wątek dziedziczy historię. Bez parent_thread_id powstaje nowy wątek główny w tym samym
  // projekcie, workspace'ie i katalogu, z dostawcą, instancją, modelem, wysiłkiem, trybem i instrukcjami
  // wątku fork_thread_id (pola dostawcy, modelu i miejsca z żądania są pomijane). Z parent_thread_id i fork:
  // wątek boczny z historią rodzica do tej tury (tura musi należeć do rodzica).
  string fork_at_turn_id = 190;
  // Wątek, z którego użytkownik forkuje (pusty = parent_thread_id).
  string fork_thread_id = 191;
  // Numery od 900: git worktree (docs/worktrees.md). UNSPECIFIED = bieżący checkout (jak dotąd).
  WorkspaceMode workspace_mode = 900;
  // NEW_WORKTREE: ref bazowy nowej gałęzi (pusty = gałąź domyślna).
  string base_ref = 901;
  // EXISTING_WORKTREE: rekord worktree tego projektu i workspace'u.
  string worktree_id = 902;
}

message CreateThreadResponse {
  Thread thread = 1;
}

message SendMessageRequest {
  string thread_id = 1;
  string text = 2;
  string client_request_id = 3;
  // Nadpisanie modelu i wysiłku tylko dla tej tury (puste = domyślne wątku). Steer ich nie używa
  // (tura już trwa); obowiązują, gdy wiadomość trafi do kolejki.
  string model = 40;
  string effort = 41;
  MessageDelivery delivery = 42;
  // Numery od 90: tryb uprawnień tury.
  // Nadpisanie trybu uprawnień tylko dla tej tury (UNSPECIFIED = domyślny wątku). Steer dołącza do tury
  // w toku i zostaje przy jej trybie; nadpisanie obowiązuje, gdy wiadomość trafi do kolejki.
  canopy.worker.v1.PermissionMode permission_mode = 90;
  // Załączniki (UploadAttachment). Wiadomość z załącznikami zawsze idzie do kolejki (nie steer).
  repeated string attachment_ids = 110;
  // Wzmianki w text (zakresy w nim). Gateway sprawdza je i dopisuje to, czego dostawca potrzebuje (docs/ui-api.md).
  repeated canopy.worker.v1.Mention mentions = 140;
  // Numery od 150: fragmenty tego, co agent wytworzył, cytowane przez użytkownika (z opcjonalnym komentarzem).
  // Gateway podaje je agentowi przed treścią wiadomości (docs/ui-api.md, "Cytaty"); działa też ze steer.
  // Wiadomość może składać się z samych cytatów (pusty text).
  repeated Quote quotes = 150;
}

message SendMessageResponse {
  // Powód zastępczej kolejki podany przez gateway pośredniczący starszego domu wątku.
  string delivery_note = 244;
  // Wiadomość jako tura (kolejka, także steer bez tury w toku).
  Turn turn = 1;
  // Wiadomość dołączona do tury w toku (delivery = STEER).
  Steer steer = 40;
  // Wiadomość z komendą platformy /goal: ustawiony cel (Claude: także jego tura w turn; Codex: bez tury).
  Goal goal = 140;
}

message InterruptThreadRequest {
  string thread_id = 1;
}

message InterruptThreadResponse {}

message AnswerInteractionRequest {
  string request_id = 1;
  bool allow = 2;
  bool allow_for_session = 3;
  string message = 4;
  string answer_json = 5;
  bool cancelled = 6;
}

message AnswerInteractionResponse {
  Interaction interaction = 1;
}

message WatchThreadRequest {
  string thread_id = 1;
  // Internal linked read, negotiated by thread_mirror_delta; empty keeps full snapshots.
  string mirror_cursor = 800;
  // UI cache checkpoint. Ignored unless incremental is true; unsupported peers send snapshots.
  string cursor = 801;
  bool incremental = 802;
  // Opt-in tail paging. Zero preserves the legacy full-history watch.
  uint32 page_size = 803;
  string before_turn_id = 804;
  string target_item_id = 805;
  // A page must belong to the same fork/move history as the held window.
  string history_version = 806;
  // Inclusive oldest loaded turn on resume; full-snapshot fallback keeps this window.
  string from_turn_id = 807;
  // Internal linked subscription, negotiated by thread_watch_liveness.
  bool watch_liveness = 808;
}

message ThreadSnapshot {
  // Owner journal checkpoint read atomically with history. Empty on older gateways.
  string cursor = 800;
  string history_before_turn_id = 803;
  bool history_has_more = 804;
  string history_version = 805;
  // Older-page requests whose history changed return a fresh tail instead.
  bool history_reset = 806;
  repeated ThreadSecret secrets = 500;
  Thread thread = 1;
  repeated Turn turns = 2;
  repeated TimelineItem items = 3;
  repeated Interaction interactions = 4;
  // Zdarzenia na żywo zaczynają się od last_seq + 1.
  uint64 last_seq = 5;
  // Ostatnie komunikaty (do 200); nowe przychodzą jako zdarzenia.
  repeated ThreadNotice notices = 6;
  // Aktywne i wstrzymane harmonogramy wątku.
  repeated Schedule schedules = 7;
  // Wiadomości dołączone do tur w toku (steer), od najstarszej.
  repeated Steer steers = 40;
  // Bieżący cel albo ostatni zakończony (brak = wątek nigdy nie miał celu).
  Goal goal = 60;
  // Numery od 210: dokąd dotarły wywołania spawn_thread / send_message tego wątku (status tur docelowych).
  repeated BusDelivery bus_deliveries = 210;
}

message ThreadEventUpdate {
  uint64 seq = 1;
  canopy.worker.v1.ThreadEvent event = 2;
}

message ThreadUpdate {
  // The snapshot is a local mirror; the home's current state is still pending.
  bool syncing = 800;
  // Internal idle heartbeat: current durable owner journal, independent of live fan-out.
  string watch_cursor = 808;
  oneof change {
    ThreadSnapshot snapshot = 1;
    ThreadEventUpdate event = 2;
    Thread thread = 3;
    Turn turn = 4;
    Interaction interaction = 5;
    Schedule schedule = 6;
    Steer steer = 40;
    Goal goal = 60;
    // Zmiana statusu tury, do której trafiło wywołanie szyny tego wątku.
    BusDelivery bus_delivery = 210;
    ThreadSecret secret = 500;
    // Internal response to mirror_cursor. Routed gateways reconstruct the UI snapshot.
    ThreadSnapshotDelta delta = 801;
  }
}

// Items and turns are upserts plus tombstones. Other snapshot fields replace metadata;
// notices append by seq. Secrets and schedules are excluded by the mirror publisher.
message ThreadSnapshotDelta {
  string base_cursor = 1;
  ThreadSnapshot snapshot = 2;
  repeated string removed_item_ids = 3;
  repeated string removed_turn_ids = 4;
  repeated uint64 removed_notice_seqs = 5;
}

// Metadane bez wartości; osobny kontrakt nie pozwala echo sekretu w interakcji.
message ThreadSecret {
  string request_id = 1;
  string thread_id = 2;
  string label = 3;
  string description = 4;
  string placeholder = 5;
  string name = 6;
  // pending | saved | declined | revoked | expired
  string status = 7;
  google.protobuf.Timestamp expires_at = 8;
}
message AnswerThreadSecretRequest {
  string request_id = 1;
  // Poufne: bez logowania i bez zwracania w odpowiedzi/błędzie.
  string value = 2;
  bool decline = 3;
}
message RevokeThreadSecretRequest { string request_id = 1; }
message ThreadSecretResponse { ThreadSecret secret = 1; }

// ---------- Harmonogram ----------

message Schedule {
  string id = 1;
  string thread_id = 2;
  string project_id = 3;
  // once | recurring
  string kind = 4;
  string prompt = 5;
  // once: termin.
  google.protobuf.Timestamp run_at = 6;
  // recurring: cron (pięć pól) w strefie timezone.
  string cron = 7;
  string timezone = 8;
  google.protobuf.Timestamp until = 9;
  uint32 max_runs = 10;     // 0 = bez limitu
  uint32 runs = 11;
  google.protobuf.Timestamp next_run_at = 12;
  // active | paused | completed | cancelled
  string status = 13;
  // run_once | skip: co po przestoju
  string missed_policy = 14;
  // user | agent
  string created_by = 15;
  // Agent: wątek, który utworzył harmonogram.
  string created_by_thread_id = 16;
  string last_turn_id = 17;
  google.protobuf.Timestamp created_at = 18;
  // thread (default) | new_thread; new-thread targets are user-only.
  string target = 290;
  NewThreadSchedule new_thread = 291;
  // skip_if_running (default) | allow
  string concurrency = 292;
  repeated ScheduleRun recent_runs = 293;
  string name = 294;
  uint32 version = 330;
  string last_edited_by_user_id = 331;
  google.protobuf.Timestamp last_edited_at = 332;
  // Jawna nazwa, także pusta; name zachowuje etykietę z fallbackiem do wiadomości.
  string configured_name = 333;
}

message NewThreadSchedule {
  string project_id = 1;
  // any (default) | least_busy | round_robin | specific
  string placement = 2;
  // Required only for specific.
  string workspace_id = 3;
  canopy.worker.v1.Provider provider = 4;
  string provider_profile_id = 5;
  string model = 6;
  string effort = 7;
  canopy.worker.v1.PermissionMode permission_mode = 8;
  string title = 9;
  // UNSPECIFIED = scoped default. INHERIT_PARENT needs a source thread in this project/workspace.
  WorkspaceMode workspace_mode = 10;
  string base_ref = 11;
  string parent_thread_id = 12;
}

message ScheduleRun {
  google.protobuf.Timestamp scheduled_for = 1;
  uint32 number = 2;
  string thread_id = 3;
  string turn_id = 4;
  string worker_id = 5;
  string workspace_id = 6;
  // started | missed | running | expired
  string outcome = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListSchedulesRequest {
  // Filtry (oba puste = wszystkie harmonogramy użytkownika).
  string project_id = 1;
  string thread_id = 2;
  // Także zakończone i anulowane.
  bool include_finished = 3;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message CreateScheduleRequest {
  string thread_id = 1;
  string prompt = 2;
  oneof when {
    google.protobuf.Timestamp run_at = 3;
    string cron = 4;
  }
  string timezone = 5;      // pusty = UTC
  google.protobuf.Timestamp until = 6;
  uint32 max_runs = 7;
  string missed_policy = 8; // pusty = run_once
  string target = 290;
  NewThreadSchedule new_thread = 291;
  string concurrency = 292;
  string name = 293;
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

// Pełna konfiguracja, walidowana tak samo jak podczas tworzenia. Status i historia pozostają.
message UpdateScheduleRequest {
  string schedule_id = 1;
  uint32 expected_version = 2;
  CreateScheduleRequest configuration = 3;
}

message UpdateScheduleResponse {
  Schedule schedule = 1;
}

message PreviewScheduleRequest {
  string cron = 1;
  string timezone = 2;   // pusty = UTC
  uint32 count = 3;      // ile terminów, 1..20 (0 = 5)
}

message PreviewScheduleResponse {
  repeated google.protobuf.Timestamp next_runs = 1;
}

message SetScheduleStatusRequest {
  string schedule_id = 1;
  // active (wznowienie wstrzymanego) | paused | cancelled. Zakończonego ani anulowanego nie da się wznowić.
  string status = 2;
}

message SetScheduleStatusResponse {
  Schedule schedule = 1;
}


syntax = "proto3";
package canopy.ui.v1;
import "google/protobuf/timestamp.proto";

// Input includes cache read/write; reasoning is part of output. Never sum subsets twice.
message UsageTotals {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cached_input_tokens = 3;
  uint64 cache_write_input_tokens = 4;
  uint64 reasoning_output_tokens = 5;
  double reported_cost_usd = 6;
  // Distinct turn/model counters, not the number of cumulative live updates.
  uint64 reports = 7;
  uint64 unknown_cost_reports = 8;
  // Independent API-equivalent estimate; do not add to reported_cost_usd.
  double estimated_cost_usd = 9;
  uint64 unknown_estimated_cost_reports = 10;
  // Per counter: complete reported cost, else complete estimate, else unknown.
  double effective_cost_usd = 11;
  uint64 unknown_effective_cost_reports = 12;
  // These two source counts plus unknown_effective_cost_reports equal reports.
  uint64 effective_reported_cost_reports = 13;
  uint64 effective_estimated_cost_reports = 14;
}
message UsageBucket {
  google.protobuf.Timestamp bucket_start = 1;
  string provider = 2;
  string model = 3;
  UsageTotals totals = 4;
  uint64 revision = 5;
  string computer_id = 6;
  string requested_service_tier = 7;
  // Same totals split by activity. Older sources omit this field.
  repeated UsageActivityBucket activities = 8;
}
message UsageActivityBucket {
  // thread | generation | unattributed | bot:<bot UUID>
  string key = 1;
  string bot_name = 2;
  UsageTotals totals = 3;
  // Same activity split by executing worker. Older gateways omit this field.
  repeated UsageWorkerBreakdown workers = 4;
}
message UsageWorkerBreakdown {
  // Empty when the recording gateway has no evidence of the executing worker.
  string worker_id = 1;
  string name = 2;
  UsageTotals totals = 3;
}
message UsageSource {
  string computer_id = 1;
  string name = 2;
  bool online = 3;
  google.protobuf.Timestamp tracking_since = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool local = 6;
  // ready | syncing | unsupported | relay | stale | offline
  string status = 7;
}
message UsageBreakdown {
  string key = 1;
  UsageTotals totals = 2;
}
message UsageBotBreakdown {
  string bot_id = 1;
  string name = 2;
  UsageTotals totals = 3;
}
message UsageDay {
  google.protobuf.Timestamp day = 1;
  UsageTotals totals = 2;
  repeated UsageBreakdown providers = 3;
}
message GetUsageStatsRequest {
  // UTC calendar days including today: 1, 7, 30 or 90. Zero defaults to 30.
  uint32 days = 1;
  string provider = 2;
  string computer_id = 3;
  // Absent selects all; empty selects unknown. Native tier IDs are preserved.
  optional string requested_service_tier = 4;
  // Empty selects all. Otherwise: thread | bot | generation | unattributed.
  string activity_kind = 5;
  string bot_id = 6;
}
message GetUsageStatsResponse {
  UsageTotals totals = 1;
  repeated UsageDay days = 2;
  repeated UsageBreakdown providers = 3;
  repeated UsageBreakdown models = 4;
  repeated UsageSource sources = 5;
  google.protobuf.Timestamp starts_at = 6;
  google.protobuf.Timestamp ends_at = 7;
  // Missing coverage, unknown effective cost, or a stale/unavailable source.
  bool partial = 8;
  // Requested speeds: default, fast, ultrafast, native IDs, or empty (unknown).
  repeated UsageBreakdown speeds = 9;
  repeated UsageBreakdown activities = 10;
  repeated UsageBotBreakdown bots = 11;
  bool supports_activity_breakdown = 12;
  // Within the other filters, even if activity_kind or bot_id excludes it.
  bool has_unattributed_usage = 13;
  repeated UsageWorkerBreakdown workers = 14;
  bool supports_worker_breakdown = 15;
}

syntax = "proto3";
package canopy.ui.v1;
import "google/protobuf/timestamp.proto";
import "canopy/ui/v1/attachments.proto";

// All credentials and the OAuth device_code remain encrypted at the home gateway.
message GitHubAccount {
  string id = 1;
  string github_user_id = 2;
  string login = 3;
  string host = 4;
  string auth_kind = 5;
  string status = 6;
  uint64 revision = 7;
  string connector_account_id = 8;
  google.protobuf.Timestamp catalog_verified_at = 9;
  uint32 installation_count = 10;
  uint32 repository_count = 11;
}
message GitHubAccountsRequest {
  // Empty = this computer; otherwise the home marker qualified by the computer.
  string home_id = 1;
}
message GitHubPatCandidate {
  string connector_account_id = 1;
  string name = 2;
}
message GitHubAccountsResponse {
  bool configured = 1;
  string install_url = 2;
  repeated GitHubAccount accounts = 3;
  repeated GitHubPatCandidate pat_candidates = 4;
}
message BeginGitHubDeviceAuthRequest {
  string home_id = 1;
  string client_request_id = 2;
  // Internal binding supplied by authenticated BFF/Connect routing, never returned.
  string client_binding = 3;
}
message GitHubDeviceAuthRequest {
  string attempt_id = 1;
  string client_binding = 2;
}
message GitHubDeviceAuth {
  string id = 1;
  string state = 2;
  string user_code = 3;
  string verification_uri = 4;
  google.protobuf.Timestamp expires_at = 5;
  uint32 interval_seconds = 6;
  string account_id = 7;
}
message GitHubDeviceAuthResponse {
  bool configured = 1;
  GitHubDeviceAuth attempt = 2;
}
message GitHubAccountRequest { string account_id = 1; }
message GitHubAccountResponse { GitHubAccount account = 1; }
message UseGitHubPatRequest {
  string connector_account_id = 1;
  string home_id = 2;
}
message GitHubCatalogueRequest {
  string account_id = 1;
  string installation_id = 2;
  uint32 page = 3;
  bool refresh = 4;
}
message GitHubInstallation {
  string installation_id = 1;
  string login = 2;
  string account_type = 3;
  string repository_selection = 4;
  bool suspended = 5;
  map<string, string> permissions = 6;
  string manage_url = 7;
  google.protobuf.Timestamp verified_at = 8;
}
message GitHubInstallationsResponse {
  repeated GitHubInstallation installations = 1;
  uint32 next_page = 2;
  string detail = 3;
  uint32 total_count = 4;
  uint32 repository_count = 5;
}
message GitHubRepository {
  string repository_id = 1;
  string full_name = 2;
  bool private = 3;
  map<string, bool> permissions = 4;
}
message GitHubRepositoriesResponse {
  repeated GitHubRepository repositories = 1;
  uint32 next_page = 2;
  uint32 total_count = 3;
}

message GitHubRepositoryAccountRequest {
  string home_id = 1;
  string repository_name = 2;
}
message GitHubRepositoryAccountResponse {
  string repository_id = 1;
  string repository_name = 2;
  string account_id = 3;
  uint64 revision = 4;
  repeated GitHubAccount candidates = 5;
}
message SetGitHubRepositoryAccountRequest {
  string home_id = 1;
  string repository_name = 2;
  string account_id = 3;
  uint64 expected_revision = 4;
}
message PullRequestRef {
  string id = 1;
  string host = 2;
  string repository_id = 3;
  string repository_name = 4;
  uint32 number = 5;
  string node_id = 6;
}
message PullRequestSummary {
  PullRequestRef ref = 1;
  string title = 2;
  string state = 3;
  string head_sha = 4;
  string checks_state = 5;
  uint32 checks_count = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp verified_at = 8;
}
message PullRequestCheck {
  string name = 1;
  string state = 2;
  string provider = 3;
  string url = 4;
  string head_sha = 5;
  string node_id = 6;
  string run_id = 7;
  string output = 8;
}
message PullRequestReviewer {
  string login = 1;
  string state = 2;
}
message PullRequestLabel {
  string name = 1;
  string color = 2;
}
message PullRequestSnapshot {
  PullRequestSummary summary = 1;
  string author = 2;
  string body = 3;
  string base_ref = 4;
  string head_ref = 5;
  string base_sha = 6;
  uint32 files = 7;
  uint32 additions = 8;
  uint32 deletions = 9;
  repeated PullRequestReviewer reviewers = 10;
  repeated string labels = 11;
  repeated PullRequestCheck checks = 12;
  string completeness = 13;
  bool stale = 14;
  string detail = 15;
  string account_id = 16;
  uint64 access_revision = 17;
  repeated string assignees = 18;
  repeated PullRequestLabel label_details = 19;
  string head_repository_id = 20;
  string head_repository_name = 21;
  string viewer_login = 22;
  PullRequestLifecycle lifecycle = 23;
}
message PullRequestLifecycle {
  repeated string actions = 1;
  repeated string merge_methods = 2;
  repeated string update_methods = 3;
  repeated string blocking_reasons = 4;
  bool queue_required = 5;
  bool in_queue = 6;
  string auto_merge_method = 7;
  string auto_merge_author = 8;
  bool maintainer_can_modify = 9;
  string merge_title = 10;
  string merge_body = 11;
  string update_blocking_reason = 12;
}
// Read-only checkout and GitHub verification. No push or turn dispatch.
message PullRequestCreateContextRequest {
  string thread_id = 1;
  string repository_name = 2;
  string base_ref = 3;
  string head_sha = 4;
  string cursor = 5;
}
message PullRequestCreateContext {
  string thread_id = 1;
  string repository_name = 2;
  string repository_id = 3;
  repeated string repositories = 4;
  string head_repository_name = 5;
  string head_ref = 6;
  string head_sha = 7;
  string base_ref = 8;
  string base_sha = 9;
  repeated string branches = 10;
  string next_cursor = 11;
  string account_id = 12;
  uint64 access_revision = 13;
  string viewer_login = 14;
  bool published = 15;
  string detail = 16;
}
message PullRequestLink {
  PullRequestSummary summary = 1;
  string source = 2;
  google.protobuf.Timestamp created_at = 3;
  bool current_branch = 4;
  string evidence = 5;
}
message ThreadPullRequestsRequest { string thread_id = 1; }
message ThreadPullRequestsResponse {
  repeated PullRequestLink links = 1;
  uint64 revision = 2;
  bool stale = 3;
  string detail = 4;
}
message LinkThreadPullRequestRequest {
  string thread_id = 1;
  string url = 2;
  uint64 expected_revision = 3;
}
message UnlinkThreadPullRequestRequest {
  string thread_id = 1;
  string pull_request_id = 2;
  uint64 expected_revision = 3;
}
message PullRequestRequest {
  string pull_request_id = 1;
  bool refresh = 2;
}

// Cursors are issued by the home, bound to access, PR, filters and snapshot.
message PullRequestPageRequest {
  string pull_request_id = 1;
  string cursor = 2;
  string kind = 3;
  string author = 4;
  bool oldest_first = 5;
  string head_sha = 6;
  string base_sha = 7;
  string commit_sha = 8;
  string resource_id = 9;
  string path = 10;
  bool refresh = 11;
}
message PullRequestPageInfo {
  string next_cursor = 1;
  string head_sha = 2;
  string base_sha = 3;
  string completeness = 4;
  string detail = 5;
  google.protobuf.Timestamp verified_at = 6;
  bool stale = 7;
  string snapshot = 8;
}
message PullRequestTimelineEntry {
  string id = 1;
  string author = 2;
  string body = 3;
  string url = 4;
  google.protobuf.Timestamp created_at = 5;
  string state = 6;
  string sha = 7;
  string kind = 8;
  bool viewer_can_update = 9;
  bool viewer_can_delete = 10;
}
message PullRequestTimelineItem {
  oneof content {
    PullRequestTimelineEntry comment = 1;
    PullRequestTimelineEntry review = 2;
    PullRequestTimelineEntry commit = 3;
    PullRequestTimelineEntry event = 4;
  }
}
message PullRequestTimelinePage {
  repeated PullRequestTimelineItem items = 1;
  PullRequestPageInfo page = 2;
}
message PullRequestReviewThread {
  string id = 1;
  string path = 2;
  uint32 line = 3;
  bool resolved = 4;
  bool outdated = 5;
  repeated PullRequestTimelineEntry comments = 6;
  string replies_cursor = 7;
  string sha = 8;
  string side = 9;
  uint32 start_line = 10;
  string start_side = 11;
  uint32 original_line = 12;
  uint32 original_start_line = 13;
  bool viewer_can_resolve = 14;
  bool viewer_can_unresolve = 15;
}
message PullRequestReviewComment {
  PullRequestTimelineEntry comment = 1;
  string path = 2;
  string side = 3;
  uint32 line = 4;
  string start_side = 5;
  uint32 start_line = 6;
  bool outdated = 7;
}
// Private to the selected GitHub account. Every page must be read before submitting.
message PullRequestReviewDraft {
  string id = 1;
  string sha = 2;
  string body = 3;
  uint32 total_count = 4;
  repeated PullRequestReviewComment comments = 5;
  PullRequestPageInfo page = 6;
  // A digest of this page, including its head and review identity.
  string revision = 7;
  bool viewer_is_author = 8;
}
message PullRequestReviewThreadsPage {
  repeated PullRequestReviewThread threads = 1;
  PullRequestPageInfo page = 2;
}
message PullRequestChecksPage {
  repeated PullRequestCheck checks = 1;
  PullRequestPageInfo page = 2;
}
message PullRequestJob {
  string id = 1;
  string run_id = 2;
  uint32 attempt = 3;
  string name = 4;
  string state = 5;
  string url = 6;
  string head_sha = 7;
}
message PullRequestJobsPage {
  repeated PullRequestJob jobs = 1;
  PullRequestPageInfo page = 2;
}
message PullRequestJobLogPage {
  string text = 1;
  uint32 first_line = 2;
  bool truncated = 3;
  PullRequestPageInfo page = 4;
}
message PullRequestFile {
  string path = 1;
  string previous_path = 2;
  string state = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  string patch_state = 6;
  string url = 7;
  uint32 source_page = 8;
  // GitHub per-account source of truth: VIEWED, UNVIEWED, DISMISSED.
  string viewer_viewed_state = 9;
}
message PullRequestFilesPage {
  repeated PullRequestFile files = 1;
  PullRequestPageInfo page = 2;
  uint32 viewed_count = 3;
  uint32 viewed_total = 4;
  bool viewed_complete = 5;
}
message PullRequestDiff {
  PullRequestFile file = 1;
  string patch = 2;
  PullRequestPageInfo page = 3;
}
message PullRequestCommit {
  string sha = 1;
  string subject = 2;
  string author = 3;
}
message PullRequestCommitsPage {
  repeated PullRequestCommit commits = 1;
  PullRequestPageInfo page = 2;
}
message WatchPullRequestRequest {
  string pull_request_id = 1;
  string revision = 2;
  // view, panel or background; callers stop watching when hidden.
  string visibility = 3;
}
message PullRequestUpdate {
  PullRequestSnapshot snapshot = 1;
  string revision = 2;
  repeated string invalidated = 3;
  bool gap = 4;
}
message PreparePullRequestContextRequest {
  string pull_request_id = 1;
  string thread_id = 2;
  // question, explain, findings. Preparation never starts a turn.
  string action = 3;
  repeated string paths = 4;
  repeated string finding_ids = 5;
}
message PullRequestContextResponse {
  Attachment attachment = 1;
  string prompt = 2;
  string scope = 3;
}
message GitHubUpdateAccountRequest {
  string home_id = 1;
  string account_id = 2;
  bool enabled = 3;
}
message GitHubUpdateAccountResponse {
  string account_id = 1;
  bool enabled = 2;
}

// No client-provided actor, endpoint or GraphQL. Bindings are replaced by authenticated routing.
message PullRequestMutationRequest {
  string pull_request_id = 1;
  string client_request_id = 2;
  string account_id = 3;
  uint64 access_revision = 4;
  string head_sha = 5;
  string expected_state = 6;
  // create_comment, reply, update_comment, delete_comment, viewed,
  // add_review_comment, submit_review, discard_review, resolve_thread.
  string action = 7;
  string resource_id = 8;
  // issue or review for comment edits/deletions.
  string comment_kind = 9;
  string body = 10;
  string path = 11;
  bool viewed = 12;
  string confirmation_id = 13;
  string client_binding = 14;
  string side = 15;
  uint32 line = 16;
  string start_side = 17;
  uint32 start_line = 18;
  string commit_sha = 19;
  uint32 source_page = 20;
  bool single_comment = 21;
  // COMMENT, APPROVE, REQUEST_CHANGES.
  string verdict = 22;
  // Ordered page digests from the complete pending review.
  string review_revision = 23;
  bool acknowledge_outdated = 24;
  bool resolved = 25;
  string base_sha = 26;
  string method = 27;
  string title = 28;
  bool enabled = 29;
  string thread_id = 30;
  string repository_name = 31;
  string head_repository_name = 32;
  string head_ref = 33;
  string base_ref = 34;
  bool draft = 35;
  bool maintainer_can_modify = 36;
  // Metadata revision from GetPullRequestMetadata. Never a client timestamp.
  string metadata_revision = 37;
  repeated string metadata_ids = 38;
  // request, re_request or remove for reviewers.
  string reviewer_action = 39;
}
message PullRequestMutationRequestRef {
  string pull_request_id = 1;
  string client_request_id = 2;
  string client_binding = 3;
  string thread_id = 4;
}
message PullRequestMutationReceipt {
  string client_request_id = 1;
  string state = 2;
  string action = 3;
  string detail = 4;
  string upstream_id = 5;
  string confirmation_id = 6;
  google.protobuf.Timestamp expires_at = 7;
  string viewer_viewed_state = 8;
  PullRequestRef created_pull_request = 9;
  PullRequestRef existing_pull_request = 10;
}

// IDs are upstream node IDs; names and colours are presentation only.
message PullRequestMetadataOption {
  string id = 1;
  string name = 2;
  string kind = 3;
  string color = 4;
  // Numeric GitHub user ID, used only for an avatar URL.
  string user_id = 5;
}
message PullRequestMetadata {
  string title = 1;
  string body = 2;
  string revision = 3;
  repeated PullRequestMetadataOption reviewers = 4;
  repeated PullRequestMetadataOption assignees = 5;
  repeated PullRequestMetadataOption labels = 6;
  repeated string actions = 7;
}
message PullRequestMetadataPage {
  PullRequestMetadata metadata = 1;
  repeated PullRequestMetadataOption options = 2;
  PullRequestPageInfo page = 3;
  bool members_available = 4;
}

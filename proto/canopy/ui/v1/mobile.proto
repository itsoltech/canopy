syntax = "proto3";
package canopy.ui.v1;

import "google/protobuf/timestamp.proto";

// Public, rate-limited exchange. No service token is ever sent to a phone.
service MobilePairingService {
  rpc ExchangeMobilePairing(ExchangeMobilePairingRequest) returns (ExchangeMobilePairingResponse);
}

// Separate exchange: a phone invitation cannot mint a desktop client identity.
service DesktopPairingService {
  rpc ExchangeDesktopPairing(ExchangeMobilePairingRequest) returns (ExchangeMobilePairingResponse);
}

// Routes may be discovered over the worker's existing authenticated endpoint.
// Credential minting is mounted only on Network access and happens once per worker.
service DesktopMigrationService {
  rpc GetDesktopMigrationRoutes(DesktopMigrationRequest) returns (MobileRoutes);
  rpc MigrateDesktopClient(DesktopMigrationRequest) returns (ExchangeMobilePairingResponse);
}
message DesktopMigrationRequest {
  string worker_id = 1;
  string platform = 2;
}

message ClientCapabilitiesRequest {}
message ClientCapabilities {
  string gateway_version = 1;
  string gateway_name = 2;
  uint32 min_protocol = 3;
  uint32 max_protocol = 4;
  repeated string methods = 5;
  MobileRoutes routes = 6;
  // Launch role: server (default) or the desktop app's bundled local-mode gateway.
  string gateway_role = 7;
  // Absent/false means linking is unavailable, including on older gateways.
  bool linked_computers = 8;
  // Whether this is the initial version of a new installation. Older gateways omit it.
  bool offer_onboarding = 9;
  // The local Desktop BFF can configure this gateway's push relay.
  bool local_push_relay_settings = 10;
  // This paired phone can enroll for the managed relay using app attestation.
  bool managed_mobile_push = 11;
  // The authenticated BFF service or paired desktop can configure this gateway's push relay.
  bool push_relay_settings = 12;
  // A manually configured push relay is available to this paired mobile client.
  bool mobile_push = 13;
  // ListArchivedThreads honors worker_ids in its rows, count and cursors.
  bool archive_worker_filter = 14;
}

message MobileDevice {
  string id = 1;
  string name = 2;
  string platform = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  google.protobuf.Timestamp revoked_at = 6;
  uint32 pairing_version = 7;
  // mobile | desktop. Empty from older gateways means mobile.
  string client_kind = 8;
}
message MobilePairing {
  string id = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp used_at = 3;
  google.protobuf.Timestamp revoked_at = 4;
  string device_id = 5;
  string client_kind = 6;
}
message GetMobileDevicesRequest {}
message GetMobileDevicesResponse {
  string gateway_url = 1;
  repeated MobileDevice devices = 2;
  repeated MobilePairing pairings = 3;
  MobileRoutes routes = 4;
}
message CreateMobilePairingRequest {}
message CreateMobilePairingResponse {
  MobilePairing pairing = 1;
  // Shown once. Never persisted as plaintext. Valid for ten minutes.
  string code = 2;
  string gateway_url = 3;
  MobileRoutes routes = 4;
}
message MobileIdRequest { string id = 1; }
message MobileOperationResponse {}
message UnpairMobileDeviceRequest {}
message PushRelaySettingsRequest {}
message PushRelaySettings {
  // Empty when no custom relay is configured. The bearer and CA are write-only.
  string origin = 1;
  bool has_private_ca = 2;
  // The gateway uses or automatically falls back to a managed relay.
  bool managed_available = 3;
  // The managed relay the owner can select. Absent from older gateways.
  string managed_origin = 4;
  bool managed_enabled = 5;
  // Removing a custom relay automatically restores the managed relay.
  bool managed_by_default = 6;
}
message UpdatePushRelaySettingsRequest {
  bool remove = 1;
  string origin = 2;
  // Omit to keep the existing credential at the same origin.
  string bearer = 3;
  // Omit to keep the CA at the same origin. Send an empty string to use system trust.
  optional string ca_pem = 4;
  // Select the managed relay without supplying a custom relay credential.
  bool use_managed = 5;
}
message SetMobilePushSubscriptionRequest {
  bool enabled = 1;
  string expo_token = 2;
  // Base64url AES-256-GCM key generated by the phone; sent only over the paired TLS connection.
  string preview_key = 3;
}
message BeginManagedMobilePushRequest {
  string expo_token = 1;
}
message BeginManagedMobilePushResponse {
  // Empty when no new attestation is needed.
  string enrollment_id = 1;
  string challenge = 2;
  string android_cloud_project_number = 3;
  // The current grant can still refresh the subscription while the phone attests again.
  bool refresh_existing_grant = 4;
}
message CompleteManagedMobilePushRequest {
  string enrollment_id = 1;
  string attestation = 2;
  // Apple App Attest key identifier. Android leaves this empty.
  string key_id = 3;
  string preview_key = 4;
}
message ResolveMobilePushRequest {
  string receipt_id = 1;
}
message ResolveMobilePushResponse {
  oneof destination {
    string thread_id = 1;
    string bot_id = 2;
  }
}
message ExchangeMobilePairingRequest {
  string code = 1;
  string name = 2;
  // ios | android.
  string platform = 3;
}
message ExchangeMobilePairingResponse {
  MobileDevice device = 1;
  string device_token = 2;
  MobileRoutes routes = 3;
}

// Addresses are hints; only the out-of-band certificate fingerprint grants trust.
message MobileRoutes {
  string fingerprint = 1;
  repeated string addresses = 2;
}

syntax = "proto3";
package canopy.ui.v1;

import "google/protobuf/timestamp.proto";

// Public, rate-limited exchange. No service token is ever sent to a phone.
service MobilePairingService {
  rpc ExchangeMobilePairing(ExchangeMobilePairingRequest) returns (ExchangeMobilePairingResponse);
}

// Separate exchange: a phone invitation can never mint a full UI credential.
service DesktopPairingService {
  rpc ExchangeDesktopPairing(ExchangeMobilePairingRequest) returns (ExchangeMobilePairingResponse);
}

// Routes may be discovered over the worker's existing authenticated endpoint.
// Credential minting is mounted only on Network access and happens once per worker.
service DesktopMigrationService {
  rpc GetDesktopMigrationRoutes(DesktopMigrationRequest) returns (MobileRoutes);
  rpc MigrateDesktopClient(DesktopMigrationRequest) returns (ExchangeMobilePairingResponse);
}
message DesktopMigrationRequest {
  string worker_id = 1;
  string platform = 2;
}

message ClientCapabilitiesRequest {}
message ClientCapabilities {
  string gateway_version = 1;
  string gateway_name = 2;
  uint32 min_protocol = 3;
  uint32 max_protocol = 4;
  repeated string methods = 5;
  MobileRoutes routes = 6;
}

message MobileDevice {
  string id = 1;
  string name = 2;
  string platform = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  google.protobuf.Timestamp revoked_at = 6;
  uint32 pairing_version = 7;
  // mobile | desktop. Empty from older gateways means mobile.
  string client_kind = 8;
}
message MobilePairing {
  string id = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp used_at = 3;
  google.protobuf.Timestamp revoked_at = 4;
  string device_id = 5;
  string client_kind = 6;
}
message GetMobileDevicesRequest {}
message GetMobileDevicesResponse {
  string gateway_url = 1;
  repeated MobileDevice devices = 2;
  repeated MobilePairing pairings = 3;
  MobileRoutes routes = 4;
}
message CreateMobilePairingRequest {}
message CreateMobilePairingResponse {
  MobilePairing pairing = 1;
  // Shown once. Never persisted as plaintext. Valid for ten minutes.
  string code = 2;
  string gateway_url = 3;
  MobileRoutes routes = 4;
}
message MobileIdRequest { string id = 1; }
message MobileOperationResponse {}
message UnpairMobileDeviceRequest {}
message ExchangeMobilePairingRequest {
  string code = 1;
  string name = 2;
  // ios | android.
  string platform = 3;
}
message ExchangeMobilePairingResponse {
  MobileDevice device = 1;
  string device_token = 2;
  MobileRoutes routes = 3;
}

// Addresses are hints; only the out-of-band certificate fingerprint grants trust.
message MobileRoutes {
  string fingerprint = 1;
  repeated string addresses = 2;
}

syntax = "proto3";
package canopy.ui.v1;

// Numbers and locally registered identifiers only. Never payloads or error messages.
message DiagnosticsHistogram {
  repeated uint32 indices = 1;
  repeated uint64 counts = 2;
  double sum = 3;
  double max = 4;
}
message DiagnosticsAggregate {
  uint32 method_id = 1;
  uint64 started = 2;
  uint64 completed = 3;
  repeated uint64 codes = 4;
  DiagnosticsHistogram duration = 5;
  DiagnosticsHistogram request_bytes = 6;
  DiagnosticsHistogram response_bytes = 7;
  DiagnosticsHistogram first_message = 8;
  uint64 request_messages = 9;
  uint64 response_messages = 10;
  uint32 max_in_flight = 11;
  bool incomplete = 12;
  uint64 slow = 13;
  repeated uint64 message_kinds = 14; // request then response: snapshot, delta, heartbeat, control
}
message DiagnosticsRollup {
  uint32 schema_version = 1;
  repeated DiagnosticsProcess processes = 2;
  bool incomplete = 3;
}
message DiagnosticsProcess {
  string process_id = 1;
  string session = 2;
  uint64 sequence = 3;
  repeated DiagnosticsCoverage coverage = 4;
  repeated DiagnosticsAggregate series = 5;
  repeated DiagnosticsCheckpoint checkpoints = 6;
}
message DiagnosticsCheckpoint {
  string session = 1;
  uint64 sequence = 2;
}
message DiagnosticsCoverage {
  int64 start_ms = 1;
  int64 end_ms = 2;
}
message DiagnosticsRequest {
  uint32 window_minutes = 1; // 1, 15, 60 or 1440; default 15
}
message ComputerDiagnosticsRequest {
  string computer_id = 1;
  uint32 window_minutes = 2;
  uint32 offset = 3;
  uint32 limit = 4; // at most 32
  string revision = 5;
  bool overview_only = 6;
  string sort_by = 7;
  string call_kind = 8; // all, unary or stream
  repeated string method_keys = 9; // at most 32; preserve a displayed page until the user sorts again
}
message DiagnosticsPercentiles {
  double p50 = 1;
  double p95 = 2;
  double p99 = 3;
  double max = 4;
  uint64 samples = 5;
  bool overflow = 6;
  double sum = 7;
  // Bits 0/1/2 identify p50/p95/p99 ranks in the overflow bucket.
  uint32 overflow_quantiles = 8;
}
message DiagnosticsCall {
  string method = 1;
  string layer = 2;
  bool stream = 3;
  uint64 started = 4;
  uint64 completed = 5;
  double calls_per_minute = 6;
  repeated uint64 codes = 7;
  uint32 in_flight = 8;
  uint32 max_in_flight = 9;
  DiagnosticsPercentiles duration_ms = 10;
  DiagnosticsPercentiles request_bytes = 11;
  DiagnosticsPercentiles response_bytes = 12;
  DiagnosticsPercentiles first_message_ms = 13;
  uint64 request_messages = 14;
  uint64 response_messages = 15;
  double oldest_active_ms = 16;
  bool incomplete = 17;
  uint64 slow = 18;
  repeated uint64 message_kinds = 19;
}
message DiagnosticsFinding {
  string rule_id = 1;
  string subject = 2;
  string severity = 3;
  double value = 4;
  double threshold = 5;
  uint64 samples = 6;
  double observed_seconds = 7;
  uint32 entering = 8;
  uint32 leaving = 9;
  bool suspended = 10;
  bool active = 11;
}
message DiagnosticsLink {
  string target_id = 1;
  string kind = 2; // worker or computer
  string name = 3;
  bool supported = 4;
  DiagnosticsPercentiles rtt_ms = 5;
  DiagnosticsPercentiles jitter_ms = 6;
  DiagnosticsPercentiles heartbeat_interval_ms = 7;
  double heartbeat_age_ms = 8;
  uint64 echo_timeouts = 9;
  bool online = 10;
}
message ComputerDiagnostics {
  string computer_id = 1;
  string name = 2;
  string app_version = 3;
  string status = 4;
  string process_session = 5;
  string epoch = 6;
  int64 sampled_at_ms = 7;
  double sample_age_ms = 8;
  int64 window_start_ms = 9;
  int64 window_end_ms = 10;
  uint32 resolution_seconds = 11;
  double observed_seconds = 12;
  repeated DiagnosticsCoverage gaps = 13;
  bool restoring = 14;
  int64 persisted_through_ms = 15;
  uint32 pending_minutes = 16;
  string persistence_status = 17;
  repeated DiagnosticsCall calls = 18;
  repeated DiagnosticsLink links = 19;
  repeated DiagnosticsFinding findings = 20;
  uint32 total_methods = 21;
  uint32 next_offset = 22;
  string revision = 23;
  bool not_modified = 24;
  uint64 dropped_samples = 25;
  bool details_available = 26;
  int64 received_at_ms = 27;
  bool age_uncertain = 28;
  uint32 window_minutes = 29;
}
message DiagnosticsSnapshot {
  repeated ComputerDiagnostics computers = 1;
}
// Owner-scoped durable state, replaced atomically with the rollup watermark.
message DiagnosticsState {
  uint32 schema_version = 1;
  string epoch = 2;
  int64 persisted_through_ms = 3;
  repeated DiagnosticsFinding findings = 4;
  repeated DiagnosticsProcess watermarks = 5;
  repeated ComputerDiagnostics peer_overviews = 6;
  bool persistence_gap = 7;
}
message DiagnosticsGrantRequest {
  string origin_computer_id = 1;
  bool enabled = 2;
}
message DiagnosticsGrant {
  string origin_computer_id = 1;
}
message DiagnosticsGrants {
  repeated DiagnosticsGrant grants = 1;
}
// Ephemeral WorkerLink report: no journal, outbox, ACK or arbitrary labels.
message WorkerLinkDiagnostics {
  string session = 1;
  uint64 sequence = 2;
  int64 start_ms = 3;
  int64 end_ms = 4;
  DiagnosticsHistogram rtt = 5;
  DiagnosticsHistogram jitter = 6;
  uint64 echo_timeouts = 7;
}

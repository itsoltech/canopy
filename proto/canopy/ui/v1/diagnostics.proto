syntax = "proto3";
package canopy.ui.v1;

// Numbers and locally registered identifiers only. Never payloads or error messages.
message DiagnosticsHistogram {
  repeated uint32 indices = 1;
  repeated uint64 counts = 2;
  double sum = 3;
  double max = 4;
  optional double min = 5; // Absent in older rollups; lower bound is then unknown.
}
message DiagnosticsAggregate {
  uint32 method_id = 1;
  uint64 started = 2;
  uint64 completed = 3;
  repeated uint64 codes = 4;
  DiagnosticsHistogram duration = 5;
  DiagnosticsHistogram request_bytes = 6;
  DiagnosticsHistogram response_bytes = 7;
  DiagnosticsHistogram first_message = 8;
  uint64 request_messages = 9;
  uint64 response_messages = 10;
  uint32 max_in_flight = 11;
  bool incomplete = 12;
  uint64 slow = 13;
  repeated uint64 message_kinds = 14; // request then response: snapshot, delta, heartbeat, control
}
message DiagnosticsRollup {
  uint32 schema_version = 1;
  repeated DiagnosticsProcess processes = 2;
  bool incomplete = 3;
}
message DiagnosticsProcess {
  string process_id = 1;
  string session = 2;
  uint64 sequence = 3;
  repeated DiagnosticsCoverage coverage = 4;
  repeated DiagnosticsAggregate series = 5;
  repeated DiagnosticsCheckpoint checkpoints = 6;
  repeated DiagnosticsMeasureAggregate measures = 7;
}
// Compact internal series share the RPC collector's fixed allocation budget.
// IDs are assigned by code; rpc_method_id=0 denotes an unassociated observation.
message DiagnosticsMeasureAggregate {
  uint32 metric_id = 1;
  uint32 rpc_method_id = 2;
  DiagnosticsHistogram histogram = 3;
  uint64 events = 4;
  uint64 errors = 5;
  double weighted_sum = 6;
  double weight = 7;
  double max = 8;
  double last = 9;
  int64 sampled_at_ms = 10;
  bool incomplete = 11;
}
message DiagnosticsMeasure {
  uint32 metric_id = 1;
  DiagnosticsPercentiles distribution = 2;
  uint64 events = 3;
  uint64 errors = 4;
  double mean = 5;
  double max = 6;
  double last = 7;
  int64 sampled_at_ms = 8;
  double observed_seconds = 9;
  bool historical = 10;
  bool incomplete = 11;
}
message DiagnosticsDatabaseFamily {
  string family = 1;
  DiagnosticsPercentiles reserve_ms = 2;
  DiagnosticsPercentiles execute_ms = 3;
  DiagnosticsPercentiles release_ms = 4;
  DiagnosticsPercentiles transaction_ms = 5;
  uint64 reserve_errors = 6;
  uint64 execute_errors = 7;
  uint64 release_errors = 8;
  uint64 transaction_errors = 9;
  bool incomplete = 10;
}
message DiagnosticsCheckpoint {
  string session = 1;
  uint64 sequence = 2;
}
message DiagnosticsCoverage {
  int64 start_ms = 1;
  int64 end_ms = 2;
}
message DiagnosticsRequest {
  uint32 window_minutes = 1; // 1, 15, 60 or 1440; default 15
}
message ComputerDiagnosticsRequest {
  string computer_id = 1;
  uint32 window_minutes = 2;
  uint32 offset = 3;
  uint32 limit = 4; // at most 32
  string revision = 5;
  bool overview_only = 6;
  string sort_by = 7;
  string call_kind = 8; // all, unary or stream
  repeated string method_keys = 9; // at most 32; preserve a displayed page until the user sorts again
}
message DiagnosticsPercentiles {
  double p50 = 1;
  double p95 = 2;
  double p99 = 3;
  double max = 4;
  uint64 samples = 5;
  bool overflow = 6;
  double sum = 7;
  // Bits 0/1/2 identify p50/p95/p99 ranks in the overflow bucket.
  uint32 overflow_quantiles = 8;
}
message DiagnosticsCall {
  string method = 1;
  string layer = 2;
  bool stream = 3;
  uint64 started = 4;
  uint64 completed = 5;
  double calls_per_minute = 6;
  repeated uint64 codes = 7;
  uint32 in_flight = 8;
  uint32 max_in_flight = 9;
  DiagnosticsPercentiles duration_ms = 10;
  DiagnosticsPercentiles request_bytes = 11;
  DiagnosticsPercentiles response_bytes = 12;
  DiagnosticsPercentiles first_message_ms = 13;
  uint64 request_messages = 14;
  uint64 response_messages = 15;
  double oldest_active_ms = 16;
  bool incomplete = 17;
  uint64 slow = 18;
  repeated uint64 message_kinds = 19;
  repeated DiagnosticsDatabaseFamily database = 20; // top 10 measured contributors
}
message DiagnosticsFinding {
  string rule_id = 1;
  string subject = 2;
  string severity = 3;
  double value = 4;
  double threshold = 5;
  uint64 samples = 6;
  double observed_seconds = 7;
  uint32 entering = 8;
  uint32 leaving = 9;
  bool suspended = 10;
  bool active = 11;
  bool during_sync = 12; // Correlation in the evaluated minute, never attribution.
}
message DiagnosticsLink {
  string target_id = 1;
  string kind = 2; // worker or computer
  string name = 3;
  bool supported = 4;
  DiagnosticsPercentiles rtt_ms = 5;
  DiagnosticsPercentiles jitter_ms = 6;
  DiagnosticsPercentiles heartbeat_interval_ms = 7;
  double heartbeat_age_ms = 8;
  uint64 echo_timeouts = 9;
  bool online = 10;
  repeated DiagnosticsMeasure measures = 11;
  bool measures_supported = 12;
  uint64 dropped_samples = 13;
}
message ComputerDiagnostics {
  string computer_id = 1;
  string name = 2;
  string app_version = 3;
  string status = 4;
  string process_session = 5;
  string epoch = 6;
  int64 sampled_at_ms = 7;
  double sample_age_ms = 8;
  int64 window_start_ms = 9;
  int64 window_end_ms = 10;
  uint32 resolution_seconds = 11;
  double observed_seconds = 12;
  repeated DiagnosticsCoverage gaps = 13;
  bool restoring = 14;
  int64 persisted_through_ms = 15;
  uint32 pending_minutes = 16;
  string persistence_status = 17;
  repeated DiagnosticsCall calls = 18;
  repeated DiagnosticsLink links = 19;
  repeated DiagnosticsFinding findings = 20;
  uint32 total_methods = 21;
  uint32 next_offset = 22;
  string revision = 23;
  bool not_modified = 24;
  uint64 dropped_samples = 25;
  bool details_available = 26;
  int64 received_at_ms = 27;
  bool age_uncertain = 28;
  uint32 window_minutes = 29;
  repeated DiagnosticsMeasure gateway_measures = 30;
  repeated DiagnosticsDatabaseFamily database = 31; // top 10 by execute p95
  bool gateway_measures_supported = 32;
  repeated DiagnosticsMeasure client_measures = 33; // Untrusted, sampled observations; separate from server metrics.
  int64 epoch_started_at_ms = 34;
  DiagnosticsTraceState tracing = 35; // Metadata only. Samples require a separate explicit export.
  bool tracing_supported = 36;
}

// One ephemeral lease on one selected local process. Never persisted or relayed onward.
message DiagnosticsTraceRequest {
  string computer_id = 1;
  string process_id = 2; // gateway or worker:<id>
  string action = 3; // start or stop; export uses its separate RPC
  uint32 minutes = 4; // 1, 5 (default), 10
  string lease_id = 5; // Fences stop/export against a newer session.
  uint32 max_samples = 6; // Export capacity understood by the reader; 0 preserves the legacy 2000 limit.
}
message DiagnosticsTraceState {
  bool active = 1;
  int64 expires_at_ms = 2;
  string lease_id = 3;
  string process_id = 4;
}
message DiagnosticsTraceSpan {
  string trace_id = 1; // Random, unrelated to any thread, request, command or client identity.
  string operation = 2; // rpc, database, pool, ingest or governor
  uint32 operation_id = 3; // Registered numeric operation only. No arbitrary labels.
  double duration_ms = 4;
  int64 sampled_at_ms = 5;
  bool failed = 6; // Never an error object, message, cause, SQL or parameters.
  string operation_name = 7; // Derived from the local descriptor/family allowlist at export only.
}
message DiagnosticsTraceExport {
  DiagnosticsTraceState state = 1;
  repeated DiagnosticsTraceSpan spans = 2;
  uint64 dropped_samples = 3;
}
message DiagnosticsWorkerTraceRequest {
  string request_id = 1;
  DiagnosticsTraceRequest request = 2; // start, stop or export over authenticated WorkerLink only
}
message DiagnosticsWorkerTraceReply {
  string request_id = 1;
  DiagnosticsTraceExport result = 2;
  uint32 code = 3; // Sanitised Connect code only.
}
message DiagnosticsSnapshot {
  repeated ComputerDiagnostics computers = 1;
}
// Owner-scoped durable state, replaced atomically with the rollup watermark.
message DiagnosticsState {
  uint32 schema_version = 1;
  string epoch = 2;
  int64 persisted_through_ms = 3;
  repeated DiagnosticsFinding findings = 4;
  repeated DiagnosticsProcess watermarks = 5;
  repeated ComputerDiagnostics peer_overviews = 6;
  bool persistence_gap = 7;
  int64 epoch_started_at_ms = 8;
  repeated DiagnosticsBaseline baselines = 9; // At most 17 local process baselines; fences worker batches across restart.
}
message DiagnosticsBaseline {
  string process_id = 1;
  int64 started_at_ms = 2;
}

// A sender is bound by authentication, never by a payload identity.
message SubmitDiagnosticsRequest {
  string session = 1;
  uint64 sequence = 2;
  string epoch = 3;
  int64 start_ms = 4;
  int64 end_ms = 5;
  string source = 6; // web, desktop, mobile or bff
  repeated DiagnosticsMeasureAggregate measures = 7;
  double sampling_rate = 8; // 0.1 for sampled client openings, 1 for BFF operations.
}
message DiagnosticsReceipt {
  string epoch = 1;
  bool accepted = 2;
  int64 epoch_started_at_ms = 3;
}
message ResetDiagnosticsRequest {
  string computer_id = 1;
  string process_id = 2; // gateway; worker:<id> for one worker's diagnostic baseline
  string epoch = 3;
  string action_id = 4;
}
message DiagnosticsReportRequest {
  repeated string computer_ids = 1;
  uint32 window_minutes = 2;
  string format = 3; // json or markdown
}
message DiagnosticsReport {
  string text = 1;
  string format = 2;
  repeated string omitted_sections = 3;
  string proof = 4; // Short-lived authentication of the exact redacted preview, never a grant.
  int64 expires_at_ms = 5;
}
message InvestigateDiagnosticsRequest {
  DiagnosticsReport report = 1;
  string project_id = 2;
  string workspace_id = 3;
  string worker_id = 4;
  int32 provider = 5;
  string provider_profile_id = 6;
  string model = 7;
  string client_request_id = 8;
  string logs_job_id = 9; // Explicit owner choice; ordinary attachment limit still applies.
}
message DiagnosticsInvestigation {
  string thread_id = 1;
}
message DiagnosticsGrantRequest {
  string origin_computer_id = 1;
  bool enabled = 2;
  string permission = 3; // Empty/diagnostics_read or separately granted diagnostics_logs.
}
message DiagnosticsGrant {
  string origin_computer_id = 1;
  string permission = 2;
}

message CollectDiagnosticsLogsRequest {
  repeated string computer_ids = 1;
  uint32 hours = 2; // 1, 6 or 24, interpreted at each source.
  bool include_legacy = 3; // Explicitly labelled untimed tail only.
  bool alias_home = 4; // Paths/hosts/secrets are always removed, regardless of this choice.
  string action_id = 5;
}
message DiagnosticsLogsJobRequest { string job_id = 1; }
message DiagnosticsLogsHome {
  string computer_id = 1;
  string alias = 2;
  string status = 3;
  uint64 bytes = 4;
  repeated DiagnosticsLogCoverage sources = 5;
}
message DiagnosticsLogsJob {
  string job_id = 1;
  string status = 2;
  int64 created_at_ms = 3;
  int64 expires_at_ms = 4;
  uint64 bytes = 5;
  repeated DiagnosticsLogsHome homes = 6;
  uint32 hours = 7;
}
message DiagnosticsLogCoverage {
  string source = 1;
  uint32 worker = 2; // Per-action alias only, never a worker name, id or path.
  string status = 3;
  uint64 bytes = 4;
  uint64 records = 5;
  uint64 omitted_records = 6;
  uint64 omitted_bytes = 7;
  uint64 redacted_records = 8;
  int64 first_at_ms = 9;
  int64 last_at_ms = 10;
  bool legacy = 11;
  bool rotation_verified = 12;
}
// At most 32 KiB data, strict sequence and SHA-256. Metadata precedes each source.
message DiagnosticsLogPart {
  uint32 sequence = 1;
  bytes data = 2;
  string checksum = 3;
  DiagnosticsLogCoverage coverage = 4;
  bool end = 5;
  DiagnosticsLogEnvironment environment = 6;
}
message DiagnosticsLogEnvironment {
  string version = 1;
  string os = 2;
  string arch = 3;
  double uptime_seconds = 4;
  int64 collected_at_ms = 5;
  double sample_age_ms = 6;
  repeated DiagnosticsMeasure measures = 7;
  repeated DiagnosticsFinding findings = 8; // Subjects are omitted; closed rules/severities only.
}
message DiagnosticsHomeLogsRequest {
  string action_id = 1;
  uint32 hours = 2;
  bool include_legacy = 3;
  bool alias_home = 4;
  uint32 budget_bytes = 5;
}
// Private controller/BFF registration: service-token only, never a mobile or linked action.
message DiagnosticsLogSourceRegistration { string session = 1; repeated string sources = 2; }
message DiagnosticsLogSourceCommand {
  string session = 1;
  string request_id = 2;
  string transfer_id = 3;
  DiagnosticsHomeLogsRequest begin = 4;
  bool cancel = 5;
}
message DiagnosticsLogSourceReply {
  string session = 1;
  string request_id = 2;
  DiagnosticsLogPart part = 3;
}
message DiagnosticsGrants {
  repeated DiagnosticsGrant grants = 1;
}
// Ephemeral WorkerLink report: no journal, outbox, ACK or arbitrary labels.
message WorkerLinkDiagnostics {
  string session = 1;
  uint64 sequence = 2;
  int64 start_ms = 3;
  int64 end_ms = 4;
  DiagnosticsHistogram rtt = 5;
  DiagnosticsHistogram jitter = 6;
  uint64 echo_timeouts = 7;
  repeated DiagnosticsMeasureAggregate measures = 8;
  bool worker_measures_supported = 9;
  uint64 dropped_samples = 10;
}

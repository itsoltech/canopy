syntax = "proto3";
package canopy.ui.v1;

import "google/protobuf/timestamp.proto";
import "canopy/worker/v1/worker_link.proto";

// Publiczne DTO nigdy nie zwracają poświadczeń ani secretRef.
message ConnectorType {
  string id = 1;
  string name = 2;
  string url = 3;
  repeated string auth_kinds = 4;
  string requirements = 5;
  bool oauth_app_set = 6;
  string documentation_url = 7;
  // Kolejność jak auth_kinds; opisuje, jakie poświadczenie zdobyć i gdzie.
  repeated ConnectorAuthMethod auth_methods = 8;
}
// Wskazówki dla jednej metody uwierzytelnienia konektora (tylko tekst, bez sekretów).
message ConnectorAuthMethod {
  string auth_kind = 1;
  string label = 2;
  string description = 3;
  repeated string steps = 4;
  string setup_url = 5;
  string setup_label = 6;
  string token_label = 7;
  string token_description = 8;
  bool token_required = 9;
  bool oauth_app_required = 10;
  string scope_description = 11;
  string scope_placeholder = 12;
  // Scopes, które formularz wpisuje na start (np. scopes z manifestu aplikacji Slack).
  string default_scope = 13;
  // Manifest JSON aplikacji i link tworzący ją u dostawcy (Slack); bez sekretów.
  string app_manifest = 14;
  string app_create_url = 15;
  // Stały redirect URL dla zarejestrowanej aplikacji (CANOPY_OAUTH_REDIRECT_URL), gdy oauth_app_required.
  string redirect_url = 16;
}
message ConnectorAccount {
  string id = 1;
  string connector_type = 2;
  string name = 3;
  string namespace = 4;
  string url = 5;
  string transport = 6;
  string auth_kind = 7;
  string status = 8;
  bool all_workers = 9;
  repeated string worker_ids = 10;
  bool all_bots = 11;
  repeated string bot_ids = 12;
  uint64 revision = 13;
  google.protobuf.Timestamp last_used_at = 14;
  repeated string header_names = 15;
  // Redacted test failure, visible only to the account's owner.
  ConnectorError error = 16;
}
message ConnectorError {
  string kind = 1;
  string message = 2;
  string detail = 3;
}
message ListConnectorsRequest { string thread_id = 1; string bot_id = 2; }
message ListConnectorsResponse { repeated ConnectorType types = 1; repeated ConnectorAccount accounts = 2; }
message SaveConnectorAccountRequest {
  string id = 1;
  string connector_type = 2;
  string name = 3;
  string url = 4;
  string transport = 5;
  string auth_kind = 6;
  // Write-only. Empty credentials on an update preserve them unless replace_credentials.
  string token = 7;
  map<string,string> headers = 8;
  bool replace_credentials = 9;
  uint64 expected_revision = 10;
}
message ConnectorAccountResponse { ConnectorAccount account = 1; }
message SetConnectorAccessRequest {
  string account_id = 1;
  bool all_workers = 2;
  repeated string worker_ids = 3;
  bool all_bots = 4;
  repeated string bot_ids = 5;
  uint64 expected_revision = 6;
}
message ConnectorAccountRequest { string account_id = 1; }
message DeleteConnectorAccountResponse {}
message TestConnectorResponse { repeated canopy.worker.v1.ConnectorTool tools = 1; ConnectorAccount account = 2; }
message SaveConnectorOAuthAppRequest { string connector_type = 1; string client_id = 2; string client_secret = 3; string issuer = 4; }
message SaveConnectorOAuthAppResponse {}
// desktop: powrót przez stronę przekierowania otwiera canopy://oauth/callback zamiast callbacku instalacji.
message BeginConnectorOAuthRequest { string account_id = 1; string redirect_uri = 2; string browser_binding = 3; string scope = 4; bool desktop = 5; }
message BeginConnectorOAuthResponse { string authorization_url = 1; }
// pasted_code: kod skopiowany ze strony przekierowania (state i code w jednym ciągu); zastępuje state/code.
message CompleteConnectorOAuthRequest { string state = 1; string code = 2; string browser_binding = 3; string error = 4; string issuer = 5; string pasted_code = 6; }
// Callback outcomes are explicit, so a declined/expired authorization completes the redirect normally.
message CompleteConnectorOAuthResponse {
  ConnectorAccount account = 1;
  string error = 2;
  // Classified, redacted failure; error keeps the same message for older clients.
  ConnectorError failure = 3;
  // A repeated return confirms this sign-in already completed; no second exchange occurs.
  bool already_connected = 4;
}

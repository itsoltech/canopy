// Owner-managed messenger accounts. Credentials are write-only.
syntax = "proto3";
package canopy.ui.v1;

message MessengerAccount {
  string id = 1;
  string name = 2;
  string provider = 3;
  string external_id = 4;
  bool enabled = 5;
  string status = 6;
  string connector_account_id = 7;
  // True for a bot authorized through Slack User, including when its connector account was removed.
  bool requires_slack_user = 8;
}
message ListMessengerAccountsRequest {}
message ListMessengerAccountsResponse {
  repeated MessengerAccount accounts = 1;
  string slack_app_manifest = 2;
  string slack_app_create_url = 3;
  string slack_bot_app_manifest = 4;
  string slack_bot_app_create_url = 5;
}
message SaveMessengerAccountRequest {
  string id = 1;
  string name = 2;
  optional bool enabled = 3;
  optional string app_token = 4;
  optional string bot_token = 5;
  string connector_account_id = 6;
}
message SaveMessengerAccountResponse { MessengerAccount account = 1; }
message DeleteMessengerAccountRequest { string account_id = 1; }
message DeleteMessengerAccountResponse {}

message BotMessengerRoute {
  string id = 1;
  string bot_id = 2;
  string account_id = 3;
  repeated string channel_ids = 4;
  repeated string user_ids = 5;
  bool direct_messages = 6;
  bool mentions = 7;
  bool observe = 8;
  string delivery = 9; // reply | notify
  string instructions = 10;
  // Defaults to true on creation. Omit on updates to retain the saved setting. Applies only to channels.
  optional bool channel_context = 11;
}
message ListBotMessengerRoutesRequest { string bot_id = 1; }
message ListBotMessengerRoutesResponse { repeated BotMessengerRoute routes = 1; }
message SaveBotMessengerRouteRequest { BotMessengerRoute route = 1; }
message SaveBotMessengerRouteResponse { BotMessengerRoute route = 1; }
message DeleteBotMessengerRouteRequest { string route_id = 1; }
message DeleteBotMessengerRouteResponse {}

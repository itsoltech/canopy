syntax = "proto3";
package canopy.ui.v1;

// Desktop credential only, over Network access's pinned TLS. No artifacts or feed overrides.
service DesktopControlService {
  rpc Watch(DesktopHello) returns (stream DesktopControlEvent);
  rpc Report(DesktopReport) returns (DesktopAck);
}
// Separate worker authentication proves possession of this app's own worker.
service DesktopWorkerService {
  rpc Confirm(DesktopWorkerProof) returns (DesktopAck);
}
message DesktopAck {}
message DesktopHello {
  string worker_id = 1;
  string version = 2;
  string channel = 3;
  bool remote_update = 4;
  // The local app reports check timestamps and completes check-only commands.
  bool update_checks = 5;
}
message DesktopWorkerProof {
  string device_id = 1;
  string session_id = 2;
}
message DesktopUpdateCommand {
  string request_id = 1;
  bool force = 2;
  // Local mode: the linked computer that asked for this update (its name, for the notification).
  string requested_by = 3;
  // Local mode: check for an update with the app's own channel and settings. Installs nothing; no request id.
  bool check = 4;
  // Acknowledge only this completed request; never starts or retries an installation.
  bool dismiss = 5;
}
message DesktopControlEvent {
  string session_id = 1;
  bool confirmed = 2;
  DesktopUpdateCommand command = 3;
}
message DesktopUpdateState {
  string worker_id = 1;
  string version = 2;
  string channel = 3;
  string available_version = 4;
  string phase = 5;
  string reason = 6;
  double progress = 7;
  string request_id = 8;
  uint32 revision = 9;
  bool connected = 10;
  string disabled_reason = 11;
  string target_version = 12; // immutable attempted version; available_version may advance after restart
  // The app downloaded an update and installs it at the next restart.
  bool ready = 13;
  // The app's own updater, apart from any requested update (docs/updates.md). Empty from older apps.
  // idle | checking | downloading | downloaded | error | disabled
  string updater_phase = 14;
  // The version the updater downloads or has downloaded; empty when none.
  string updater_version = 15;
  // Download progress, 0–100, while updater_phase is downloading.
  double updater_progress = 16;
  // Why the updater's last check or download failed.
  string updater_error = 17;
  // Time the app's updater last started a real feed check, Unix milliseconds. Zero from older apps.
  double last_checked_at_ms = 18;
  // A completed feed check reports Up to date, with no pending download or error.
  bool updater_current = 19;
}
message DesktopReport {
  string session_id = 1;
  DesktopUpdateState state = 2;
}

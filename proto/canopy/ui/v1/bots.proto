// Boty gateway: osobny kontrakt rozmów, bez transkryptu narzędzi dla UI.
syntax = "proto3";
package canopy.ui.v1;

import "google/protobuf/timestamp.proto";
import "canopy/worker/v1/worker_link.proto";
import "canopy/ui/v1/quotes.proto";
import "canopy/ui/v1/computers.proto";
import "canopy/ui/v1/attachments.proto";

message BotConfiguration {
  string name = 1;
  string shape = 2;
  string color = 3;
  canopy.worker.v1.Provider provider = 4;
  string provider_instance = 5;
  string model = 6;
  string effort = 7;
  string instructions = 8;
  repeated string mcp_server_ids = 9;
  // safe: zgoda na zapisy MCP i niebezpieczne akcje; always: na każdą akcję poza odczytami platformy.
  string approval_policy = 10;
  // Worker harnessu; puste = dobierz i zapamiętaj przy pierwszej turze.
  string worker_id = 830;
  // Omitted: preserve on update, same_bot on create. Owner-only setting.
  // Empty/same_bot: ASK for safe/always, FULL_AUTO for full_auto.
  optional string thread_permission = 1001; // user_default (domyślnie) | ask | read_only | accept_edits | full_auto | full_access
  // Owner-only. Omitted on create = enabled; omitted on update = preserve.
  optional bool web_access = 1002;
}
message Bot {
  string id = 1;
  BotConfiguration configuration = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  // Podgląd ostatniej zapisanej wiadomości na liście i w snapshotcie rozmowy.
  BotMessage last_message = 350;
  bool archived = 430;
  // Pochodzenie: nazwa twórcy w chwili utworzenia, zachowana po zmianie nazwy/usunięciu.
  string created_by_bot_id = 600;
  string created_by_bot_name = 601;
  string owner_user_id = 560;
  uint32 unread_count = 561;
  uint64 last_read_seq = 562;
  // Home gateway of a bot listed through a linked computer; empty for local bots.
  string node_id = 800;
  // Stage 8: the bot moved here from another computer; accounts and servers to connect again here.
  string moved_from_name = 801;
  repeated string reconnect = 802;
  // Powiadomienia (docs/notifications.md): najnowsza oczekująca zgoda lub pytanie (bez pól i propozycji); brak = nic nie czeka.
  BotApproval pending_approval = 1000;
}
message BotMessage {
  string id = 1;
  uint64 seq = 2;
  string bot_id = 3;
  string sender_id = 4;
  string recipient_id = 5;
  string kind = 6; // message | event
  string text = 7;
  string exchange_id = 8;
  google.protobuf.Timestamp created_at = 9;
  // Bot nie mógł odpowiedzieć (tura zakończona błędem); text to szczegół techniczny, nie treść rozmowy.
  bool failed = 10;
  // Stable failure class and origin; text contains only redacted diagnostic details.
  string error_code = 822;
  string error_source = 823;
  // Ciche zdarzenie samoedycji; wartości przed/po służą wyłącznie widokowi zmian.
  repeated BotSettingChange setting_changes = 430;
  // Wybrane chipy w wiadomości użytkownika; BOT.name = bot_id, zakresy UTF-16.
  repeated canopy.worker.v1.Mention mentions = 450;
  repeated Quote quotes = 451;
  repeated Attachment attachments = 452;
}
message BotSettingChange {
  string field = 1;
  string before = 2;
  string after = 3;
}
message BotApproval {
  string id = 1;
  string bot_id = 2;
  string turn_id = 3;
  string kind = 4; // approval | question
  string prompt = 5;
  string status = 6; // pending | approved | discarded | expired
  string answer = 7;
  google.protobuf.Timestamp created_at = 8;
  // Pytanie: proponowane odpowiedzi (do 6); użytkownik może też odpowiedzieć własnymi słowami.
  repeated string options = 9;
  // Labelled values preserve multi-paragraph tool input without parsing prose.
  repeated BotApprovalField fields = 601;
  // Absent for unbounded waits, including HTTP MCP without a known timeout.
  google.protobuf.Timestamp expires_at = 602;
  // Pełny, trwały podgląd create_bot, bez sekretów i MCP. Wykonanie używa tego snapshotu.
  BotConfiguration proposed_bot = 600;
  string routine_title = 560;
  // Gateway-produced choices, durably bound to this request. Never model-supplied.
  repeated BotApprovalRule rule_options = 1001;
  BotApprovalRule allowed_by_rule = 1002;
  // A projection of the existing thread interaction, not a second approval.
  string thread_id = 1003;
  string request_id = 1004;
}
message BotApprovalRule {
  string id = 1;
  string bot_id = 2;
  string kind = 3; // start_thread | connector | send_bot_message | reversible platform tool name
  string target_id = 4; // project, connector account, or destination bot; empty = all projects/bots
  string tool_name = 5; // connector remote tool; empty = all tools of this account
  string label = 6; // gateway-resolved, plain language
  google.protobuf.Timestamp created_at = 7;
  string source = 8; // approval_card
}
message ListBotApprovalRulesRequest { string bot_id = 1; }
message ListBotApprovalRulesResponse { repeated BotApprovalRule rules = 1; }
message DeleteBotApprovalRuleRequest { string bot_id = 1; string rule_id = 2; }
message DeleteBotApprovalRuleResponse {}
// Batch pending permission requests only; thread_id also selects the linked home.
message ListThreadApprovalsRequest { string thread_id = 1; repeated string other_thread_ids = 2; }
message ListThreadApprovalsResponse { repeated BotApproval approvals = 1; }
message BotApprovalField { string label = 1; string value = 2; }
message BotConversation {
  Bot bot = 1;
  repeated BotMessage messages = 2;
  repeated BotApproval approvals = 3;
  string status_line = 4;
  bool working = 5;
  uint64 revision = 6;
  repeated BotRoutine routines = 560;
  repeated BotReminder reminders = 561;
  // Bieżąca odpowiedź harnessu, jeszcze bez końcowego wpisu rozmowy.
  string streaming_text = 830;
  // Atomic UI checkpoint. With delta=true, messages are upserts; other fields replace current state.
  string cursor = 1100;
  string base_cursor = 1101;
  bool delta = 1102;
  repeated string removed_message_ids = 1103;
  // Control state hash matches the client's checkpoint; retain all non-history fields.
  bool controls_unchanged = 1104;
  uint64 history_before_seq = 1110;
  bool history_has_more = 1111;
  bool history_reset = 1112;
}
message BotRoutine {
  string id = 1;
  string bot_id = 2;
  string title = 3;
  string instructions = 4;
  string cron = 5;
  string timezone = 6;
  string schedule_text = 7;
  bool enabled = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_run_at = 11;
  google.protobuf.Timestamp next_run_at = 12;
  string last_outcome = 13;
  uint32 run_count = 14;
}
message BotReminder {
  string id = 1;
  string prompt = 2;
  google.protobuf.Timestamp run_at = 3;
}
message SetBotRoutineEnabledRequest { string bot_id = 1; string routine_id = 2; bool enabled = 3; }
message DeleteBotRoutineRequest { string bot_id = 1; string routine_id = 2; }
message BotRoutineResponse { BotRoutine routine = 1; }
message DeleteBotRoutineResponse {}
message CancelBotReminderRequest { string bot_id = 1; string reminder_id = 2; }
message CancelBotReminderResponse {}
message MarkBotReadRequest { string bot_id = 1; uint64 through_seq = 2; }
message CreateBotRequest { BotConfiguration configuration = 1; string client_request_id = 2; }
message UpdateBotRequest { string bot_id = 1; BotConfiguration configuration = 2; }
message GetBotRequest { string bot_id = 1; }
message GetBotResponse { Bot bot = 1; }
message ListBotsRequest { bool include_archived = 430; }
message ListBotsResponse {
  repeated Bot bots = 1;
  // Homes whose live list could not be read; offline mirrors may still contribute bots.
  repeated LinkedComputer unavailable_computers = 2;
  // Live reads still loading or stale; a slow read is not evidence of a dead connection.
  repeated LinkedComputer refreshing_computers = 3;
}
message DeleteBotRequest { string bot_id = 1; }
message DeleteBotResponse {}
message ArchiveBotRequest { string bot_id = 1; }
message UnarchiveBotRequest { string bot_id = 1; }
message SendBotMessageRequest {
  string bot_id = 1;
  string text = 2;
  string client_request_id = 3;
  repeated canopy.worker.v1.Mention mentions = 450;
  repeated Quote quotes = 451;
  repeated string attachment_ids = 452;
  // Clear only the draft this send started from. A newer edit on another device survives.
  optional uint64 draft_revision = 453;
}
message BotComposerDraft {
  string bot_id = 1;
  string text = 2;
  repeated canopy.worker.v1.Mention mentions = 3;
  repeated Quote quotes = 4;
  repeated Attachment attachments = 5;
  uint64 revision = 6;
  // Stable across navigation and transport retries; changing the message creates a new id.
  string client_request_id = 7;
}
message SaveBotDraftRequest {
  string bot_id = 1;
  BotComposerDraft draft = 2;
  uint64 expected_revision = 3;
}
message SendBotMessageResponse { string turn_id = 1; }
message WatchBotConversationRequest {
  string bot_id = 1;
  bool incremental = 1100;
  string cursor = 1101;
  uint32 page_size = 1110;
  uint64 before_seq = 1111;
}
message ReadBotExchangeRequest {
  string exchange_id = 1;
  bool incremental = 1100;
  string cursor = 1101;
  uint32 page_size = 1110;
  uint64 before_seq = 1111;
}
message ReadBotExchangeResponse {
  repeated BotMessage messages = 1;
  string cursor = 1100;
  string base_cursor = 1101;
  bool delta = 1102;
  repeated string removed_message_ids = 1103;
  repeated Bot participants = 1104;
  // Keep the cached participants/configuration when their digest still matches.
  bool controls_unchanged = 1105;
  uint64 history_before_seq = 1110;
  bool history_has_more = 1111;
  bool history_reset = 1112;
}
// Device-local representation; never accepted by a gateway mutation.
message BotCachedView {
  string key = 1;
  BotConversation conversation = 2;
  ReadBotExchangeResponse exchange = 3;
}
message AnswerBotApprovalRequest {
  string approval_id = 1;
  bool approve = 2;
  string answer = 3;
  // One of the gateway-produced rule_options ids on this exact card.
  string rule_option_id = 1001;
}
message AnswerBotApprovalResponse { BotApproval approval = 1; }
message InterruptBotRequest { string bot_id = 1; }
message InterruptBotResponse {}
// Ponawia ostatnią turę, jeśli zakończyła się błędem: ta sama wiadomość użytkownika, bez nowego wpisu w czacie.
message RetryBotRequest { string bot_id = 1; }
message RetryBotResponse {}

message BotMcpServer {
  string id = 1;
  string name = 2;
  string url = 3;
  string transport = 4; // http | sse (zdalne; nigdy stdio)
  bool enabled = 5;
  repeated string header_names = 6; // wartości są sekretami; nie wracają do UI
  repeated string bot_ids = 7;
}
message SaveBotMcpServerRequest {
  string id = 1; // puste tworzy nowy wpis
  string name = 2;
  string url = 3;
  string transport = 4;
  bool enabled = 5;
  map<string, string> headers = 6; // pusty zbiór przy edycji zachowuje poprzednie
  bool clear_headers = 7;
}
message SaveBotMcpServerResponse { BotMcpServer server = 1; }
message ListBotMcpServersRequest {}
message ListBotMcpServersResponse { repeated BotMcpServer servers = 1; }
message DeleteBotMcpServerRequest { string server_id = 1; }
message DeleteBotMcpServerResponse {}
message TestBotMcpServerRequest { string server_id = 1; }
message BotMcpTool { string name = 1; string description = 2; bool read_only = 3; }
message TestBotMcpServerResponse { repeated BotMcpTool tools = 1; }

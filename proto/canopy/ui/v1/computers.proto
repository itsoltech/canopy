syntax = "proto3";
package canopy.ui.v1;

message LinkedComputer {
  string node_id = 1;
  string name = 2;
  repeated string addresses = 3;
  string fingerprint = 4;
  string app_version = 5;
  uint32 min_protocol = 6;
  uint32 max_protocol = 7;
  string status = 8;
  int64 status_since_ms = 9;
  int64 last_seen_ms = 10;
  int64 linked_at_ms = 11;
  string update_node_id = 12;
  string display_name = 13;
  // Features of the live connection (stage 2: "remote_threads"); empty while not connected.
  repeated string capabilities = 14;
  // Stage 6: every known way to reach this computer, in the order connecting tries them.
  repeated ComputerRoute routes = 15;
  // Stage 7: an indirect computer, never a certificate pin or a LAN route.
  string via_node_id = 16;
  string via_name = 17;
  // This computer can reach us through the relay. Informational, no general access back.
  bool relay_origin = 18;
  repeated string share_onward_node_ids = 19;
  string unavailable_reason = 20;
  bool share_config = 21;
  bool peer_share_config = 22;
  // up_to_date, syncing, needs_update, off, unreachable
  string config_sync_status = 23;
  uint32 config_clock_ahead_minutes = 24;
  string config_alternative_name = 25;
}
message ComputerRoute {
  string address = 1;
  // manual, lan (found on the local network), announced (sent by the computer over the link)
  string source = 2;
  int64 added_at_ms = 3;
  int64 last_success_ms = 4;
  int64 last_failure_ms = 5;
  // Duration of the last successful pinned TLS handshake; 0 when unknown.
  uint32 latency_ms = 6;
}
message ComputersRequest {}
message ComputersSnapshot {
  LinkedComputer self = 1;
  repeated LinkedComputer peers = 2;
  // Network access is on and listening (UpdateNetworkAccess turns it on and off).
  bool listener_enabled = 3;
  // Always true: every computer can listen (kept for older web clients).
  bool listener_available = 4;
  // Stage 6: local network discovery of linked computers (a setting of this computer).
  bool lan_discovery_enabled = 5;
  // active, off, unavailable
  string lan_discovery_state = 6;
  // Why discovery is unavailable or limited, in the words the UI shows.
  string lan_discovery_note = 7;
  repeated ConfigComputer config_group = 8;
  repeated ConfigNotice config_notices = 9;
}
message ConfigComputer { string node_id = 1; string name = 2; }
message ConfigNotice {
  string id = 1;
  string kind = 2;
  string global_id = 3;
  string field = 4;
  string node_name = 5;
  int64 changed_at_ms = 6;
  // A display value only. Secret notices always say "A different key".
  string value = 7;
  string reason = 8;
}
message ConfigNoticeOperation { string id = 1; string action = 2; }
message CreateComputerPairingRequest { optional bool share_config = 1; }
message ComputerPairing {
  string id = 1;
  string code = 2;
  int64 expires_at_ms = 3;
  repeated string addresses = 4;
}
message LinkComputerRequest { string address = 1; string code = 2; optional bool share_config = 3; }
message ComputerOperationRequest {
  // rename, unlink, revoke_pairing, presence, lan_discovery, add_route, remove_route, share_config.
  // (The former "listener" action is UpdateNetworkAccess set_enabled.)
  // Empty node_id is self.
  string action = 1;
  string node_id = 2;
  string name = 3;
  bool enabled = 4;
  // add_route / remove_route: an HTTPS origin of the linked computer.
  string address = 5;
  // share_onward: the complete selection of this partner's other direct partners.
  repeated string share_onward_node_ids = 6;
}

// Stage 4: configuration shared between linked computers. Items are opt-in; everything else stays
// on this computer. Secret values are never part of these messages.
message SharedConfigItem {
  string key = 1;
  // instance, models, settings, project
  string kind = 2;
  string label = 3;
  bool shared = 4;
  // Sum of the version vector; grows with every change on any computer.
  uint64 version = 5;
  // Empty: this computer.
  string changed_by_node_id = 6;
  int64 changed_at_ms = 7;
  // Why a copy became local: deleted / unshared on another computer (see note_node_id).
  string note = 8;
  string note_node_id = 9;
}
message SharedConfigField {
  string name = 1;
  string local = 2;
  string remote = 3;
}
message SharedConfigConflict {
  string key = 1;
  string kind = 2;
  string label = 3;
  string node_id = 4;
  int64 detected_at_ms = 5;
  int64 remote_changed_at_ms = 6;
  // Only the differing fields. Secrets appear as "Set" / "Changed", never as values.
  repeated SharedConfigField fields = 7;
}
message SharedConfigSnapshot {
  repeated SharedConfigItem items = 1;
  repeated SharedConfigConflict conflicts = 2;
  // Linked computers that cannot share configuration yet (an older Canopy): they keep their own.
  repeated string needs_update_node_ids = 3;
}
message SharedConfigRequest {}
message SharedConfigOperation {
  // share, unshare, keep_local, keep_remote
  string action = 1;
  string key = 2;
  // keep_local / keep_remote: the computer of the conflict.
  string node_id = 3;
}

// Stage 8: moving threads and bots to another linked computer. The source (this computer, the
// current home) coordinates; the moves run in the background and GetMoves reports them.
message MoveItemRef {
  // thread, bot
  string kind = 1;
  string id = 2;
}
message MovePreviewRequest {
  string node_id = 1;
  repeated MoveItemRef items = 2;
  // Every thread and bot of this computer.
  bool everything = 3;
}
message MovePreviewItem {
  string kind = 1;
  string id = 2;
  string title = 3;
  // Why it cannot move now (a turn is running, a card waits for an answer). Empty: it can move.
  string blocked = 4;
  // What moves along (side threads, routines, reminders, files).
  repeated string moves = 5;
  // What has to be done again on the other computer (connector accounts, MCP servers, goals).
  repeated string redo = 6;
  // thread: its project, to choose a workspace on the other computer.
  string project_id = 7;
  string project_name = 8;
  bool archived = 9;
}
message MovePreview {
  string node_id = 1;
  string name = 2;
  repeated MovePreviewItem items = 3;
  // everything: configuration already shared with the other computer (it stays shared).
  repeated string shared = 4;
  // everything: what stays on this computer and has to be set up again there.
  repeated string local_only = 5;
  // The other computer cannot receive moves now (offline, needs an update).
  string unavailable = 6;
}
message MovePlacement {
  // A project of a moved thread and the other computer's workspace for its threads (overview ids).
  string project_id = 1;
  string workspace_id = 2;
}
message StartMoveRequest {
  string node_id = 1;
  repeated MoveItemRef items = 2;
  bool everything = 3;
  repeated MovePlacement placements = 4;
}
message ComputerMove {
  string id = 1;
  string batch_id = 2;
  string kind = 3;
  string item_id = 4;
  string title = 5;
  // source (moving away from this computer) or target (arriving here).
  string role = 6;
  string node_id = 7;
  string node_name = 8;
  // preparing, prepared, committed, done, aborting, aborted
  string state = 9;
  string error = 10;
  repeated string redo = 11;
  int64 updated_at_ms = 12;
  // The id to open it with now (qualified for the other computer).
  string new_id = 13;
}
message MovesRequest { string batch_id = 1; }
message MovesSnapshot { repeated ComputerMove moves = 1; }

syntax = "proto3";
package canopy.ui.v1;

message LinkedComputer {
  string node_id = 1;
  string name = 2;
  repeated string addresses = 3;
  string fingerprint = 4;
  string app_version = 5;
  uint32 min_protocol = 6;
  uint32 max_protocol = 7;
  string status = 8;
  int64 status_since_ms = 9;
  int64 last_seen_ms = 10;
  int64 linked_at_ms = 11;
  string update_node_id = 12;
  string display_name = 13;
  // Features of the live connection (stage 2: "remote_threads"); empty while not connected.
  repeated string capabilities = 14;
  // Stage 6: every known way to reach this computer, in the order connecting tries them.
  repeated ComputerRoute routes = 15;
  // Stage 7: an indirect computer, never a certificate pin or a LAN route.
  string via_node_id = 16;
  string via_name = 17;
  // This computer can reach us through the relay. Informational, no general access back.
  bool relay_origin = 18;
  repeated string share_onward_node_ids = 19;
  string unavailable_reason = 20;
}
message ComputerRoute {
  string address = 1;
  // manual, lan (found on the local network), announced (sent by the computer over the link)
  string source = 2;
  int64 added_at_ms = 3;
  int64 last_success_ms = 4;
  int64 last_failure_ms = 5;
  // Duration of the last successful pinned TLS handshake; 0 when unknown.
  uint32 latency_ms = 6;
}
message ComputersRequest {}
message ComputersSnapshot {
  LinkedComputer self = 1;
  repeated LinkedComputer peers = 2;
  bool listener_enabled = 3;
  bool listener_available = 4;
  // Stage 6: local network discovery of linked computers (a setting of this computer).
  bool lan_discovery_enabled = 5;
  // active, off, unavailable
  string lan_discovery_state = 6;
  // Why discovery is unavailable or limited, in the words the UI shows.
  string lan_discovery_note = 7;
}
message CreateComputerPairingRequest {}
message ComputerPairing {
  string id = 1;
  string code = 2;
  int64 expires_at_ms = 3;
  repeated string addresses = 4;
}
message LinkComputerRequest { string address = 1; string code = 2; }
message ComputerOperationRequest {
  // rename, unlink, listener, revoke_pairing, presence, lan_discovery, add_route, remove_route.
  // Empty node_id is self.
  string action = 1;
  string node_id = 2;
  string name = 3;
  bool enabled = 4;
  // add_route / remove_route: an HTTPS origin of the linked computer.
  string address = 5;
  // share_onward: the complete selection of this partner's other direct partners.
  repeated string share_onward_node_ids = 6;
}

// Stage 4: configuration shared between linked computers. Items are opt-in; everything else stays
// on this computer. Secret values are never part of these messages.
message SharedConfigItem {
  string key = 1;
  // instance, models, settings, project
  string kind = 2;
  string label = 3;
  bool shared = 4;
  // Sum of the version vector; grows with every change on any computer.
  uint64 version = 5;
  // Empty: this computer.
  string changed_by_node_id = 6;
  int64 changed_at_ms = 7;
  // Why a copy became local: deleted / unshared on another computer (see note_node_id).
  string note = 8;
  string note_node_id = 9;
}
message SharedConfigField {
  string name = 1;
  string local = 2;
  string remote = 3;
}
message SharedConfigConflict {
  string key = 1;
  string kind = 2;
  string label = 3;
  string node_id = 4;
  int64 detected_at_ms = 5;
  int64 remote_changed_at_ms = 6;
  // Only the differing fields. Secrets appear as "Set" / "Changed", never as values.
  repeated SharedConfigField fields = 7;
}
message SharedConfigSnapshot {
  repeated SharedConfigItem items = 1;
  repeated SharedConfigConflict conflicts = 2;
  // Linked computers that cannot share configuration yet (an older Canopy): they keep their own.
  repeated string needs_update_node_ids = 3;
}
message SharedConfigRequest {}
message SharedConfigOperation {
  // share, unshare, keep_local, keep_remote
  string action = 1;
  string key = 2;
  // keep_local / keep_remote: the computer of the conflict.
  string node_id = 3;
}

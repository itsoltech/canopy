syntax = "proto3";
package canopy.ui.v1;
import "canopy/worker/v1/workspace_copy.proto";

message GetWorkspaceCopyManifestRequest { string workspace_id = 1; }
message GetWorkspaceCopyManifestResponse {
  canopy.worker.v1.WorkspaceCopyManifest manifest = 1;
}
// Orchestrated at the client-facing gateway; references can belong to different computers.
message CopyWorkspaceRequest {
  string source_ref = 1;
  string target_ref = 2;
  string project_ref = 3;
  string manifest_token = 4;
  // Legacy full selection; incomplete repositories are rejected.
  repeated string paths = 5 [deprecated = true];
  repeated string confirmed_secrets = 6;
  string parent_path = 7;
  string name = 8;
  string transfer_key = 9;
  canopy.worker.v1.WorkspaceCopyIgnoredSelection ignored_selection = 10;
  // Display only: the destination worker's name as the client shows it (StartWorkspaceCopy).
  string target_name = 11;
}
message WorkspaceCopyProgress {
  uint64 bytes = 1;
  uint64 total_bytes = 2;
  uint32 files = 3;
  uint32 total_files = 4;
  string current_file = 5;
  string status = 6;
  string workspace_ref = 7;
  uint32 skipped = 8;
}
// Internal coordination over the same owner-authenticated linked-computer routes.
// The source home binds a manifest token to an owned workspace before authorizing reads.
message WorkspaceCopySourceRequest {
  string workspace_id = 1;
  string token = 2;
  repeated string paths = 3 [deprecated = true];
  repeated string confirmed_secrets = 4;
  bool authorize = 5;
  canopy.worker.v1.WorkspaceCopyRead read = 6;
  bool release = 7;
  canopy.worker.v1.WorkspaceCopyIgnoredSelection ignored_selection = 8;
  canopy.worker.v1.WorkspaceCopyReadBatch read_batch = 9;
}
message WorkspaceCopySourceResponse {
  repeated canopy.worker.v1.WorkspaceCopyEntry entries = 1;
  canopy.worker.v1.WorkspaceCopyChunk chunk = 2;
  uint32 skipped = 3;
  canopy.worker.v1.WorkspaceCopyBatch batch = 4;
}
message WorkspaceCopyTargetRequest {
  string worker_id = 1;
  string project_id = 2;
  string source_ref = 3;
  canopy.worker.v1.WorkspaceCopyOperation operation = 4;
}
message WorkspaceCopyTargetResponse {
  string directory = 1;
  string workspace_ref = 2;
  repeated canopy.worker.v1.WorkspaceCopyStaged staged = 3;
}

// A copy that runs in the background at the client-facing gateway, owned by one user. It survives closed clients
// and restarts of the gateway and both workers, and continues from the files the target already holds.
message WorkspaceCopyJob {
  // The transfer key of the request.
  string id = 1;
  string source_ref = 2;
  string target_ref = 3;
  string project_ref = 4;
  // The new directory's name and the destination worker's name, for "Copying <name> → <target>".
  string name = 5;
  string target_name = 6;
  string parent_path = 7;
  // queued, copying, finishing, waiting (a worker or computer is away), completed, failed, cancelled.
  string status = 8;
  // Bytes, files, the current file and, once completed, workspace_ref.
  WorkspaceCopyProgress progress = 9;
  string error = 10;
  int64 created_ms = 11;
  int64 updated_ms = 12;
}
message ListWorkspaceCopyJobsRequest {}
message ListWorkspaceCopyJobsResponse {
  repeated WorkspaceCopyJob jobs = 1;
}
message WorkspaceCopyJobRequest {
  string id = 1;
}

syntax = "proto3";
package canopy.worker.v1;

// Transient, owner initiated file transfer. Never journal, log or put these messages in an outbox.
message WorkspaceCopyEntry {
  string path = 1;
  uint64 size = 2;
  uint32 mode = 3;
  string symlink = 4;
  bool directory = 5;
  bool ignored = 6;
  bool included = 7;
  bool secret = 8;
  bool metadata = 9;
  string blocked = 10;
}

message WorkspaceCopyManifest {
  string token = 1;
  repeated WorkspaceCopyEntry entries = 2;
  uint64 bytes = 3;
  uint32 files = 4;
  repeated string skipped_directories = 5;
  string branch = 6;
  optional uint32 unpushed_commits = 7;
  uint32 changed_files = 8;
}

message WorkspaceCopyScan { string root_path = 1; }
message WorkspaceCopyRead {
  string token = 1;
  string path = 2;
  uint64 offset = 3;
  // Resume: the source hashes the whole file and answers `unchanged` instead of bytes when it matches.
  string known_sha256 = 4;
  // Batched reads: at most this many bytes from `offset` (all reads of a frame together stay within the frame).
  uint32 max_bytes = 5;
}
// The source validates the complete repository before allowing any reads.
message WorkspaceCopyAuthorize {
  string token = 1;
  repeated string paths = 2;
}
// Only ignored local files are selectable. The repository is always included.
message WorkspaceCopyIgnoredSelection { repeated string paths = 1; }
message WorkspaceCopyPrepare {
  string token = 1;
  string parent_path = 2;
  string name = 3;
  repeated WorkspaceCopyEntry entries = 4;
  uint64 bytes = 5;
  // Continue an interrupted transfer with the same token: the target keeps complete staged files that are still
  // selected and reports them in `staged`.
  bool resume = 6;
}
message WorkspaceCopyChunk {
  string token = 1;
  string path = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool last = 5;
  string sha256 = 6;
  // The file already exists on the target with `sha256`; no data follows.
  bool unchanged = 7;
}
// Many small files, or one piece of a large file, in one bounded frame (workspace_copy_batch_v1).
message WorkspaceCopyReadBatch {
  string token = 1;
  repeated WorkspaceCopyRead reads = 2;
}
message WorkspaceCopyBatch {
  string token = 1;
  repeated WorkspaceCopyChunk chunks = 2;
}
// A file the target already holds in its private staging directory; the gateway checks it with the source.
message WorkspaceCopyStaged {
  string path = 1;
  uint64 size = 2;
  string sha256 = 3;
}
message WorkspaceCopyFinish {
  string token = 1;
  string sha256 = 2;
}
message WorkspaceCopyOperation {
  oneof action {
    WorkspaceCopyScan scan = 1;
    WorkspaceCopyRead read = 2;
    WorkspaceCopyPrepare prepare = 3;
    WorkspaceCopyChunk write = 4;
    WorkspaceCopyFinish finish = 5;
    string cancel = 6;
    string release = 7;
    WorkspaceCopyAuthorize authorize = 8;
    WorkspaceCopyReadBatch read_batch = 9;
    WorkspaceCopyBatch write_batch = 10;
  }
}
message WorkspaceCopyResult {
  WorkspaceCopyManifest manifest = 1;
  WorkspaceCopyChunk chunk = 2;
  string directory = 3;
  WorkspaceCopyBatch batch = 4;
  repeated WorkspaceCopyStaged staged = 5;
}

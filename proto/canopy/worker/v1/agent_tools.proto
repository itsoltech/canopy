syntax = "proto3";

package canopy.worker.v1;

import "google/protobuf/timestamp.proto";

// Local automation binaries installed on, and executed by, the worker.
// The gateway only forwards the allow-listed tool and operation identifiers.
enum AgentTool {
  AGENT_TOOL_UNSPECIFIED = 0;
  AGENT_TOOL_BROWSER = 1;
  AGENT_TOOL_DESKTOP = 2;
  AGENT_TOOL_DEVICE = 3;
}

message AgentToolInstallStatus {
  string install_id = 1;
  string state = 2; // running | succeeded | failed
  string target_version = 3;
  string error = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message AgentToolInfo {
  AgentTool tool = 1;
  string package_name = 2;
  string path = 3;
  string version = 4;
  bool installed = 5;
  bool ready = 6;
  bool installable = 7;
  string detail = 8;
  bool screenshot = 9;
  bool stream = 10;
  AgentToolInstallStatus install = 11;
}

message AgentToolsReport {
  repeated AgentToolInfo tools = 1;
  string os = 2;
  string arch = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message InstallAgentTool {
  AgentTool tool = 1;
  // X.Y.Z; the worker uses the fixed version associated with the tool when empty.
  string version = 2;
  string install_id = 3;
  // agent-browser: also install Chrome for Testing after npm completes.
  bool install_runtime = 4;
}

message AgentToolProgress {
  string install_id = 1;
  AgentTool tool = 2;
  repeated string lines = 3;
}

// A bounded operation set. target/value are interpreted by the worker per tool;
// they are never assembled into a shell command.
message RunAgentTool {
  AgentTool tool = 1;
  string operation = 2; // open | snapshot | screenshot | click | fill | type | press | close
  string target = 3;
  string value = 4;
  string platform = 5; // agent-device only: ios | android | web | ...
  // Empty uses the tool's default session; agent sessions use the Canopy thread id.
  string session = 6;
  string app = 7;
  string window_id = 8;
  string device_id = 9;
}

message AgentToolOutput {
  string operation = 1;
  string text = 2;
  string mime_type = 3;
  bytes data = 4;
  bool truncated = 5;
}

// Ephemeral, frame-acknowledged previews. These messages never enter a journal,
// command outbox, transcript, or persisted computer mirror.
message AgentPreviewTarget {
  string id = 1;
  string label = 2;
  string platform = 3;
  string app = 4;
  string window_id = 5;
  string device_id = 6;
  bool active = 7;
}

message StartAgentPreview {
  string preview_id = 1;
  string thread_id = 2;
  RunAgentTool scope = 3;
  uint32 max_fps = 4;
}

message StopAgentPreview { string preview_id = 1; }
message AgentPreviewAck {
  string preview_id = 1;
  uint64 frame_id = 2;
}

message AgentPreviewInput {
  // pointer-move | pointer-down | pointer-up | wheel | key-down | key-up |
  // text | navigate | back | forward | reload | home | release | resize
  string kind = 1;
  // Coordinates are normalized to the rendered frame, excluding letterboxing.
  double x = 2;
  double y = 3;
  double delta_x = 4;
  double delta_y = 5;
  uint32 button = 6; // DOM button: 0 left, 1 middle, 2 right
  uint32 buttons = 7;
  string key = 8;
  string code = 9;
  string text = 10;
  uint32 modifiers = 11; // alt=1, control=2, meta=4, shift=8
  uint32 width = 12;
  uint32 height = 13;
}

message AgentPreviewInputBatch {
  string preview_id = 1;
  repeated AgentPreviewInput inputs = 2;
}

message AgentPreviewCommand {
  oneof kind {
    StartAgentPreview start = 1;
    StopAgentPreview stop = 2;
    AgentPreviewInputBatch input = 3;
    AgentPreviewAck ack = 4;
  }
}

message AgentPreviewEvent {
  string preview_id = 1;
  string state = 2; // connecting | ready | frame | error | closed
  uint64 frame_id = 3;
  bytes data = 4;
  string mime_type = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint32 viewport_width = 8;
  uint32 viewport_height = 9;
  string url = 10;
  string title = 11;
  string detail = 12;
  repeated AgentPreviewTarget targets = 13;
  string target_id = 14;
  string mode = 15; // stream | screenshots
}

syntax = "proto3";
package canopy.worker.v1;

// Transient read of a reported device copy. Never carries a caller-supplied path.
message PreviewLocalSkill {
  string target_id = 1;
  string archive_token = 2;
  uint64 expected_revision = 3;
  string skill_id = 4; // assigned copy, capability agent_conflict_skill_import_v1
}

// Capability agent_environment_v1. Complete desired state, never an outbox of stale commands.
message EnvironmentInstruction {
  string harness = 1; // claude | codex
  string content = 2;
  string checksum = 3;
  bool device_home = 4;
  bool platform_home = 5;
}

message EnvironmentResolution {
  string target_id = 1;
  string action = 2; // keep | overwrite | archive (reviewed skill copies)
  string observed_checksum = 3;
  string desired_checksum = 4;
}

message AgentEnvironmentDesired {
  uint64 revision = 1;
  repeated EnvironmentInstruction instructions = 2;
  repeated EnvironmentResolution resolutions = 3;
  repeated EnvironmentSkill skills = 4; // capability agent_skills_v1
  repeated EnvironmentResolution skill_resolutions = 5;
  repeated EnvironmentSkill plugins = 6; // capability agent_plugins_v1; validated plugin artifacts
  repeated EnvironmentResolution plugin_resolutions = 7;
  bool platform_skill_archives = 8; // gateway accepts tokens for blocking copies in private platform homes
}

message SkillFile {
  string path = 1;
  bytes content = 2;
  string checksum = 3;
  bool executable = 4;
}

message SkillArtifact {
  string name = 1;
  string description = 2;
  string checksum = 3;
  repeated SkillFile files = 4;
}

// Transient owner-operated PTY. Requests and output never enter the outbox or journal.
message SkillInstallerRequest {
  string session_id = 1;
  string action = 2; // start | read | write | cancel | collect | close
  string command = 3;
  bytes input = 4;
  uint64 offset = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  string skill_path = 8;
}

message SkillInstallerResult {
  string session_id = 1;
  string cwd = 2;
  bytes output = 3;
  uint64 offset = 4; // next byte cursor, including any discarded bytes
  bool running = 5;
  optional int32 exit_code = 6;
  repeated string skill_paths = 7;
  SkillArtifact artifact = 8; // only on collect
  bool output_truncated = 9;
  string reason = 10;
}

message EnvironmentSkill {
  string id = 1;
  uint64 version = 2;
  SkillArtifact artifact = 3;
  repeated string harnesses = 4; // claude | codex | grok | antigravity
  bool device_home = 5;
  bool platform_home = 6;
}

message EnvironmentSkillStatus {
  string target_id = 1;
  string skill_id = 2;
  string harness = 3;
  string path = 4;
  string scope = 5;
  string status = 6; // applied | drift | kept | error | removed | local
  string desired_checksum = 7;
  string observed_checksum = 8; // whole-directory CAS token
  repeated SkillFile managed_files = 9; // only files in the ownership manifest
  bool importable = 10;
  string detail = 11;
  uint64 version = 12;
  repeated SkillFile desired_files = 13; // exact pinned version, only when comparing drift
  bool owned = 14;
  string local_name = 15; // skill directory entry, independent of library membership
  string archive_token = 16; // opaque precondition for moving this entry aside
  bool local_link = 17; // the directory entry itself is a link
}

message EnvironmentFileStatus {
  string target_id = 1;
  string harness = 2;
  string path = 3;
  string scope = 4; // device | platform
  string status = 5; // applied | drift | kept | error | removed
  string desired_checksum = 6;
  string observed_checksum = 7; // full-file CAS token; no unmanaged content leaves the worker
  string managed_content = 8;
  bool importable = 9;
  string detail = 10;
}

message AgentEnvironmentReport {
  uint64 revision = 1;
  repeated EnvironmentFileStatus files = 2;
  repeated EnvironmentSkillStatus skills = 3;
  repeated EnvironmentSkillStatus plugins = 4;
  bool skill_inventory_scanned = 5; // all device skill roots were inventoried
}

syntax = "proto3";
package canopy.worker.v1;

import "canopy/worker/v1/agent_environment.proto";
import "google/protobuf/timestamp.proto";

// Import z CLI agentów (docs/import.md), capability cli_import_v1.
// Komendy są nietrwałe: nigdy z outboxa ani journala. Worker czyta wyłącznie katalogi CLI
// ze swojej konfiguracji; gateway nigdy nie wysyła ścieżek, tylko podpisane source_key.

message ScanImportSources {
  // claude | codex | grok; puste = wszystkie trzy.
  repeated string agent_clis = 1;
}

// Katalog CLI na workerze (urządzenie albo home_path instancji), po realpath i bez duplikatów.
message ImportRoot {
  // Stały skrót ścieżki rzeczywistej; source_identity w gatewayu.
  string id = 1;
  string agent_cli = 2;
  // Tylko do wyświetlenia.
  string path = 3;
  // Zainstalowane CLI (pierwsza linia --version), puste gdy brak.
  string cli_version = 4;
  string problem = 5;
}

// Stan pliku źródłowego w chwili skanu; import czyta tylko ten prefiks.
message ImportSnapshot {
  uint64 size = 1;
  int64 modified_ms = 2;
  // sha256 pierwszych 64 KiB: wykrywa podmieniony plik o tej samej nazwie.
  string prefix_sha256 = 3;
  // Grok: chat_history.jsonl w chwili skanu (rozmiar i sha256 pierwszych 64 KiB), gdy importowany jest log ACP;
  // kopia do kontynuacji kończy się dokładnie tu.
  uint64 history_size = 4;
  string history_prefix_sha256 = 5;
}

// Metadane jednego wątku CLI, bez treści rozmowy (tytuł i podgląd po maskowaniu sekretów).
message ImportThreadSummary {
  // Podpisany przez workera: root + ścieżka względna + HMAC kluczem lokalnym workera.
  string source_key = 1;
  string agent_cli = 2;
  // Id sesji Claude, wątku Codexa albo sesji Groka.
  string native_id = 3;
  string root_id = 4;
  string cwd = 5;
  bool cwd_exists = 6;
  string title = 7;
  // Najwyżej 120 znaków pierwszej wiadomości, gdy CLI nie zapisało tytułu.
  string preview = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  uint64 bytes = 11;
  // Liczba wiadomości użytkownika, gdy plik jest mały; 0 = nieznana.
  uint32 turns = 12;
  // cli | sdk | ide | exec | app | unknown
  string origin = 13;
  string cli_version = 14;
  // supported | newer | unknown | empty
  string format = 15;
  string parent_native_id = 16;
  bool subagent = 17;
  // Wartości podobne do sekretów w przeczytanych fragmentach (zostaną zamaskowane).
  uint32 flagged_secrets = 18;
  string git_branch = 19;
  ImportSnapshot snapshot = 20;
  bool archived = 21;
}

message ImportScan {
  repeated ImportRoot roots = 1;
  repeated ImportThreadSummary threads = 2;
  // Limit liczby wątków albo czasu skanu został osiągnięty.
  bool truncated = 3;
  // Plików, których nie dało się odczytać.
  uint32 skipped = 4;
  // Ustawienia i biblioteka CLI (cli_import_library_v1); starszy worker zostawia puste.
  repeated ImportLibraryItem library = 5;
}

// ---------- Ustawienia i biblioteka (stos B, capability cli_import_library_v1) ----------

// Ustawienie, dokument instrukcji, skill albo inna pozycja konfiguracji CLI. Bez sekretów: wartość
// ustawienia to nazwa modelu albo tryb uprawnień, treść dokumentu czyta dopiero ReadImportLibraryItem.
message ImportLibraryItem {
  // Podpisany przez workera; wskazuje wyłącznie stałe miejsca konfiguracji CLI w jego katalogu.
  string source_key = 1;
  string agent_cli = 2;
  string root_id = 3;
  // setting | instruction | skill | command | marketplace | plugin | connector
  string kind = 4;
  // Stała nazwa w katalogu CLI: model, permissions, CLAUDE.md, AGENTS.md.
  string name = 5;
  // setting: wartość w Canopy (id modelu; ask | accept_edits | read_only | full_auto); pusta, gdy brak odpowiednika.
  string value = 6;
  // Co zapisało CLI (np. bypassPermissions albo nazwa pliku); do wyświetlenia.
  string detail = 7;
  // sha256 treści (dokument) albo wartości (ustawienie).
  string digest = 8;
  uint64 bytes = 9;
  // Pusty = można importować; inaczej jednozdaniowy powód.
  string reason = 10;
  repeated string warnings = 11;
  // skill, command: liczba plików; marketplace, plugin: źródło (owner/repo, URL) i wersja albo commit.
  uint32 files = 12;
  string source = 13;
  string version = 14;
  // connector: http | sse, i miejsca na sekrety (nazwy i rodzaj, nigdy wartości).
  string transport = 15;
  repeated ImportSecretSlot slots = 16;
}

// Nagłówek serwera MCP, który niesie sekret. Wartość zostaje na workerze, dopóki właściciel jej nie wybierze.
message ImportSecretSlot {
  // Nazwa nagłówka (Authorization dla bearer).
  string name = 1;
  // literal: wartość jest w pliku CLI; env: plik wskazuje zmienną środowiskową (nigdy odczytywaną).
  string kind = 2;
  // Zmienna środowiskowa przy env (do wyświetlenia).
  string variable = 3;
}

// Wartość jednego nagłówka z wartością w pliku, tylko na potwierdzenie właściciela (jednorazowy token gatewaya).
// Nietrwała: nigdy z outboxa ani journala.
message ReadImportSecret {
  string source_key = 1;
  string slot = 2;
  string confirmation = 3;
  string digest = 4;
}

message ImportSecretValue {
  // Token z żądania: gateway sprawdza go i zużywa.
  string confirmation = 1;
  string value = 2;
}

// Treść jednej pozycji biblioteki, po maskowaniu sekretów. digest z ImportLibraryItem: zmieniony plik = błąd.
message ReadImportLibraryItem {
  string source_key = 1;
  string digest = 2;
}

message ImportLibraryContent {
  string text = 1;
  string digest = 2;
  // skill, command: pliki skilla (komenda jako wygenerowany SKILL.md), tekst zamaskowany.
  repeated SkillFile files = 3;
}

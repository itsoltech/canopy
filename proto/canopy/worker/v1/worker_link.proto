// Kontrakt gateway <-> worker (v1, przed pierwszym wydaniem).
// Opis semantyki: docs/protocol.md
syntax = "proto3";

package canopy.worker.v1;

import "google/protobuf/timestamp.proto";
import "canopy/worker/v1/agent_environment.proto";

// Jednorazowa rejestracja nowego workera tokenem z UI.
service WorkerEnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// Worker otwiera jeden długożyjący strumień i utrzymuje go.
// Komendy z gateway płyną w dół tym samym strumieniem.
service WorkerLinkService {
  // Authenticated reachability check; never replaces the active Connect stream.
  rpc ProbeNetworkRoute(ProbeNetworkRouteRequest) returns (ProbeNetworkRouteResponse);
  rpc Connect(stream WorkerMessage) returns (stream GatewayMessage);
}

// ---------- Enrollment ----------

message EnrollRequest {
  string enrollment_token = 1;
  HostInfo host = 2;
}

message EnrollResponse {
  string worker_id = 1;
  // Poświadczenie używane w metadanych Connect (authorization: Bearer ...).
  string worker_credential = 2;
}

message HostInfo {
  string hostname = 1;
  string os = 2;   // linux | darwin | windows
  string arch = 3; // x64 | arm64
  string worker_version = 4;
}

// ---------- Koperty ----------

message WorkerMessage {
  // Unikalne ID wiadomości (UUIDv7). Do logów i deduplikacji.
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    ThreadEvent thread_event = 12;
    CommandResult command_result = 13;
    InteractionRequest interaction_request = 14;
    AgentToolCall agent_tool_call = 15;
    BlobChunk blob_chunk = 16;
    ConfigApplied config_applied = 17;
    // Załączniki (docs/protocol.md#załączniki): worker pobiera bajty załącznika tury.
    FetchBlob fetch_blob = 18;
    // Modele, effort i steer (sekcja na końcu pliku).
    ModelCatalog model_catalog = 40;
    ThreadSecretReceipt thread_secret_receipt = 500;
    // CLI dostawców (sekcja na końcu pliku): wykrycie i postęp instalacji.
    CliToolsReport cli_tools = 800;
    CliInstallProgress cli_install_progress = 801;
    NetworkRouteStatus network_route_status = 802;
    AgentEnvironmentReport agent_environment = 820;
  }
}

message GatewayMessage {
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;

  oneof payload {
    Welcome welcome = 10;
    Command command = 11;
    EventAck event_ack = 12;
    InteractionResponse interaction_response = 13;
    AgentToolResult agent_tool_result = 14;
    Drain drain = 15;
    WorkerConfig config = 16;
    // Odpowiedź na FetchBlob: fragmenty bajtów (request_id) albo błąd.
    BlobChunk blob_chunk = 17;
    // Poufne: wyłącznie transport TLS, nigdy journal/outbox/logi.
    ThreadSecretDelivery thread_secret_delivery = 500;
    // Only sent to workers advertising "network_route_migration".
    NetworkRoutes network_routes = 802;
    AgentEnvironmentDesired agent_environment = 820;
  }
}

message NetworkRoutes {
  repeated string origins = 1;
  string fingerprint = 2; // full SHA-256, authenticated by the existing WorkerLink
}

message NetworkRouteStatus {
  string route = 1; // server | pinned | local
  string detail = 2; // safe diagnostic, no credentials
}

message ProbeNetworkRouteRequest { string worker_id = 1; }
message ProbeNetworkRouteResponse {}

message ThreadSecretDelivery {
  string request_id = 1;
  string thread_id = 2;
  uint32 revision = 3;
  string value = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool remove = 6;
  string cwd = 7;
}

message ThreadSecretReceipt {
  string request_id = 1;
  string thread_id = 2;
  uint32 revision = 3;
  string file = 4;
  bool applied = 5;
}

// ---------- Handshake ----------

message Hello {
  uint32 worker_link_protocol = 760;
  uint32 min_worker_link_protocol = 761;
  // Pola 4 (allowed_roots) i 6 (profiles) były lokalną konfiguracją; konfiguracja jest teraz zdalna (WorkerConfig).
  reserved 4, 6;
  reserved "allowed_roots", "profiles";

  string worker_id = 1;
  HostInfo host = 2;
  // Wykryte na urządzeniu CLI dostawców (zainstalowane, wersja), niezależnie od konfiguracji.
  repeated ProviderInfo providers = 3;
  // Wątki ze zdarzeniami w lokalnym dzienniku, z ostatnim journal_seq.
  repeated ThreadCursor threads = 5;
  WorkerState state = 7;
  // Funkcje obsługiwane przez tę wersję workera. Gateway nie wysyła komend spoza listy.
  repeated string capabilities = 8;
  // Identyfikator lokalnego dziennika, nowy przy każdym utworzeniu bazy dziennika.
  // Kursory journal_seq mają sens tylko w obrębie tego samego dziennika.
  string journal_id = 9;
  // Wersja konfiguracji z pamięci podręcznej workera. Gateway wysyła WorkerConfig, gdy jest inna.
  uint64 config_version = 10; // 0 = brak konfiguracji w pamięci
  // Tury, które ten proces workera prowadzi teraz. Gateway kończy tury `running` wątków tego workera,
  // których tu nie ma (np. po restarcie procesu workera), z powodem „worker restarted”.
  // Wiążące tylko z capability "running_turns" (starszy worker nie wysyła listy).
  repeated RunningTurn running_turns = 11;
  // Katalog załączników na urządzeniu (ścieżka absolutna, poza repozytoriami), np. <data_dir>/attachments.
  // Plik załącznika: <attachments_root>/<thread_id>/<attachment_id>/<nazwa>. Pusty = worker bez załączników.
  string attachments_root = 12;
  // Stała baza nowych rozmów No project: <data_dir>/scratch.
  string scratch_root = 13;
  string home_directory = 14;
  NetworkRouteStatus network_route_status = 15;
  string environment_kind = 820; // desktop | server; reported by the actual worker launch
  // Zarządzany korzeń worktree: <data_dir>/worktrees (capability "worktrees", docs/worktrees.md).
  string worktrees_root = 16;
}

message RunningTurn {
  string thread_id = 1;
  string turn_id = 2;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  WORKER_STATE_ACTIVE = 1;
  // Zatrzymanie łagodne: nowe tury są odrzucane (WORKER_DRAINING), bieżące się kończą.
  WORKER_STATE_DRAINING = 2;
}

enum ProviderProfileKind {
  PROVIDER_PROFILE_KIND_UNSPECIFIED = 0;
  // Logowanie CLI na urządzeniu (Claude Code / Codex), bez pośrednika.
  PROVIDER_PROFILE_KIND_NATIVE = 1;
  // Endpoint zgodny z API Anthropic/OpenAI pod jednym adresem: Claude <base>/v1/messages,
  // Codex <base>/v1/responses (np. CLIProxyAPI, https://github.com/router-for-me/CLIProxyAPI).
  PROVIDER_PROFILE_KIND_CLIPROXYAPI = 2;
}

// Stan profilu dostawcy po zastosowaniu konfiguracji (raport workera, bez sekretów).
message ProviderProfile {
  string id = 1;
  ProviderProfileKind kind = 2;
  // Dostawcy, którzy mogą użyć profilu.
  repeated Provider providers = 3;
  // Adres pośrednika, informacyjnie (bez poświadczeń). Pusty dla NATIVE.
  string endpoint = 4;
  bool available = 5;
  string detail = 6; // powód niedostępności, np. brak klucza
  // Nazwa nadana przez użytkownika (docs/worker-config.md, "Profile dostawców"); pusta = id.
  string display_name = 7;
  // Globalne instancje dostawców (docs/worker-config.md, sekcja 9): wersja CLI tej instancji (jej pliku
  // wykonywalnego) i sposób uwierzytelnienia, bez sekretów.
  string version = 8;
  // Np. "ChatGPT", "API key", "endpoint key", "device login"; pusty = nieznany.
  string auth = 9;
  // Instancja ma poświadczenia (logowanie, klucz); false + detail mówi, czego brakuje.
  bool authenticated = 10;
}

message ProviderInfo {
  Provider provider = 1;
  bool available = 2;     // np. czy CLI jest zainstalowane i zalogowane
  string version = 3;
  string detail = 4;      // powód niedostępności
}

message ThreadCursor {
  string thread_id = 1;
  uint64 last_seq = 2;
}

message Welcome {
  // Ostatni journal_seq zapisany w bazie, tylko dla Hello.journal_id. Worker dosyła wszystko powyżej.
  // Brak kursora = dosłanie całego dziennika (duplikaty odrzuca event_id).
  repeated ThreadCursor persisted = 1;
  uint32 heartbeat_interval_seconds = 2;
}

// ---------- Konfiguracja zdalna (docs/worker-config.md) ----------
// Cała konfiguracja workera pochodzi z gateway. Lokalnie worker zna tylko sposób połączenia z gateway.

message WorkerConfig {
  // Rośnie przy każdej zmianie. Worker potwierdza zastosowaną wersję w ConfigApplied.
  uint64 version = 1;
  // Pole historyczne: ignorowane. Katalogi ograniczają uprawnienia użytkownika OS.
  repeated string allowed_roots = 2 [deprecated = true];
  ProviderConfig claude = 3;
  ProviderConfig codex = 4;
  ProviderConfig grok = 640;
  repeated ProviderProfileConfig profiles = 5;
  NativeToolsConfig native_tools = 6;
  WorkerLimits limits = 7;
}

message ProviderConfig {
  bool enabled = 1;
  // Pusty = z PATH.
  string executable_path = 2;
  // Wymagana wersja CLI (np. "0.164.0"); pusta = dowolna. Niezgodność wyłącza dostawcę z czytelnym powodem.
  string required_version = 3;
  // Codex: logowanie właściciela urządzenia w izolowanym CODEX_HOME workera (docs/codex-adapter.md).
  DeviceLogin device_login = 4;
}

enum DeviceLogin {
  // Domyślnie: dowiąż logowanie CLI właściciela urządzenia (np. ~/.codex/auth.json), jeśli istnieje.
  DEVICE_LOGIN_UNSPECIFIED = 0;
  DEVICE_LOGIN_LINK = 1;
  // Bez logowania urządzenia, np. gdy worker korzysta tylko z CLIProxyAPI.
  DEVICE_LOGIN_NONE = 2;
}

message ProviderProfileConfig {
  string id = 1;
  ProviderProfileKind kind = 2;
  repeated Provider providers = 3;
  // CLIPROXYAPI: adres pośrednika, np. http://127.0.0.1:8317.
  string base_url = 4;
  // Sekret. Worker trzyma go tylko w pamięci (nigdy w pamięci podręcznej na dysku ani w logach).
  string api_key = 5;
  // Nazwa nadana przez użytkownika, tylko do wyświetlania.
  string display_name = 6;
  // Zmienne środowiskowe procesu harnessu tego profilu (Claude Code per tura, Codex: osobny app-server).
  // Nazwy z listy zakazanych (docs/worker-config.md) wyłączają profil.
  repeated ProfileEnvVar env = 7;
  // Wyłączony przez użytkownika: niedostępny dla nowych tur (raport: available = false, detail "disabled").
  bool disabled = 8;

  // Globalne instancje dostawców (docs/worker-config.md, sekcja 9). Profil z jednym dostawcą jest instancją
  // (dostawca + id); to samo id może mieć osobny profil dla drugiego dostawcy.
  // Plik wykonywalny harnessu tej instancji; pusty = ProviderConfig.executable_path albo PATH.
  string executable_path = 9;
  // Katalog domowy właściciela urządzenia, z którego worker dowiązuje logowanie CLI (CODEX_HOME / CLAUDE_CONFIG_DIR);
  // pusty = środowisko procesu workera, inaczej ~/.codex / ~/.claude.
  string home_path = 10;
  // Izolowany katalog domowy, z którym działa harness (stan, sesje, logowanie); pusty = <data_dir>/codex-home
  // albo claude-home (wspólny dla instancji bez własnych ustawień uruchomienia).
  string shadow_home_path = 11;
  // Dodatkowe argumenty uruchomienia harnessu (Codex: po `app-server`, Claude: flagi Claude Code).
  repeated string launch_args = 12;
  // Własne logowanie instancji w jej izolowanym katalogu (np. ChatGPT przez StartLogin), bez dowiązania
  // logowania właściciela urządzenia.
  bool own_login = 13;
  // Public transport options; keys remain in api_key, never in headers or argv.
  ProxyCodexOptions proxy_codex = 14;
}

message ProxyCodexOptions {
  // Current Codex supports responses. Empty uses that default.
  string wire_api = 1;
  bool supports_websockets = 2;
  map<string, string> extra_headers = 3;
}

message ProfileEnvVar {
  string name = 1;
  // Sekret (secret = true): tylko w pamięci workera, nigdy w logach ani raportach.
  string value = 2;
  bool secret = 3;
}

message NativeToolsConfig {
  // Domyślne dla wątków; ThreadSpec może nadpisać per wątek.
  bool subagents = 1;
  bool scheduling = 2;
  // Konektory konta właściciela urządzenia (Codex apps: aplikacje połączone z kontem ChatGPT). Domyślnie wyłączone.
  bool connectors = 3;
}

message WorkerLimits {
  uint32 max_running_turns = 1;
  uint32 max_background_tasks = 2;
  uint32 drain_timeout_seconds = 3;
  uint32 idle_unload_seconds = 4;
}

message ConfigIssue {
  string path = 1;       // np. profiles[cliproxy].base_url
  string message = 2;
  // fatal: konfiguracja odrzucona, worker zostaje przy poprzedniej.
  bool fatal = 3;
}

message ConfigApplied {
  uint64 version = 1;
  bool applied = 2;
  repeated ConfigIssue issues = 3;
  repeated ProviderProfile profiles = 4;
  repeated ProviderInfo providers = 5;
}

message Heartbeat {
  uint32 running_turns = 1;
  WorkerState state = 2;
  uint32 background_tasks = 3;
  uint32 pending_interactions = 4;
}

// Instancja gateway kończy pracę (aktualizacja, skalowanie). Worker zamyka strumień
// i łączy się ponownie po reconnect_after_ms (zawiera już jitter), zwykle z inną instancją.
message Drain {
  uint32 reconnect_after_ms = 1;
  string reason = 2;
}

// ---------- Komendy gateway -> worker ----------

message Command {
  // Idempotencja: worker pamięta przetworzone command_id i ich wyniki.
  string command_id = 1;

  oneof kind {
    CreateThread create_thread = 10;
    StartTurn start_turn = 11;
    InterruptTurn interrupt_turn = 12;
    UnloadThread unload_thread = 13;
    ListDirectory list_directory = 14;
    SteerTurn steer_turn = 15;
    StopTask stop_task = 16;
    BackgroundItem background_item = 17;
    SetGoal set_goal = 18;
    // Modele, effort i steer (sekcja na końcu pliku).
    ListModels list_models = 40;
    // Globalne instancje dostawców (sekcja na końcu pliku).
    ProbeProviders probe_providers = 41;
    StartLogin start_login = 42;
    // Wzmianki w kompozytorze (sekcja na końcu pliku).
    ListMentionCatalog list_mention_catalog = 140;
    SearchFiles search_files = 141;
    // Nietrwałe zapytanie: bez wątku platformy, outboxa ani journala.
    GenerateText generate_text = 200;
    // Git worktrees (capability "worktrees", docs/worktrees.md). Nietrwałe: nigdy z outboxa.
    ListGitRefs list_git_refs = 210;
    CreateWorktree create_worktree = 211;
    RenameWorktreeBranch rename_worktree_branch = 212;
    ScanWorktrees scan_worktrees = 213;
    RemoveWorktree remove_worktree = 214;
    WorktreeTarget reveal_worktree = 215;
    // CLI dostawców (sekcja na końcu pliku). Nietrwała: nigdy z outboxa.
    InstallCli install_cli = 800;
  }
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_CLAUDE = 1;
  PROVIDER_CODEX = 2;
  PROVIDER_GROK = 3;
}

enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  PERMISSION_MODE_ASK = 1;          // każde ryzykowne narzędzie wymaga decyzji z UI
  PERMISSION_MODE_ACCEPT_EDITS = 2; // edycje plików bez pytania, reszta pyta
  PERMISSION_MODE_READ_ONLY = 3;
  PERMISSION_MODE_FULL_AUTO = 4;    // tylko świadomie, per agent
}

// Pełny opis wątku. Gateway (baza) jest źródłem prawdy i wysyła go w każdej komendzie,
// więc worker może odtworzyć wątek nawet po utracie lokalnego stanu (docs/threads.md).
message ThreadSpec {
  // Katalog bez poświadczeń. Wykonanie zawsze autoryzuje gateway.
  repeated ConnectorTool connector_tools = 520;
  // Utwórz zarządzany katalog scratch przed uruchomieniem harnessu.
  bool scratch = 410;
  string thread_id = 1;
  Provider provider = 2;
  // ProviderProfile.id z Hello. Pusty oznacza profil natywny.
  string provider_profile_id = 3;
  string cwd = 4;
  string model = 5;
  string instructions = 6;
  PermissionMode permission_mode = 7;
  // Czy udostępnić narzędzia szyny agentów (spawn_thread, send_message, wait_threads, ...; docs/agent-bus.md).
  bool enable_agent_bus = 8;
  // Ustawienia specyficzne dla dostawcy, JSON.
  string provider_options_json = 9;
  // Claude session id / Codex thread id. Pusty, dopóki dostawca nie utworzył wątku (THREAD_READY).
  string provider_thread_id = 10;
  // Natywni subagenci dostawcy (Claude Agent/Workflow, Codex multi_agent). Domyślnie wyłączeni:
  // delegowanie idzie przez szynę agentów jako wątki boczne.
  bool native_subagents = 11;
  // Natywny harmonogram dostawcy (Claude ScheduleWakeup/Cron*/RemoteTrigger, Codex automations/sleep).
  // Domyślnie wyłączony: zastępują go narzędzia schedule_* platformy.
  bool native_scheduling = 12;
  // Poziom wątku: 0 = główny (orkiestrator), 1 = boczny. Wyznacza zestaw narzędzi szyny (agentBusToolsFor).
  uint32 depth = 13;
}

message ConnectorTool {
  string account_id = 1;
  string connector_type = 2;
  string account_name = 3;
  string name = 4;
  string remote_name = 5;
  string description = 6;
  string input_schema_json = 7;
  bool read_only = 8;
}

// Dziedziczenie historii (fork) z wątku w tym samym drzewie, na tym samym workerze.
message ForkSpec {
  string source_thread_id = 1;
  string source_provider_thread_id = 2;
  // Zakończona tura źródła, do której (włącznie) dziedziczymy historię.
  string after_turn_id = 3;
  // Punkt forka u dostawcy: Codex id tury, Claude uuid wiadomości kończącej turę.
  string after_provider_turn_ref = 4;
}

// Tworzy wątek u dostawcy (Codex thread/start lub thread/fork, Claude forkSession lub nowa sesja).
// Wynik: zdarzenie THREAD_READY z provider_thread_id.
message CreateThread {
  ThreadSpec thread = 1;
  ForkSpec fork = 2; // nieustawione = wątek bez historii
}

// Nowa tura. Worker w razie potrzeby wznawia wątek (resume) na podstawie ThreadSpec.
// Idempotentne po turn_id: ponowione dostarczenie nie uruchamia tury drugi raz.
message StartTurn {
  ThreadSpec thread = 1;
  string turn_id = 2;
  UserInput input = 3;
  // Model i wysiłek rozumowania tej tury: nadpisanie z wiadomości albo domyślne wątku (gateway rozstrzyga).
  // Puste = domyślne profilu (Codex: domyślny model katalogu, Claude: domyślny Claude Code).
  string model = 40;
  string effort = 41;
  // Tryb uprawnień tej tury: nadpisanie z wiadomości albo domyślny wątku (gateway rozstrzyga; zawsze ustawiony).
  // UNSPECIFIED = thread.permission_mode (starszy gateway). Zgody czekające w turze w toku się nie zmieniają.
  PermissionMode permission_mode = 42;
}

message UserInput {
  string text = 1;
  // Autor wiadomości: użytkownik albo inny agent (szyna agentów).
  string author_user_id = 2;
  string author_agent_id = 3;
  // Pliki dołączone do wiadomości. Tekst zawiera już notatkę platformy z ich ścieżkami; worker zapisuje
  // każdy plik pod path (pobiera bajty przez FetchBlob, sprawdza sha256) przed przekazaniem tury dostawcy.
  repeated InputAttachment attachments = 4;
  // Wzmianki w tekście (numery od 140, docs/protocol.md#wzmianki): komendy, skille, pluginy, pliki, wątki.
  // Zakresy dotyczą tego tekstu (już z notatką platformy i przepisaniem dla dostawcy, które zrobił gateway).
  // Codex dostaje z nich text_elements oraz itemy skill / mention / localImage; Claude sam tekst.
  repeated Mention mentions = 140;
}

message InputAttachment {
  string attachment_id = 1;
  string sha256 = 2;
  uint64 size_bytes = 3;
  string mime_type = 4;
  string name = 5;
  // Ścieżka absolutna na workerze: <attachments_root>/<thread_id>/<attachment_id>/<name>.
  string path = 6;
  // image | file
  string kind = 7;
}

// Prośba workera o bajty załącznika wątku (UserInput.attachments). Gateway odpowiada fragmentami BlobChunk
// z tym samym request_id; tylko załączniki wątków tego workera.
message FetchBlob {
  string request_id = 1;
  string thread_id = 2;
  string sha256 = 3;
}

// Przerywa tylko turę. Zadania w tle działają dalej (zatrzymuje je StopTask).
message InterruptTurn {
  string thread_id = 1;
  string turn_id = 2;
}

// Dołącza wejście do tury w toku (Claude: wiadomość w strumieniu wejścia, Codex: turn/steer)
// zamiast kolejkować je jako następną turę. ok = dostawca przyjął wejście do tury; miejsce, w którym weszło,
// to item user_message z client_id = input_id. Tura już się skończyła albo dostawca odmówił: ok = false,
// error_code STEER_NOT_RUNNING / STEER_REJECTED (gateway kolejkuje wiadomość jako następną turę).
// Przyjęte, ale tura skończyła się bez niego (Claude): Notice code = steer_dropped, data_json {"input_id"}.
message SteerTurn {
  string thread_id = 1;
  string turn_id = 2;
  string input_id = 3;   // idempotencja
  UserInput input = 4;
}

// Zatrzymuje jedno zadanie w tle albo subagenta w tle (Claude stopTask, Codex thread/backgroundTerminals/terminate).
// task_id = BackgroundTask.task_id. Zadanie kończy się itemem INTERRUPTED (stop_reason = stopped_by_user).
message StopTask {
  string thread_id = 1;
  string task_id = 2;
}

enum GoalDirective {
  GOAL_DIRECTIVE_UNSPECIFIED = 0;
  GOAL_DIRECTIVE_RUN = 1;       // ustaw (z objective) albo wznów (bez objective) cel: Codex status active
  GOAL_DIRECTIVE_PAUSE = 2;     // zatrzymaj kontynuację, zachowaj cel: Codex paused (tura w toku kończy się normalnie)
  GOAL_DIRECTIVE_COMPLETE = 3;  // użytkownik uznał cel za osiągnięty: Codex complete
  GOAL_DIRECTIVE_CLEAR = 4;     // usuń cel: Codex thread/goal/clear
}

// Cel harnessu ustawiany z UI (docs/goals.md). Silnikiem jest harness; platforma go śledzi.
// Tylko Codex (thread/goal/*). Claude steruje celem komendą /goal w strumieniu wejścia, więc gateway
// wysyła ją jako zwykłą turę (trigger = goal), nie jako SetGoal.
message SetGoal {
  reserved 4;
  reserved "condition"; // warunek ewaluatora silnika platformy (porzucony)
  string thread_id = 1;
  string goal_id = 2;
  string objective = 3;
  GoalDirective directive = 5;
  // Budżet tokenów harnessu (Codex tokenBudget). 0 = bez limitu.
  uint64 native_token_budget = 6;
  // Do wznowienia wątku, którego proces dostawcy jeszcze nie załadował (np. po restarcie workera).
  ThreadSpec thread = 7;
}

// Przenosi pracę pierwszoplanową do tła (Claude backgroundTasks(toolUseId), odpowiednik Ctrl+B).
// Pusty item_id = cała praca pierwszoplanowa bieżącej tury.
message BackgroundItem {
  string thread_id = 1;
  string item_id = 2;
}

// Zwalnia zasoby wątku na workerze (proces dostawcy). Historia zostaje; StartTurn go wznowi.
message UnloadThread {
  string thread_id = 1;
}

message ListDirectory {
  string path = 1; // absolutny istniejący katalog; pusty = katalog domowy workera
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string error_code = 3;
  string error_message = 4;
  // Wynik ListDirectory i podobnych komend zapytań.
  repeated DirectoryEntry entries = 5;
  // Rzeczywista ścieżka listowanego katalogu (także dla pustego ListDirectory.path).
  string directory_path = 6;
  // Wynik ListModels.
  repeated ProfileModels models = 40;
  // Wynik StartLogin.
  LoginStarted login = 41;
  // Wynik ListMentionCatalog i SearchFiles.
  MentionCatalog mention_catalog = 140;
  FileSearchResult file_search = 141;
  string generated_text = 200;
  // Wynik ListGitRefs.
  GitRefs git_refs = 210;
  // Wynik CreateWorktree i RenameWorktreeBranch.
  WorktreeInfo worktree = 211;
  repeated WorktreeStatus worktree_statuses = 213;
  bool worktree_branch_deleted = 214;
}

message GenerateText {
  Provider provider = 1;
  string profile_id = 2;
  string model = 3;
  string effort = 4;
  string prompt = 5;
}

message DirectoryEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_git_repo = 3;
}

// ---------- Transkrypt worker -> gateway ----------
// Model zdarzeń i itemów: docs/transcript.md. Zasada: nic nie ginie. Każde zdarzenie dostawcy,
// także między turami i bez mapowania, trafia do gateway (co najmniej jako raw_json).

message ThreadEvent {
  string thread_id = 1;
  // Kolejność w dzienniku workera, rośnie w obrębie wątku. Służy tylko do EventAck.
  // Kolejność na osi czasu wątku (seq) nadaje gateway przy zapisie.
  uint64 journal_seq = 2;
  // UUIDv7 nadany przy powstaniu zdarzenia. Klucz idempotencji w bazie.
  string event_id = 3;
  // Tura, w której powstało zdarzenie. Pusty między turami (np. zadania w tle, kompaktowanie).
  string turn_id = 4;
  google.protobuf.Timestamp occurred_at = 5;

  oneof body {
    ThreadReady thread_ready = 10;
    TurnStarted turn_started = 11;
    TurnFinished turn_finished = 12;
    ItemStarted item_started = 13;
    ItemDelta item_delta = 14;
    ItemCompleted item_completed = 15;
    ThreadActivity activity = 16;
    UsageUpdated usage_updated = 17;
    Notice notice = 18;
    GoalState goal_state = 19;
  }

  // Oryginalne zdarzenie dostawcy (JSON). Zawsze ustawione dla zdarzeń dostawcy;
  // gdy body jest puste, zdarzenie nie ma jeszcze mapowania, ale zostaje zapisane.
  string raw_json = 30;
}

message EventAck {
  string thread_id = 1;
  // Wszystkie zdarzenia z journal_seq <= ack_seq są zapisane w bazie.
  uint64 ack_seq = 2;
}

message ThreadReady {
  // Claude session id / Codex thread id.
  string provider_thread_id = 1;
  // Wątek dostawcy, który ten zastępuje (Codex: wątek bez żadnej tury nie ma rolloutu i po restarcie
  // nie da się go wznowić, więc worker zaczyna nowy). Gateway podmienia provider_thread_id tylko wtedy,
  // gdy zapisany jest właśnie ten.
  string replaces_provider_thread_id = 2;
}

// Skąd worker wie o turze. Wyzwalacz z punktu widzenia platformy (użytkownik, szyna agentów,
// harmonogram, interakcja) zna gateway i zapisuje go w turns.trigger; worker widzi wtedy po prostu StartTurn.
enum TurnOrigin {
  TURN_ORIGIN_UNSPECIFIED = 0;
  // Tura z komendy StartTurn (turn_id nadał gateway).
  TURN_ORIGIN_COMMAND = 1;
  reserved 2;
  // Turę rozpoczął dostawca, np. po zakończeniu zadania w tle (Claude: tura „meta” po task_notification).
  // turn_id nadaje worker.
  TURN_ORIGIN_PROVIDER = 3;
  // Automatyczne wznowienie tury przerwanej restartem lub drain (Claude: resume_reason). turn_id nadaje worker.
  TURN_ORIGIN_RECOVERY = 4;
}

message TurnStarted {
  string provider_turn_ref = 1;
  string model = 2;
  TurnOrigin origin = 3;
  // Dla TURN_ORIGIN_RECOVERY: przerwana tura, którą ta kontynuuje.
  string resumes_turn_id = 4;
  string resume_reason = 5;
}

// Trzy stany końcowe tury (docs/durability.md, „Stany tury i wątku”). Wątek zostaje używalny po każdym z nich.
enum TurnOutcome {
  TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  TURN_OUTCOME_INTERRUPTED = 2;
  TURN_OUTCOME_FAILED = 3;
}

// Kto przerwał turę (INTERRUPTED) albo skąd przyszedł błąd (FAILED).
enum TurnEndSource {
  TURN_END_SOURCE_UNSPECIFIED = 0;
  // INTERRUPTED: ktoś poprosił o przerwanie przez platformę (użytkownik, agent rodzica przez szynę).
  TURN_END_SOURCE_USER = 1;
  // INTERRUPTED: zdarzenie systemowe (restart workera w trakcie tury, drain, harness zginął z naszego powodu).
  TURN_END_SOURCE_SYSTEM = 2;
  // FAILED: błąd po naszej stronie (gateway, worker, adapter, dziennik, utracone połączenie).
  TURN_END_SOURCE_PLATFORM = 3;
  // FAILED: harness zgłosił błąd (401, limit, błąd modelu, proces harnessu zakończył się błędem).
  TURN_END_SOURCE_HARNESS = 4;
}

message TurnFinished {
  TurnOutcome outcome = 1;
  // Punkt forka u dostawcy: Codex id tury, Claude uuid wiadomości kończącej turę.
  string provider_turn_ref = 2;
  Usage usage = 3;
  // Powód przerwania (np. „worker restarted mid-turn”) albo dokładny komunikat błędu.
  string reason = 4;
  // Źródło przerwania albo błędu; UNSPECIFIED od starszego workera (gateway zgaduje: przerwanie = user, błąd = harness).
  TurnEndSource source = 5;
  // Krótki kod błędu, jeśli jest (np. Codex codexErrorInfo „http_connection_failed:401”, Claude subtype „error_max_turns”,
  // „process_exit”, „transcript”).
  string error_code = 6;
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_CREATING = 1;
  THREAD_STATUS_IDLE = 2;
  THREAD_STATUS_RUNNING = 3;
  THREAD_STATUS_WAITING_INPUT = 4;   // czeka na odpowiedź użytkownika (zgoda, pytanie, elicitation)
  THREAD_STATUS_INTERRUPTED = 5;
  THREAD_STATUS_FAILED = 6;
}

// Pełny obraz aktywności wątku. Wątek jest zajęty, gdy trwa tura, zadanie w tle
// albo czeka interakcja. Tylko bezczynny wątek wolno zwolnić (UnloadThread) bez strat.
message ThreadActivity {
  ThreadStatus status = 1;
  string running_turn_id = 2;
  repeated string background_task_ids = 3;
  repeated string pending_interaction_ids = 4;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cached_input_tokens = 3;
  double cost_usd = 4;
  uint64 context_window_tokens = 5;
}

message UsageUpdated {
  Usage usage = 1;
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_WARNING = 2;
  NOTICE_LEVEL_ERROR = 3;
}

// Stan celu harnessu: Codex thread/goal/updated|cleared; Claude: wynik komendy /goal (lokalna odpowiedź
// „Goal set: …” / „Goal cleared: …”) i werdykty ewaluatora (goal_status w transkrypcie sesji), active_goal.
message GoalState {
  // Cel platformy rozpoznaje gateway (tura celu, treść), nie worker; pochodzenie celu też (created_by).
  reserved 1, 2;
  reserved "goal_id", "origin";
  // Codex: active | paused | blocked | usageLimited | budgetLimited | complete;
  // Claude: active (ustawiony albo niespełniony po ocenie) | met | failed (niemożliwy) | cleared.
  string native_status = 3;
  string objective = 4;
  string condition = 5;
  uint64 tokens_used = 6;
  uint64 time_used_seconds = 7;
  uint32 iterations = 8;        // Claude: iteracje ewaluatora
  string last_reason = 9;       // Claude: werdykt ewaluatora (dlaczego spełniony albo jeszcze nie)
  bool cleared = 10;
  uint64 token_budget = 11;     // Codex tokenBudget; 0 = bez limitu
}

// Zdarzenie informacyjne bez własnego itemu: limit zapytań, ponowienie API, hook,
// restart workera, drain, zmiana modelu, błąd dostawcy poza turą.
message Notice {
  NoticeLevel level = 1;
  string code = 2;      // np. rate_limit, api_retry, hook, worker_restart, drain, provider_error
  string message = 3;
  string data_json = 4;
}

// ---------- Itemy ----------

message ItemStarted {
  Item item = 1;
}

message ItemCompleted {
  // Pełny, końcowy stan itemu. Zastępuje to, co złożono z delt.
  Item item = 1;
}

enum ItemDeltaField {
  ITEM_DELTA_FIELD_UNSPECIFIED = 0;
  ITEM_DELTA_FIELD_TEXT = 1;       // agent_message.text, reasoning.text
  ITEM_DELTA_FIELD_SUMMARY = 2;    // reasoning.summary
  ITEM_DELTA_FIELD_OUTPUT = 3;     // command_execution.output, tool_call.output, background_task.output
}

message ItemDelta {
  string item_id = 1;
  ItemDeltaField field = 2;
  string chunk = 3;
}

enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_IN_PROGRESS = 1;
  ITEM_STATUS_COMPLETED = 2;
  ITEM_STATUS_FAILED = 3;
  ITEM_STATUS_DECLINED = 4;      // odmowa zgody
  ITEM_STATUS_INTERRUPTED = 5;
}

// Jeden element osi czasu wątku. item_id jest stabilny między started, delta i completed.
message Item {
  // Codex: item.id; Claude: tool_use_id, uuid wiadomości albo task_id.
  string item_id = 1;
  // Zagnieżdżenie, np. itemy subagenta (Claude parent_tool_use_id, Codex subAgentActivity).
  string parent_item_id = 2;
  ItemStatus status = 3;

  oneof content {
    UserMessage user_message = 10;
    AgentMessage agent_message = 11;
    Reasoning reasoning = 12;
    CommandExecution command_execution = 13;
    FileChange file_change = 14;
    ToolCall tool_call = 15;
    WebSearch web_search = 16;
    Plan plan = 17;
    TodoList todo_list = 18;
    Subagent subagent = 19;
    BackgroundTask background_task = 20;
    AgentBusCall agent_bus_call = 21;
    Image image = 22;
    ContextCompaction context_compaction = 23;
    InteractionPrompt interaction_prompt = 24;
    // Typ dostawcy bez dedykowanego mapowania. Dane są pełne, UI pokazuje widok ogólny.
    ProviderItem provider_item = 30;
  }
}

// Treść większa niż limit wiadomości trafia do blobu (BlobChunk) i jest wskazywana przez BlobRef.
// Nic nie jest przycinane.
message BlobRef {
  string sha256 = 1;
  uint64 size_bytes = 2;
  string mime_type = 3;
}

message UserMessage {
  string text = 1;
  repeated BlobRef attachments = 2;
  string author_user_id = 3;
  string author_agent_id = 4;
  // Identyfikator wejścia po stronie platformy: turn_id dla wejścia tury, SteerTurn.input_id dla wiadomości
  // dołączonej do tury w toku (UI łączy ją z jej SendMessage). Pusty, gdy dostawca go nie zna.
  string client_id = 40;
  // Wzmianki w tekście wiadomości (zakresy w text), żeby UI pokazało je jako chipy.
  repeated Mention mentions = 140;
}

message AgentMessage {
  string text = 1;
  // commentary (komentarz w trakcie pracy) | partial_answer | final_answer; pusty, gdy dostawca nie rozróżnia.
  string phase = 2;
}

message Reasoning {
  string text = 1;
  string summary = 2;
}

message CommandExecution {
  string command = 1;
  string cwd = 2;
  optional int32 exit_code = 3;
  string output = 4;
  BlobRef output_blob = 5;
  uint64 duration_ms = 6;
}

message FileChange {
  repeated FileChangeEntry changes = 1;
}

message FileChangeEntry {
  string path = 1;
  string kind = 2;   // add | update | delete | move
  string diff = 3;
  BlobRef diff_blob = 4;
  string move_path = 5;
}

// Narzędzie ogólne: Claude (Read, Grep, Edit, ...), MCP, narzędzia dynamiczne Codexa.
message ToolCall {
  string connector_account_id = 520;
  string connector_type = 521;
  string connector_account_name = 522;
  string server = 1;   // serwer MCP; pusty dla wbudowanych
  string name = 2;
  string input_json = 3;
  string output = 4;
  BlobRef output_blob = 5;
  bool is_error = 6;
  // Obrazy w wyniku narzędzia (Claude Read na pliku obrazu, obrazy z MCP): podglądy wysłane przez workera.
  repeated BlobRef images = 7;
}

message WebSearch {
  string query = 1;
  string results_json = 2;
}

message Plan {
  string text = 1;
  repeated PlanStep steps = 2;
}

message PlanStep {
  string text = 1;
  string status = 2;   // pending | in_progress | completed
}

message TodoList {
  repeated TodoItem items = 1;
}

message TodoItem {
  string text = 1;
  string status = 2;
}

// Postęp długiej pracy (subagent, zadanie w tle).
message TaskProgress {
  uint64 total_tokens = 1;
  uint32 tool_uses = 2;
  uint64 duration_ms = 3;
  string last_tool_name = 4;
  string summary = 5;
}

// Subagent dostawcy (Claude Task / Agent, Codex collab spawnAgent). Jego itemy mają parent_item_id = item_id.
// To wewnętrzna praca dostawcy w tym samym wątku, nie wątek boczny platformy.
message Subagent {
  string agent_type = 1;
  string description = 2;
  string prompt = 3;
  string result = 4;
  string model = 5;
  // Codex: wątek subagenta u dostawcy (receiverThreadIds / agentThreadId). Worker mapuje jego zdarzenia tutaj.
  string provider_thread_id = 6;
  // Subagent działa w tle i może skończyć po zakończeniu tury.
  bool background = 7;
  string task_id = 8;
  TaskProgress progress = 9;
}

enum BackgroundTaskKind {
  BACKGROUND_TASK_KIND_UNSPECIFIED = 0;
  BACKGROUND_TASK_KIND_SHELL = 1;      // Claude background Bash
  BACKGROUND_TASK_KIND_AGENT = 2;      // subagent w tle (szczegóły w itemie subagent)
  BACKGROUND_TASK_KIND_WORKFLOW = 3;   // Claude workflow
  BACKGROUND_TASK_KIND_PROCESS = 4;    // Codex unified exec: proces żyjący między wywołaniami narzędzi
}

// Praca, która trwa niezależnie od tury i może emitować zdarzenia po jej zakończeniu.
// Status itemu: IN_PROGRESS, COMPLETED, FAILED, INTERRUPTED (stop użytkownika, drain, restart).
message BackgroundTask {
  string task_id = 1;
  string description = 2;
  // Output strumieniowany deltami; po zakończeniu pełny output jako blob (Claude: plik output_file).
  string output = 3;
  BlobRef output_blob = 4;
  BackgroundTaskKind kind = 5;
  // Tura, w której zadanie powstało (może już być zakończona).
  string started_in_turn_id = 6;
  string parent_task_id = 7;
  string command = 8;
  string process_id = 9;
  TaskProgress progress = 10;
  // Powód zakończenia innego niż sukces: stopped_by_user, stopped, drain, limit, error,
  // worker_shutdown (worker zatrzymany łagodnie: restart, wdrożenie), worker_lost (proces workera zginął bez
  // zapisu zatrzymania: awaria, kill -9), worker_restart (runtime dostawcy uruchomiony od nowa: zmiana ustawień
  // albo jego proces się zakończył). Słowa dla ludzi i modeli: packages/domain/src/background-tasks.ts.
  string stop_reason = 11;
  // Item, który uruchomił zadanie (Codex commandExecution, Claude tool_use Bash).
  string source_item_id = 12;
  // Numery od 230: kiedy zadanie zaczęło się i skończyło. Worker ustawia je przy zdarzeniach zadania (także przy
  // zamknięciu przez restart workera: chwila zamknięcia); gateway uzupełnia brakujące czasem zdarzenia.
  google.protobuf.Timestamp started_at = 230;
  google.protobuf.Timestamp ended_at = 231;
  // Kod wyjścia procesu, gdy jest znany (Codex unified exec).
  optional int32 exit_code = 232;
}

// Wywołanie narzędzia szyny agentów (spawn_thread, send_message, wait_threads, ...).
// Tworzy je worker przy AgentToolCall, kończy przy AgentToolResult.
message AgentBusCall {
  string call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
  string result_json = 4;
  bool is_error = 5;
  // spawn_thread / send_message: wątek i tura, które wywołanie uruchomiło (link w UI).
  string target_thread_id = 6;
  string target_turn_id = 7;
}

// Obraz, który agent obejrzał albo wygenerował. blob = podgląd tego, co widział model (worker zmniejsza,
// koduje na nowo bez metadanych i wysyła BlobChunk przed zdarzeniem).
message Image {
  BlobRef blob = 1;
  string path = 2;
  string prompt = 3;
  // view_image (narzędzie platformy) | native (Codex view_image) | generated
  string source = 4;
  // Wymiary podglądu (blob) i oryginału.
  uint32 width = 5;
  uint32 height = 6;
  uint32 original_width = 7;
  uint32 original_height = 8;
  // Powód, dla którego obrazu nie ma (np. ścieżka poza dozwolonymi katalogami).
  string detail = 9;
}

message ContextCompaction {
  string summary = 1;
}

// Interakcja z użytkownikiem na osi czasu. Tworzy ją gateway po InteractionRequest, kończy po odpowiedzi.
message InteractionPrompt {
  string request_id = 1;
  InteractionKind kind = 2;
  string tool_name = 3;
  string request_json = 4;
  string response_json = 5;
  string answered_by_user_id = 6;
  // allowed / declined / answered / expired / cancelled
  string outcome = 7;
  // human | parent: kto miał odpowiedzieć (threads.interaction_route).
  string routed_to = 8;
  // Gdy odpowiedział agent wątku nadrzędnego (answer_interaction).
  string answered_by_thread_id = 9;
  bool asynchronous = 250;
}

message ProviderItem {
  string type = 1;
  string json = 2;
}

// Fragment dużej treści. Gateway składa fragmenty, sprawdza sha256 i zapisuje blob,
// zanim przyjmie zdarzenie, które go wskazuje.
// Worker -> gateway: podgląd obrazu (Image.blob, ToolCall.images), przed zdarzeniem, które go wskazuje.
// Gateway -> worker: odpowiedź na FetchBlob (request_id); error = brak dostępu albo blobu (ostatni fragment).
message BlobChunk {
  string sha256 = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
  string mime_type = 5;
  string request_id = 6;
  string error = 7;
}

// ---------- Interakcje z użytkownikiem ----------
// Dostawca wstrzymuje pracę i czeka na człowieka: zgoda na narzędzie, pytanie, formularz MCP.
// Może pochodzić z tury, subagenta albo zadania w tle (item_id wskazuje miejsce na osi czasu).

enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  // Claude canUseTool; Codex item/commandExecution|fileChange|permissions/requestApproval.
  INTERACTION_KIND_PERMISSION = 1;
  // Claude AskUserQuestion / onUserDialog; Codex item/tool/requestUserInput.
  INTERACTION_KIND_QUESTION = 2;
  // MCP elicitation (oba).
  INTERACTION_KIND_ELICITATION = 3;
}

message InteractionRequest {
  string request_id = 1;
  string thread_id = 2;
  string turn_id = 3;          // pusty, gdy pyta zadanie w tle po turze
  string item_id = 4;          // narzędzie / subagent, którego dotyczy
  InteractionKind kind = 5;
  string tool_name = 6;
  // PERMISSION: wejście narzędzia; QUESTION: pytania i opcje; ELICITATION: schemat formularza.
  string request_json = 7;
}

message InteractionResponse {
  string request_id = 1;
  // PERMISSION
  bool allow = 2;
  bool allow_for_session = 3;    // Codex acceptForSession / Claude zasada na sesję
  string message = 4;            // powód odmowy przekazywany agentowi
  string updated_input_json = 5; // opcjonalnie zmodyfikowane wejście narzędzia
  // QUESTION / ELICITATION
  string answer_json = 6;
  // Odrzucenie bez odpowiedzi (anuluj pytanie lub formularz).
  bool cancelled = 7;
}

// ---------- Szyna agentów ----------

// Wywołanie narzędzia szyny przez model. Idempotentne po call_id: worker ponawia je po
// ponownym połączeniu, a gateway zwraca zapisany wynik zamiast wykonywać drugi raz.
message AgentToolCall {
  string connector_account_id = 520;
  string call_id = 1;
  string thread_id = 2;
  string turn_id = 3;          // pusty, gdy woła praca w tle po turze
  string item_id = 6;          // item narzędzia na osi czasu
  string tool_name = 4;        // nazwa z AGENT_BUS_TOOLS (packages/domain)
  string arguments_json = 5;
}

message AgentToolResult {
  string call_id = 1;
  bool is_error = 2;
  // Tekst dla modelu (wynik albo powód odmowy).
  string content = 3;
  // Ten sam wynik w formie strukturalnej, dla osi czasu i UI.
  string result_json = 4;
}

// ---------- Modele (docs/protocol.md#modele-effort-i-steer) ----------

// Model, który profil oferuje dla dostawcy.
message ModelInfo {
  // Wartość dla StartTurn.model / ThreadSpec.model.
  string id = 1;
  // Model, na który id się rozwiązuje (Claude: alias "opus" -> claude-opus-5-5); pusty, gdy ten sam.
  string resolved_model = 2;
  string display_name = 3;
  string description = 4;
  // Ukryty w domyślnym wyborze (Codex hidden).
  bool hidden = 5;
  // Model, którego profil używa, gdy model nie jest wybrany.
  bool is_default = 6;
  // Obsługiwane poziomy wysiłku rozumowania (Codex: none..xhigh/max/ultra, Claude: low|medium|high|xhigh|max).
  // Pusta lista = model bez wyboru wysiłku albo nieznana (np. model spoza katalogu dostawcy).
  repeated string efforts = 7;
  // Domyślny wysiłek modelu; pusty = domyślny dostawcy (Claude go nie podaje).
  string default_effort = 8;
}

// Modele jednej pary dostawca + profil na workerze.
message ProfileModels {
  Provider provider = 1;
  string profile_id = 2;
  repeated ModelInfo models = 3;
  // Lista niepełna albo pusta przez błąd (np. pośrednik nie odpowiedział). Pusty = lista kompletna.
  string detail = 4;
  google.protobuf.Timestamp listed_at = 5;
}

// Katalog modeli workera: wszystkie pary dostawca + profil z bieżącej konfiguracji.
// Worker wysyła go po zastosowaniu konfiguracji (i ponownie po połączeniu); zastępuje poprzedni.
message ModelCatalog {
  // Wersja konfiguracji, dla której powstał.
  uint64 config_version = 1;
  repeated ProfileModels profiles = 2;
}

// Lista modeli od nowa (bez pamięci podręcznej workera). Wynik: CommandResult.models.
message ListModels {
  // Puste = wszyscy dostawcy i profile.
  Provider provider = 1;
  string profile_id = 2;
}

// ---------- Globalne instancje dostawców ----------
// docs/worker-config.md, sekcja 9.

// Ponowne sprawdzenie dostawców i instancji bieżącej konfiguracji (wersje CLI, dostępność, logowanie), bez nowej
// wersji. Worker wysyła ConfigApplied z tą samą wersją i nowym raportem, potem odpowiada CommandResult
// (capability "probe_providers").
message ProbeProviders {}

// Logowanie instancji z own_login przez API harnessu (capability "codex_device_login": Codex app-server
// account/login/start z kodem urządzenia). Worker czeka w tle na zakończenie i wysyła wtedy ConfigApplied.
message StartLogin {
  Provider provider = 1;
  string profile_id = 2;
}

message LoginStarted {
  // Adres, pod którym użytkownik potwierdza logowanie (w dowolnej przeglądarce), i jednorazowy kod.
  string verification_url = 1;
  string user_code = 2;
  string login_id = 3;
}

// ---------- Wzmianki w kompozytorze (docs/protocol.md#wzmianki) ----------
// Komendy (/), skille i pluginy ($), pliki (@) i inne wątki (#) wstawione w tekst wiadomości jako chipy.

enum MentionKind {
  MENTION_KIND_UNSPECIFIED = 0;
  // Komenda harnessu (Claude: /nazwa na początku wejścia) albo platformy (source = platform, np. /goal).
  MENTION_KIND_COMMAND = 1;
  // Skill: Codex item skill (name, path do SKILL.md); Claude /nazwa albo narzędzie Skill.
  MENTION_KIND_SKILL = 2;
  // Plugin albo aplikacja (konektor): Codex item mention z path app://<id> albo plugin://<nazwa>@<marketplace>.
  MENTION_KIND_PLUGIN = 3;
  // Plik albo katalog workspace'u wątku.
  MENTION_KIND_FILE = 4;
  // Inny wątek platformy tego użytkownika: notatka platformy z thread_id, agent czyta go read_thread / get_thread.
  MENTION_KIND_THREAD = 5;
  // Bot gateway tego użytkownika; name = bot_id, label = nazwa w znaczniku @Nazwa.
  MENTION_KIND_BOT = 6;
  MENTION_KIND_CONNECTOR = 7;
}

// Jedna wzmianka: fragment tekstu [start, end) (jednostki UTF-16, jak string w JS i w protobuf-es) zajmuje jej
// znacznik, np. "/review", "$transitions-dev", "@docs/notatka.md", "#Tytuł wątku". Tekst bez wzmianek nadal czyta się
// jak zwykła wiadomość.
message Mention {
  MentionKind kind = 1;
  // command, skill, plugin: nazwa w harnessie; file: ścieżka względem katalogu wątku (separator "/"); thread: id wątku.
  string name = 2;
  // To, co pokazuje chip: nazwa wyświetlana skilla albo pluginu, nazwa pliku, tytuł wątku. Pusty = name.
  string label = 3;
  uint32 start = 4;
  uint32 end = 5;
  // skill: SKILL.md; plugin: cel wzmianki (app://…, plugin://…); file: ścieżka absolutna na workerze (ustawia gateway).
  string path = 6;
  // Skąd pochodzi pozycja katalogu: built-in | user | project | plugin | system | admin | mcp | platform.
  string source = 7;
  // file: katalog, nie plik.
  bool is_dir = 8;
}

// Pozycja katalogu wzmianek (to, co popup kompozytora pokazuje do wyboru).
message MentionCatalogEntry {
  MentionKind kind = 1;
  // Mention.name.
  string name = 2;
  // Nazwa wyświetlana (Codex interface.displayName); pusta = name.
  string label = 3;
  string description = 4;
  // Podpowiedź argumentów komendy (Claude argumentHint, np. "<file>").
  string argument_hint = 5;
  string source = 6;
  // Mention.path.
  string path = 7;
  // Ikona: data: URI (mała, z pliku skilla albo pluginu) albo https://; pusta = ikona rodzaju.
  string icon = 8;
  repeated string aliases = 9;
  // Plugin, z którego pochodzi skill albo komenda.
  string plugin = 10;
  // Kolor marki (Codex brandColor), np. "#0a84ff".
  string color = 11;
}

// Katalog wzmianek jednej pary dostawca + profil w katalogu wątku.
message MentionCatalog {
  Provider provider = 1;
  string profile_id = 2;
  string cwd = 3;
  repeated MentionCatalogEntry entries = 4;
  // Czego brakuje i dlaczego, np. "plugins: Claude Code in platform threads loads none (isolated config dir)".
  repeated string notes = 5;
  google.protobuf.Timestamp listed_at = 6;
}

// Komendy, skille i pluginy dostawcy w katalogu (bez wywołania modelu). Wynik: CommandResult.mention_catalog.
message ListMentionCatalog {
  Provider provider = 1;
  string profile_id = 2;
  // Istniejący katalog wątku: skille i komendy projektu. Pusty = katalog domowy workera.
  string cwd = 3;
  // Bez pamięci podręcznej workera.
  bool refresh = 4;
}

// Wyszukiwanie plików w katalogu wątku (fuzzy, tylko w nim, z .gitignore). Wynik: CommandResult.file_search.
message SearchFiles {
  string cwd = 1;
  string query = 2;
  // 0 = 50; najwyżej 200.
  uint32 limit = 3;
}

message FileMatch {
  // Względem cwd, separator "/".
  string path = 1;
  bool is_dir = 2;
  // Pozycje dopasowanych znaków w path (podświetlenie).
  repeated uint32 indices = 3;
}

message FileSearchResult {
  repeated FileMatch matches = 1;
  // Lista plików niepełna (limit przeglądania dużego katalogu bez gita).
  bool truncated = 2;
  // git (git ls-files: śledzone i nieśledzone bez ignorowanych) | walk (przeglądanie katalogu bez gita).
  string source = 3;
}

// ---------- CLI dostawców (docs/provider-cli.md) ----------
// Canopy nie dołącza CLI dostawców. Worker wykrywa CLI na urządzeniu, a na kliknięcie użytkownika instaluje
// albo aktualizuje je stałym przepisem dla dostawcy i sposobu instalacji (capability "cli_install").

// Jak CLI jest zainstalowane (wg rzeczywistej ścieżki pliku wykonywalnego po symlinkach).
enum CliInstallMethod {
  CLI_INSTALL_METHOD_UNSPECIFIED = 0;
  CLI_INSTALL_METHOD_NOT_INSTALLED = 1;
  // Własny instalator CLI w katalogu domowym (Claude ~/.local/share/claude/versions, Grok ~/.grok/bin).
  CLI_INSTALL_METHOD_NATIVE = 2;
  // Globalny pakiet npm (<prefix>/lib/node_modules/...).
  CLI_INSTALL_METHOD_NPM = 3;
  // Globalny pakiet Bun (~/.bun/install/global).
  CLI_INSTALL_METHOD_BUN = 4;
  CLI_INSTALL_METHOD_HOMEBREW = 5;
  CLI_INSTALL_METHOD_MISE = 6;
  CLI_INSTALL_METHOD_ASDF = 7;
  // Worker w kontenerze: CLI pochodzi z obrazu.
  CLI_INSTALL_METHOD_DOCKER = 8;
  // Inna, nierozpoznana instalacja.
  CLI_INSTALL_METHOD_OTHER = 9;
}

// Ostatnia albo trwająca instalacja CLI na workerze.
message CliInstallStatus {
  string install_id = 1;
  string state = 2; // running | succeeded | failed
  // Wersja docelowa: X.Y.Z[-pre] albo "latest".
  string target_version = 3;
  string previous_version = 4;
  // Czytelny powód błędu (zredagowany).
  string error = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7;
}

message CliTool {
  Provider provider = 1;
  CliInstallMethod method = 2;
  // Plik wykonywalny, którego worker używa (WorkerConfig executable_path albo PATH); pusty = nie znaleziono.
  string path = 3;
  // Ta sama ścieżka po rozwiązaniu symlinków.
  string resolved_path = 4;
  // Z `--version`; pusty = nie da się uruchomić.
  string version = 5;
  // Ścieżka pochodzi z konfiguracji (executable_path), nie z PATH.
  bool configured_path = 6;
  // Worker ma stały przepis instalacji/aktualizacji dla tej metody i platformy.
  bool installable = 7;
  // Gdy nie installable: polecenie do uruchomienia na urządzeniu (np. "brew upgrade claude-code"); może być puste.
  string manual_command = 8;
  // Dodatkowa informacja, np. dlaczego brak przepisu albo "not on PATH".
  string detail = 9;
  CliInstallStatus install = 10;
}

// Wysyłany po połączeniu, po ProbeProviders, po instalacji i rzadko okresowo; zastępuje poprzedni.
message CliToolsReport {
  repeated CliTool tools = 1;
  string os = 2;   // linux | darwin | win32
  string arch = 3; // x64 | arm64
  google.protobuf.Timestamp checked_at = 4;
}

// Instalacja albo aktualizacja jednego CLI (capability "cli_install"). CommandResult.ok = przyjęta i rozpoczęta;
// postęp: CliInstallProgress, wynik: CliToolsReport z CliTool.install. Odmowa (błąd w CommandResult): np.
// CLI_TURNS_RUNNING, CLI_MANAGED_EXTERNALLY, CLI_INSTALL_RUNNING, INVALID_VERSION.
message InstallCli {
  Provider provider = 1;
  // X.Y.Z[-pre] albo "latest". Nic innego: worker nie wykonuje dowolnych poleceń.
  string version = 2;
  string install_id = 3;
}

// Zredagowane linie wyjścia trwającej instalacji (porcjami).
message CliInstallProgress {
  string install_id = 1;
  Provider provider = 2;
  repeated string lines = 3;
}

// ---------- Git worktrees (docs/worktrees.md) ----------

// Refy repozytorium, w którym leży repo_path (absolutny istniejący katalog).
message ListGitRefs {
  string repo_path = 1;
  // Remote gałęzi domyślnej, gdy brak <remote>/HEAD (pusty = origin).
  string remote = 2;
}

message GitRef {
  // Krótka nazwa: main, feat/x albo origin/main.
  string name = 1;
  bool remote = 2;
  string commit = 3;
  // Śledzona gałąź zdalna (tylko lokalne), np. origin/main.
  string upstream = 4;
  google.protobuf.Timestamp committed_at = 5;
}

message GitRefs {
  // Fałsz: katalog nie jest w repozytorium git (reszta pusta).
  bool is_repo = 1;
  string repo_root = 2;
  // Pusty przy odłączonym HEAD.
  string current_branch = 3;
  string default_branch = 4;
  repeated GitRef refs = 5;
  // Checkout ma niezatwierdzone zmiany.
  bool dirty = 6;
}

// Nowy worktree z nową gałęzią. Ścieżkę liczy worker: <location | worktrees_root>/<repo>/<gałąź>.
message CreateWorktree {
  string repo_path = 1;
  // Ref bazowy (gałąź lokalna albo zdalna); pusty = gałąź domyślna.
  string base_ref = 2;
  // Żądana nazwa gałęzi; zajęta dostaje przyrostek -2, -3, ...
  string branch = 3;
  // Absolutny folder z ustawień; pusty = worktrees_root.
  string location = 4;
  // Najpierw najnowszy commit śledzonej gałęzi zdalnej (albo <remote>/<base>), z fetch; inaczej lokalny ref.
  bool start_from_remote = 5;
  string remote = 6;
}

// Zmiana nazwy gałęzi worktree (pod korzeniem), tylko gdy nadal jest w nim wybrana i nie ma upstreamu.
message RenameWorktreeBranch {
  string path = 1;
  string from_branch = 2;
  string to_branch = 3;
  string location = 4;
}

// Rekord znany gatewayowi; location to korzeń utrwalony przy tworzeniu.
message WorktreeTarget {
  string id = 1;
  string path = 2;
  string repo_root = 3;
  string branch = 4;
  string base_ref = 5;
  string base_commit = 6;
  string location = 7;
  string remote = 8;
}

message ScanWorktrees {
  repeated WorktreeTarget targets = 1;
  bool fetch = 2;
}

message WorktreeStatus {
  string id = 1;
  string branch = 2;
  uint32 ahead = 3;
  uint32 behind = 4;
  uint32 dirty_files = 5;
  bool unpushed = 6;
  bool merged = 7;
  bool unchanged = 8;
  string detail = 9;
  bool missing = 10;
  google.protobuf.Timestamp last_activity_at = 11;
  string head_commit = 12;
}

message RemoveWorktree {
  WorktreeTarget target = 1;
  // Wyłącznie ręczne żądanie użytkownika po ostrzeżeniu o utracie zmian.
  bool confirm_local_changes = 2;
  bool delete_branch = 3;
  bool require_merged = 4;
  bool require_unchanged = 5;
  // Potwierdzenie dotyczy dokładnie tego stanu; zmiana HEAD wymaga nowego podglądu.
  string expected_head_commit = 6;
}

message WorktreeInfo {
  string path = 1;
  string branch = 2;
  string repo_root = 3;
  // Rozstrzygnięta baza: ref i commit, od którego wyszła gałąź.
  string base_ref = 4;
  string base_commit = 5;
  // Fałsz przy RenameWorktreeBranch, gdy nazwa została (powód w detail).
  bool renamed = 6;
  string detail = 7;
}

syntax = "proto3";
package canopy.link.v1;

import "canopy/ui/v1/gateway.proto";
import "canopy/ui/v1/bots.proto";

// Stage 5. Internal, negotiated methods over the pinned link, never public RPCs.
service LinkedAgentsService {
  rpc WatchBotMirror(MirrorRequest) returns (stream BotMirrorUpdate);
  rpc CallAgentBus(LinkedAgentCall) returns (LinkedAgentResult);
}
message BotMirrorUpdate {
  string cursor = 1;
  // A replacement batch consists of start, one conversation per frame, then commit.
  bool start = 2;
  bool commit = 3;
  canopy.ui.v1.BotConversation conversation = 4;
  bool conversation_start = 5;
  bool conversation_end = 6;
}
message LinkedAgentCall {
  // Closed operation set validated by the receiving gateway.
  string operation = 1;
  string call_id = 2;
  string actor_id = 3;
  string actor_kind = 4; // thread | bot
  // Validated operation arguments, never credentials. No onward routing.
  string arguments_json = 5;
  uint32 hops = 6;
  // Display snapshot from the actor's gateway; never used for authorization.
  canopy.ui.v1.AgentSender sender = 7;
}
message LinkedAgentResult { string result_json = 1; }

// Internal subscription over RemoteRequest/RemoteResponse, only with thread_mirror.
// It is not registered on the public gateway or pairing listener.
service ThreadMirrorService {
  rpc WatchThreadMirror(MirrorRequest) returns (stream MirrorUpdate);
  rpc AckThreadRange(ThreadRangeAck) returns (ThreadRangeAckResult);
  rpc GetThreadRange(ThreadRangeRequest) returns (canopy.ui.v1.ThreadSyncBatch);
}
message ThreadRangeRequest {
  canopy.ui.v1.ThreadSyncCursor cursor = 1;
  // Inclusive end, zero means current head. Every response remains bounded.
  uint64 through_seq = 2;
}
message ThreadRangeAck {
  string subscription_id = 1;
  canopy.ui.v1.ThreadSyncCursor cursor = 2;
}
message ThreadRangeAckResult {}
message MirrorRequest {
  string cursor = 1;
  // Only with thread_mirror_delta on both computers. Older computers keep full projections.
  bool incremental = 2;
  // Negotiated by thread_watch_liveness. Emit idle revision frames.
  bool heartbeat = 3;
  // Negotiated by thread_ranges_v1. Never downgrades to snapshot transfer.
  bool ranges = 4;
  repeated canopy.ui.v1.ThreadSyncCursor thread_cursors = 5;
}
message MirrorUpdate {
  string previous_cursor = 1;
  string cursor = 2;
  // Begin a replacement generation. Readers keep the old generation until commit.
  bool reset = 3;
  bool commit = 4;
  canopy.ui.v1.ThreadSnapshot snapshot = 5;
  string removed_thread_id = 6;
  canopy.ui.v1.GetOverviewResponse overview = 7;
  // A large timeline is a header, followed by bounded snapshot fragments, then end.
  bool snapshot_start = 8;
  bool snapshot_end = 9;
  canopy.ui.v1.ThreadSnapshotDelta delta = 10;
  bool delta_start = 11;
  bool delta_end = 12;
  // No projection; cursor must equal the last committed checkpoint.
  bool heartbeat = 13;
  canopy.ui.v1.ThreadSyncBatch range_batch = 14;
  ThreadRangeFailure range_failure = 15;
}

message ThreadRangeFailure {
  string thread_id = 1;
  // Sanitized classification, never a transport message or thread content.
  string reason = 2;
  uint32 code = 3;
  bool retryable = 4;
  uint32 frame_bytes = 5;
}

// Stage 4, capability "shared_config": internal call over RemoteRequest/RemoteResponse, never
// registered on a public listener. A computer pushes the state of every item it shares (and the
// items it stopped sharing); the receiver applies, ignores or records a conflict per item.
service SharedConfigService {
  rpc PushSharedConfig(SharedConfigPush) returns (SharedConfigReply);
}
// A secret value of a shared item, only for items marked shared and only while the receiver does
// not have this value yet. The token names the value; the receiver encrypts it with its own key.
message SharedSecret { string token = 1; string value = 2; }
message SharedItem {
  // "instance:<harness>:<id>", "models:<harness>:<id>", "settings:<section>", "project:<uuid>".
  string key = 1;
  // false: the sender stopped sharing it (or deleted it); every copy becomes local.
  bool shared = 2;
  // Version vector: node id -> counter. Concurrent vectors with different values are a conflict.
  map<string, uint64> clock = 3;
  string changed_by = 4;
  int64 changed_at_ms = 5;
  // Hex SHA-256 of the canonical payload (secret values are represented by their tokens).
  string digest = 6;
  // Canonical JSON of the item's shared fields. Never contains secret values.
  string payload = 7;
  repeated SharedSecret secrets = 8;
  // Why the sender stopped sharing ("deleted"), shown on the receiver.
  string reason = 9;
}
message SharedConfigPush { repeated SharedItem items = 1; }
message SharedItemResult {
  string key = 1;
  // applied, same, newer (the receiver has a newer value and pushes it back), conflict,
  // unshared, rejected (invalid here, e.g. a missing instance), secrets (resend with secrets).
  string outcome = 2;
  string digest = 3;
  string message = 4;
  // The receiver's version vector after this item (applied, same): the sender merges it, so a
  // later change on either side is not mistaken for a concurrent one, and settles its own question.
  map<string, uint64> clock = 5;
}
message SharedConfigReply { repeated SharedItemResult results = 1; }

// Account configuration state, republished across consenting direct mTLS links.
// Internal only: carried by RemoteRequest/RemoteResponse, never registered publicly.
service ConfigSyncService {
  rpc WatchConfig(ConfigCursor) returns (stream ConfigUpdate);
  // Library content (skill and plugin versions, marketplace catalogs) by SHA-256 of its JSON text.
  // The receiver checks the hash and the artifact before storing it.
  rpc GetConfigBlob(ConfigBlobRequest) returns (stream ConfigBlobChunk);
}
message ConfigBlobRequest { string hash = 1; }
// The first chunk carries the total size; chunks arrive in order.
message ConfigBlobChunk { bytes data = 1; uint64 size = 2; }
message ConfigCursor { string cursor = 1; }
message ConfigHello { map<string, uint32> schemas = 1; }
message ConfigField {
  string value_json = 1;
  string hlc = 2;
  string prev = 3;
  // Reserved for kinds carrying secrets; never exposed by UI messages.
  optional string secret = 4;
  // False for untouched bootstrap defaults. Absent on older peers.
  optional bool edited = 5;
  // Latest observed version of this field per author; timestamps alone do not prove ancestry.
  repeated string seen = 6;
}
message ConfigItem {
  string kind = 1;
  string global_id = 2;
  string home_node_id = 3;
  string identity = 4;
  map<string, ConfigField> fields = 5;
  ConfigField deleted = 6;
  uint32 schema_version = 7;
}
message ConfigUpdate {
  ConfigHello hello = 1;
  repeated ConfigItem items = 2;
  string checkpoint = 3;
  bool reset = 4;
}
message ConfigSharing { bool enabled = 1; uint64 revision = 2; }

// Pair is the only RPC open to a certificate without a pin. The invitation
// authenticates the server certificate before its secret is sent.
// Capability "remote_app_update": a linked computer's Canopy app and its updates (docs/updates.md).
// Direct links only, never relayed. The home checks its own feed, channel and settings; the caller's view is a hint.
service ComputerUpdateService {
  rpc GetComputerUpdates(ComputerUpdatesRequest) returns (canopy.ui.v1.UpdatesSnapshot);
  rpc RequestComputerUpdate(ComputerUpdateRequest) returns (canopy.ui.v1.UpdatesSnapshot);
}
message ComputerUpdatesRequest {}
message ComputerUpdateRequest {
  string action = 1; // app | check | worker | dismiss
  string worker_id = 2; // worker: one of the home's binary workers
  string request_id = 3; // dismiss: only the current failed app update
}

service ComputerLinkService {
  rpc Pair(PairRequest) returns (PairResponse);
  rpc Connect(stream LinkFrame) returns (stream LinkFrame);
}

message NodeHello {
  string node_id = 1;
  string name = 2;
  repeated string addresses = 3;
  string app_version = 4;
  uint32 min_protocol = 5;
  uint32 max_protocol = 6;
  repeated string capabilities = 7;
}
message PairRequest { string secret = 1; NodeHello hello = 2; optional bool share_config = 3; }
message PairResponse { NodeHello hello = 1; optional bool share_config = 2; }
message LinkWelcome {
  NodeHello hello = 1;
  uint32 protocol = 2;
  // Zero protocol forbids application messages; the control channel remains
  // available for update verdicts, presence and unlink.
  string update_node_id = 3;
}
message Presence {
  string state = 1;
  int64 announced_at_ms = 2;
  canopy.ui.v1.GatewayDeparture departure = 3;
}
message Heartbeat { int64 sent_at_ms = 1; }
message Unlinked {}
// Stage 6, capability "lan_routes": the sender's current addresses (e.g. after its IP changed).
// The receiver stores them as routes with source "announced"; it never trusts them more than
// any other route: each is used only through the pinned mTLS handshake.
message RouteAnnouncement { repeated string addresses = 1; }

// Stage 7, capability "relay". Full replacement, ordered by a durable revision.
// No addresses, certificates or configuration are introduced to a third computer.
message RelayComputer {
  string node_id = 1;
  string name = 2;
  string app_version = 3;
  string status = 4;
  int64 status_since_ms = 5;
  int64 last_seen_ms = 6;
  repeated string capabilities = 7;
  // home: accessible through the sender; origin: transparency and agent callbacks only;
  // both: each is shared with the other through this relay.
  string role = 8;
}
message RelayCatalog {
  uint64 revision = 1;
  repeated RelayComputer computers = 2;
}

// Stage 2, capability "remote_threads": a canopy.ui.v1.GatewayService call
// proxied to the home gateway of a thread. Either side may call over any
// connection; call ids are chosen by the caller and unique per connection and
// direction. Payloads are binary protobuf of the method's request/response,
// split into chunks that fit the link frame limit. Only an allowlisted set of
// thread methods is served; ids never carry another computer's qualification.
message RemoteRequest {
  uint64 call_id = 1;
  // GatewayService method name, e.g. "WatchThread".
  string method = 2;
  bytes payload = 3;
  // The request continues in the next frame of the same call.
  bool more = 4;
  // Empty for direct calls. First leg: target only, hops=0. Second leg: target is
  // the receiver itself, origin is asserted by the trusted relay, hops=1.
  string target_node_id = 5;
  string origin_node_id = 6;
  uint32 relay_hops = 7;
}
message RemoteResponse {
  uint64 call_id = 1;
  bytes payload = 2;
  // This response message continues in the next frame.
  bool more = 3;
  // The call is finished; no payload follows. A non-zero code is a Connect error.
  bool end = 4;
  uint32 code = 5;
  string message = 6;
  // Stage 8: the error is "moved": these things live on another computer now. Survives a relay.
  repeated MovedItem moved = 7;
}
// The caller stopped listening (stream closed, timeout). The home aborts the call.
message RemoteCancel { uint64 call_id = 1; }

message LinkFrame {
  oneof body {
    NodeHello hello = 1;
    LinkWelcome welcome = 2;
    Heartbeat heartbeat = 3;
    Presence presence = 4;
    Unlinked unlinked = 5;
    RemoteRequest remote_request = 6;
    RemoteResponse remote_response = 7;
    RemoteCancel remote_cancel = 8;
    RouteAnnouncement routes = 9;
    RelayCatalog relay_catalog = 10;
    // Stage 8, capability "move_items": where moved threads and bots live now.
    MovedItems moved = 11;
    ConfigSharing config_sharing = 12;
  }
}

// Stage 8, capability "move_items": moving a thread or bot between two directly linked
// computers. Internal methods over RemoteRequest/RemoteResponse, never public RPCs and never
// relayed. The source (current home) coordinates a two-phase move; see docs/linked-computers.md.
service ComputerMoveService {
  // Target: stage the full state of one thing. Idempotent per move id.
  rpc PrepareMove(MovePrepare) returns (MoveReply);
  // Target: the source's decision ("commit" or "abort"). Idempotent.
  rpc DecideMove(MoveDecision) returns (MoveReply);
  // Source: its decision for a move the target has staged (after a restart or reconnect).
  rpc MoveOutcome(MoveDecision) returns (MoveReply);
  // Target: which of these provider instances and projects it has (preview, preparation).
  rpc InspectMove(MoveInspect) returns (MoveInspection);
}
message MovePrepare {
  string move_id = 1;
  // thread, bot
  string kind = 2;
  string item_id = 3;
  string batch_id = 4;
  string title = 5;
  // thread: the target's own workspace (plain id on the target).
  string workspace_id = 6;
  ThreadMove thread = 7;
  BotMove bot = 8;
}
// One attachment row (JSON of its columns) with its bytes.
message MovedFile {
  string attachment_json = 1;
  bytes data = 2;
  string mime_type = 3;
  bytes thumbnail = 4;
  string thumbnail_mime_type = 5;
}
message MovedBlob {
  string sha256 = 1;
  string mime_type = 2;
  bytes data = 3;
}
message MovedThread {
  // The thread as its home showed it (no schedules, secrets or pending interactions).
  canopy.ui.v1.ThreadSnapshot history = 1;
  // The home's row: settings, provider, title, workspace path, timestamps (JSON).
  string row_json = 2;
  // Active and paused schedules of the thread (JSON rows).
  repeated string schedules_json = 3;
}
message ThreadMove {
  // The main thread first, then its side threads.
  repeated MovedThread threads = 1;
  repeated MovedFile files = 2;
  repeated MovedBlob blobs = 3;
  // Display name of the source computer for the timeline notice and the handoff note.
  string source_name = 4;
}
// Rows of the bot and its conversation, turns, routines, reminders and handoff notes (JSON).
message BotMove {
  string rows_json = 1;
  string source_name = 2;
  // Negotiated with remote_bot_composer_v1; includes images referenced by the draft.
  repeated MovedFile files = 3;
  canopy.ui.v1.BotComposerDraft draft = 4;
}
message MoveDecision {
  string move_id = 1;
  // commit, abort; empty in MoveOutcome.
  string decision = 2;
}
message MoveReply {
  string state = 1;
  string error = 2;
}
message MoveInspect {
  // harness:id of provider instances.
  repeated string provider_instances = 1;
  repeated string project_ids = 2;
}
message MoveInspection {
  repeated string provider_instances = 1;
  repeated string project_ids = 2;
}
message MovedItem {
  string item_id = 1;
  // thread, bot
  string kind = 2;
  string home_node_id = 3;
  string from_node_id = 4;
  int64 moved_at_ms = 5;
  // Display name of the new home, for "Moved to Laptop C" where that computer isn't linked.
  string home_name = 6;
}
message MovedItems { repeated MovedItem items = 1; }

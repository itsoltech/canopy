syntax = "proto3";
package canopy.link.v1;

import "canopy/ui/v1/gateway.proto";

// Internal subscription over RemoteRequest/RemoteResponse, only with thread_mirror.
// It is not registered on the public gateway or pairing listener.
service ThreadMirrorService {
  rpc WatchThreadMirror(MirrorRequest) returns (stream MirrorUpdate);
}
message MirrorRequest { string cursor = 1; }
message MirrorUpdate {
  string previous_cursor = 1;
  string cursor = 2;
  // Begin a replacement generation. Readers keep the old generation until commit.
  bool reset = 3;
  bool commit = 4;
  canopy.ui.v1.ThreadSnapshot snapshot = 5;
  string removed_thread_id = 6;
  canopy.ui.v1.GetOverviewResponse overview = 7;
  // A large timeline is a header, followed by bounded snapshot fragments, then end.
  bool snapshot_start = 8;
  bool snapshot_end = 9;
}

// Stage 4, capability "shared_config": internal call over RemoteRequest/RemoteResponse, never
// registered on a public listener. A computer pushes the state of every item it shares (and the
// items it stopped sharing); the receiver applies, ignores or records a conflict per item.
service SharedConfigService {
  rpc PushSharedConfig(SharedConfigPush) returns (SharedConfigReply);
}
// A secret value of a shared item, only for items marked shared and only while the receiver does
// not have this value yet. The token names the value; the receiver encrypts it with its own key.
message SharedSecret { string token = 1; string value = 2; }
message SharedItem {
  // "instance:<harness>:<id>", "models:<harness>:<id>", "settings:<section>", "project:<uuid>".
  string key = 1;
  // false: the sender stopped sharing it (or deleted it); every copy becomes local.
  bool shared = 2;
  // Version vector: node id -> counter. Concurrent vectors with different values are a conflict.
  map<string, uint64> clock = 3;
  string changed_by = 4;
  int64 changed_at_ms = 5;
  // Hex SHA-256 of the canonical payload (secret values are represented by their tokens).
  string digest = 6;
  // Canonical JSON of the item's shared fields. Never contains secret values.
  string payload = 7;
  repeated SharedSecret secrets = 8;
  // Why the sender stopped sharing ("deleted"), shown on the receiver.
  string reason = 9;
}
message SharedConfigPush { repeated SharedItem items = 1; }
message SharedItemResult {
  string key = 1;
  // applied, same, newer (the receiver has a newer value and pushes it back), conflict,
  // unshared, rejected (invalid here, e.g. a missing instance), secrets (resend with secrets).
  string outcome = 2;
  string digest = 3;
  string message = 4;
  // The receiver's version vector after this item (applied, same): the sender merges it, so a
  // later change on either side is not mistaken for a concurrent one, and settles its own question.
  map<string, uint64> clock = 5;
}
message SharedConfigReply { repeated SharedItemResult results = 1; }

// Pair is the only RPC open to a certificate without a pin. The invitation
// authenticates the server certificate before its secret is sent.
service ComputerLinkService {
  rpc Pair(PairRequest) returns (PairResponse);
  rpc Connect(stream LinkFrame) returns (stream LinkFrame);
}

message NodeHello {
  string node_id = 1;
  string name = 2;
  repeated string addresses = 3;
  string app_version = 4;
  uint32 min_protocol = 5;
  uint32 max_protocol = 6;
  repeated string capabilities = 7;
}
message PairRequest { string secret = 1; NodeHello hello = 2; }
message PairResponse { NodeHello hello = 1; }
message LinkWelcome {
  NodeHello hello = 1;
  uint32 protocol = 2;
  // Zero protocol forbids application messages; the control channel remains
  // available for update verdicts, presence and unlink.
  string update_node_id = 3;
}
message Presence { string state = 1; int64 announced_at_ms = 2; }
message Heartbeat { int64 sent_at_ms = 1; }
message Unlinked {}

// Stage 2, capability "remote_threads": a canopy.ui.v1.GatewayService call
// proxied to the home gateway of a thread. Either side may call over any
// connection; call ids are chosen by the caller and unique per connection and
// direction. Payloads are binary protobuf of the method's request/response,
// split into chunks that fit the link frame limit. Only an allowlisted set of
// thread methods is served; ids never carry another computer's qualification.
message RemoteRequest {
  uint64 call_id = 1;
  // GatewayService method name, e.g. "WatchThread".
  string method = 2;
  bytes payload = 3;
  // The request continues in the next frame of the same call.
  bool more = 4;
}
message RemoteResponse {
  uint64 call_id = 1;
  bytes payload = 2;
  // This response message continues in the next frame.
  bool more = 3;
  // The call is finished; no payload follows. A non-zero code is a Connect error.
  bool end = 4;
  uint32 code = 5;
  string message = 6;
}
// The caller stopped listening (stream closed, timeout). The home aborts the call.
message RemoteCancel { uint64 call_id = 1; }

message LinkFrame {
  oneof body {
    NodeHello hello = 1;
    LinkWelcome welcome = 2;
    Heartbeat heartbeat = 3;
    Presence presence = 4;
    Unlinked unlinked = 5;
    RemoteRequest remote_request = 6;
    RemoteResponse remote_response = 7;
    RemoteCancel remote_cancel = 8;
  }
}

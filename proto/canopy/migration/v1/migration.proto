// Desktop → server migration between two gateways (docs/desktop-server-migration.md §5).
// Additive only. Each later stage adds RPCs and fields; versions are negotiated, never assumed.
syntax = "proto3";
package canopy.migration.v1;

import "google/protobuf/timestamp.proto";

// What each gateway runs. V1 requires the same build and schema on every side.
message MigrationVersions {
  uint32 protocol = 1;
  string build = 2;
  // Highest applied database migration, e.g. "147_server_migration_sessions".
  string schema = 3;
  repeated string capabilities = 4;
}

// Public pairing on the server's Network access, without a client certificate. It consumes the
// one-time invitation code and binds the home's new session certificate to the session.
service MigrationPairingService {
  rpc ExchangeMigrationPairing(ExchangeMigrationPairingRequest) returns (ExchangeMigrationPairingResponse);
}

message ExchangeMigrationPairingRequest {
  string session_id = 1;
  string source_id = 2;
  // One-time, 256-bit, valid for ten minutes. Never logged or echoed.
  string code = 3;
  // PEM. The home's new self-signed session certificate; its private key never leaves the home.
  string session_certificate = 4;
  // PEM. The home's computer certificate; it proves the node ID by signing the binding below.
  string computer_certificate = 5;
  // ECDSA SHA-256 signature by the computer key over the binding of session, source, both pins.
  bytes binding_signature = 6;
  string source_name = 7;
  // The home's local owner. Provenance only; the server takes its owner from the invitation.
  string source_owner_id = 8;
  MigrationVersions versions = 9;
}

message ExchangeMigrationPairingResponse {
  string session_id = 1;
  string source_id = 2;
  string target_node_id = 3;
  string target_name = 4;
  string target_owner_id = 5;
  google.protobuf.Timestamp credential_expires_at = 6;
  MigrationVersions versions = 7;
}

// Only over mutual TLS 1.3 with the session certificate, pinned on both sides. The server's link
// rule stays: other client certificates get no service.
service MigrationService {
  rpc Negotiate(NegotiateMigrationRequest) returns (NegotiateMigrationResponse);
}

message NegotiateMigrationRequest {
  string session_id = 1;
  string source_id = 2;
  uint32 generation = 3;
  MigrationVersions versions = 4;
}

message NegotiateMigrationResponse {
  uint32 protocol = 1;
  uint32 generation = 2;
  string state = 3;
  MigrationVersions versions = 4;
}

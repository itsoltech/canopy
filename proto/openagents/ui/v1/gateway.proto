// API gateway dla UI (Svelte). Gateway jest jedynym stanem globalnym; UI tylko czyta i wysyła akcje.
// Transkrypt (Item, ThreadEvent) to te same typy co w kanale gateway <-> worker.
// Opis: docs/ui-api.md
syntax = "proto3";

package openagents.ui.v1;

import "google/protobuf/timestamp.proto";
import "openagents/worker/v1/worker_link.proto";

service GatewayService {
  // Workery, projekty z workspace'ami i agenci: to, czego UI potrzebuje na start.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // Na żywo: zmiany workerów (online, konfiguracja) i wątków (status, oczekujące interakcje).
  rpc WatchOverview(WatchOverviewRequest) returns (stream OverviewUpdate);

  // Przeglądanie katalogów na workerze (w dozwolonych katalogach) przy wyborze workspace'u.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc InterruptThread(InterruptThreadRequest) returns (InterruptThreadResponse);
  rpc AnswerInteraction(AnswerInteractionRequest) returns (AnswerInteractionResponse);

  // Najpierw snapshot (wątek, tury, itemy, interakcje), potem zmiany na żywo od snapshot.last_seq.
  rpc WatchThread(WatchThreadRequest) returns (stream ThreadUpdate);

  // Harmonogram platformy (docs/agent-bus.md#5-harmonogram): tworzony przez użytkownika albo agenta.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  // Podgląd: najbliższe terminy cronu w strefie (albo błąd walidacji), bez tworzenia harmonogramu.
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse);
  // Wstrzymanie, wznowienie albo anulowanie.
  rpc SetScheduleStatus(SetScheduleStatusRequest) returns (SetScheduleStatusResponse);

  // Ustawienia użytkownika i projektów. Przechowuje je gateway; przeglądarka jest tylko klientem.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
  rpc UpdateProjectSettings(UpdateProjectSettingsRequest) returns (UpdateProjectSettingsResponse);

  // Modele, effort i steer (sekcja na końcu pliku).
  // Katalog modeli workerów (dostawca -> profil -> modele z wysiłkami rozumowania); refresh = lista od nowa z workera.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Domyślny model i wysiłek wątku (kolejne tury bez nadpisania w wiadomości).
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse);
  rpc RegenerateTitle(RegenerateTitleRequest) returns (RegenerateTitleResponse);
  // Cel harnessu w wątku (docs/goals.md): ustawienie, pauza, wznowienie, usunięcie.
  rpc SetGoal(SetGoalRequest) returns (SetGoalResponse);
  // Zatrzymanie zadania w tle (proces Codexa, background Bash Claude; docs/execution.md).
  rpc StopBackgroundTask(StopBackgroundTaskRequest) returns (StopBackgroundTaskResponse);

  // Projekt na workerach (sekcja na końcu pliku): zmiana katalogu workspace'u i usunięcie projektu z workera.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  rpc RemoveWorkspace(RemoveWorkspaceRequest) returns (RemoveWorkspaceResponse);

  // Globalne instancje dostawców (sekcja na końcu pliku, docs/worker-config.md, sekcja 9): definicja raz w gateway,
  // włączenie i nadpisania per worker, synchronizacja do workerów przez ich wersjonowaną konfigurację.
  rpc ListProviderInstances(ListProviderInstancesRequest) returns (ListProviderInstancesResponse);
  // Nowa albo zmieniona instancja: nowe wersje konfiguracji workerów, na których działa.
  rpc SaveProviderInstance(SaveProviderInstanceRequest) returns (SaveProviderInstanceResponse);
  // Usunięcie instancji, której nie używa żaden wątek (używana: FailedPrecondition, można ją wyłączyć).
  rpc DeleteProviderInstance(DeleteProviderInstanceRequest) returns (DeleteProviderInstanceResponse);
  // Na których workerach działa instancja: wszystkie (także przyszłe) albo wybrane.
  rpc SetInstanceWorkers(SetInstanceWorkersRequest) returns (SetInstanceWorkersResponse);
  // Włączenie i nadpisania (ścieżki, argumenty, zmienne, endpoint) na jednym workerze.
  rpc SetInstanceWorker(SetInstanceWorkerRequest) returns (SetInstanceWorkerResponse);
  // Ulubione, kolejność, widoczność i własne modele instancji (pickery; bez nowej wersji konfiguracji).
  rpc SetInstanceModels(SetInstanceModelsRequest) returns (SetInstanceModelsResponse);
  // Ponowne sprawdzenie wersji, dostępności i logowania na workerach online (ProbeProviders).
  rpc RefreshProviders(RefreshProvidersRequest) returns (RefreshProvidersResponse);
  // Logowanie instancji przez API harnessu (Codex: ChatGPT kodem urządzenia).
  rpc StartProviderLogin(StartProviderLoginRequest) returns (StartProviderLoginResponse);

  // Załączniki (sekcja na końcu pliku): plik użytkownika do wiadomości, jego bajty i podglądy obrazów z transkryptu.
  rpc UploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);
  rpc GetThreadBlob(GetThreadBlobRequest) returns (GetThreadBlobResponse);

  // Kolejka (sekcja na końcu pliku): wiadomości czekające za turą w toku — kolejność, edycja, usunięcie
  // (z cofnięciem) i steer do tury w toku. Działa tylko na turach queued, których gateway jeszcze nie wystartował.
  rpc ReorderQueuedTurns(ReorderQueuedTurnsRequest) returns (ReorderQueuedTurnsResponse);
  rpc EditQueuedTurn(EditQueuedTurnRequest) returns (EditQueuedTurnResponse);
  rpc DeleteQueuedTurn(DeleteQueuedTurnRequest) returns (DeleteQueuedTurnResponse);
  rpc RestoreQueuedTurn(RestoreQueuedTurnRequest) returns (RestoreQueuedTurnResponse);
  rpc SteerQueuedTurn(SteerQueuedTurnRequest) returns (SteerQueuedTurnResponse);

  // Wzmianki w kompozytorze (sekcja na końcu pliku): komendy, skille i pluginy dostawcy, pliki workspace'u, wątki.
  rpc ListMentionCatalog(ListMentionCatalogRequest) returns (ListMentionCatalogResponse);
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
  rpc SearchThreads(SearchThreadsRequest) returns (SearchThreadsResponse);
  // Stan przeczytania (sekcja na końcu pliku): użytkownik widział wątek do zdarzenia up_to_seq (ostatnia wiadomość
  // agenta była na ekranie); Thread.unseen_result gaśnie na wszystkich urządzeniach (OverviewUpdate.thread).
  rpc MarkThreadSeen(MarkThreadSeenRequest) returns (MarkThreadSeenResponse);
}

// ---------- Model ----------

message Worker {
  string id = 1;
  string name = 2;
  bool online = 3;
  string hostname = 4;
  string os = 5;
  string version = 6;
  repeated openagents.worker.v1.ProviderInfo providers = 7;
  repeated openagents.worker.v1.ProviderProfile profiles = 8;
  repeated string allowed_roots = 9;
  uint64 config_version = 10;
  uint64 applied_version = 11;
  repeated openagents.worker.v1.ConfigIssue config_issues = 12;
  google.protobuf.Timestamp last_seen_at = 13;
  // Globalne instancje dostawców z ich stanem na tym workerze (pickery: tylko enabled i available).
  repeated WorkerInstance provider_instances = 120;
}

message Project {
  string id = 1;
  string name = 2;
  string slug = 3;
  repeated Workspace workspaces = 4;
}

message Workspace {
  string id = 1;
  string project_id = 2;
  string worker_id = 3;
  string root_path = 4;
  string label = 5;
}

message Agent {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  openagents.worker.v1.Provider provider = 5;
  string model = 6;
  bool global = 7;
}

enum ThreadKind {
  THREAD_KIND_UNSPECIFIED = 0;
  THREAD_KIND_MAIN = 1;
  THREAD_KIND_SIDE = 2;
}

message Thread {
  string id = 1;
  string project_id = 2;
  ThreadKind kind = 3;
  string parent_thread_id = 4;
  string title = 5;
  openagents.worker.v1.Provider provider = 6;
  string provider_profile_id = 7;
  string model = 8;
  openagents.worker.v1.PermissionMode permission_mode = 9;
  string worker_id = 10;
  string workspace_id = 11;
  string cwd = 12;
  // creating | idle | running | waiting_input | interrupted | failed | archived
  string status = 13;
  string agent_id = 14;
  bool spawned_by_agent = 15;
  string status_detail = 16;   // np. błąd utworzenia u dostawcy
  uint64 last_seq = 17;
  google.protobuf.Timestamp created_at = 18;
  uint32 pending_interactions = 19;
  // Fork: wątek, którego historię dziedziczy (pusty, gdy to nie fork).
  string fork_source_thread_id = 20;
  // Wątek główny drzewa (dla wątku głównego: on sam).
  string root_thread_id = 21;
  // human | parent: kto odpowiada na zgody i pytania wątku (wątki agentów: parent).
  string interaction_route = 22;
  // Ostatnia zmiana: utworzenie, kolejkowanie, start albo koniec tury.
  google.protobuf.Timestamp last_activity_at = 23;
  // Domyślny wysiłek rozumowania wątku (pusty = domyślny modelu); model domyślny to pole model.
  string effort = 40;

  // Cele i praca w tle (numery od 60, osobno od innych zmian kontraktu).
  // Status bieżącego celu (Goal.status) albo pusty, gdy wątek nie ma otwartego celu.
  string goal_status = 60;
  // Zadania w tle w toku (itemy background_task ze statusem in_progress).
  uint32 background_tasks = 61;

  // Numery od 70: restart workera i błędy komend celu.
  // gateway (agent czatowy w gateway: bez celów i pracy w tle) | worker (wątek dostawcy na workerze)
  string runtime = 70;

  // Numery od 95: subagenci platformy (docs/agent-bus.md).
  // Wątki boczne: początek ostatniej wiadomości agenta (wynik subagenta) do karty w wątku rodzica. Główne: pusty.
  string last_message = 95;

  // Numery od 180: stan przeczytania. Wynik ostatniej zakończonej tury, której użytkownik jeszcze nie widział
  // (completed | failed | interrupted); pusty, gdy widział wszystko (MarkThreadSeen).
  string unseen_result = 180;

  // Numery od 190: fork od tury. Tura źródła, do której (włącznie) wątek dziedziczy historię, i jej numer
  // w wątku, do którego należy (fork_source_thread_id), taki jak na osi czasu: bez tur wyjętych z kolejki
  // (Turn.withdrawn). Puste / 0, gdy to nie fork.
  string fork_after_turn_id = 190;
  uint32 fork_after_turn_ordinal = 191;
  // provisional | generated | user (jawny tytuł, fork lub ręczna zmiana).
  string title_source = 200;
  // Tytuł jest właśnie generowany (automatycznie albo na żądanie): UI pokazuje, że coś się dzieje.
  bool title_generating = 201;

  // Numery od 210: subagenci dowolnego dostawcy i wiadomości między wątkami (docs/agent-bus.md).
  // Jak skończyła się ostatnia zakończona tura (completed | failed | interrupted); pusty przed pierwszą.
  string last_turn_status = 210;
}

// Wątek agenta, od którego przyszło wejście tury albo steer (zadanie, wiadomość, raport): do oznaczenia wiadomości
// agenta w UI („from <wątek>”) także wtedy, gdy wątek nadawcy jest w innym drzewie, projekcie albo na innym workerze.
message AgentSender {
  string thread_id = 1;
  string title = 2;
  openagents.worker.v1.Provider provider = 3;
  // Instancja dostawcy (pusty = native).
  string provider_profile_id = 4;
  // Model tury, która wysłała (task, message), albo domyślny wątku; pusty = domyślny dostawcy.
  string model = 5;
  string project_id = 6;
  string worker_id = 7;
}

// Dokąd dotarło wywołanie spawn_thread / send_message wątku: karta na osi czasu nadawcy śledzi turę docelową.
message BusDelivery {
  // AgentBusCall.call_id.
  string call_id = 1;
  string target_thread_id = 2;
  // Tura docelowa; pusta, dopóki steer nie wszedł do tury.
  string target_turn_id = 3;
  // queue | steer (tak, jak wiadomość faktycznie poszła: steer bez tury w toku idzie do kolejki).
  string delivery = 4;
  // Status tury docelowej (queued | running | completed | interrupted | failed | cancelled) albo steering (steer w drodze).
  string status = 5;
}

message Turn {
  string id = 1;
  uint32 ordinal = 2;
  // queued | running | completed | interrupted | failed | cancelled
  string status = 3;
  // user | agent_bus | schedule | interaction | goal | provider | recovery | background_task
  string trigger = 4;
  string input_text = 5;
  string error = 6;
  google.protobuf.Timestamp queued_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  // Zużycie tokenów i koszt (z turn_finished).
  openagents.worker.v1.Usage usage = 10;
  // Długość łańcucha agent → agent bez udziału człowieka (docs/agent-bus.md).
  uint32 hops = 11;
  // Tura z historii odziedziczonej przez fork (należy do wątku źródłowego).
  bool inherited = 12;
  // Odziedziczona tura: wątek, do którego należy (w łańcuchu forków nie zawsze bezpośrednie źródło).
  string from_thread_id = 13;
  // Skąd przyszło wejście tury (puste dla użytkownika i tur dostawcy):
  // task (spawn_thread) | message (send_message) | report (powiadomienie: wątek docelowy skończył turę)
  // | question (wątek boczny pyta rodzica) | schedule (harmonogram)
  // | background_task (zadania w tle się zakończyły: background_item_ids)
  string source_kind = 14;
  // Wątek, od którego tura pochodzi: zlecający (task, message), raportujący (report), pytający (question),
  // a dla harmonogramu agenta wątek, który go utworzył.
  string source_thread_id = 15;
  string schedule_id = 16;
  string interaction_request_id = 17;
  // Treść wejścia bez notatki platformy: wiadomość użytkownika, zadanie, wiadomość agenta, raport
  // (ostatnia wiadomość wątku docelowego) albo polecenie harmonogramu. input_text = notatka + treść,
  // dokładnie to, co dostał model.
  string message_text = 18;
  // Notatka platformy przed treścią (np. "[open-agents] Task from the thread …"); pusta dla użytkownika.
  string platform_note = 19;
  // report: jak skończyła się tura wątku docelowego (completed | interrupted | failed | cancelled).
  string source_status = 20;
  // question: rodzaj pytania (permission | question | elicitation) i narzędzie, którego dotyczy.
  string question_kind = 21;
  string question_tool = 22;
  // Model i wysiłek tury: nadpisanie z wiadomości; od startu tury wartości faktycznie wysłane do workera
  // (z domyślnymi wątku). Puste = domyślne profilu.
  string model = 40;
  string effort = 41;

  // Cel, nad którym pracowała tura (tura celu albo kontynuacja dostawcy w trakcie celu).
  string goal_id = 60;

  // Dlaczego tura została przerwana (status interrupted), np. „worker restarted”: worker już jej nie prowadzi
  // (restart procesu), „superseded: …”, albo powód od dostawcy. Pusty dla innych statusów.
  string interrupt_reason = 70;

  // Status failed: skąd błąd — platform (nasza strona: gateway, worker, adapter, połączenie) albo harness
  // (Codex/Claude zgłosił błąd). Treść w error. Pusty dla innych statusów.
  string error_source = 72;
  // Status interrupted: kto przerwał — user (użytkownik albo agent rodzica) albo system (np. restart workera
  // w trakcie tury). Powód w interrupt_reason. Tura przerwana przez system może być kontynuowana („Continue”).
  string interrupt_source = 73;
  // Krótki kod błędu (np. „http_connection_failed:401”, „error_max_turns”, „process_exit”), jeśli jest.
  string error_code = 74;

  // Numery od 90: tryb uprawnień tury. Nadpisanie z wiadomości (UNSPECIFIED = domyślny wątku); od startu tury
  // tryb faktycznie wysłany do workera.
  openagents.worker.v1.PermissionMode permission_mode = 90;
  // Pliki dołączone do wiadomości (numery od 110). Ich ścieżki na workerze są w platform_note.
  repeated Attachment attachments = 110;

  // Numery od 160: zarządzanie kolejką.
  // Tura wyjęta z kolejki przez użytkownika (status cancelled, oś czasu jej nie pokazuje): deleted (usunięta,
  // RestoreQueuedTurn ją przywraca) | steered (wysłana do tury w toku jako steer z Steer.from_turn_id; wraca na
  // swoje miejsce w kolejce, gdy nie mogła wejść). Pusty dla innych tur.
  string withdrawn = 160;
  // Rośnie z każdą edycją wejścia tury w kolejce (EditQueuedTurn.expected_revision).
  uint32 revision = 161;

  // Wzmianki w message_text (numery od 140): chipy wiadomości użytkownika.
  repeated openagents.worker.v1.Mention mentions = 140;
  // Numery od 150: cytaty z wiadomości (SendMessage.quotes). Ich treść i komentarze są w platform_note.
  repeated Quote quotes = 150;

  // Numery od 210: nadawca-agent (source_kind task | message | report): wątek, jego dostawca i model.
  AgentSender sender = 210;

  // Numery od 230: tura z notatką platformy o zakończonych zadaniach w tle (trigger background_task,
  // source_kind background_task): item_id tych itemów background_task (docs/execution.md, „Pobudka”).
  repeated string background_item_ids = 230;
}

// Item na osi czasu z zakresem seq (first_seq..last_seq).
message TimelineItem {
  openagents.worker.v1.Item item = 1;
  string turn_id = 2;
  uint64 first_seq = 3;
  uint64 last_seq = 4;
  // Item z historii odziedziczonej przez fork (first_seq/last_seq liczone w wątku źródłowym).
  bool inherited = 5;
  // Odziedziczony item: wątek, do którego należy.
  string from_thread_id = 6;
}

// Komunikat dostawcy albo platformy na osi czasu (np. ponowienie po błędzie API).
message ThreadNotice {
  uint64 seq = 1;
  string turn_id = 2;
  openagents.worker.v1.Notice notice = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message Interaction {
  string request_id = 1;
  string thread_id = 2;
  string turn_id = 3;
  string item_id = 4;
  openagents.worker.v1.InteractionKind kind = 5;
  string tool_name = 6;
  string request_json = 7;
  // pending | allowed | declined | answered | expired | cancelled
  string status = 8;
  string routed_to = 9;
  google.protobuf.Timestamp created_at = 10;
}

// ---------- Overview ----------

message GetOverviewRequest {}

message GetOverviewResponse {
  repeated Worker workers = 1;
  repeated Project projects = 2;
  repeated Agent agents = 3;
}

message WatchOverviewRequest {}

message OverviewUpdate {
  oneof change {
    Worker worker = 1;
    Thread thread = 2;
    Project project = 3;
    Schedule schedule = 4;
    // Zmiana z innego urządzenia albo karty.
    UserSettings user_settings = 5;
    ProjectSettings project_settings = 6;
    // Nowy katalog modeli workera.
    WorkerModels models = 40;
  }
}

// ---------- Katalogi, projekty, workspace'y ----------

message ListDirectoryRequest {
  string worker_id = 1;
  string path = 2; // pusty = dozwolone katalogi workera
}

message ListDirectoryResponse {
  repeated openagents.worker.v1.DirectoryEntry entries = 1;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message CreateWorkspaceRequest {
  string project_id = 1;
  string worker_id = 2;
  string root_path = 3;
  string label = 4;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

// ---------- Wątki ----------

message ListThreadsRequest {
  // Pusty = wątki wszystkich projektów użytkownika.
  string project_id = 1;
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  Thread thread = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message CreateThreadRequest {
  string project_id = 1;
  string workspace_id = 2;
  // Pusty = katalog główny workspace'u.
  string cwd = 3;
  string title = 4;
  openagents.worker.v1.Provider provider = 5;
  string provider_profile_id = 6;
  string model = 7;
  openagents.worker.v1.PermissionMode permission_mode = 8;
  string instructions = 9;
  // Wątek boczny: rodzic (ten sam workspace i katalog), opcjonalnie fork historii rodzica.
  string parent_thread_id = 10;
  bool fork = 11;
  // Pierwsza wiadomość (opcjonalnie).
  string initial_message = 12;
  // Idempotencja ponowień z UI.
  string client_request_id = 13;
  // Domyślny wysiłek rozumowania wątku (pusty = domyślny modelu).
  string effort = 40;
  // Załączniki pierwszej wiadomości (UploadAttachment).
  repeated string initial_attachment_ids = 110;
  // Wzmianki w initial_message (zakresy w nim; docs/ui-api.md, "Wzmianki").
  repeated openagents.worker.v1.Mention initial_mentions = 140;
  // Numery od 190: fork od tury ("Fork from here", docs/threads.md). Zakończona tura (completed, failed albo
  // interrupted) z widocznej historii wątku fork_thread_id (jego własna albo odziedziczona), do której
  // (włącznie) nowy wątek dziedziczy historię. Bez parent_thread_id powstaje nowy wątek główny w tym samym
  // projekcie, workspace'ie i katalogu, z dostawcą, instancją, modelem, wysiłkiem, trybem i instrukcjami
  // wątku fork_thread_id (pola dostawcy, modelu i miejsca z żądania są pomijane). Z parent_thread_id i fork:
  // wątek boczny z historią rodzica do tej tury (tura musi należeć do rodzica).
  string fork_at_turn_id = 190;
  // Wątek, z którego użytkownik forkuje (pusty = parent_thread_id).
  string fork_thread_id = 191;
}

message CreateThreadResponse {
  Thread thread = 1;
}

message SendMessageRequest {
  string thread_id = 1;
  string text = 2;
  string client_request_id = 3;
  // Nadpisanie modelu i wysiłku tylko dla tej tury (puste = domyślne wątku). Steer ich nie używa
  // (tura już trwa); obowiązują, gdy wiadomość trafi do kolejki.
  string model = 40;
  string effort = 41;
  MessageDelivery delivery = 42;
  // Numery od 90: tryb uprawnień tury.
  // Nadpisanie trybu uprawnień tylko dla tej tury (UNSPECIFIED = domyślny wątku). Steer dołącza do tury
  // w toku i zostaje przy jej trybie; nadpisanie obowiązuje, gdy wiadomość trafi do kolejki.
  openagents.worker.v1.PermissionMode permission_mode = 90;
  // Załączniki (UploadAttachment). Wiadomość z załącznikami zawsze idzie do kolejki (nie steer).
  repeated string attachment_ids = 110;
  // Wzmianki w text (zakresy w nim). Gateway sprawdza je i dopisuje to, czego dostawca potrzebuje (docs/ui-api.md).
  repeated openagents.worker.v1.Mention mentions = 140;
  // Numery od 150: fragmenty tego, co agent wytworzył, cytowane przez użytkownika (z opcjonalnym komentarzem).
  // Gateway podaje je agentowi przed treścią wiadomości (docs/ui-api.md, "Cytaty"); działa też ze steer.
  // Wiadomość może składać się z samych cytatów (pusty text).
  repeated Quote quotes = 150;
}

message SendMessageResponse {
  // Wiadomość jako tura (kolejka, także steer bez tury w toku).
  Turn turn = 1;
  // Wiadomość dołączona do tury w toku (delivery = STEER).
  Steer steer = 40;
  // Wiadomość z komendą platformy /goal: ustawiony cel (Claude: także jego tura w turn; Codex: bez tury).
  Goal goal = 140;
}

message InterruptThreadRequest {
  string thread_id = 1;
}

message InterruptThreadResponse {}

message AnswerInteractionRequest {
  string request_id = 1;
  bool allow = 2;
  bool allow_for_session = 3;
  string message = 4;
  string answer_json = 5;
  bool cancelled = 6;
}

message AnswerInteractionResponse {
  Interaction interaction = 1;
}

message WatchThreadRequest {
  string thread_id = 1;
}

message ThreadSnapshot {
  Thread thread = 1;
  repeated Turn turns = 2;
  repeated TimelineItem items = 3;
  repeated Interaction interactions = 4;
  // Zdarzenia na żywo zaczynają się od last_seq + 1.
  uint64 last_seq = 5;
  // Ostatnie komunikaty (do 200); nowe przychodzą jako zdarzenia.
  repeated ThreadNotice notices = 6;
  // Aktywne i wstrzymane harmonogramy wątku.
  repeated Schedule schedules = 7;
  // Wiadomości dołączone do tur w toku (steer), od najstarszej.
  repeated Steer steers = 40;
  // Bieżący cel albo ostatni zakończony (brak = wątek nigdy nie miał celu).
  Goal goal = 60;
  // Numery od 210: dokąd dotarły wywołania spawn_thread / send_message tego wątku (status tur docelowych).
  repeated BusDelivery bus_deliveries = 210;
}

message ThreadEventUpdate {
  uint64 seq = 1;
  openagents.worker.v1.ThreadEvent event = 2;
}

message ThreadUpdate {
  oneof change {
    ThreadSnapshot snapshot = 1;
    ThreadEventUpdate event = 2;
    Thread thread = 3;
    Turn turn = 4;
    Interaction interaction = 5;
    Schedule schedule = 6;
    Steer steer = 40;
    Goal goal = 60;
    // Zmiana statusu tury, do której trafiło wywołanie szyny tego wątku.
    BusDelivery bus_delivery = 210;
  }
}

// ---------- Harmonogram ----------

message Schedule {
  string id = 1;
  string thread_id = 2;
  string project_id = 3;
  // once | recurring
  string kind = 4;
  string prompt = 5;
  // once: termin.
  google.protobuf.Timestamp run_at = 6;
  // recurring: cron (pięć pól) w strefie timezone.
  string cron = 7;
  string timezone = 8;
  google.protobuf.Timestamp until = 9;
  uint32 max_runs = 10;     // 0 = bez limitu
  uint32 runs = 11;
  google.protobuf.Timestamp next_run_at = 12;
  // active | paused | completed | cancelled
  string status = 13;
  // run_once | skip: co po przestoju
  string missed_policy = 14;
  // user | agent
  string created_by = 15;
  // Agent: wątek, który utworzył harmonogram.
  string created_by_thread_id = 16;
  string last_turn_id = 17;
  google.protobuf.Timestamp created_at = 18;
}

message ListSchedulesRequest {
  // Filtry (oba puste = wszystkie harmonogramy użytkownika).
  string project_id = 1;
  string thread_id = 2;
  // Także zakończone i anulowane.
  bool include_finished = 3;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message CreateScheduleRequest {
  string thread_id = 1;
  string prompt = 2;
  oneof when {
    google.protobuf.Timestamp run_at = 3;
    string cron = 4;
  }
  string timezone = 5;      // pusty = UTC
  google.protobuf.Timestamp until = 6;
  uint32 max_runs = 7;
  string missed_policy = 8; // pusty = run_once
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

message PreviewScheduleRequest {
  string cron = 1;
  string timezone = 2;   // pusty = UTC
  uint32 count = 3;      // ile terminów, 1..20 (0 = 5)
}

message PreviewScheduleResponse {
  repeated google.protobuf.Timestamp next_runs = 1;
}

message SetScheduleStatusRequest {
  string schedule_id = 1;
  // active (wznowienie wstrzymanego) | paused | cancelled. Zakończonego ani anulowanego nie da się wznowić.
  string status = 2;
}

message SetScheduleStatusResponse {
  Schedule schedule = 1;
}

// ---------- Ustawienia ----------

enum ColorScheme {
  COLOR_SCHEME_UNSPECIFIED = 0; // = system
  COLOR_SCHEME_SYSTEM = 1;
  COLOR_SCHEME_LIGHT = 2;
  COLOR_SCHEME_DARK = 3;
}

enum AccentTheme {
  ACCENT_THEME_UNSPECIFIED = 0; // = default
  ACCENT_THEME_DEFAULT = 1;
  ACCENT_THEME_GROVE = 2;
  ACCENT_THEME_OCEAN = 3;
  ACCENT_THEME_EMBER = 4;
  ACCENT_THEME_IRIS = 5;
  ACCENT_THEME_ROSE = 6;
}

enum ChatWidth {
  CHAT_WIDTH_UNSPECIFIED = 0; // = comfortable
  CHAT_WIDTH_COMFORTABLE = 1;
  CHAT_WIDTH_WIDE = 2;
  CHAT_WIDTH_FULL = 3;
}

message AppearanceSettings {
  ColorScheme color_scheme = 1;
  AccentTheme accent = 2;
  ChatWidth chat_width = 3;
  // Panel kontekstu wątku zwinięty.
  bool thread_panel_collapsed = 4;
  // Szerokość paska bocznego na desktopie w px; 0 = domyślna. Gateway przycina do granic
  // (@open-agents/domain SIDEBAR_WIDTH), UI dodatkowo do szerokości okna.
  uint32 sidebar_width = 130;
  // Pasek boczny na desktopie zwinięty (szerokość zostaje zapisana na powrót).
  bool sidebar_collapsed = 131;
}

// Wartości startowe nowego wątku. Puste pole = bez preferencji.
message ThreadDefaults {
  string workspace_id = 1;
  openagents.worker.v1.Provider provider = 2;
  // Pusty albo "native" = profil natywny.
  string provider_profile_id = 3;
  reserved 4;
  reserved "model";
  openagents.worker.v1.PermissionMode permission_mode = 5;
  // Model per dostawca (zmiana dostawcy w nowym wątku zachowuje model każdego z nich). Brak = model profilu.
  repeated ProviderModel models = 6;
}

message ProviderModel {
  openagents.worker.v1.Provider provider = 1;
  string model = 2;
}

message UserSettings {
  AppearanceSettings appearance = 1;
  ThreadDefaults thread_defaults = 2;
  // Rośnie przy każdej zmianie; 0 = jeszcze nie zapisane.
  uint64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
  // Nieużywane od globalnych instancji dostawców: ulubione są w InstanceModels.favorites (migracja 0018 je przeniosła).
  ModelFavorites model_favorites = 40;
  ComposerSettings composer = 160;
  TextGenerationSettings text_generation = 200;
}

// Globalne ustawienie użytkownika. Pusty model = automatyczny wybór z instancji wątku.
message TextGenerationSettings {
  openagents.worker.v1.Provider provider = 1;
  string profile_id = 2;
  string model = 3;
  string effort = 4;
  string thread_title_instructions = 5;
}

// Kompozytor wątku (numery od 160).
message ComposerSettings {
  // Co robi Enter, gdy w wątku trwa tura: STEER (domyślnie, UNSPECIFIED = STEER; Mod+Enter = kolejka) albo QUEUE
  // (przełącznik queueing w menu kolejki: Enter = kolejka, Mod+Enter = steer).
  MessageDelivery running_delivery = 1;
}

// Ustawienia projektu; nadpisują domyślne wartości użytkownika w tym projekcie.
message ProjectSettings {
  string project_id = 1;
  ThreadDefaults thread_defaults = 2;
  uint64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  UserSettings user = 1;
  repeated ProjectSettings projects = 2;
  // Limity załączników gateway (kompozytor sprawdza je przed wysłaniem).
  AttachmentLimits attachment_limits = 110;
}

// Ustawione sekcje zastępują zapisane; nieustawione zostają.
message UpdateUserSettingsRequest {
  AppearanceSettings appearance = 1;
  ThreadDefaults thread_defaults = 2;
  // Wersja, od której klient zaczął zmianę (konflikt = FailedPrecondition, klient pobiera ustawienia od nowa).
  uint64 expected_version = 3;
  ModelFavorites model_favorites = 40;
  ComposerSettings composer = 160;
  TextGenerationSettings text_generation = 200;
}

message UpdateUserSettingsResponse {
  UserSettings settings = 1;
}

message UpdateProjectSettingsRequest {
  string project_id = 1;
  ThreadDefaults thread_defaults = 2;
  uint64 expected_version = 3;
}

message UpdateProjectSettingsResponse {
  ProjectSettings settings = 1;
}

// ---------- Modele, effort i steer ----------

// Jak dostarczyć wiadomość, gdy w wątku trwa tura.
enum MessageDelivery {
  MESSAGE_DELIVERY_UNSPECIFIED = 0; // = QUEUE
  // Następna tura (po bieżącej).
  MESSAGE_DELIVERY_QUEUE = 1;
  // Do tury w toku (Codex turn/steer, Claude strumień wejścia). Bez tury w toku działa jak QUEUE;
  // gdy tura skończy się wcześniej albo dostawca odmówi, wiadomość trafia do kolejki z powodem (Steer.reason).
  MESSAGE_DELIVERY_STEER = 2;
}

// Wiadomość dołączona do tury w toku. W transkrypcie to item user_message z client_id = id w tej turze,
// w miejscu, w którym weszła.
message Steer {
  string id = 1;
  string thread_id = 2;
  // Tura, do której ma trafić.
  string turn_id = 3;
  string text = 4;
  // pending (czeka na workera) | accepted (dostawca przyjął) | delivered (weszła do tury: item user_message)
  // | queued (nie weszła; jest następną turą queued_turn_id, powód w reason) | failed
  string status = 5;
  string reason = 6;
  string queued_turn_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // Autor: użytkownik albo wątek agenta (send_message z delivery = steer).
  string source_thread_id = 9;
  // Numery od 160: steer zrobiony z tury w kolejce (SteerQueuedTurn). Gdy nie wejdzie, ta tura wraca do kolejki
  // na swoje miejsce (queued_turn_id = from_turn_id) zamiast nowej tury na końcu.
  string from_turn_id = 160;
  // Wzmianki w text.
  repeated openagents.worker.v1.Mention mentions = 140;
  // Numery od 150: cytaty wiadomości (SendMessage.quotes); text to sama treść użytkownika.
  repeated Quote quotes = 150;
  // Numery od 210: steer agenta (send_message): wątek nadawcy, jego dostawca i model.
  AgentSender sender = 210;

  // Numery od 230: notatka platformy o zakończonych zadaniach w tle wstrzyknięta do tury w toku (bez autora):
  // item_id tych itemów background_task.
  repeated string background_item_ids = 230;
}

// Katalog modeli jednego workera (z ostatniego raportu workera).
message WorkerModels {
  string worker_id = 1;
  repeated openagents.worker.v1.ProfileModels profiles = 2;
  // Wersja konfiguracji workera, dla której powstał.
  uint64 config_version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ListModelsRequest {
  // Pusty = wszystkie workery użytkownika.
  string worker_id = 1;
  // Lista od nowa z workera (musi być online); bez tego ostatni zapisany raport.
  bool refresh = 2;
  // Pełny katalog bez wyborów modeli instancji (ekran ustawień). Domyślnie modele ukryte w instancji mają hidden, własne dochodzą, ulubione są pierwsze.
  bool unfiltered = 100;
}

message ListModelsResponse {
  repeated WorkerModels workers = 1;
}

message UpdateThreadRequest {
  string thread_id = 1;
  // Nieustawione = bez zmian; pusty = domyślny profilu / modelu.
  optional string model = 2;
  optional string effort = 3;
  // Domyślny tryb uprawnień wątku (tury bez nadpisania). Nieustawione albo UNSPECIFIED = bez zmian.
  optional openagents.worker.v1.PermissionMode permission_mode = 90;
  optional string title = 200;
}

message RegenerateTitleRequest {
  string thread_id = 1;
}
// Zlecenie przyjęte; nowy tytuł przychodzi przez WatchThread / WatchOverview.
message RegenerateTitleResponse {}

message UpdateThreadResponse {
  Thread thread = 1;
}

// Ulubione modele w wyborze modelu (sekcja ustawień użytkownika, zastępowana w całości).
message ModelFavorites {
  repeated FavoriteModel models = 1;
}

message FavoriteModel {
  openagents.worker.v1.Provider provider = 1;
  // Pusty = dowolny profil z tym modelem.
  string profile_id = 2;
  string model = 3;
}
// ---------- Cele i praca w tle ----------

// Cel harnessu (docs/goals.md): silnikiem jest harness (Codex thread/goal, Claude /goal), platforma śledzi
// stan, zużycie i tury celu. Najwyżej jeden otwarty cel na wątek.
message Goal {
  string id = 1;
  string thread_id = 2;
  // Co ma być osiągnięte (Claude: warunek /goal).
  string objective = 3;
  // active | paused | blocked | budget_limited | usage_limited | achieved | cancelled
  string status = 4;
  // user (z UI) | provider (model albo harness sam ustawił cel)
  string created_by = 5;
  uint64 token_budget = 6;        // 0 = bez limitu (Codex tokenBudget)
  uint64 tokens_used = 7;         // według harnessu (Codex tokensUsed)
  uint64 time_used_seconds = 8;
  // Codex: tury kontynuacji celu; Claude: oceny ewaluatora.
  uint32 iterations = 9;
  // Werdykt ewaluatora (Claude), powód blokady albo zatrzymania.
  string last_reason = 10;
  // Ostatni status zgłoszony przez harness (Codex: active, paused, complete, ...; Claude: active, met, failed, cleared).
  string native_status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  // Ostatnia komenda celu nie powiodła się na workerze (np. SetGoal: wątek nie dał się wznowić).
  // Status wraca wtedy do ostatniego stanu harnessu (cel, którego harness nigdy nie potwierdził: blocked).
  // Czyszczone przy następnej udanej komendzie celu.
  string error = 70;
  google.protobuf.Timestamp error_at = 71;
}

message SetGoalRequest {
  string thread_id = 1;
  // set (nowy cel; zastępuje otwarty) | pause | resume | clear
  string action = 2;
  // set: wymagany.
  string objective = 3;
  // set: budżet tokenów harnessu (Codex); 0 = bez limitu. Claude go nie obsługuje.
  uint64 token_budget = 4;
}

message SetGoalResponse {
  Goal goal = 1;
}

message StopBackgroundTaskRequest {
  string thread_id = 1;
  // item_id itemu background_task z osi czasu.
  string item_id = 2;
}

message StopBackgroundTaskResponse {}

// ---------- Projekt na workerach ----------
// Projekt żyje na workerach, na których ma workspace (katalog). Nowy wątek wybiera projekt, potem worker
// spośród jego workspace'ów (docs/ui-api.md).

// Nieustawione pole = bez zmian. Istniejące wątki zostają w swoim katalogu (cwd wątku jest jego własny).
message UpdateWorkspaceRequest {
  string workspace_id = 1;
  // Nowy katalog na tym samym workerze (te same reguły co przy CreateWorkspace).
  optional string root_path = 2;
  optional string label = 3;
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

// Usunięcie projektu z workera (archiwizacja workspace'u): nowe wątki nie mogą go już wybrać, istniejące
// działają dalej (wiadomości, wątki boczne i forki w tym samym katalogu).
message RemoveWorkspaceRequest {
  string workspace_id = 1;
}

message RemoveWorkspaceResponse {}

// ---------- Globalne instancje dostawców ----------
// Instancja = dostawca (harness: Claude Code, Codex) + id, zdefiniowana raz w gateway i włączana na wybranych
// workerach (docs/worker-config.md, sekcja 9). Wbudowane instancje "native" (logowanie CLI na urządzeniu) istnieją
// zawsze dla obu dostawców: nie da się ich usunąć ani zmienić ich połączenia. Sekrety (klucz API, zmienne oznaczone
// jako sekret) nigdy nie wracają do UI: jest tylko informacja, że są ustawione.

message ProfileEnvVarSettings {
  string name = 1;
  bool secret = 2;
  // Tylko dla zmiennych jawnych; sekret ma zawsze pustą wartość.
  string value = 3;
}

message ProfileEnvVarInput {
  string name = 1;
  bool secret = 2;
  // Jawna: wartość (nieustawiona = pusta). Sekret: nieustawiona = bez zmian (zmienna o tej nazwie musi już być sekretem).
  optional string value = 3;
}

// Jak worker uruchamia harness instancji. Puste = ustawienia workera (izolowany katalog w data_dir, logowanie
// urządzenia dowiązane z domyślnego katalogu domowego CLI).
message InstanceRuntime {
  string binary_path = 1;
  // Katalog CLI właściciela urządzenia (CODEX_HOME / CLAUDE_CONFIG_DIR), z którego dowiązywane jest logowanie.
  string home_path = 2;
  // Izolowany katalog harnessu instancji (stan i sesje; z own_login także logowanie).
  string shadow_home_path = 3;
  repeated string launch_args = 4;
  // Własne logowanie instancji (np. ChatGPT przez StartProviderLogin) zamiast logowania urządzenia.
  bool own_login = 5;
}

// Modele instancji w pickerach. Model widoczny = jest w shown albo (dostawca go nie ukrywa i nie ma go w hidden).
message InstanceModels {
  // Ulubione w kolejności użytkownika: w pickerze pierwsze, z ⌘1…⌘9.
  repeated string favorites = 1;
  repeated string hidden = 2;
  // Modele ukryte przez dostawcę (np. Codex hidden), które użytkownik pokazał.
  repeated string shown = 3;
  // Własne id modeli spoza katalogu (bez danych o wysiłku).
  repeated string custom = 4;
}

// Nadpisania na jednym workerze (np. ścieżki zależne od systemu). Nieustawione = definicja globalna.
message InstanceOverrides {
  optional string binary_path = 1;
  optional string home_path = 2;
  optional string shadow_home_path = 3;
  // launch_args_set = argumenty tego workera zastępują globalne (także pustą listą).
  bool launch_args_set = 4;
  repeated string launch_args = 5;
  // Zmienne dodane albo zastąpione (po nazwie) na tym workerze.
  repeated ProfileEnvVarSettings env = 6;
  // Endpoint: inny adres albo klucz na tym workerze (np. inna sieć).
  optional string base_url = 7;
  bool api_key_set = 8;
}

message InstanceOverridesInput {
  optional string binary_path = 1;
  optional string home_path = 2;
  optional string shadow_home_path = 3;
  bool launch_args_set = 4;
  repeated string launch_args = 5;
  // Pełna lista zmiennych tego workera (sekret bez wartości = bez zmian).
  repeated ProfileEnvVarInput env = 6;
  optional string base_url = 7;
  // Nieustawiony = bez zmian, pusty = bez własnego klucza (globalny), inaczej nowy klucz.
  optional string api_key = 8;
}

// Instancja na jednym workerze: włączenie, nadpisania i ostatni raport workera.
message InstanceOnWorker {
  string worker_id = 1;
  bool enabled = 2;
  // Wybór zapisany dla tego workera; false = wynika z all_workers.
  bool explicit = 3;
  InstanceOverrides overrides = 4;
  // Worker zgłosił instancję w ostatnim raporcie (ConfigApplied).
  bool reported = 5;
  bool available = 6;
  string detail = 7;
  string version = 8;
  string auth = 9;
  bool authenticated = 10;
  // Wątki (niezarchiwizowane) instancji na tym workerze.
  uint32 thread_count = 11;
  google.protobuf.Timestamp checked_at = 12;
  // Worker ma już wersję konfiguracji z bieżącą definicją instancji.
  bool synced = 13;
}

message ProviderInstance {
  openagents.worker.v1.Provider harness = 1;
  // Litery, cyfry, "-" i "_" (małe litery); stałe (wątki je zapisują). Unikalne w obrębie dostawcy.
  string id = 2;
  string label = 3;
  openagents.worker.v1.ProviderProfileKind kind = 4;
  // CLIPROXYAPI: adres endpointu.
  string base_url = 5;
  bool api_key_set = 6;
  repeated ProfileEnvVarSettings env = 7;
  InstanceRuntime runtime = 8;
  // Kolor akcentu w pickerze (#rrggbb); pusty = bez.
  string accent_color = 9;
  InstanceModels models = 10;
  // Działa na wszystkich workerach (także przyszłych), poza wyłączonymi wprost.
  bool all_workers = 11;
  bool built_in = 12;
  // Rośnie przy każdej zmianie definicji (expected_revision).
  uint64 revision = 13;
  uint32 thread_count = 14;
  // Każdy worker (niezarchiwizowany), także te, na których instancja jest wyłączona.
  repeated InstanceOnWorker workers = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// Instancja w Worker.provider_instances: to, czego potrzebują pickery.
message WorkerInstance {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  string label = 3;
  string accent_color = 4;
  bool enabled = 5;
  bool available = 6;
  string detail = 7;
  repeated string favorites = 8;
}

message ListProviderInstancesRequest {}

message ListProviderInstancesResponse {
  repeated ProviderInstance instances = 1;
}

message SaveProviderInstanceRequest {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  // true = nowa instancja (id nie może być zajęte), false = zmiana istniejącej.
  bool create = 3;
  string label = 4;
  openagents.worker.v1.ProviderProfileKind kind = 5;
  string base_url = 6;
  // Nieustawiony = bez zmian, pusty = usunięcie, inaczej nowy klucz.
  optional string api_key = 7;
  // Pełna lista: zastępuje dotychczasową.
  repeated ProfileEnvVarInput env = 8;
  InstanceRuntime runtime = 9;
  string accent_color = 10;
  // Wersja definicji, którą widział klient; inna = FailedPrecondition (BFF: 409). 0 = bez sprawdzania.
  uint64 expected_revision = 11;
  // Tylko przy tworzeniu: gdzie instancja działa (jak SetInstanceWorkers).
  bool all_workers = 12;
  repeated string worker_ids = 13;
}

message SaveProviderInstanceResponse {
  ProviderInstance instance = 1;
}

message DeleteProviderInstanceRequest {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  uint64 expected_revision = 3;
}

message DeleteProviderInstanceResponse {}

message SetInstanceWorkersRequest {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  bool all_workers = 3;
  // Bez all_workers: workery, na których instancja działa (pozostałe: wyłączona).
  repeated string worker_ids = 4;
}

message SetInstanceWorkersResponse {
  ProviderInstance instance = 1;
}

message SetInstanceWorkerRequest {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  string worker_id = 3;
  // Nieustawione = bez zmian.
  optional bool enabled = 4;
  // Nieustawione = bez zmian; ustawione = zastępuje nadpisania tego workera.
  InstanceOverridesInput overrides = 5;
}

message SetInstanceWorkerResponse {
  ProviderInstance instance = 1;
}

message SetInstanceModelsRequest {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  InstanceModels models = 3;
  // true = tylko ulubione (gwiazdka w pickerze); pozostałe listy bez zmian.
  bool favorites_only = 4;
}

message SetInstanceModelsResponse {
  ProviderInstance instance = 1;
}

message RefreshProvidersRequest {
  // Pusty = wszystkie workery online.
  string worker_id = 1;
}

message RefreshProvidersResponse {
  repeated ProviderInstance instances = 1;
  // Workery, które nie odpowiedziały (offline, starsza wersja, błąd), z powodem.
  repeated string skipped = 2;
}

message StartProviderLoginRequest {
  openagents.worker.v1.Provider harness = 1;
  string id = 2;
  string worker_id = 3;
}

message StartProviderLoginResponse {
  string verification_url = 1;
  string user_code = 2;
}

// ---------- Cytaty (docs/ui-api.md, "Cytaty") ----------

// Fragment tego, co agent wytworzył w wątku (odpowiedź, rozumowanie, wynik polecenia, wywołanie narzędzia,
// kod, diff), zacytowany przez użytkownika w wiadomości.
message Quote {
  // Dokładnie zaznaczony tekst, tak jak go widać (bez znaczników markdown), z podziałami linii.
  string text = 1;
  // Komentarz użytkownika do cytatu (opcjonalny).
  string comment = 2;
  // Item, z którego pochodzi cytat (Item.item_id), i wątek tego itemu (także odziedziczona historia forka).
  string source_item_id = 3;
  string source_thread_id = 4;
  // agent_message | reasoning | command_output | tool_call | code | diff; pusty = nieznany (tekst).
  // command_output, tool_call, code i diff trafiają do agenta jako blok kodu.
  string source_kind = 5;
  // Język bloku kodu (np. "ts"), gdy cytat pochodzi z bloku kodu z językiem; inaczej pusty.
  string language = 6;
}

// ---------- Załączniki (docs/ui-api.md) ----------

// Plik dołączony do wiadomości. Gateway sam rozpoznaje typ po treści (nie po nazwie ani typie z przeglądarki).
message Attachment {
  string id = 1;
  // Nazwa bez katalogów i znaków sterujących (taka trafia na workera).
  string name = 2;
  string mime_type = 3;
  // image (png, jpeg, gif, webp: podgląd w UI) | file (reszta, także SVG i HEIC)
  string kind = 4;
  uint64 size_bytes = 5;
  uint32 width = 6;
  uint32 height = 7;
  string sha256 = 8;
  // Obraz ma miniaturę (GetAttachment.thumbnail).
  bool has_thumbnail = 9;
}

message AttachmentLimits {
  uint64 max_file_bytes = 1;
  uint64 max_message_bytes = 2;
  uint32 max_files = 3;
}

message UploadAttachmentRequest {
  string name = 1;
  bytes data = 2;
}

message UploadAttachmentResponse {
  Attachment attachment = 1;
}

message GetAttachmentRequest {
  string attachment_id = 1;
  // Miniatura obrazu (WebP, do 512 px) zamiast pliku.
  bool thumbnail = 2;
}

message GetAttachmentResponse {
  Attachment attachment = 1;
  bytes data = 2;
  string mime_type = 3;
}

// Podgląd obrazu z transkryptu wątku (Image.blob, ToolCall.images), tylko dla właściciela wątku.
message GetThreadBlobRequest {
  string thread_id = 1;
  string sha256 = 2;
}

message GetThreadBlobResponse {
  bytes data = 1;
  string mime_type = 2;
}

// ---------- Kolejka ----------
// Błędy: tura, która już ruszyła (gateway wysłał jej StartTurn) albo nie jest już w kolejce = FailedPrecondition
// z powodem; klient ma stan z ThreadUpdate.turn. Każda zmiana idzie do wszystkich klientów jako ThreadUpdate.turn
// (kolejność = Turn.ordinal; tura z withdrawn znika z kolejki).

// Nowa kolejność: podane tury dostają, w tej kolejności, miejsca (ordinal), które zajmują razem; tury kolejki,
// których klient nie zna (przyszły w międzyczasie), zostają na swoich miejscach.
message ReorderQueuedTurnsRequest {
  string thread_id = 1;
  repeated string turn_ids = 2;
}

message ReorderQueuedTurnsResponse {
  // Podane tury po zmianie, w nowej kolejności.
  repeated Turn turns = 1;
}

// Nowy tekst wiadomości w kolejce (tylko tury użytkownika). Nadpisania (model, wysiłek, tryb) i załączniki zostają;
// wejście składa się jak w SendMessage (notatka załączników, wzmianki). „/goal” nie czeka w kolejce (InvalidArgument).
message EditQueuedTurnRequest {
  string turn_id = 1;
  string text = 2;
  // Turn.revision, od której klient zaczął (inna = FailedPrecondition: ktoś zmienił ją wcześniej).
  uint32 expected_revision = 3;
  // Wzmianki w nowym tekście (jak SendMessage.mentions); puste = bez wzmianek.
  repeated openagents.worker.v1.Mention mentions = 4;
}

message EditQueuedTurnResponse {
  Turn turn = 1;
}

// Usuwa wiadomość użytkownika z kolejki (status cancelled, withdrawn = deleted).
message DeleteQueuedTurnRequest {
  string turn_id = 1;
}

message DeleteQueuedTurnResponse {
  Turn turn = 1;
}

// Cofnięcie DeleteQueuedTurn: tura wraca do kolejki na swoje miejsce.
message RestoreQueuedTurnRequest {
  string turn_id = 1;
}

message RestoreQueuedTurnResponse {
  Turn turn = 1;
}

// Wiadomość z kolejki idzie teraz do tury w toku (jak SendMessage z delivery = STEER): tura wychodzi z kolejki
// (withdrawn = steered) w tej samej transakcji, w której powstaje steer. Bez tury w toku = FailedPrecondition i
// wiadomość zostaje w kolejce. Tylko wiadomości użytkownika bez załączników.
message SteerQueuedTurnRequest {
  string turn_id = 1;
}

message SteerQueuedTurnResponse {
  Steer steer = 1;
  Turn turn = 2;
}

// ---------- Wzmianki w kompozytorze (docs/ui-api.md, "Wzmianki") ----------
// Wyzwalacze w kompozytorze: "/" komendy, "$" skille i pluginy (jak w Codexie), "@" pliki, "#" wątki.

// Gdzie: istniejący wątek (thread_id) albo nowy (workspace, dostawca, profil, opcjonalnie katalog).
message MentionScope {
  string thread_id = 1;
  string workspace_id = 2;
  openagents.worker.v1.Provider provider = 3;
  string provider_profile_id = 4;
  // Pusty = katalog wątku albo główny workspace'u.
  string cwd = 5;
}

message ListMentionCatalogRequest {
  MentionScope scope = 1;
  // Od nowa z workera (bez pamięci podręcznej gateway i workera).
  bool refresh = 2;
}

message ListMentionCatalogResponse {
  // Komendy, skille i pluginy harnessu oraz komendy platformy (source = platform).
  openagents.worker.v1.MentionCatalog catalog = 1;
}

message SearchFilesRequest {
  MentionScope scope = 1;
  string query = 2;
  uint32 limit = 3;
}

message SearchFilesResponse {
  openagents.worker.v1.FileSearchResult result = 1;
}

message SearchThreadsRequest {
  // Pusty = najnowsze wątki.
  string query = 1;
  // Bez tego wątku (zwykle bieżący).
  string exclude_thread_id = 2;
  // 0 = 20; najwyżej 50.
  uint32 limit = 3;
}

message SearchThreadsResponse {
  // Najpierw najlepiej pasujące, przy równym dopasowaniu najnowsza aktywność.
  repeated Thread threads = 1;
}

// ---------- Stan przeczytania ----------

message MarkThreadSeenRequest {
  string thread_id = 1;
  // Ostatnie zdarzenie wątku na ekranie użytkownika (ThreadEvent.seq); znacznik tylko rośnie, najwyżej do Thread.last_seq.
  uint64 up_to_seq = 2;
}

message MarkThreadSeenResponse {
  Thread thread = 1;
}

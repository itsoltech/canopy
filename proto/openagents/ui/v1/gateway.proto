// API gateway dla UI (Svelte). Gateway jest jedynym stanem globalnym; UI tylko czyta i wysyła akcje.
// Transkrypt (Item, ThreadEvent) to te same typy co w kanale gateway <-> worker.
// Opis: docs/ui-api.md
syntax = "proto3";

package openagents.ui.v1;

import "google/protobuf/timestamp.proto";
import "openagents/worker/v1/worker_link.proto";

service GatewayService {
  // Workery, projekty z workspace'ami i agenci: to, czego UI potrzebuje na start.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // Na żywo: zmiany workerów (online, konfiguracja) i wątków (status, oczekujące interakcje).
  rpc WatchOverview(WatchOverviewRequest) returns (stream OverviewUpdate);

  // Przeglądanie katalogów na workerze (w dozwolonych katalogach) przy wyborze workspace'u.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);

  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc InterruptThread(InterruptThreadRequest) returns (InterruptThreadResponse);
  rpc AnswerInteraction(AnswerInteractionRequest) returns (AnswerInteractionResponse);

  // Najpierw snapshot (wątek, tury, itemy, interakcje), potem zmiany na żywo od snapshot.last_seq.
  rpc WatchThread(WatchThreadRequest) returns (stream ThreadUpdate);

  // Harmonogram platformy (docs/agent-bus.md#5-harmonogram): tworzony przez użytkownika albo agenta.
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  // Podgląd: najbliższe terminy cronu w strefie (albo błąd walidacji), bez tworzenia harmonogramu.
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse);
  // Wstrzymanie, wznowienie albo anulowanie.
  rpc SetScheduleStatus(SetScheduleStatusRequest) returns (SetScheduleStatusResponse);

  // Ustawienia użytkownika i projektów. Przechowuje je gateway; przeglądarka jest tylko klientem.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse);
  rpc UpdateProjectSettings(UpdateProjectSettingsRequest) returns (UpdateProjectSettingsResponse);

  // Modele, effort i steer (sekcja na końcu pliku).
  // Katalog modeli workerów (dostawca -> profil -> modele z wysiłkami rozumowania); refresh = lista od nowa z workera.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  // Domyślny model i wysiłek wątku (kolejne tury bez nadpisania w wiadomości).
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse);
  // Cel harnessu w wątku (docs/goals.md): ustawienie, pauza, wznowienie, usunięcie.
  rpc SetGoal(SetGoalRequest) returns (SetGoalResponse);
  // Zatrzymanie zadania w tle (proces Codexa, background Bash Claude; docs/execution.md).
  rpc StopBackgroundTask(StopBackgroundTaskRequest) returns (StopBackgroundTaskResponse);

  // Projekt na workerach (sekcja na końcu pliku): zmiana katalogu workspace'u i usunięcie projektu z workera.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  rpc RemoveWorkspace(RemoveWorkspaceRequest) returns (RemoveWorkspaceResponse);

  // Profile dostawców workera (sekcja na końcu pliku): własne profile, zmienne środowiskowe, wybór modeli.
  rpc ListProviderProfiles(ListProviderProfilesRequest) returns (ListProviderProfilesResponse);
  // Nowy albo zmieniony profil: nowa wersja konfiguracji workera, wysłana do niego od razu, gdy jest online.
  rpc SaveProviderProfile(SaveProviderProfileRequest) returns (SaveProviderProfileResponse);
  // Usunięcie profilu, którego nie używa żaden wątek (używany: FailedPrecondition, można go wyłączyć).
  rpc DeleteProviderProfile(DeleteProviderProfileRequest) returns (DeleteProviderProfileResponse);
  // Które modele katalogu profilu widać w pickerach (gateway filtruje ListModels i OverviewUpdate.models).
  rpc SetModelSelection(SetModelSelectionRequest) returns (SetModelSelectionResponse);

  // Załączniki (sekcja na końcu pliku): plik użytkownika do wiadomości, jego bajty i podglądy obrazów z transkryptu.
  rpc UploadAttachment(UploadAttachmentRequest) returns (UploadAttachmentResponse);
  rpc GetAttachment(GetAttachmentRequest) returns (GetAttachmentResponse);
  rpc GetThreadBlob(GetThreadBlobRequest) returns (GetThreadBlobResponse);

  // Stan przeczytania (sekcja na końcu pliku): użytkownik widział wątek do zdarzenia up_to_seq (ostatnia wiadomość
  // agenta była na ekranie); Thread.unseen_result gaśnie na wszystkich urządzeniach (OverviewUpdate.thread).
  rpc MarkThreadSeen(MarkThreadSeenRequest) returns (MarkThreadSeenResponse);
}

// ---------- Model ----------

message Worker {
  string id = 1;
  string name = 2;
  bool online = 3;
  string hostname = 4;
  string os = 5;
  string version = 6;
  repeated openagents.worker.v1.ProviderInfo providers = 7;
  repeated openagents.worker.v1.ProviderProfile profiles = 8;
  repeated string allowed_roots = 9;
  uint64 config_version = 10;
  uint64 applied_version = 11;
  repeated openagents.worker.v1.ConfigIssue config_issues = 12;
  google.protobuf.Timestamp last_seen_at = 13;
}

message Project {
  string id = 1;
  string name = 2;
  string slug = 3;
  repeated Workspace workspaces = 4;
}

message Workspace {
  string id = 1;
  string project_id = 2;
  string worker_id = 3;
  string root_path = 4;
  string label = 5;
}

message Agent {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  openagents.worker.v1.Provider provider = 5;
  string model = 6;
  bool global = 7;
}

enum ThreadKind {
  THREAD_KIND_UNSPECIFIED = 0;
  THREAD_KIND_MAIN = 1;
  THREAD_KIND_SIDE = 2;
}

message Thread {
  string id = 1;
  string project_id = 2;
  ThreadKind kind = 3;
  string parent_thread_id = 4;
  string title = 5;
  openagents.worker.v1.Provider provider = 6;
  string provider_profile_id = 7;
  string model = 8;
  openagents.worker.v1.PermissionMode permission_mode = 9;
  string worker_id = 10;
  string workspace_id = 11;
  string cwd = 12;
  // creating | idle | running | waiting_input | interrupted | failed | archived
  string status = 13;
  string agent_id = 14;
  bool spawned_by_agent = 15;
  string status_detail = 16;   // np. błąd utworzenia u dostawcy
  uint64 last_seq = 17;
  google.protobuf.Timestamp created_at = 18;
  uint32 pending_interactions = 19;
  // Fork: wątek, którego historię dziedziczy (pusty, gdy to nie fork).
  string fork_source_thread_id = 20;
  // Wątek główny drzewa (dla wątku głównego: on sam).
  string root_thread_id = 21;
  // human | parent: kto odpowiada na zgody i pytania wątku (wątki agentów: parent).
  string interaction_route = 22;
  // Ostatnia zmiana: utworzenie, kolejkowanie, start albo koniec tury.
  google.protobuf.Timestamp last_activity_at = 23;
  // Domyślny wysiłek rozumowania wątku (pusty = domyślny modelu); model domyślny to pole model.
  string effort = 40;

  // Cele i praca w tle (numery od 60, osobno od innych zmian kontraktu).
  // Status bieżącego celu (Goal.status) albo pusty, gdy wątek nie ma otwartego celu.
  string goal_status = 60;
  // Zadania w tle w toku (itemy background_task ze statusem in_progress).
  uint32 background_tasks = 61;

  // Numery od 70: restart workera i błędy komend celu.
  // gateway (agent czatowy w gateway: bez celów i pracy w tle) | worker (wątek dostawcy na workerze)
  string runtime = 70;

  // Numery od 95: subagenci platformy (docs/agent-bus.md).
  // Wątki boczne: początek ostatniej wiadomości agenta (wynik subagenta) do karty w wątku rodzica. Główne: pusty.
  string last_message = 95;

  // Numery od 180: stan przeczytania. Wynik ostatniej zakończonej tury, której użytkownik jeszcze nie widział
  // (completed | failed | interrupted); pusty, gdy widział wszystko (MarkThreadSeen).
  string unseen_result = 180;
}

message Turn {
  string id = 1;
  uint32 ordinal = 2;
  // queued | running | completed | interrupted | failed | cancelled
  string status = 3;
  // user | agent_bus | schedule | interaction | goal | provider | recovery
  string trigger = 4;
  string input_text = 5;
  string error = 6;
  google.protobuf.Timestamp queued_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  // Zużycie tokenów i koszt (z turn_finished).
  openagents.worker.v1.Usage usage = 10;
  // Długość łańcucha agent → agent bez udziału człowieka (docs/agent-bus.md).
  uint32 hops = 11;
  // Tura z historii odziedziczonej przez fork (należy do wątku źródłowego).
  bool inherited = 12;
  // Odziedziczona tura: wątek, do którego należy (w łańcuchu forków nie zawsze bezpośrednie źródło).
  string from_thread_id = 13;
  // Skąd przyszło wejście tury (puste dla użytkownika i tur dostawcy):
  // task (spawn_thread) | message (send_message) | report (powiadomienie: wątek docelowy skończył turę)
  // | question (wątek boczny pyta rodzica) | schedule (harmonogram)
  string source_kind = 14;
  // Wątek, od którego tura pochodzi: zlecający (task, message), raportujący (report), pytający (question),
  // a dla harmonogramu agenta wątek, który go utworzył.
  string source_thread_id = 15;
  string schedule_id = 16;
  string interaction_request_id = 17;
  // Treść wejścia bez notatki platformy: wiadomość użytkownika, zadanie, wiadomość agenta, raport
  // (ostatnia wiadomość wątku docelowego) albo polecenie harmonogramu. input_text = notatka + treść,
  // dokładnie to, co dostał model.
  string message_text = 18;
  // Notatka platformy przed treścią (np. "[open-agents] Task from the thread …"); pusta dla użytkownika.
  string platform_note = 19;
  // report: jak skończyła się tura wątku docelowego (completed | interrupted | failed | cancelled).
  string source_status = 20;
  // question: rodzaj pytania (permission | question | elicitation) i narzędzie, którego dotyczy.
  string question_kind = 21;
  string question_tool = 22;
  // Model i wysiłek tury: nadpisanie z wiadomości; od startu tury wartości faktycznie wysłane do workera
  // (z domyślnymi wątku). Puste = domyślne profilu.
  string model = 40;
  string effort = 41;

  // Cel, nad którym pracowała tura (tura celu albo kontynuacja dostawcy w trakcie celu).
  string goal_id = 60;

  // Dlaczego tura została przerwana (status interrupted), np. „worker restarted”: worker już jej nie prowadzi
  // (restart procesu), „superseded: …”, albo powód od dostawcy. Pusty dla innych statusów.
  string interrupt_reason = 70;

  // Status failed: skąd błąd — platform (nasza strona: gateway, worker, adapter, połączenie) albo harness
  // (Codex/Claude zgłosił błąd). Treść w error. Pusty dla innych statusów.
  string error_source = 72;
  // Status interrupted: kto przerwał — user (użytkownik albo agent rodzica) albo system (np. restart workera
  // w trakcie tury). Powód w interrupt_reason. Tura przerwana przez system może być kontynuowana („Continue”).
  string interrupt_source = 73;
  // Krótki kod błędu (np. „http_connection_failed:401”, „error_max_turns”, „process_exit”), jeśli jest.
  string error_code = 74;

  // Numery od 90: tryb uprawnień tury. Nadpisanie z wiadomości (UNSPECIFIED = domyślny wątku); od startu tury
  // tryb faktycznie wysłany do workera.
  openagents.worker.v1.PermissionMode permission_mode = 90;
  // Pliki dołączone do wiadomości (numery od 110). Ich ścieżki na workerze są w platform_note.
  repeated Attachment attachments = 110;
}

// Item na osi czasu z zakresem seq (first_seq..last_seq).
message TimelineItem {
  openagents.worker.v1.Item item = 1;
  string turn_id = 2;
  uint64 first_seq = 3;
  uint64 last_seq = 4;
  // Item z historii odziedziczonej przez fork (first_seq/last_seq liczone w wątku źródłowym).
  bool inherited = 5;
  // Odziedziczony item: wątek, do którego należy.
  string from_thread_id = 6;
}

// Komunikat dostawcy albo platformy na osi czasu (np. ponowienie po błędzie API).
message ThreadNotice {
  uint64 seq = 1;
  string turn_id = 2;
  openagents.worker.v1.Notice notice = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message Interaction {
  string request_id = 1;
  string thread_id = 2;
  string turn_id = 3;
  string item_id = 4;
  openagents.worker.v1.InteractionKind kind = 5;
  string tool_name = 6;
  string request_json = 7;
  // pending | allowed | declined | answered | expired | cancelled
  string status = 8;
  string routed_to = 9;
  google.protobuf.Timestamp created_at = 10;
}

// ---------- Overview ----------

message GetOverviewRequest {}

message GetOverviewResponse {
  repeated Worker workers = 1;
  repeated Project projects = 2;
  repeated Agent agents = 3;
}

message WatchOverviewRequest {}

message OverviewUpdate {
  oneof change {
    Worker worker = 1;
    Thread thread = 2;
    Project project = 3;
    Schedule schedule = 4;
    // Zmiana z innego urządzenia albo karty.
    UserSettings user_settings = 5;
    ProjectSettings project_settings = 6;
    // Nowy katalog modeli workera.
    WorkerModels models = 40;
  }
}

// ---------- Katalogi, projekty, workspace'y ----------

message ListDirectoryRequest {
  string worker_id = 1;
  string path = 2; // pusty = dozwolone katalogi workera
}

message ListDirectoryResponse {
  repeated openagents.worker.v1.DirectoryEntry entries = 1;
}

message CreateProjectRequest {
  string name = 1;
}

message CreateProjectResponse {
  Project project = 1;
}

message CreateWorkspaceRequest {
  string project_id = 1;
  string worker_id = 2;
  string root_path = 3;
  string label = 4;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

// ---------- Wątki ----------

message ListThreadsRequest {
  // Pusty = wątki wszystkich projektów użytkownika.
  string project_id = 1;
}

message GetThreadRequest {
  string thread_id = 1;
}

message GetThreadResponse {
  Thread thread = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message CreateThreadRequest {
  string project_id = 1;
  string workspace_id = 2;
  // Pusty = katalog główny workspace'u.
  string cwd = 3;
  string title = 4;
  openagents.worker.v1.Provider provider = 5;
  string provider_profile_id = 6;
  string model = 7;
  openagents.worker.v1.PermissionMode permission_mode = 8;
  string instructions = 9;
  // Wątek boczny: rodzic (ten sam workspace i katalog), opcjonalnie fork historii rodzica.
  string parent_thread_id = 10;
  bool fork = 11;
  // Pierwsza wiadomość (opcjonalnie).
  string initial_message = 12;
  // Idempotencja ponowień z UI.
  string client_request_id = 13;
  // Domyślny wysiłek rozumowania wątku (pusty = domyślny modelu).
  string effort = 40;
  // Załączniki pierwszej wiadomości (UploadAttachment).
  repeated string initial_attachment_ids = 110;
}

message CreateThreadResponse {
  Thread thread = 1;
}

message SendMessageRequest {
  string thread_id = 1;
  string text = 2;
  string client_request_id = 3;
  // Nadpisanie modelu i wysiłku tylko dla tej tury (puste = domyślne wątku). Steer ich nie używa
  // (tura już trwa); obowiązują, gdy wiadomość trafi do kolejki.
  string model = 40;
  string effort = 41;
  MessageDelivery delivery = 42;
  // Numery od 90: tryb uprawnień tury.
  // Nadpisanie trybu uprawnień tylko dla tej tury (UNSPECIFIED = domyślny wątku). Steer dołącza do tury
  // w toku i zostaje przy jej trybie; nadpisanie obowiązuje, gdy wiadomość trafi do kolejki.
  openagents.worker.v1.PermissionMode permission_mode = 90;
  // Załączniki (UploadAttachment). Wiadomość z załącznikami zawsze idzie do kolejki (nie steer).
  repeated string attachment_ids = 110;
}

message SendMessageResponse {
  // Wiadomość jako tura (kolejka, także steer bez tury w toku).
  Turn turn = 1;
  // Wiadomość dołączona do tury w toku (delivery = STEER).
  Steer steer = 40;
}

message InterruptThreadRequest {
  string thread_id = 1;
}

message InterruptThreadResponse {}

message AnswerInteractionRequest {
  string request_id = 1;
  bool allow = 2;
  bool allow_for_session = 3;
  string message = 4;
  string answer_json = 5;
  bool cancelled = 6;
}

message AnswerInteractionResponse {
  Interaction interaction = 1;
}

message WatchThreadRequest {
  string thread_id = 1;
}

message ThreadSnapshot {
  Thread thread = 1;
  repeated Turn turns = 2;
  repeated TimelineItem items = 3;
  repeated Interaction interactions = 4;
  // Zdarzenia na żywo zaczynają się od last_seq + 1.
  uint64 last_seq = 5;
  // Ostatnie komunikaty (do 200); nowe przychodzą jako zdarzenia.
  repeated ThreadNotice notices = 6;
  // Aktywne i wstrzymane harmonogramy wątku.
  repeated Schedule schedules = 7;
  // Wiadomości dołączone do tur w toku (steer), od najstarszej.
  repeated Steer steers = 40;
  // Bieżący cel albo ostatni zakończony (brak = wątek nigdy nie miał celu).
  Goal goal = 60;
}

message ThreadEventUpdate {
  uint64 seq = 1;
  openagents.worker.v1.ThreadEvent event = 2;
}

message ThreadUpdate {
  oneof change {
    ThreadSnapshot snapshot = 1;
    ThreadEventUpdate event = 2;
    Thread thread = 3;
    Turn turn = 4;
    Interaction interaction = 5;
    Schedule schedule = 6;
    Steer steer = 40;
    Goal goal = 60;
  }
}

// ---------- Harmonogram ----------

message Schedule {
  string id = 1;
  string thread_id = 2;
  string project_id = 3;
  // once | recurring
  string kind = 4;
  string prompt = 5;
  // once: termin.
  google.protobuf.Timestamp run_at = 6;
  // recurring: cron (pięć pól) w strefie timezone.
  string cron = 7;
  string timezone = 8;
  google.protobuf.Timestamp until = 9;
  uint32 max_runs = 10;     // 0 = bez limitu
  uint32 runs = 11;
  google.protobuf.Timestamp next_run_at = 12;
  // active | paused | completed | cancelled
  string status = 13;
  // run_once | skip: co po przestoju
  string missed_policy = 14;
  // user | agent
  string created_by = 15;
  // Agent: wątek, który utworzył harmonogram.
  string created_by_thread_id = 16;
  string last_turn_id = 17;
  google.protobuf.Timestamp created_at = 18;
}

message ListSchedulesRequest {
  // Filtry (oba puste = wszystkie harmonogramy użytkownika).
  string project_id = 1;
  string thread_id = 2;
  // Także zakończone i anulowane.
  bool include_finished = 3;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
}

message CreateScheduleRequest {
  string thread_id = 1;
  string prompt = 2;
  oneof when {
    google.protobuf.Timestamp run_at = 3;
    string cron = 4;
  }
  string timezone = 5;      // pusty = UTC
  google.protobuf.Timestamp until = 6;
  uint32 max_runs = 7;
  string missed_policy = 8; // pusty = run_once
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

message PreviewScheduleRequest {
  string cron = 1;
  string timezone = 2;   // pusty = UTC
  uint32 count = 3;      // ile terminów, 1..20 (0 = 5)
}

message PreviewScheduleResponse {
  repeated google.protobuf.Timestamp next_runs = 1;
}

message SetScheduleStatusRequest {
  string schedule_id = 1;
  // active (wznowienie wstrzymanego) | paused | cancelled. Zakończonego ani anulowanego nie da się wznowić.
  string status = 2;
}

message SetScheduleStatusResponse {
  Schedule schedule = 1;
}

// ---------- Ustawienia ----------

enum ColorScheme {
  COLOR_SCHEME_UNSPECIFIED = 0; // = system
  COLOR_SCHEME_SYSTEM = 1;
  COLOR_SCHEME_LIGHT = 2;
  COLOR_SCHEME_DARK = 3;
}

enum AccentTheme {
  ACCENT_THEME_UNSPECIFIED = 0; // = default
  ACCENT_THEME_DEFAULT = 1;
  ACCENT_THEME_GROVE = 2;
  ACCENT_THEME_OCEAN = 3;
  ACCENT_THEME_EMBER = 4;
  ACCENT_THEME_IRIS = 5;
  ACCENT_THEME_ROSE = 6;
}

enum ChatWidth {
  CHAT_WIDTH_UNSPECIFIED = 0; // = comfortable
  CHAT_WIDTH_COMFORTABLE = 1;
  CHAT_WIDTH_WIDE = 2;
  CHAT_WIDTH_FULL = 3;
}

message AppearanceSettings {
  ColorScheme color_scheme = 1;
  AccentTheme accent = 2;
  ChatWidth chat_width = 3;
  // Panel kontekstu wątku zwinięty.
  bool thread_panel_collapsed = 4;
  // Szerokość paska bocznego na desktopie w px; 0 = domyślna. Gateway przycina do granic
  // (@open-agents/domain SIDEBAR_WIDTH), UI dodatkowo do szerokości okna.
  uint32 sidebar_width = 130;
  // Pasek boczny na desktopie zwinięty (szerokość zostaje zapisana na powrót).
  bool sidebar_collapsed = 131;
}

// Wartości startowe nowego wątku. Puste pole = bez preferencji.
message ThreadDefaults {
  string workspace_id = 1;
  openagents.worker.v1.Provider provider = 2;
  // Pusty albo "native" = profil natywny.
  string provider_profile_id = 3;
  reserved 4;
  reserved "model";
  openagents.worker.v1.PermissionMode permission_mode = 5;
  // Model per dostawca (zmiana dostawcy w nowym wątku zachowuje model każdego z nich). Brak = model profilu.
  repeated ProviderModel models = 6;
}

message ProviderModel {
  openagents.worker.v1.Provider provider = 1;
  string model = 2;
}

message UserSettings {
  AppearanceSettings appearance = 1;
  ThreadDefaults thread_defaults = 2;
  // Rośnie przy każdej zmianie; 0 = jeszcze nie zapisane.
  uint64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
  ModelFavorites model_favorites = 40;
}

// Ustawienia projektu; nadpisują domyślne wartości użytkownika w tym projekcie.
message ProjectSettings {
  string project_id = 1;
  ThreadDefaults thread_defaults = 2;
  uint64 version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  UserSettings user = 1;
  repeated ProjectSettings projects = 2;
  // Limity załączników gateway (kompozytor sprawdza je przed wysłaniem).
  AttachmentLimits attachment_limits = 110;
}

// Ustawione sekcje zastępują zapisane; nieustawione zostają.
message UpdateUserSettingsRequest {
  AppearanceSettings appearance = 1;
  ThreadDefaults thread_defaults = 2;
  // Wersja, od której klient zaczął zmianę (konflikt = FailedPrecondition, klient pobiera ustawienia od nowa).
  uint64 expected_version = 3;
  ModelFavorites model_favorites = 40;
}

message UpdateUserSettingsResponse {
  UserSettings settings = 1;
}

message UpdateProjectSettingsRequest {
  string project_id = 1;
  ThreadDefaults thread_defaults = 2;
  uint64 expected_version = 3;
}

message UpdateProjectSettingsResponse {
  ProjectSettings settings = 1;
}

// ---------- Modele, effort i steer ----------

// Jak dostarczyć wiadomość, gdy w wątku trwa tura.
enum MessageDelivery {
  MESSAGE_DELIVERY_UNSPECIFIED = 0; // = QUEUE
  // Następna tura (po bieżącej).
  MESSAGE_DELIVERY_QUEUE = 1;
  // Do tury w toku (Codex turn/steer, Claude strumień wejścia). Bez tury w toku działa jak QUEUE;
  // gdy tura skończy się wcześniej albo dostawca odmówi, wiadomość trafia do kolejki z powodem (Steer.reason).
  MESSAGE_DELIVERY_STEER = 2;
}

// Wiadomość dołączona do tury w toku. W transkrypcie to item user_message z client_id = id w tej turze,
// w miejscu, w którym weszła.
message Steer {
  string id = 1;
  string thread_id = 2;
  // Tura, do której ma trafić.
  string turn_id = 3;
  string text = 4;
  // pending (czeka na workera) | accepted (dostawca przyjął) | delivered (weszła do tury: item user_message)
  // | queued (nie weszła; jest następną turą queued_turn_id, powód w reason) | failed
  string status = 5;
  string reason = 6;
  string queued_turn_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // Autor: użytkownik albo wątek agenta (send_message z delivery = steer).
  string source_thread_id = 9;
}

// Katalog modeli jednego workera (z ostatniego raportu workera).
message WorkerModels {
  string worker_id = 1;
  repeated openagents.worker.v1.ProfileModels profiles = 2;
  // Wersja konfiguracji workera, dla której powstał.
  uint64 config_version = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message ListModelsRequest {
  // Pusty = wszystkie workery użytkownika.
  string worker_id = 1;
  // Lista od nowa z workera (musi być online); bez tego ostatni zapisany raport.
  bool refresh = 2;
  // Pełny katalog bez wyboru modeli profilu (ekran ustawień). Domyślnie modele odznaczone w wyborze mają hidden.
  bool unfiltered = 100;
}

message ListModelsResponse {
  repeated WorkerModels workers = 1;
}

message UpdateThreadRequest {
  string thread_id = 1;
  // Nieustawione = bez zmian; pusty = domyślny profilu / modelu.
  optional string model = 2;
  optional string effort = 3;
  // Domyślny tryb uprawnień wątku (tury bez nadpisania). Nieustawione albo UNSPECIFIED = bez zmian.
  optional openagents.worker.v1.PermissionMode permission_mode = 90;
}

message UpdateThreadResponse {
  Thread thread = 1;
}

// Ulubione modele w wyborze modelu (sekcja ustawień użytkownika, zastępowana w całości).
message ModelFavorites {
  repeated FavoriteModel models = 1;
}

message FavoriteModel {
  openagents.worker.v1.Provider provider = 1;
  // Pusty = dowolny profil z tym modelem.
  string profile_id = 2;
  string model = 3;
}
// ---------- Cele i praca w tle ----------

// Cel harnessu (docs/goals.md): silnikiem jest harness (Codex thread/goal, Claude /goal), platforma śledzi
// stan, zużycie i tury celu. Najwyżej jeden otwarty cel na wątek.
message Goal {
  string id = 1;
  string thread_id = 2;
  // Co ma być osiągnięte (Claude: warunek /goal).
  string objective = 3;
  // active | paused | blocked | budget_limited | usage_limited | achieved | cancelled
  string status = 4;
  // user (z UI) | provider (model albo harness sam ustawił cel)
  string created_by = 5;
  uint64 token_budget = 6;        // 0 = bez limitu (Codex tokenBudget)
  uint64 tokens_used = 7;         // według harnessu (Codex tokensUsed)
  uint64 time_used_seconds = 8;
  // Codex: tury kontynuacji celu; Claude: oceny ewaluatora.
  uint32 iterations = 9;
  // Werdykt ewaluatora (Claude), powód blokady albo zatrzymania.
  string last_reason = 10;
  // Ostatni status zgłoszony przez harness (Codex: active, paused, complete, ...; Claude: active, met, failed, cleared).
  string native_status = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  // Ostatnia komenda celu nie powiodła się na workerze (np. SetGoal: wątek nie dał się wznowić).
  // Status wraca wtedy do ostatniego stanu harnessu (cel, którego harness nigdy nie potwierdził: blocked).
  // Czyszczone przy następnej udanej komendzie celu.
  string error = 70;
  google.protobuf.Timestamp error_at = 71;
}

message SetGoalRequest {
  string thread_id = 1;
  // set (nowy cel; zastępuje otwarty) | pause | resume | clear
  string action = 2;
  // set: wymagany.
  string objective = 3;
  // set: budżet tokenów harnessu (Codex); 0 = bez limitu. Claude go nie obsługuje.
  uint64 token_budget = 4;
}

message SetGoalResponse {
  Goal goal = 1;
}

message StopBackgroundTaskRequest {
  string thread_id = 1;
  // item_id itemu background_task z osi czasu.
  string item_id = 2;
}

message StopBackgroundTaskResponse {}

// ---------- Projekt na workerach ----------
// Projekt żyje na workerach, na których ma workspace (katalog). Nowy wątek wybiera projekt, potem worker
// spośród jego workspace'ów (docs/ui-api.md).

// Nieustawione pole = bez zmian. Istniejące wątki zostają w swoim katalogu (cwd wątku jest jego własny).
message UpdateWorkspaceRequest {
  string workspace_id = 1;
  // Nowy katalog na tym samym workerze (te same reguły co przy CreateWorkspace).
  optional string root_path = 2;
  optional string label = 3;
}

message UpdateWorkspaceResponse {
  Workspace workspace = 1;
}

// Usunięcie projektu z workera (archiwizacja workspace'u): nowe wątki nie mogą go już wybrać, istniejące
// działają dalej (wiadomości, wątki boczne i forki w tym samym katalogu).
message RemoveWorkspaceRequest {
  string workspace_id = 1;
}

message RemoveWorkspaceResponse {}

// ---------- Profile dostawców ----------
// Profil = jak harness (Claude Code, Codex) łączy się z modelem na danym workerze (docs/worker-config.md,
// "Profile dostawców"). Profil "native" jest wbudowany: zawsze istnieje, nie da się go usunąć ani wyłączyć.
// Sekrety (klucz API, zmienne oznaczone jako sekret) nigdy nie wracają do UI: jest tylko informacja, że są ustawione.

message ProviderProfileSettings {
  string worker_id = 1;
  string id = 2;
  string display_name = 3;
  openagents.worker.v1.ProviderProfileKind kind = 4;
  // Dostawcy, którzy mogą użyć profilu.
  repeated openagents.worker.v1.Provider providers = 5;
  // CLIPROXYAPI: adres endpointu.
  string base_url = 6;
  bool api_key_set = 7;
  repeated ProfileEnvVarSettings env = 8;
  bool enabled = 9;
  bool built_in = 10;
  // Ostatni raport workera (ConfigApplied) dla tego profilu.
  bool available = 11;
  string detail = 12;
  // Wątki (niezarchiwizowane), które używają profilu.
  uint32 thread_count = 13;
  repeated ModelSelection model_selections = 14;
}

message ProfileEnvVarSettings {
  string name = 1;
  bool secret = 2;
  // Tylko dla zmiennych jawnych; sekret ma zawsze pustą wartość.
  string value = 3;
}

message ModelSelection {
  openagents.worker.v1.Provider provider = 1;
  // Modele widoczne w pickerach.
  repeated string shown = 2;
  // Modele katalogu w chwili zapisu: model spoza tej listy jest nowy i decyduje o nim show_new.
  repeated string known = 3;
  bool show_new = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListProviderProfilesRequest {
  string worker_id = 1;
}

message ListProviderProfilesResponse {
  repeated ProviderProfileSettings profiles = 1;
  // Wersja konfiguracji workera, z której pochodzą profile (do expected_config_version).
  uint64 config_version = 2;
}

message ProfileEnvVarInput {
  string name = 1;
  bool secret = 2;
  // Jawna: wartość (nieustawiona = pusta). Sekret: nieustawiona = bez zmian (zmienna o tej nazwie musi już być sekretem).
  optional string value = 3;
}

message SaveProviderProfileRequest {
  string worker_id = 1;
  // Pusty = nowy profil (id powstaje z nazwy).
  string profile_id = 2;
  string display_name = 3;
  openagents.worker.v1.ProviderProfileKind kind = 4;
  repeated openagents.worker.v1.Provider providers = 5;
  string base_url = 6;
  // Nieustawiony = bez zmian, pusty = usunięcie, inaczej nowy klucz.
  optional string api_key = 7;
  // Pełna lista: zastępuje dotychczasową.
  repeated ProfileEnvVarInput env = 8;
  bool enabled = 9;
  // Wersja konfiguracji, którą widział klient; inna = FailedPrecondition (BFF: 409). 0 = bez sprawdzania.
  uint64 expected_config_version = 10;
}

message SaveProviderProfileResponse {
  ProviderProfileSettings profile = 1;
  uint64 config_version = 2;
}

message DeleteProviderProfileRequest {
  string worker_id = 1;
  string profile_id = 2;
  uint64 expected_config_version = 3;
}

message DeleteProviderProfileResponse {
  uint64 config_version = 1;
}

message SetModelSelectionRequest {
  string worker_id = 1;
  string profile_id = 2;
  openagents.worker.v1.Provider provider = 3;
  // true = wszystkie modele katalogu (jak bez wyboru); shown, known i show_new są wtedy pomijane.
  bool show_all = 4;
  repeated string shown = 5;
  repeated string known = 6;
  bool show_new = 7;
}

message SetModelSelectionResponse {
  // Brak = wszystkie modele.
  ModelSelection selection = 1;
}

// ---------- Załączniki (docs/ui-api.md) ----------

// Plik dołączony do wiadomości. Gateway sam rozpoznaje typ po treści (nie po nazwie ani typie z przeglądarki).
message Attachment {
  string id = 1;
  // Nazwa bez katalogów i znaków sterujących (taka trafia na workera).
  string name = 2;
  string mime_type = 3;
  // image (png, jpeg, gif, webp: podgląd w UI) | file (reszta, także SVG i HEIC)
  string kind = 4;
  uint64 size_bytes = 5;
  uint32 width = 6;
  uint32 height = 7;
  string sha256 = 8;
  // Obraz ma miniaturę (GetAttachment.thumbnail).
  bool has_thumbnail = 9;
}

message AttachmentLimits {
  uint64 max_file_bytes = 1;
  uint64 max_message_bytes = 2;
  uint32 max_files = 3;
}

message UploadAttachmentRequest {
  string name = 1;
  bytes data = 2;
}

message UploadAttachmentResponse {
  Attachment attachment = 1;
}

message GetAttachmentRequest {
  string attachment_id = 1;
  // Miniatura obrazu (WebP, do 512 px) zamiast pliku.
  bool thumbnail = 2;
}

message GetAttachmentResponse {
  Attachment attachment = 1;
  bytes data = 2;
  string mime_type = 3;
}

// Podgląd obrazu z transkryptu wątku (Image.blob, ToolCall.images), tylko dla właściciela wątku.
message GetThreadBlobRequest {
  string thread_id = 1;
  string sha256 = 2;
}

message GetThreadBlobResponse {
  bytes data = 1;
  string mime_type = 2;
}

// ---------- Stan przeczytania ----------

message MarkThreadSeenRequest {
  string thread_id = 1;
  // Ostatnie zdarzenie wątku na ekranie użytkownika (ThreadEvent.seq); znacznik tylko rośnie, najwyżej do Thread.last_seq.
  uint64 up_to_seq = 2;
}

message MarkThreadSeenResponse {
  Thread thread = 1;
}
